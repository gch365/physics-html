<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测量电源的电动势与内阻-赣州中学高二物理组2026.10</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    margin: 0; padding: 14px 20px;
    background-color: #f5f7fa;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; gap: 10px;
  }
  h1 { color: #2c3e50; margin: 6px 0 2px; font-size: 24px; text-align: center; }

  .button-container {
    display: flex; flex-wrap: wrap; gap: 9px;
    justify-content: center; align-items: center;
  }
  button {
    padding: 7px 15px; font-size: 14px; border: none; border-radius: 4px;
    cursor: pointer; transition: all .25s; color: #fff; font-weight: bold;
    box-shadow: 0 2px 4px rgba(0,0,0,.12);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 6px rgba(0,0,0,.15); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .b-home    { background:#3498db; } .b-home:hover { background:#2980b9; }
  .b-connect { background:#e74c3c; } .b-connect:hover { background:#c0392b; }
  .b-start   { background:#e74c3c; } .b-start:hover { background:#c0392b; }
  .b-start.on{ background:#27ae60; }
  .b-record  { background:#2ecc71; } .b-record:hover { background:#27ae60; }
  .b-del     { background:#f1948a; } .b-del:hover { background:#ec7063; }
  .b-fit     { background:#9b59b6; } .b-fit:hover { background:#8e44ad; }
  .b-save    { background:#16a085; } .b-save:hover { background:#117a65; }
  .b-export  { background:#f1c40f; color:#2c3e50; } .b-export:hover { background:#f4d03f; }
  .b-zoom    { background:#27ae60; } .b-zoom:hover { background:#1e8449; }
  .b-zoom.on { background:#145a32; }
  .b-reset   { background:#8e44ad; } .b-reset:hover { background:#7d3c98; }
  .b-setting { background:#7d3c98; } .b-setting:hover { background:#6c3483; }
  .b-mode    { background:#d35400; } .b-mode:hover { background:#ba4a00; }
  .b-swap    { background:#e67e22; } .b-swap:hover { background:#ca6f1e; }
  .b-debug   { background:#7f8c8d; } .b-debug:hover { background:#616a6b; }
  .color-group { display:flex; align-items:center; gap:6px; }
  .color-group label { font-size:14px; font-weight:bold; color:#2c3e50; }
  .active-color-picker {
    width:34px; height:30px; padding:0; border:2px solid #c8d0d4;
    border-radius:4px; background:#fff; cursor:pointer;
  }

  .main-content { display:flex; gap:16px; width:100%; max-width:1400px; align-items:stretch; }
  .circuit-card {
    width: 38%; min-width: 380px; background:#fff; border-radius:8px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 10px;
  }
  .circuit-card svg { width:100%; height:auto; max-height: 60vh; }
  /* 接法标题行：接法大字 + 切换按钮同一排 */
  .circuit-head {
    display:flex; align-items:center; justify-content:center; gap:14px;
    width:100%; padding:2px 0 4px; flex-wrap:nowrap;
  }
  .circuit-head #modeTag {
    font-size:22px; font-weight:bold; color:#2c3e50;
    white-space:nowrap; letter-spacing:.5px; line-height:1.1;
  }
  .circuit-head .b-mode {
    padding:7px 13px; font-size:13.5px; white-space:nowrap; flex:0 0 auto;
  }
  .right-col { flex:1; display:flex; flex-direction:column; gap:14px; min-width:0; }

  .table-card {
    background:#fff; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1);
    padding:10px; overflow-x:auto;
  }
  table.data { border-collapse: collapse; width:100%; }
  table.data td, table.data th {
    border:1px solid #d5dbe0; text-align:center; font-size:14px;
    min-width:52px; height:30px; padding:2px 6px; background:#fff; color:#2c3e50;
  }
  table.data .hcell { background:#2b6cdc; color:#fff; font-weight:bold; min-width:64px; }

  .chart-card {
    background:#fff; border-radius:8px; box-shadow:0 2px 4px rgba(0,0,0,.1);
    flex:1; position:relative; min-height:340px; overflow:hidden;
  }
  #chart { position:absolute; inset:0; width:100%; height:100%; }

  /* 已保存对比曲线的图例（右上角，点击可隐藏/显示） */
  #legend {
    position:absolute; top:8px; right:10px; z-index:3;
    display:flex; flex-direction:column; gap:4px; align-items:flex-end;
    max-width:62%; pointer-events:none;
  }
  #legend .chip {
    pointer-events:auto; display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.94); border:1px solid #dfe5ea; border-radius:12px;
    padding:2px 9px; font-size:12px; color:#2c3e50; cursor:pointer;
    user-select:none; box-shadow:0 1px 3px rgba(0,0,0,.08); white-space:nowrap;
  }
  #legend .chip.off { opacity:.4; text-decoration:line-through; }
  #legend .sw { width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
  #legend .clr {
    pointer-events:auto; font-size:12px; color:#e74c3c; cursor:pointer;
    text-decoration:underline; background:rgba(255,255,255,.94);
    border:1px solid #dfe5ea; border-radius:12px; padding:1px 8px;
  }
  .fit-eq { font-size:18px; font-weight:bold; color:#2c3e50; text-align:center; margin:4px 0 10px; }

  #statusBar { font-size:13px; color:#5d6d7e; text-align:center; }
  #resultBar {
    font-size:14px; color:#2c3e50; text-align:center; min-height:20px;
    width:100%; max-width:1400px;
  }

  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal-mask.show { display:flex; }
  .modal {
    background:#fff; border-radius:10px; padding:22px 26px;
    box-shadow:0 8px 30px rgba(0,0,0,.25); max-width:540px; width:92%;
    max-height:80vh; overflow:auto;
  }
  .modal h3 { margin:0 0 14px; color:#2c3e50; }
  .modal .row { display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:14px; }
  .modal .row label { flex:0 0 180px; color:#2c3e50; }
  .modal input[type=number] {
    width:110px; padding:6px 8px; border:1px solid #ccd5dc; border-radius:4px; font-size:14px;
  }
  .modal table { border-collapse:collapse; width:100%; margin:8px 0; }
  .modal table td { border:1px solid #d5dbe0; padding:4px 10px; text-align:center; font-size:14px; }
  .modal .close-row { text-align:right; margin-top:10px; }
  .fit-big { font-size:20px; font-weight:bold; color:#8e44ad; text-align:center; margin:8px 0; }
  .hint { font-size:12px; color:#7f8c8d; margin:4px 0 0; }

  #debugPanel {
    display:none; width:100%; max-width:1400px; background:#fff; border-radius:8px;
    box-shadow:0 2px 4px rgba(0,0,0,.1); padding:10px;
  }
  #debugPanel.show { display:block; }
  #debugPanel h4 { margin:0 0 6px; font-size:14px; color:#5d6d7e; }
  #debugLog {
    font-family:Consolas,monospace; font-size:12px; color:#34495e;
    max-height:180px; overflow:auto; white-space:pre-wrap;
  }
</style>
</head>
<body>
  <h1>测量电源的电动势与内阻-赣州中学高二物理组2026.10</h1>

  <div class="button-container">
    <button class="b-home" id="homeBtn">返回主页</button>
    <button class="b-connect" id="connectBtn">连接传感器</button>
    <button class="b-start" id="startBtn" disabled>开始接收数据</button>
    <button class="b-record" id="recordBtn" disabled>记录数据</button>
    <span class="color-group"><label>记录颜色:</label><input type="color" class="active-color-picker" id="recColor" value="#e74c3c"></span>
    <button class="b-del" id="delBtn" disabled>删除数据</button>
    <button class="b-fit" id="fitBtn" disabled>处理数据</button>
    <button class="b-save" id="saveBtn" disabled title="把这一轮的点和拟合线留作对比曲线，之后删数据不影响它">保存图像</button>
    <button class="b-export" id="exportBtn" disabled>导出数据</button>
    <button class="b-zoom" id="zoomBtn">整体缩放</button>
    <button class="b-reset" id="resetBtn">重置视图</button>
    <button class="b-setting" id="setBtn">显示设置</button>
    <button class="b-swap" id="swap2Btn" title="万一电压/电流读数反了，点这里对调（之后会记住）">交换电压/电流</button>
    <button class="b-debug" id="debugBtn">调试</button>
  </div>

  <div id="statusBar">未连接传感器</div>

  <div class="main-content">
    <div class="circuit-card">
      <!-- 标题栏：接法名称（大字）+ 切换按钮，同一行 -->
      <div class="circuit-head">
        <span id="modeTag">① 电流表内接法</span>
        <button class="b-mode" id="modeBtn">⇄ 切换为电流表外接法</button>
      </div>
      <svg viewBox="0 0 480 500" xmlns="http://www.w3.org/2000/svg">
        <!-- 导线：左、上、右、下（底边留电源与开关缺口） -->
        <line x1="48" y1="85" x2="48" y2="465" stroke="#111" stroke-width="5"/>
        <line x1="48" y1="85" x2="380" y2="85" stroke="#111" stroke-width="5"/>
        <line x1="380" y1="85" x2="380" y2="465" stroke="#111" stroke-width="5"/>
        <line x1="48" y1="465" x2="125" y2="465" stroke="#111" stroke-width="5"/>
        <line x1="175" y1="465" x2="230" y2="465" stroke="#111" stroke-width="5"/>
        <line x1="300" y1="465" x2="380" y2="465" stroke="#111" stroke-width="5"/>
        <!-- 滑动变阻器 R（滑片从左节点向上折，箭头下压） -->
        <polyline points="48,85 48,38 160,38" fill="none" stroke="#111" stroke-width="4"/>
        <line x1="160" y1="38" x2="160" y2="56" stroke="#111" stroke-width="4"/>
        <path d="M160,68 L152,52 L168,52 Z" fill="#111"/>
        <rect x="115" y="72" width="85" height="26" fill="#fff" stroke="#111" stroke-width="4"/>
        <text x="128" y="130" font-size="30" font-style="italic" font-family="Times New Roman" fill="#111">R</text>
        <!-- 电流传感器（绿框，串联） -->
        <text x="302" y="44" font-size="17" font-weight="bold" fill="#1e8e3e" text-anchor="middle">电流传感器</text>
        <rect x="245" y="56" width="115" height="54" fill="#fff" stroke="#1e8e3e" stroke-width="4"/>
        <text id="iDisp" x="302" y="93" font-size="27" font-weight="bold" fill="#155d33" text-anchor="middle">0.000A</text>
        <!-- 电压传感器（蓝框，并联中支）
             内接法：右端接到右侧干路（并在 R+电流传感器 两端，即电源两端）
             外接法：右端改接 R 与电流传感器之间的结点（只并在 R 两端） -->
        <line x1="48" y1="295" x2="155" y2="295" stroke="#111" stroke-width="5"/>
        <line id="vRightWire" x1="300" y1="295" x2="380" y2="295" stroke="#111" stroke-width="5"/>
        <line id="vTapWire" x1="222" y1="268" x2="222" y2="85" stroke="#111" stroke-width="5" style="display:none"/>
        <circle cx="48" cy="85" r="7" fill="#111"/>
        <circle cx="48" cy="295" r="7" fill="#111"/>
        <circle id="vRightDot" cx="380" cy="295" r="7" fill="#111"/>
        <circle id="vTapDot" cx="222" cy="85" r="7" fill="#111" style="display:none"/>
        <text id="vLabel" x="227" y="254" font-size="17" font-weight="bold" fill="#0288d1" text-anchor="middle">电压传感器</text>
        <rect x="155" y="268" width="145" height="54" fill="#fff" stroke="#0288d1" stroke-width="4"/>
        <text id="uDisp" x="227" y="305" font-size="27" font-weight="bold" fill="#01579b" text-anchor="middle">0.00V</text>
        <!-- 电源 E r（红色，底边左段） -->
        <line x1="140" y1="435" x2="140" y2="495" stroke="#e53935" stroke-width="4"/>
        <line x1="162" y1="447" x2="162" y2="483" stroke="#e53935" stroke-width="10"/>
        <text x="100" y="497" font-size="32" font-style="italic" font-family="Times New Roman" fill="#111">E</text>
        <text x="170" y="497" font-size="32" font-style="italic" font-family="Times New Roman" fill="#111">r</text>
        <!-- 开关 S（底边右段） -->
        <circle cx="230" cy="465" r="6" fill="#111"/>
        <circle cx="300" cy="465" r="6" fill="#111"/>
        <line x1="230" y1="465" x2="293" y2="412" stroke="#111" stroke-width="4"/>
        <text x="255" y="505" font-size="32" font-style="italic" font-family="Times New Roman" fill="#111">S</text>
      </svg>
    </div>

    <div class="right-col">
      <div class="table-card">
        <table class="data" id="dataTable"></table>
      </div>
      <div class="chart-card"><canvas id="chart"></canvas><div id="legend"></div></div>
    </div>
  </div>

  <div id="resultBar"></div>

  <!-- 显示设置弹窗 -->
  <div class="modal-mask" id="setModal">
    <div class="modal">
      <h3>显示设置</h3>
      <div class="row"><label>电压换算系数 (V/计数)</label><input type="number" id="scaleU" step="0.0001" value="0.001"></div>
      <div class="row"><label>电流换算系数 (A/计数)</label><input type="number" id="scaleI" step="0.00001" value="0.0001"></div>
      <div class="row"><label>电压小数位</label><input type="number" id="decU" min="1" max="5" value="3"></div>
      <div class="row"><label>电流小数位</label><input type="number" id="decI" min="1" max="5" value="3"></div>
      <div class="row"><label>示数平滑 (0=不平滑, 0~0.95)</label><input type="number" id="smooth" min="0" max="0.95" step="0.05" value="0.5"></div>
      <p class="hint">标定方法：接已知电压（如 1.5V 干电池），若显示值 ≠ 1.5，新系数 = 0.001 × 1.5 ÷ 显示值，填入上面"电压换算系数"。</p>
      <div class="row"><label>当前传感器对应</label><span id="idMapInfo" style="font-size:13px;color:#2c3e50;"></span></div>
      <div class="row" style="gap:10px;">
        <button class="b-fit" id="swapBtn" style="padding:6px 12px;font-size:13px;">交换电压/电流（会记住）</button>
        <button class="b-connect" id="rewakeBtn" style="padding:6px 12px;font-size:13px;">重新唤醒传感器</button>
        <button class="b-del" id="resetMapBtn" style="padding:6px 12px;font-size:13px;">恢复默认对应</button>
      </div>
      <p class="hint">默认对应：<b>0x1a → 电压传感器，0x1b → 电流传感器</b>（与官方 core.dat 传感器定义表一致）。万一看反了，点顶部工具栏橙色「交换电压/电流」按钮即可，交换结果会记住，下次打开不用再点。电路图中电压表并联、电流表串联的位置始终不变。</p>
      <div class="close-row">
        <button class="b-home" onclick="$('setModal').classList.remove('show')">关闭</button>
      </div>
    </div>
  </div>

  <!-- 处理数据（拟合结果）弹窗 -->
  <div class="modal-mask" id="fitModal">
    <div class="modal">
      <h3 id="fitTitle">处理数据 — 一次函数拟合 U = E − rI</h3>
      <div id="fitContent"></div>
      <div class="close-row"><button class="b-home" onclick="$('fitModal').classList.remove('show')">关闭</button></div>
    </div>
  </div>

  <!-- 调试面板 -->
  <div id="debugPanel">
    <h4>原始数据调试（连接/收发诊断）</h4>
    <div id="debugLog"></div>
  </div>

<script>
"use strict";
const $ = id => document.getElementById(id);

// ============ 协议常量（探究猫USB传感器，实测破解） ============
// 帧：a0 ff | 5字节地址(第2字节=传感器ID) | cmd | 4字节payload
// 数据帧 cmd=0x80，值 = 末2字节 大端 int16
// 唤醒：广播识别→从应答取地址→寻址握手(01..01)→启动采集(a0)→参数(14)
const BROADCAST = [0xa0,0xff,0xd4,0x88,0x00,0x00,0x05,0x88,0x00,0x00,0x00,0x00];
// 传感器 ID（地址第2字节）→ 电压/电流槽位 的对应关系
// 默认：0x1a = 电压传感器，0x1b = 电流传感器（实测正确）
// 若某次接反了，可在"显示设置"里交换一次，之后沿用
const MAP_VER = "3";
try {
  // 版本迁移：清掉旧版本（默认值写反的那版）残留在浏览器里的对应关系
  if (localStorage.getItem("emf3_mapVer") !== MAP_VER) {
    localStorage.removeItem("emf3_idU");
    localStorage.removeItem("emf3_idI");
    localStorage.removeItem("emf3_addrMap");
    localStorage.setItem("emf3_mapVer", MAP_VER);
  }
} catch (e) {}
let ID_U = parseInt(localStorage.getItem("emf3_idU") || "", 16);
let ID_I = parseInt(localStorage.getItem("emf3_idI") || "", 16);
if (!Number.isFinite(ID_U) || !Number.isFinite(ID_I) || ID_U === ID_I) {
  ID_U = 0x1a;   // 电压传感器
  ID_I = 0x1b;   // 电流传感器
}
function saveIdMap() {
  localStorage.setItem("emf3_idU", ID_U.toString(16));
  localStorage.setItem("emf3_idI", ID_I.toString(16));
  const el = $("idMapInfo");
  if (el) el.textContent = "0x" + ID_U.toString(16) + " → 电压　｜　0x" + ID_I.toString(16) + " → 电流";
}
// 更可靠的记住方式：按"传感器地址"记住它是电压还是电流（插拔顺序变了也不会错）
let addrMap = {};
try { addrMap = JSON.parse(localStorage.getItem("emf3_addrMap") || "{}") || {}; } catch (e) { addrMap = {}; }
function addrKey(a) { return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join(""); }
function slotByAddr(a) {
  if (!a) return null;
  const k = addrMap[addrKey(a)];
  return k === "U" ? SU : (k === "I" ? SI : null);
}
function rememberAddrMap() {
  for (const d of devices) if (d.addr && d.owner) addrMap[addrKey(d.addr)] = d.owner.id;
  try { localStorage.setItem("emf3_addrMap", JSON.stringify(addrMap)); } catch (e) {}
}

// 电压/电流显示槽位（纯数据）
const SU = { id: "U", name: "电压传感器", unit: "V", lastRaw: 0, bound: false };
const SI = { id: "I", name: "电流传感器", unit: "A", lastRaw: 0, bound: false };

// 已连接的物理设备（每台一个，与槽位解耦——按ID自动绑定）
let devices = [];
let receiving = false;
const MAX_POINTS = 20000;
let trace = [];
let traceStart = null;
let records = [];
let recCounter = 0;
let fitResult = null;
let showFit = false;   // 是否显示拟合直线/函数关系：记录阶段只描点，点"处理数据"后才出图像
// 已保存的"对比曲线"：做完一轮实验保存一次，之后删数据/再做新一轮都不会动它
let runs = [];        // { no, color, pts:[{i,u,n}], groups:[fit], primary, visible }
let runNo = 0;
// 对比曲线持久化：关掉/刷新页面后仍然在（可在右上角图例里清除）
function saveRuns() { try { localStorage.setItem("emf3_runs", JSON.stringify(runs)); } catch (e) {} }
function loadRuns() {
  try {
    const s = localStorage.getItem("emf3_runs");
    if (!s) return;
    const a = JSON.parse(s);
    if (Array.isArray(a)) {
      runs = a.filter(r => r && Array.isArray(r.pts) && r.primary && Array.isArray(r.groups));
      for (const r of runs) if (r.visible === undefined) r.visible = true;
      runNo = runs.reduce((m, r) => Math.max(m, r.no || 0), 0);
    }
  } catch (e) { runs = []; }
}
let view = { iMin: 0, iMax: 1.0, uMin: 0, uMax: 1.0 };
let zoomMode = false;
// 电路接法："nei"=电流表内接法（电压表并在 R+电流表 两端）
//           "wai"=电流表外接法（电压表只并在 R 两端，电流表在干路靠电源侧）
let circuitMode = localStorage.getItem("emf3_circuit") === "wai" ? "wai" : "nei";
function modeName() { return circuitMode === "wai" ? "电流表外接法" : "电流表内接法"; }
function applyCircuit() {
  const wai = circuitMode === "wai";
  $("vRightWire").style.display = wai ? "none" : "";
  $("vRightDot").style.display = wai ? "none" : "";
  $("vTapWire").style.display = wai ? "" : "none";
  $("vTapDot").style.display = wai ? "" : "none";
  $("vLabel").setAttribute("x", wai ? 110 : 227);
  $("modeTag").textContent = (wai ? "② " : "① ") + modeName();
  $("modeBtn").textContent = wai ? "⇄ 切换为电流表内接法" : "⇄ 切换为电流表外接法";
}

// ============ 换算系数（localStorage 持久化） ============
function scaleOf(slotId) {
  const el = $(slotId === "U" ? "scaleU" : "scaleI");
  const v = parseFloat(el.value);
  return Number.isFinite(v) && v > 0 ? v : (slotId === "U" ? 0.001 : 0.0001);
}
["scaleU","scaleI","decU","decI","smooth"].forEach(id => {
  const el = $(id);
  const saved = localStorage.getItem("emf3_" + id);
  if (saved) el.value = saved;
  el.addEventListener("change", () => localStorage.setItem("emf3_" + id, el.value));
});
function decOf(slotId) { return parseInt($(slotId === "U" ? "decU" : "decI").value) || 3; }
function smoothK() { const v = parseFloat($("smooth").value); return (Number.isFinite(v) && v > 0 && v < 1) ? v : 0; }

// ============ 状态 / 调试 ============
function debugLog(msg) {
  const el = $("debugLog");
  el.textContent += timeStr() + " " + msg + "\n";
  el.scrollTop = el.scrollHeight;
}
function timeStr() { return new Date().toTimeString().slice(0,8); }
function setResult(html) { $("resultBar").innerHTML = html; }
function updateStatus() {
  const parts = [];
  for (const d of devices) {
    if (!d.connected) continue;
    if (d.owner) parts.push(d.owner.name + (d.addr ? "[0x" + d.addr[1].toString(16) + "]" : "") + " " + d.rate + "Hz " + d.bytes + "B");
    else parts.push("识别中…(" + d.bytes + "B，" + Math.floor(d.bytes / 12) + "帧)");
  }
  $("statusBar").textContent = parts.length ? "已连接：" + parts.join(" ｜ ") + (receiving ? "　·　接收中" : "") : "未连接传感器";
}

// ============ 串口连接 ============
let connectCount = 0;
$("connectBtn").onclick = async () => {
  if (!("serial" in navigator)) { alert("请使用 Chrome 或 Edge 浏览器打开本页面！"); return; }
  if (SU.bound && SI.bound) { alert("两台传感器均已连接。"); return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 38400, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
    try { await port.setSignals({ dataTerminalReady: true, requestToSend: true }); } catch (e) {}
    const dev = { port, connected: true, buf: [], rxBuf: [], addr: null, owner: null,
                  bytes: 0, rate: 0, rateCnt: 0, rateT: Date.now(), waking: false, tries: 0 };
    devices.push(dev);
    connectCount++;
    $("connectBtn").textContent = connectCount >= 2 ? "传感器已连" : "连接传感器(" + connectCount + "/2)";
    debugLog("[OK] 串口已打开 @38400（第" + connectCount + "台），等待设备启动后广播识别...");
    // 连接成功立刻解锁按钮（不等唤醒结果）
    updateButtons();
    updateStatus();
    readLoop(dev);
    // CH340 置位 DTR 会让设备复位重启，等 1.2 秒再广播
    await new Promise(r => setTimeout(r, 1200));
    await wakeSensor(dev);
  } catch (e) {
    if (e.name !== "NotFoundError") alert("连接失败：" + e.message);
    debugLog("[ERR] " + e.message);
  }
};

// 唤醒：广播 → 从原始字节流提取应答地址并按ID绑定 → 握手 → 启动 → 参数（最多重试3轮）
async function wakeSensor(dev) {
  if (dev.waking) return;
  dev.waking = true;
  try {
    const w = dev.port.writable.getWriter();
    const send = async (bytes, delayMs) => {
      await w.write(new Uint8Array(bytes));
      await new Promise(r => setTimeout(r, delayMs));
    };
    // 在原始字节流副本里找帧：cmd=0x88 为广播应答，cmd=0x80 为数据帧
    const findIn = (cmd) => {
      const b = dev.rxBuf;
      for (let i = 0; i <= b.length - 12; i++) {
        if (b[i] === 0xa0 && b[i+1] === 0xff && b[i+7] === cmd) return b.slice(i+2, i+7);
      }
      return null;
    };
    let addr = null;
    for (let attempt = 1; attempt <= 3 && !addr; attempt++) {
      dev.rxBuf = [];
      dev.buf = [];
      await send(BROADCAST, 1000);
      addr = findIn(0x88);                 // 广播应答里的地址
      if (!addr) addr = findIn(0x80);      // 已激活的传感器直接吐数据帧
      if (!addr) {
        debugLog("[INFO] 第" + attempt + "轮广播无应答（收到 " + dev.bytes + " 字节）");
      }
    }
    if (!addr) {
      w.releaseLock();
      dev.tries++;
      debugLog("[WARN] 未识别到传感器：共收到 " + dev.bytes + " 字节。请打开\"调试\"面板查看，或拔插USB线后重试。");
      setResult("<b style='color:#e67e22'>传感器已打开串口但无应答（" + dev.bytes + " 字节）。</b>请确认：① 传感器指示灯亮；② 换一根USB数据线；③ 点\"调试\"把内容发我。");
      updateStatus();
      return;
    }
    // 地址第2字节 = 传感器ID，按映射表绑定；若这台传感器以前记过，优先用记忆结果
    const sid = addr[1];
    let slot = slotByAddr(addr) || (sid === ID_U ? SU : (sid === ID_I ? SI : null));
    if (!slot) {
      debugLog("[WARN] 未知传感器ID 0x" + sid.toString(16) + "，按未占用槽位分配。");
      slot = !SU.bound ? SU : (!SI.bound ? SI : SU);
    }
    // 若该槽位已被另一台占用，找空槽
    if (slot.bound && devices.some(d => d !== dev && d.owner === slot)) {
      const other = slot === SU ? SI : SU;
      if (!other.bound) slot = other;
    }
    dev.owner = slot;
    dev.owner.bound = true;
    dev.addr = addr;
    debugLog("[OK] " + dev.owner.name + " 地址 = " + Array.from(addr).map(b => b.toString(16).padStart(2,"0")).join(" "));
    const A = () => new Uint8Array([0xa0, 0xff, ...addr]);
    dev.buf = [];
    await send([...A(), 0x01, 0,0,0,0x01], 400);
    await send([...A(), 0xa0, 0,0,0,0], 400);
    await send([...A(), 0x14, 0,0,0,0], 400);
    dev.buf = [];
    dev.rxBuf = [];
    w.releaseLock();
    debugLog("[OK] " + dev.owner.name + " 唤醒完成。");
    const bothMsg = "两台均已连接，可以开始实验。" +
      "<br><b>提示：</b>" +
      "<br><b>1. 因传感器数据精确，最好先做电流表外接法。</b>" +
      "<br><b>2. 如果电流电压不准，可以点\"交换电压/电流\"（USB 接口数据可能反了）。</b>";
    setResult("✅ " + dev.owner.name + " 已连接。" + ((SU.bound && SI.bound) ? bothMsg : "再点一次\"连接传感器\"连另一台。"));
    updateButtons();
    updateStatus();
  } catch (e) {
    debugLog("[WARN] 唤醒失败: " + e.message);
  } finally {
    dev.waking = false;
  }
}

// 看门狗：连上但长时间 0 字节 / 未识别 → 自动重发唤醒
setInterval(() => {
  for (const d of devices) {
    if (!d.connected || d.waking) continue;
    if (!d.owner || d.bytes === 0) {
      if (d.tries < 6) wakeSensor(d);
    }
  }
}, 4000);


async function readLoop(dev) {
  const reader = dev.port.readable.getReader();
  try {
    while (dev.connected) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value && value.length) {
        const firstChunk = dev.bytes === 0;
        dev.bytes += value.length;
        if (firstChunk) {
          debugLog("[RX] 首包 " + value.length + " 字节: " +
            Array.from(value.slice(0, 24)).map(b => b.toString(16).padStart(2, "0")).join(" "));
        }
        for (const b of value) {
          dev.buf.push(b);
          dev.rxBuf.push(b);      // 握手专用的原始副本（解析器不动它）
        }
        if (dev.buf.length > 4096) dev.buf = dev.buf.slice(-2048);
        if (dev.rxBuf.length > 8192) dev.rxBuf = dev.rxBuf.slice(-4096);
        parseFrames(dev);
        const now = Date.now();
        if (now - dev.rateT >= 1000) {
          dev.rate = Math.round(dev.rateCnt * 1000 / (now - dev.rateT));
          dev.rateCnt = 0; dev.rateT = now;
          updateStatus();
        }
      }
    }
  } catch (e) { debugLog("[ERR] 读取中断: " + e.message); }
  finally { try { reader.releaseLock(); } catch (e) {} }
}

// 帧解析：a0 ff + 地址匹配 + cmd 0x80，值=末2字节大端int16 → 写入绑定槽位
function parseFrames(dev) {
  while (dev.buf.length >= 12) {
    if (!(dev.buf[0] === 0xa0 && dev.buf[1] === 0xff)) {
      let idx = -1;
      for (let i = 1; i <= dev.buf.length - 2; i++) {
        if (dev.buf[i] === 0xa0 && dev.buf[i+1] === 0xff) { idx = i; break; }
      }
      if (idx < 0) { dev.buf.splice(0, Math.max(dev.buf.length - 1, 0)); return; }
      dev.buf.splice(0, idx);
      continue;
    }
    // 未绑定前：数据帧即身份来源，自动绑定（ID字节=地址第2字节）
    if (!dev.owner && dev.buf[7] === 0x80) {
      const sid = dev.buf[3];
      const memSlot = slotByAddr(dev.buf.slice(2, 7));
      if (memSlot || sid === ID_U || sid === ID_I) {
        dev.owner = memSlot || (sid === ID_U ? SU : SI);
        dev.owner.bound = true;
        dev.addr = dev.buf.slice(2, 7);
        debugLog("[OK] 数据流自动识别：" + dev.owner.name + "（ID 0x" + sid.toString(16) + "）");
        updateButtons(); updateStatus();
      }
    }
    if (dev.owner && dev.addr && dev.buf.slice(2, 7).join(",") !== dev.addr.join(",")) { dev.buf.splice(0, 1); continue; }
    if (dev.buf[7] !== 0x80) { dev.buf.splice(0, 12); continue; }
    if (!dev.owner) { dev.buf.splice(0, 12); continue; }
    const raw = (dev.buf[10] << 8) | dev.buf[11];
    const signed = raw >= 0x8000 ? raw - 0x10000 : raw;
    if (Math.abs(signed) > 30000) { dev.buf.shift(); continue; }
    const value = signed * scaleOf(dev.owner.id);
    // 平滑显示（EMA）：k=0 不平滑；记录值始终用原始值
    const k = smoothK();
    dev.owner.lastRaw = k > 0 ? dev.owner.lastRaw + k * (value - dev.owner.lastRaw) : value;
    dev.rateCnt++;
    if (!receiving) {
      setReceiving(true);
      setResult("<b style='color:#27ae60'>数据已到达，自动开始接收。</b>闭合开关 S，调节滑动变阻器，每档点一次\"记录数据\"，记 6 组以上后点\"处理数据\"。");
    }
    if (receiving) {
      const t = Date.now() / 1000;
      if (traceStart === null) traceStart = t;
      trace.push({ t: t - traceStart, u: SU.lastRaw, i: SI.lastRaw });
      if (trace.length > MAX_POINTS) trace.shift();
    }
    dev.buf.splice(0, 12);
  }
}

async function disconnectAll() {
  for (const d of devices) {
    d.connected = false;
    if (d.port) { try { await d.port.close(); } catch (e) {} }
  }
  devices = [];
  SU.bound = false; SI.bound = false;
  SU.lastRaw = 0; SI.lastRaw = 0;
  setReceiving(false);
  connectCount = 0;
  $("connectBtn").textContent = "连接传感器";
  updateButtons();
  updateStatus();
  setResult("已断开所有传感器。");
}

// ============ 接收开关 ============

// ============ 记录数据（描点法：每个数据就是一个坐标点） ============
$("recordBtn").onclick = () => {

$("delBtn").onclick = () => {

// ============ 保存本轮图像（多次实验对比用：删数据也不会丢） ============
$("saveBtn").onclick = () => {
  if (records.length < 2) { alert("至少记录 2 组数据才能保存本轮图像！"); return; }
  const f = fitAll();
  if (!f.primary) { alert("数据点的电流值几乎相同，无法拟合。请调节滑动变阻器让电流有明显变化后再保存。"); return; }
  runNo++;
  const P = f.primary;
  runs.push({
    no: runNo,
    color: $("recColor").value,
    mode: circuitMode,
    pts: records.map(p => ({ i: p.i, u: p.u, n: p.n })),
    groups: f.groups.map(g => ({ a: g.a, b: g.b, r2: g.r2, n: g.n, imin: g.imin, imax: g.imax, color: g.color })),
    primary: { a: P.a, b: P.b, r2: P.r2, n: P.n, color: P.color },

  });

  saveRuns();

            "（E = " + P.a.toFixed(3) + " V，r = " + (-P.b).toFixed(3) + " Ω）。已留在图上，可开始新一轮实验；" +
            "右上角点图例可隐藏/显示，删除数据不会删掉它。");
};

// 图例：右上角，点击切换某条对比曲线的显示/隐藏
function renderLegend() {
  const el = $("legend");
  if (!el) return;
  if (!runs.length) { el.innerHTML = ""; return; }
  let html = "";
  for (const r of runs) {
    const P = r.primary;
    const mt = r.mode === "wai" ? "·外接" : (r.mode === "nei" ? "·内接" : "");
    html += "<div class='chip" + (r.visible ? "" : " off") + "' data-no='" + r.no + "' " +
            "title='点击隐藏/显示这条曲线'>" +
            "<span class='sw' style='background:" + r.color + "'></span>" +
            "第" + r.no + "次" + mt + "　E=" + P.a.toFixed(3) + "V　r=" + (-P.b).toFixed(3) + "Ω</div>";
  }
  html += "<div class='clr' id='clrRuns'>清除全部对比</div>";

  el.querySelectorAll(".chip").forEach(c => {

  if (cb) cb.onclick = () => {
    if (confirm("清除所有已保存的对比曲线？（当前这一轮记录不受影响）")) { runs = []; saveRuns(); renderLegend(); draw(); }
  };
}

// ============ 最小二乘线性拟合（一次函数 U = E − r·I） ============
// 返回 null 表示无法拟合（点数不足或横坐标几乎相同）
function linFit(pts) {
  const n = pts.length;
  if (n < 2) return null;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (const p of pts) { sx += p.i; sy += p.u; sxy += p.i * p.u; sxx += p.i * p.i; }
  const den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-12) return null;      // 所有点电流相同 → 竖直线，无一次函数
  const b = (n * sxy - sx * sy) / den;         // 斜率 = −r
  const a = (sy - b * sx) / n;                 // 截距 = E
  const my = sy / n;
  let ssRes = 0, ssTot = 0;
  for (const p of pts) { const f = a + b * p.i; ssRes += (p.u - f) ** 2; ssTot += (p.u - my) ** 2; }
  const r2 = ssTot > 1e-15 ? 1 - ssRes / ssTot : 1;
  const ii = pts.map(p => p.i);
  return { a, b, r2, n, imin: Math.min(...ii), imax: Math.max(...ii), color: pts[0].color };
}

// 按记录颜色分组拟合（换颜色 = 换一组数据，比如换一节电池）
function fitAll() {
  const map = new Map();
  for (const p of records) {
    if (!map.has(p.color)) map.set(p.color, []);
    map.get(p.color).push(p);
  }
  const groups = [];
  for (const pts of map.values()) { const g = linFit(pts); if (g) groups.push(g); }
  let primary = null;
  for (const g of groups) if (!primary || g.n >= primary.n) primary = g;
  return { groups, primary };
}
function refreshFit() {
  // 记录/删除阶段只描点，不自动出直线；只有点过"处理数据"(showFit=true)才计算并展示拟合直线
  fitResult = (showFit && records.length >= 2) ? fitAll() : null;
}
// 函数关系式文本：U = 1.482 − 0.512 I
function eqStr(g) {
  return "U = " + g.a.toFixed(3) + (g.b < 0 ? " − " : " + ") + Math.abs(g.b).toFixed(3) + "·I";
}

// ============ 处理数据：显示拟合结果与函数关系 ============
$("fitBtn").onclick = () => {
  if (records.length < 2) { alert("至少记录 2 组数据才能拟合！"); return; }
  const f = fitAll();
  if (!f.primary) { alert("数据点的电流值几乎相同，无法拟合。请调节滑动变阻器，让电流有明显变化后再记录。"); return; }
  fitResult = f;
  showFit = true;          // 点"处理数据"后才在图像上画出拟合直线与函数关系
  $("fitTitle").textContent = "处理数据 — 一次函数拟合 U = E − rI（" + modeName() + "）";
  const P = f.primary, E = P.a, r = -P.b;
  let rows = "";
  for (const g of f.groups) {
    rows += "<tr><td><span class='dot' style='background:" + g.color + "'></span>" +
            (g === P ? "<b>主组</b>" : "第" + (f.groups.indexOf(g) + 1) + "组") + "</td>" +
            "<td>" + g.n + "</td><td>" + g.a.toFixed(3) + "</td><td>" + (-g.b).toFixed(3) + "</td>" +
            "<td>" + g.r2.toFixed(4) + "</td></tr>";
  }
  $("fitContent").innerHTML =
    '<div class="fit-eq">' + eqStr(P) + "　（U/V，I/A）</div>" +
    '<div class="fit-big">电动势 E = ' + E.toFixed(3) + ' V</div>' +
    '<div class="fit-big">内阻 r = ' + r.toFixed(3) + ' Ω</div>' +
    "<table><tr><td>函数关系</td><td>U = " + E.toFixed(3) + (P.b < 0 ? " − " : " + ") + Math.abs(r).toFixed(3) + " I</td></tr>" +
    "<tr><td>斜率 k</td><td>" + P.b.toFixed(4) + " V/A　（k = −r）</td></tr>" +
    "<tr><td>截距 b</td><td>" + E.toFixed(4) + " V　（b = E）</td></tr>" +
    "<tr><td>相关系数 r²</td><td>" + P.r2.toFixed(4) + "</td></tr>" +
    "<tr><td>数据组数 n</td><td>" + P.n + "</td></tr></table>" +
    (f.groups.length > 1 ? "<table><tr><th>组</th><th>n</th><th>E/V</th><th>r/Ω</th><th>r²</th></tr>" + rows + "</table>" : "") +
    (P.r2 < 0.99
      ? "<p style='color:#e67e22'>提示：r² 偏低，说明数据偏离直线。建议多测几组、电流跨度拉大（从接近短路到接近开路），并等示数稳定后再记录。</p>"
      : "<p style='color:#27ae60'>拟合良好：图像为一条直线，说明 U 与 I 成一次函数关系。</p>");
  $("fitModal").classList.add("show");
  draw();
  setResult("拟合结果：<b>" + eqStr(P) + "</b>　→　E = " + E.toFixed(3) + " V，r = " + r.toFixed(3) + " Ω（r² = " + P.r2.toFixed(4) + "）");
};

// ============ 导出 CSV ============
$("exportBtn").onclick = () => {
  if (!records.length && !trace.length && !runs.length) { alert("没有可导出的数据！"); return; }
  let csv = "\uFEFF序号,电流I(A),电压U(V),记录颜色\n";
  for (const p of records) csv += p.n + "," + p.i.toFixed(5) + "," + p.u.toFixed(5) + "," + p.color + "\n";
  csv += "\n时间(s),电压U(V),电流I(A)\n";
  for (const q of trace) csv += q.t.toFixed(3) + "," + q.u.toFixed(5) + "," + q.i.toFixed(5) + "\n";
  if (fitResult) csv += "\n拟合,U = " + fitResult.a.toFixed(4) + " + (" + fitResult.b.toFixed(4) + ")·I\n电动势E(V)," + fitResult.a.toFixed(4) + "\n内阻r(Ω)," + (-fitResult.b).toFixed(4) + "\nR2," + fitResult.r2.toFixed(5) + "\n";
  if (runs.length) {
    csv += "\n===== 已保存的对比实验 =====\n";
    for (const r of runs) {
      const P = r.primary;
      csv += "\n第" + r.no + "次,颜色," + r.color + ",点数," + r.pts.length + "\n";
      csv += "序号,电流I(A),电压U(V)\n";
      for (const p of r.pts) csv += p.n + "," + p.i.toFixed(5) + "," + p.u.toFixed(5) + "\n";
      csv += "拟合,U = " + P.a.toFixed(4) + " + (" + P.b.toFixed(4) + ")·I,电动势E(V)," + P.a.toFixed(4) +
             ",内阻r(Ω)," + (-P.b).toFixed(4) + ",R2," + P.r2.toFixed(5) + "\n";
    }
  }
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");

};

// ============ 数据表 ============
function renderTable() {
  const t = $("dataTable");
  const cols = Math.max(10, records.length);
  let html = "<tr><td class='hcell'>序号</td>";
  for (let c = 1; c <= cols; c++) html += "<td>" + c + "</td>";
  html += "</tr><tr><td class='hcell'>U/V</td>";

  html += "</tr><tr><td class='hcell'>I/A</td>";

  html += "</tr>";
  t.innerHTML = html;
}

// ============ U-I 图像 ============
const canvas = $("chart"), ctx = canvas.getContext("2d");
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  draw();
}
window.addEventListener("resize", resize);

function niceStep(range, target) {
  if (!(range > 0)) return 0.1;
  const raw = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 5, 10]) if (raw <= m * mag) return m * mag;
  return 10 * mag;
}
function draw() {
  const W = canvas.width, H = canvas.height;
  if (W < 50 || H < 50) return;
  ctx.clearRect(0, 0, W, H);
  const dp = devicePixelRatio;
  const mL = 70 * dp, mR = 24 * dp, mT = 20 * dp, mB = 52 * dp;
  const pw = W - mL - mR, ph = H - mT - mB;
  // 非缩放模式：视图自动适配，且强制以 (0,0) 为原点（电流 I 轴、电压 U 轴都从 0 起）
  if (!zoomMode) {
    let iMax = 0, uMax = 0;
    const pts = [];
    for (const p of records) pts.push({ i: p.i, u: p.u });
    if (records.length < 2) for (const q of trace) pts.push({ i: q.i, u: q.u });
    // 已保存的对比曲线也纳入坐标范围，保证多条曲线同框比较
    for (const r of runs) {
      if (!r.visible) continue;
      for (const p of r.pts) pts.push({ i: p.i, u: p.u });
      for (const g of r.groups) {
        pts.push({ i: g.imin, u: g.a + g.b * g.imin });
        pts.push({ i: g.imax, u: g.a + g.b * g.imax });
      }
    }
    if (!pts.length) { iMax = 0.5; uMax = 1.5; }
    // 一次函数直线要画满全图：纳入两个截距（I=0 处 U=E，U=0 处 I=E/r）
    if (fitResult) {
      const P = fitResult.primary;
      pts.push({ i: 0, u: P.a });
      const isc = -P.a / P.b;
      if (Number.isFinite(isc) && isc > 0) pts.push({ i: isc, u: 0 });
    }
    for (const p of pts) {
      if (!Number.isFinite(p.i) || !Number.isFinite(p.u) || Math.abs(p.i) > 1e6 || Math.abs(p.u) > 1e6) continue;
      if (p.i > 0) iMax = Math.max(iMax, p.i);
      if (p.u > 0) uMax = Math.max(uMax, p.u);
    }
    const padI = iMax * 0.12 || 0.1, padU = uMax * 0.15 || 0.1;
    view = { iMin: 0, iMax: iMax + padI, uMin: 0, uMax: uMax + padU };
  }
  const { iMin, iMax, uMin, uMax } = view;
  const X = i => mL + (i - iMin) / (iMax - iMin) * pw;
  const Y = u => mT + (uMax - u) / (uMax - uMin) * ph;

  const stepI = niceStep(iMax - iMin, 10), stepU = niceStep(uMax - uMin, 8);
  ctx.font = 12 * dp + "px Arial";
  ctx.strokeStyle = "#e3e8ee"; ctx.lineWidth = 1 * dp;
  ctx.fillStyle = "#5d6d7e";
  for (let v = Math.ceil(iMin / stepI) * stepI; v <= iMax; v += stepI) {
    const x = X(v);
    ctx.beginPath(); ctx.moveTo(x, mT); ctx.lineTo(x, mT + ph); ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillText(fmtTick(v), x, H - mB + 18 * dp);
  }
  for (let v = Math.ceil(uMin / stepU) * stepU; v <= uMax; v += stepU) {
    const y = Y(v);
    ctx.beginPath(); ctx.moveTo(mL, y); ctx.lineTo(mL + pw, y); ctx.stroke();
    ctx.textAlign = "right";
    ctx.fillText(fmtTick(v), mL - 8 * dp, y + 4 * dp);
  }
  // 外框（浅）
  ctx.strokeStyle = "#cfd8e3"; ctx.lineWidth = 1 * dp;
  ctx.strokeRect(mL, mT, pw, ph);
  // ===== 坐标轴：过原点(0,0) =====
  // U=0 为横轴（x 轴，电流 I 轴）；I=0 为纵轴（y 轴，电压 U 轴）
  ctx.strokeStyle = "#1a2b3c"; ctx.lineWidth = 2.4 * dp;
  ctx.beginPath(); ctx.moveTo(mL, Y(0)); ctx.lineTo(mL + pw, Y(0)); ctx.stroke();   // 横轴 x
  ctx.beginPath(); ctx.moveTo(X(0), mT + ph); ctx.lineTo(X(0), mT); ctx.stroke();   // 纵轴 y
  ctx.fillStyle = "#1a2b3c";
  // 横轴箭头（向右）
  { const ax = mL + pw, ay = Y(0);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax - 10 * dp, ay - 4.5 * dp); ctx.lineTo(ax - 10 * dp, ay + 4.5 * dp); ctx.closePath(); ctx.fill(); }
  // 纵轴箭头（向上）
  { const bx = X(0), by = mT;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 4.5 * dp, by + 10 * dp); ctx.lineTo(bx + 4.5 * dp, by + 10 * dp); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = "#2c3e50";
  ctx.textAlign = "center";
  ctx.fillText("电流 (A)", mL + pw / 2, H - 12 * dp);
  ctx.save();
  ctx.translate(16 * dp, mT + ph / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText("电压 (V)", 0, 0);
  ctx.restore();

  // ===== 已保存的对比曲线（虚线 + 小点，浅色保留，便于多次实验对比） =====
  for (const r of runs) {
    if (!r.visible) continue;
    for (const g of r.groups) {
      ctx.save();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = g.color; ctx.lineWidth = 2 * dp;
      ctx.setLineDash([8 * dp, 5 * dp]);
      ctx.beginPath();
      ctx.moveTo(X(iMin), Y(g.a + g.b * iMin));
      ctx.lineTo(X(iMax), Y(g.a + g.b * iMax));
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = r.color;
    for (const p of r.pts) {
      if (p.i < iMin || p.i > iMax || p.u < uMin || p.u > uMax) continue;
      ctx.beginPath(); ctx.arc(X(p.i), Y(p.u), 3.4 * dp, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  // 实时轨迹（浅色点）
  ctx.fillStyle = "rgba(155,89,182,.25)";
  for (const q of trace) {
    if (q.i < iMin || q.i > iMax || q.u < uMin || q.u > uMax) continue;
    ctx.fillRect(X(q.i) - 1 * dp, Y(q.u) - 1 * dp, 2 * dp, 2 * dp);
  }
  // ===== 描点法作图：记录的数据直接描成点（不连线，连线交给拟合直线） =====
  for (const p of records) {
    if (p.i < iMin || p.i > iMax || p.u < uMin || p.u > uMax) continue;
    const x = X(p.i), y = Y(p.u);
    ctx.beginPath(); ctx.arc(x, y, 5 * dp, 0, 7);
    ctx.fillStyle = p.color; ctx.fill();
    ctx.lineWidth = 1.6 * dp; ctx.strokeStyle = "#ffffff"; ctx.stroke();
    ctx.fillStyle = "#37474f"; ctx.textAlign = "left";
    ctx.font = "bold " + 10 * dp + "px Arial";
    ctx.fillText(p.n, x + 7 * dp, y - 6 * dp);
  }
  // ===== 拟合直线（一次函数图像）：只有点过"处理数据"(showFit) 才画 =====
  if (showFit && fitResult && fitResult.groups.length) {
    for (const g of fitResult.groups) {
      ctx.strokeStyle = g.color; ctx.lineWidth = 2.6 * dp;
      ctx.beginPath();
      ctx.moveTo(X(iMin), Y(g.a + g.b * iMin));
      ctx.lineTo(X(iMax), Y(g.a + g.b * iMax));
      ctx.stroke();
    }
    // 标注：截距 E（I=0 与纵轴交点）、短路电流 I短（U=0 与横轴交点）
    const P = fitResult.primary;
    ctx.fillStyle = P.color; ctx.textAlign = "center";
    ctx.font = "bold " + 11 * dp + "px Arial";
    if (0 >= iMin && 0 <= iMax && P.a >= uMin && P.a <= uMax) {
      const y0 = Y(P.a);
      ctx.beginPath(); ctx.arc(X(0), y0, 4 * dp, 0, 7); ctx.fill();
      ctx.textAlign = "right";
      ctx.fillText("E=" + P.a.toFixed(3) + "V", X(0) - 6 * dp, y0 - 7 * dp);
    }
    if (Math.abs(P.b) > 1e-9) {
      const isc = -P.a / P.b;
      if (isc >= iMin && isc <= iMax) {
        ctx.beginPath(); ctx.arc(X(isc), Y(0), 4 * dp, 0, 7); ctx.fill();
        ctx.textAlign = "right";
        ctx.fillText("I短=" + isc.toFixed(3) + "A", X(isc) - 6 * dp, Y(0) + 18 * dp);
      }
    }
    // 函数关系式（左上角）
    let ly = mT + 22 * dp;
    ctx.textAlign = "left";
    for (const g of fitResult.groups) {
      ctx.fillStyle = g.color;
      ctx.font = "bold " + 13 * dp + "px Arial";
      const txt = eqStr(g) + (g === P ? "   E=" + g.a.toFixed(3) + "V  r=" + (-g.b).toFixed(3) + "Ω" : "");
      ctx.fillText(txt, mL + 10 * dp, ly);
      ly += 17 * dp;
    }
  } else if (!showFit && records.length < 2) {
    ctx.fillStyle = "#7f8c8d"; ctx.textAlign = "left";
    ctx.font = "12px Arial";
    const tip = records.length === 1 ? "再记录 1 组，然后点\"处理数据\"拟合出直线图像" : "记录数据后点\"处理数据\"拟合出直线图像";
    ctx.fillText(tip, mL + 10 * dp, mT + 20 * dp);
  }
}
function fmtTick(v) {
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.001 || a >= 1e5)) return v.toExponential(1);
  return +v.toFixed(6) + "";
}

// ============ 缩放 / 平移 / 重置 ============
$("zoomBtn").onclick = () => {
  zoomMode = !zoomMode;
  $("zoomBtn").classList.toggle("on", zoomMode);
  setResult(zoomMode ? "整体缩放已开启：滚轮缩放、拖动平移（再点一次关闭，恢复自动适配）。" : "已恢复自动适配数据范围。");
  draw();
};
$("resetBtn").onclick = () => {
  zoomMode = false;
  $("zoomBtn").classList.remove("on");
  view = { iMin: 0, iMax: 1.0, uMin: 0, uMax: 1.0 };
  draw();
};
// 滚轮/拖动只在"整体缩放"开启时生效，防止误操作把视图缩到天文数字
canvas.addEventListener("wheel", e => {
  if (!zoomMode) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const dp = devicePixelRatio;
  const mL = 70 * dp, pw = canvas.width - mL - 24 * dp, ph = canvas.height - 20 * dp - 52 * dp;
  const mx = Math.min(1, Math.max(0, (e.offsetX * dp - mL) / pw));
  const my = Math.min(1, Math.max(0, (e.offsetY * dp - 20 * dp) / ph));
  const k = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  const ci = view.iMin + mx * (view.iMax - view.iMin);
  const cu = view.uMax - my * (view.uMax - view.uMin);
  let iMin = ci - (ci - view.iMin) * k, iMax = ci + (view.iMax - ci) * k;
  let uMin = cu - (cu - view.uMin) * k, uMax = cu + (view.uMax - cu) * k;
  // 限制视图跨度，防止无限缩放
  if (iMax - iMin < 1e6 && iMax - iMin > 1e-7 && uMax - uMin < 1e6 && uMax - uMin > 1e-7) {
    view = { iMin, iMax, uMin, uMax };
  }
  draw();
}, { passive: false });
let dragging = false, dragPos = null;
canvas.addEventListener("mousedown", e => { if (!zoomMode) return; dragging = true; dragPos = { x: e.offsetX, y: e.offsetY, v: { ...view } }; });
window.addEventListener("mouseup", () => dragging = false);
canvas.addEventListener("mousemove", e => {
  if (!dragging || !zoomMode) return;
  const dp = devicePixelRatio;
  const mL = 70 * dp, pw = canvas.width - mL - 24 * dp, ph = canvas.height - 20 * dp - 52 * dp;
  const di = (e.offsetX - dragPos.x) * dp / pw * (dragPos.v.iMax - dragPos.v.iMin);
  const du = (e.offsetY - dragPos.y) * dp / ph * (dragPos.v.uMax - dragPos.v.uMin);
  view = { iMin: dragPos.v.iMin - di, iMax: dragPos.v.iMax - di, uMin: dragPos.v.uMin + du, uMax: dragPos.v.uMax + du };
  draw();
});

// ============ 其它按钮 ============
$("homeBtn").onclick = () => { if (history.length > 1) history.back(); };
$("setBtn").onclick = () => { saveIdMap(); $("setModal").classList.add("show"); };

// ============ 切接法：电流表内接 ⇄ 电流表外接 ============
$("modeBtn").onclick = () => {
  circuitMode = circuitMode === "wai" ? "nei" : "wai";
  localStorage.setItem("emf3_circuit", circuitMode);
  applyCircuit();
  if (circuitMode === "wai") {
    setResult("<b style='color:#d35400'>② 电流表外接法</b>：电压传感器只并在滑动变阻器 R 两端，电流传感器在干路（靠电源一侧）测总电流。" +
              "误差：电流传感器分压 → E 测量值准确、r 偏大（r测 = r + R<sub>A</sub>）。开关 S 断开时电压传感器可直读电动势。" +
              "建议换一个记录颜色再开始新一轮，两条图线可同框对比。");
  } else {
    setResult("<b style='color:#d35400'>① 电流表内接法</b>：电压传感器并在「R + 电流传感器」两端（即电源两端），电流传感器只测变阻器支路电流。" +
              "误差：电压传感器分流 → E、r 测量值均偏小。建议换一个记录颜色再开始新一轮，两条图线可同框对比。");
  }
};
// 手动交换电压/电流（只做一次，自动记住；下次打开页面沿用）
function swapChannels() {
  const t = ID_U; ID_U = ID_I; ID_I = t;
  saveIdMap();
  for (const d of devices) {
    if (d.owner === SU) d.owner = SI;
    else if (d.owner === SI) d.owner = SU;
  }
  rememberAddrMap();      // 按这台传感器的地址记住，插拔顺序变了也不会再错
  SU.bound = devices.some(d => d.owner === SU);
  SI.bound = devices.some(d => d.owner === SI);
  SU.lastRaw = 0; SI.lastRaw = 0;
  debugLog("[INFO] 已交换电压/电流传感器，新对应已保存：0x" + ID_U.toString(16) + "→电压");
  updateStatus(); updateButtons();
  setResult("已交换电压/电流：现在 <b>0x" + ID_U.toString(16) + " → 电压</b>，0x" + ID_I.toString(16) +
            " → 电流。<b>对应关系已记住</b>，下次打开不用再交换；电路图里电压表/电流表的位置不变。");
}
$("swapBtn").onclick = swapChannels;
$("swap2Btn").onclick = swapChannels;
// 恢复默认对应（清除记住的 ID / 地址对应关系）
$("resetMapBtn").onclick = () => {
  ID_U = 0x1a; ID_I = 0x1b;
  addrMap = {};
  try { localStorage.removeItem("emf3_addrMap"); } catch (e) {}
  saveIdMap();
  setResult("已恢复默认对应（0x1a → 电压，0x1b → 电流）。两台传感器重新连接后会按 ID 自动识别；若还是反的，再点一次\"交换\"即可。");
  debugLog("[INFO] 已重置电压/电流对应关系");
};
// 手动重新唤醒
$("rewakeBtn").onclick = () => {
  for (const d of devices) { if (d.connected) { d.tries = 0; d.bytes = 0; wakeSensor(d); } }
  setResult("正在重新唤醒传感器（约 3 秒）…");
};
$("debugBtn").onclick = () => $("debugPanel").classList.toggle("show");
$("setModal").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("show"); });
$("fitModal").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("show"); });
["decU","decI"].forEach(id => $(id).addEventListener("change", () => { renderTable(); draw(); }));

function updateButtons() {
  const any = devices.some(d => d.connected);
  $("startBtn").disabled = !any;
  $("recordBtn").disabled = !any;
  $("delBtn").disabled = records.length === 0;
  $("fitBtn").disabled = records.length < 2;
  $("saveBtn").disabled = records.length < 2;
  $("exportBtn").disabled = records.length === 0 && trace.length === 0 && runs.length === 0;
}

// ============ 主循环 ============
let lastDraw = 0;
function loop(ts) {
  $("uDisp").textContent = SU.lastRaw.toFixed(decOf("U")) + "V";
  $("iDisp").textContent = SI.lastRaw.toFixed(decOf("I")) + "A";
  if (ts - lastDraw > 100) { lastDraw = ts; draw(); }
  requestAnimationFrame(loop);
}

renderTable();
loadRuns();
renderLegend();
saveIdMap();          // 显示当前电压/电流传感器的 ID 对应关系（已记住）
applyCircuit();       // 恢复上次的电路接法（内接/外接）
resize();
requestAnimationFrame(loop);
setResult("当前接法：<b>" + modeName() + "</b>（电路图上方按钮可切换）。请先点\"连接传感器\"：每按一次连一台（电压/电流按 ID 自动识别，位置不会变），两台都连上后按电路图接好即可实验。");
</script>

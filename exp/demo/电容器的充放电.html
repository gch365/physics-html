<style>
  * { box-sizing: border-box; }

    margin: 0; padding: 14px 20px;

  .b-start.on{ background:#e67e22; }
  .b-clear { background:#7f8c8d; } .b-clear:hover { background:#616a6b; }
  .b-export { background:#f1c40f; color:#2c3e50; } .b-export:hover { background:#f4d03f; }

  #statusBar { width: 100%; max-width: 980px; text-align: center; font-size: 13px; color: #7f8c8d; }
  .sensor-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; max-width: 980px; }
  .sensor-card { background: #fff; border-radius: 8px; padding: 12px 18px; min-width: 200px; box-shadow: 0 2px 6px rgba(0,0,0,.08); text-align: center; flex: 1 1 200px; }
  .sensor-card .sname { font-size: 14px; color: #7f8c8d; }

  .assign-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: 100%; max-width: 980px; }

  .win-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; width:100%; max-width:980px; }

  .win-row input { width:80px; padding:6px 8px; border:1px solid #bdc3c7; border-radius:4px; font-size:14px; }

  .legend { display:flex; gap:18px; justify-content:center; font-size:13px; color:#2c3e50; }

  .role-set button:hover { background:#ca6f1e; }
  .debug { width: 100%; max-width: 980px; }

  .hint { font-size: 12px; color: #7f8c8d; line-height: 1.6; }
</style>
</head>
<body>
  <h1>电容器的充放电</h1>
  <div class="button-container">
    <button class="b-home" onclick="location.href='../index.html'">返回主页</button>
    <button class="b-connect" id="connectBtn">连接传感器</button>
    <button class="b-start" id="startBtn">开始采集</button>
    <button class="b-clear" id="clearBtn">清空曲线</button>
    <button class="b-export" id="exportBtn">导出数据</button>
    <button class="b-reset" id="resetBtn">恢复默认映射</button>
  </div>
  <div id="statusBar">未连接传感器</div>
  <div id="resultBar">请点「连接传感器」连接探究猫电压传感器与电流传感器（USB 串口 38400）。接好 RC 充放电电路后点「开始采集」，可实时观察电容两端电压 U 与电流 I 随时间的变化曲线。</div>

  <div class="sensor-row" id="sensorRow"></div>
  <div class="assign-row" id="assignRow"></div>

  <div class="win-row">
    <label>时间窗口(s)：</label><input type="number" id="winInput" step="5" value="20" min="2" max="120">
    <span class="hint">曲线显示最近 N 秒的数据；点「清空曲线」可重置起始时刻。</span>
  </div>

  <div class="legend">
    <span><b style="background:#27ae60"></b>电压 U (V)</span>
    <span><b style="background:#e67e22"></b>电流 I (A)</span>
  </div>

  <div class="plot-wrap"><canvas id="plot"></canvas></div>

  <div class="settings">
    <h3>显示与校准设置</h3>
    <div class="grid" id="roleSettings"></div>
    <p class="hint">默认对应：<b>0x1a → 电压传感器</b>（±20V），<b>0x1b → 电流传感器</b>（±3A）。连接后可在上方下拉框为每个角色指定具体设备；交换结果会记住。数值若不准，填入标准值后点「一键校准」即可。</p>
  </div>

  <details class="debug">
    <summary>调试信息</summary>
    <pre id="debugLog"></pre>
  </details>

<script>
function $(id){ return document.getElementById(id); }

// ===================== 实验配置 =====================
const PREFIX = "cap_";
const ROLES = [
  { id:"U", name:"电压 U", unit:"V", defaultID:0x1a, scale:0.001, dec:3 },
  { id:"I", name:"电流 I", unit:"A", defaultID:0x1b, scale:0.0001, dec:3 },
];
ROLES.forEach(r => { r.bound=false; r.lastRaw=0; r.connected=false; });

// ===================== 通信层（复用测量电源页，已验证） =====================
const BROADCAST = [0xa0,0xff,0xd4,0x88,0x00,0x00,0x05,0x88,0x00,0x00,0x00,0x00];
const MAP_VER = "1";
try {
  if (localStorage.getItem(PREFIX+"mapVer") !== MAP_VER) {
    localStorage.removeItem(PREFIX+"addrMap");
    localStorage.setItem(PREFIX+"mapVer", MAP_VER);
  }
} catch(e) {}

let addrMap = {};
try { addrMap = JSON.parse(localStorage.getItem(PREFIX+"addrMap") || "{}") || {}; } catch(e) { addrMap = {}; }
function addrKey(a){ return Array.from(a).map(b=>b.toString(16).padStart(2,"0")).join(""); }
function roleByAddr(a){ const k = addrMap[addrKey(a)]; return ROLES.find(r=>r.id===k) || null; }
function rememberAddrMap(){
  for (const d of devices) if (d.addr && d.owner) addrMap[addrKey(d.addr)] = d.owner.id;
  try { localStorage.setItem(PREFIX+"addrMap", JSON.stringify(addrMap)); } catch(e) {}
}

let devices = [];
let receiving = false;
let series = [];           // 滚动数据 {t,u,i}
let t0 = null;
let winSec = 20;
let sampleAcc = 0, lastSample = 0;

// ===================== 系数 / 小数位 =====================
function scaleKey(rid){ return PREFIX+"scale_"+rid; }
function decKey(rid){ return PREFIX+"dec_"+rid; }
function stdKey(rid){ return PREFIX+"std_"+rid; }
function scaleOf(rid){
  const v = parseFloat(localStorage.getItem(scaleKey(rid)));
  const role = ROLES.find(r=>r.id===rid);
  return Number.isFinite(v) && v>0 ? v : (role?role.scale:0.001);
}
function decOf(rid){
  const v = parseInt(localStorage.getItem(decKey(rid)));
  return Number.isFinite(v) ? v : (ROLES.find(r=>r.id===rid)||{dec:3}).dec;
}

// ===================== 一键校准 =====================
function calibrate(rid){
  const role = ROLES.find(r=>r.id===rid);
  if (!role || !role.bound) { alert("请先连接「"+role.name+"」！"); return; }
  const std = parseFloat(localStorage.getItem(stdKey(rid)));
  if (!Number.isFinite(std) || std===0) { alert("请先在「"+role.name+"」的标准值里填入标准"+role.unit+"（不为 0）"); return; }
  const disp = role.lastRaw;
  if (Math.abs(disp) < 1e-9) { alert(role.name+"当前读数为 0，请检查接线或等待读数稳定后再校准"); return; }
  const oldK = scaleOf(rid);
  const newK = oldK * std / disp;
  localStorage.setItem(scaleKey(rid), newK.toPrecision(6));
  role.lastRaw = std;
  debugLog("[CAL] "+role.name+" 系数 "+oldK+" -> "+newK.toPrecision(6));
  setResult("✅ "+role.name+"已校准：标准 "+std+role.unit+"，原显示 "+disp.toFixed(4)+role.unit+" → 新系数 "+newK.toPrecision(5)+" "+role.unit+"/计数。现在显示应≈"+std+role.unit+"。");
  updateSensors();
}

// ===================== 状态 / 调试 =====================
function debugLog(msg){ const el=$("debugLog"); el.textContent += timeStr()+" "+msg+"\n"; el.scrollTop=el.scrollHeight; }
function timeStr(){ return new Date().toTimeString().slice(0,8); }
function setResult(html){ $("resultBar").innerHTML = html; }
function updateStatus(){
  const parts = [];
  for (const d of devices){
    if (!d.connected) continue;
    if (d.owner) parts.push(d.owner.name + "[0x"+d.addr[1].toString(16)+"] " + d.rate + "Hz " + d.bytes + "B");
    else parts.push("识别中…(" + d.bytes + "B，" + Math.floor(d.bytes/12) + "帧)");
  }
  $("statusBar").textContent = parts.length ? "已连接：" + parts.join(" ｜ ") + (receiving?"　·　采集中":"") : "未连接传感器";
}
function updateButtons(){
  const connectable = devices.filter(d=>d.connected).length;
  $("connectBtn").textContent = connectable>0 ? "再连传感器("+connectable+")" : "连接传感器";
}

// ===================== 串口连接 =====================
let connectCount = 0;
$("connectBtn").onclick = async () => {
  if (!("serial" in navigator)) { alert("请使用 Chrome 或 Edge 浏览器打开本页面！"); return; }
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate:38400, dataBits:8, stopBits:1, parity:"none", flowControl:"none" });
    try { await port.setSignals({ dataTerminalReady:true, requestToSend:true }); } catch(e){}
    const dev = { port, connected:true, buf:[], rxBuf:[], addr:null, owner:null, bytes:0, rate:0, rateCnt:0, rateT:Date.now(), waking:false, tries:0 };
    devices.push(dev);
    connectCount++;
    debugLog("[OK] 串口已打开 @38400（第"+connectCount+"台），等待设备启动后广播识别...");
    updateButtons(); updateStatus();
    readLoop(dev);
    await new Promise(r=>setTimeout(r,1200));
    await wakeSensor(dev);
  } catch(e){
    if (e.name !== "NotFoundError") alert("连接失败：" + e.message);
    debugLog("[ERR] " + e.message);
  }
};

// 唤醒并识别
async function wakeSensor(dev){
  if (dev.waking) return;
  dev.waking = true;
  try {
    const w = dev.port.writable.getWriter();
    const send = async (bytes, delayMs) => { await w.write(new Uint8Array(bytes)); await new Promise(r=>setTimeout(r,delayMs)); };
    const findIn = (cmd) => {
      const b = dev.rxBuf;
      for (let i=0; i<=b.length-12; i++){
        if (b[i]===0xa0 && b[i+1]===0xff && b[i+7]===cmd) return b.slice(i+2,i+7);
      }
      return null;
    };
    let addr = null;
    for (let attempt=1; attempt<=3 && !addr; attempt++){
      dev.rxBuf = []; dev.buf = [];
      await send(BROADCAST, 1000);
      addr = findIn(0x88) || findIn(0x80);
      if (!addr) debugLog("[INFO] 第"+attempt+"轮广播无应答（收到 "+dev.bytes+" 字节）");
    }
    if (!addr){
      w.releaseLock();
      dev.tries++;
      debugLog("[WARN] 未识别到传感器：共收到 "+dev.bytes+" 字节。");
      setResult("<b style='color:#e67e22'>传感器已打开串口但无应答（"+dev.bytes+" 字节）。</b>请确认：① 指示灯亮；② 换 USB 线；③ 点「调试」把内容发我。");
      updateStatus();
      return;
    }
    const sid = addr[1];
    let role = roleByAddr(addr) || ROLES.find(r=>r.defaultID===sid && !r.bound) || ROLES.find(r=>!r.bound);
    if (!role){ debugLog("[WARN] 已无可分配角色。"); w.releaseLock(); return; }
    if (role.bound && devices.some(d=>d!==dev && d.owner===role)){
      const other = ROLES.find(r=>!r.bound);
      if (other) role = other;
    }
    dev.owner = role; dev.owner.bound = true; dev.addr = addr;
    role.connected = true;
    debugLog("[OK] "+role.name+" 地址 = "+Array.from(addr).map(b=>b.toString(16).padStart(2,"0")).join(" "));
    const A = () => new Uint8Array([0xa0,0xff,...addr]);
    dev.buf=[];
    await send([...A(),0x01,0,0,0,0x01],400);
    await send([...A(),0xa0,0,0,0,0],400);
    await send([...A(),0x14,0,0,0,0],400);
    dev.buf=[]; dev.rxBuf=[];
    w.releaseLock();
    debugLog("[OK] "+role.name+" 唤醒完成。");
    rememberAddrMap();
    rebuildAssign();
    const allBound = ROLES.every(r=>r.bound);
    setResult("✅ "+role.name+" 已连接。" + (allBound ? "电压与电流均已连接，可以开始实验。<br><b>提示：接好 RC 电路后点「开始采集」。</b>" : "再点一次「连接传感器」连另一台。"));
    updateButtons(); updateStatus();
  } catch(e){
    debugLog("[WARN] 唤醒失败: "+e.message);
  } finally { dev.waking = false; }
}

setInterval(()=>{
  for (const d of devices){
    if (!d.connected || d.waking) continue;
    if (!d.owner || d.bytes===0){ if (d.tries<6) wakeSensor(d); }
  }
},4000);

async function readLoop(dev){
  const reader = dev.port.readable.getReader();
  try {
    while (dev.connected){
      const { value, done } = await reader.read();
      if (done) break;
      if (value && value.length){
        const firstChunk = dev.bytes===0;
        dev.bytes += value.length;
        if (firstChunk) debugLog("[RX] 首包 "+value.length+" 字节");
        for (const b of value){ dev.buf.push(b); dev.rxBuf.push(b); }
        if (dev.buf.length>4096) dev.buf = dev.buf.slice(-2048);
        if (dev.rxBuf.length>8192) dev.rxBuf = dev.rxBuf.slice(-4096);
        parseFrames(dev);
        const now = Date.now();
        if (now - dev.rateT >= 1000){ dev.rate = Math.round(dev.rateCnt*1000/(now-dev.rateT)); dev.rateCnt=0; dev.rateT=now; updateStatus(); }
      }
    }
  } catch(e){ debugLog("[ERR] 读取中断: "+e.message); }
  finally { try{ reader.releaseLock(); }catch(e){} }
}

function parseFrames(dev){
  while (dev.buf.length >= 12){
    if (!(dev.buf[0]===0xa0 && dev.buf[1]===0xff)){
      let idx=-1;
      for (let i=1;i<=dev.buf.length-2;i++){ if (dev.buf[i]===0xa0 && dev.buf[i+1]===0xff){ idx=i; break; } }
      if (idx<0){ dev.buf.splice(0,Math.max(dev.buf.length-1,0)); return; }
      dev.buf.splice(0,idx); continue;
    }
    if (!dev.owner && dev.buf[7]===0x80){
      const sid = dev.buf[3];
      const memRole = roleByAddr(dev.buf.slice(2,7));
      if (memRole || ROLES.some(r=>r.defaultID===sid)){
        dev.owner = memRole || ROLES.find(r=>r.defaultID===sid && !r.bound) || ROLES.find(r=>!r.bound);
        if (dev.owner){ dev.owner.bound=true; dev.owner.connected=true; dev.addr=dev.buf.slice(2,7);
          debugLog("[OK] 数据流自动识别："+dev.owner.name+"（ID 0x"+sid.toString(16)+"）");
          rememberAddrMap(); rebuildAssign(); updateButtons(); updateStatus();
        }
      }
    }
    if (dev.owner && dev.addr && dev.buf.slice(2,7).join(",")!==dev.addr.join(",")){ dev.buf.splice(0,1); continue; }
    if (dev.buf[7]!==0x80){ dev.buf.splice(0,12); continue; }
    if (!dev.owner){ dev.buf.splice(0,12); continue; }
    const raw = (dev.buf[10]<<8) | dev.buf[11];
    const signed = raw >= 0x8000 ? raw - 0x10000 : raw;
    if (Math.abs(signed) > 30000){ dev.buf.shift(); continue; }
    const value = signed * scaleOf(dev.owner.id);
    dev.owner.lastRaw = value;
    dev.rateCnt++;
    dev.buf.splice(0,12);
  }
}

// ===================== 接收 / 采样 =====================
function setReceiving(on){
  receiving = on;
  const b = $("startBtn");
  b.textContent = on ? "停止采集" : "开始采集";
  b.classList.toggle("on", on);
  if (on){ t0 = Date.now()/1000; series = []; lastSample = t0; }
}
$("startBtn").onclick = () => {
  if (!ROLES.every(r=>r.bound)) { alert("请先连接电压传感器与电流传感器！"); return; }
  setReceiving(!receiving);
};
$("clearBtn").onclick = () => { series = []; if (t0!==null) t0 = Date.now()/1000; setResult("已清空曲线，重新开始计时。"); draw(); };

// 采样：每 ~50ms 记录一次当前 U/I
setInterval(()=>{
  if (!receiving || !ROLES.every(r=>r.bound)) return;
  const now = Date.now()/1000;
  if (now - lastSample < 0.05) return;
  lastSample = now;
  const t = t0===null ? 0 : now - t0;
  series.push({ t, u:ROLES[0].lastRaw, i:ROLES[1].lastRaw });
  if (series.length > 20000) series.shift();
}, 50);

// ===================== 导出 CSV =====================
$("exportBtn").onclick = () => {
  if (!series.length){ alert("没有可导出的数据。"); return; }
  let csv = "时间t(s),电压U(V),电流I(A)\n";
  for (const p of series) csv += p.t.toFixed(3)+","+p.u.toFixed(decOf("U"))+","+p.i.toFixed(decOf("I"))+"\n";
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "电容器充放电数据.csv";
  a.click();
  setResult("✅ 已导出 CSV（"+series.length+" 个采样点）。");
};

// ===================== 恢复默认映射 =====================
$("resetBtn").onclick = () => {
  addrMap = {};
  try { localStorage.removeItem(PREFIX+"addrMap"); } catch(e){}
  setResult("已清除地址→角色记忆。重新连接传感器后会按默认自动分配；若反了，用上方下拉框重新指定即可。");
};

// ===================== 设备分配下拉框 =====================
function rebuildAssign(){
  const row = $("assignRow");
  if (!devices.length){ row.innerHTML=""; return; }
  row.innerHTML = ROLES.map(role=>{
    const opts = devices.map((d,i)=>{
      const label = "设备"+ (i+1) +"[0x"+(d.addr?d.addr[1].toString(16):"?")+"]" + (d.owner?("→"+d.owner.name):"");
      const sel = (d.owner===role) ? "selected" : "";
      return '<option value="'+i+'" '+sel+'>'+label+'</option>';
    }).join("");
    return '<div class="assign-box">'+role.name+'：<select data-role="'+role.id+'" onchange="reassign(this)">'+opts+'<option value="-1">未分配</option></select></div>';
  }).join("");
}
function reassign(sel){
  const rid = sel.getAttribute("data-role");
  const di = parseInt(sel.value);
  const role = ROLES.find(r=>r.id===rid);
  for (const d of devices) if (d.owner===role) d.owner=null;
  role.bound = false;
  if (di>=0){
    const dev = devices[di];
    if (dev.owner){ dev.owner.bound=false; dev.owner=null; }
    dev.owner = role; role.bound=true; role.connected=true;
    rememberAddrMap();
  }
  rebuildAssign(); updateStatus();
  const adv = role.bound ? devices.find(d=>d.owner===role) : null;
  const txt = (adv && adv.addr) ? ("设备[0x"+adv.addr[1].toString(16)+"]") : "未分配";
  setResult("已更新分配："+role.name+" → "+txt+"。");
}

// ===================== 实时显示 =====================
function updateSensors(){
  const row = $("sensorRow");
  row.innerHTML = ROLES.map(r=>{
    const val = r.bound ? r.lastRaw.toFixed(decOf(r.id)) : "--";
    return '<div class="sensor-card"><div class="sname">'+r.name+'</div><div class="sval">'+val+'</div><div class="sunit">'+r.unit+'</div></div>';
  }).join("");
}
setInterval(()=>{ if (devices.some(d=>d.owner)) updateSensors(); }, 200);

// ===================== 设置面板 =====================
function buildRoleSettings(){
  const wrap = $("roleSettings");
  wrap.innerHTML = ROLES.map(r=>{
    return '<div class="role-set" data-rid="'+r.id+'">'+
      '<div class="rt">'+r.name+'</div>'+
      '<label>系数</label><input type="text" id="scale_'+r.id+'" value="'+scaleOf(r.id)+'"><br>'+
      '<label>小数位</label><input type="text" id="dec_'+r.id+'" value="'+decOf(r.id)+'"><br>'+
      '<label>标准值('+r.unit+')</label><input type="text" id="std_'+r.id+'" value="'+ (localStorage.getItem(stdKey(r.id))||"") +'"><br>'+
      '<button onclick="saveRoleSet(\''+r.id+'\')">保存设置</button> '+
      '<button onclick="calibrate(\''+r.id+'\')">一键校准</button>'+
      '</div>';
  }).join("");
  ROLES.forEach(r=>{
    const sv=$("scale_"+r.id), dv=$("dec_"+r.id), st=$("std_"+r.id);
    sv.addEventListener("change",()=>localStorage.setItem(scaleKey(r.id), sv.value));
    dv.addEventListener("change",()=>localStorage.setItem(decKey(r.id), dv.value));
    st.addEventListener("change",()=>localStorage.setItem(stdKey(r.id), st.value));
  });
}
function saveRoleSet(rid){
  const sv=$("scale_"+rid).value, dv=$("dec_"+rid).value, st=$("std_"+rid).value;
  localStorage.setItem(scaleKey(rid), sv);
  localStorage.setItem(decKey(rid), dv);
  localStorage.setItem(stdKey(rid), st);
  setResult("✅ 已保存「"+ROLES.find(r=>r.id===rid).name+"」设置。");
}

// ===================== 绘图（滚动时间曲线，双 y 轴） =====================
const cv = $("plot");
const ctx = cv.getContext("2d");
function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio||1;
  cv.width = r.width*dpr; cv.height = r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  fitCanvas();
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  winSec = Math.max(2, Math.min(120, parseFloat($("winInput").value)||20));
  const padL=58, padR=58, padB=42, padT=16;
  let tEnd = series.length ? series[series.length-1].t : (t0?0:1);
  let tStart = Math.max(0, tEnd - winSec);
  let uMax = 0.001, iMax = 0.0001;
  for (const p of series){ if (p.t<tStart) continue; if (Math.abs(p.u)>uMax) uMax=Math.abs(p.u); if (Math.abs(p.i)>iMax) iMax=Math.abs(p.i); }
  uMax = Math.max(uMax*1.1, 0.5); iMax = Math.max(iMax*1.1, 0.01);
  const px = t => padL + ((t-tStart)/(winSec||1))*(W-padL-padR);
  const pyU = v => (H-padB) - ((v+uMax)/(2*uMax))*(H-padB-padT);
  const pyI = v => (H-padB) - ((v+iMax)/(2*iMax))*(H-padB-padT);
  // 网格
  ctx.strokeStyle="#eef0f2"; ctx.lineWidth=1;
  for (let i=0;i<=5;i++){ const t=tStart+(winSec)*i/5;
    ctx.beginPath(); ctx.moveTo(px(t),padT); ctx.lineTo(px(t),H-padB); ctx.stroke(); }
  for (let i=0;i<=4;i++){ const v=uMax*(1-2*i/4);
    ctx.beginPath(); ctx.moveTo(padL,pyU(v)); ctx.lineTo(W-padR,pyU(v)); ctx.stroke(); }
  // 轴
  ctx.strokeStyle="#34495e"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,H-padB); ctx.lineTo(W-padR,H-padB); ctx.stroke();
  ctx.fillStyle="#34495e"; ctx.font="13px Arial";
  ctx.fillText("t / s", W-padR-30, H-padB+30);
  ctx.save(); ctx.translate(padL-44, (padT+H-padB)/2); ctx.rotate(-Math.PI/2); ctx.fillStyle="#27ae60"; ctx.fillText("U / V",0,0); ctx.restore();
  ctx.save(); ctx.translate(W-padR+44, (padT+H-padB)/2); ctx.rotate(Math.PI/2); ctx.fillStyle="#e67e22"; ctx.fillText("I / A",0,0); ctx.restore();
  // 曲线
  ctx.strokeStyle="#27ae60"; ctx.lineWidth=2; ctx.beginPath();
  let started=false;
  for (const p of series){ if (p.t<tStart) continue; const X=px(p.t),Y=pyU(p.u); started?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),started=true); }
  ctx.stroke();
  ctx.strokeStyle="#e67e22"; ctx.lineWidth=2; ctx.beginPath();
  started=false;
  for (const p of series){ if (p.t<tStart) continue; const X=px(p.t),Y=pyI(p.i); started?ctx.lineTo(X,Y):(ctx.moveTo(X,Y),started=true); }
  ctx.stroke();
  if (!series.length){
    ctx.fillStyle="#aaa"; ctx.font="15px Arial"; ctx.fillText("点击「开始采集」后这里显示 U、I 随时间变化曲线", padL+40, (padT+H-padB)/2);
  }
}
setInterval(()=>{ if (receiving) draw(); }, 100);
draw();

// ===================== 初始化 =====================
buildRoleSettings();
updateSensors();
rebuildAssign();
</script>

<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">
    <meta name="author" content="物理仿真实验室">

    <title>滑块摆球模板——物理仿真实验室|99</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e74c3c; --bg: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', system-ui; background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        @media (max-width: 950px) { body { flex-direction: column; overflow: auto; } #controls { width: 100% !important; } #canvas-container { height: 50vh; } }

        #controls {
            width: 380px; padding: 15px; background: #f8f9fa; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 8px; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }
        h2 { font-size: 1.1rem; margin: 0; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; }
        .group { background: white; padding: 10px; border-radius: 8px; border: 1px solid #eee; }
        label { display: block; font-size: 0.85rem; margin-bottom: 3px; color: #555; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .val { float: right; font-weight: bold; color: var(--accent); }
        .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: var(--primary); color: white; font-weight: bold; }
        button:hover { opacity: 0.9; }
        button.reset { background: #95a5a6; }

        #canvas-container { flex-grow: 1; position: relative; background: #fff; }
        canvas { width: 100%; height: 100%; }

        #data-panel {
            top: 15px; right: 15px; background: rgba(255,255,255,0.95);
            padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Consolas', monospace;
            font-size: 0.75rem; pointer-events: none; min-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .data-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
        .status-box { text-align: center; padding: 5px; margin-bottom: 8px; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; }
        .status-contact { background: #e8f5e9; color: #2e7d32; }
        .status-sep { background: #fff3e0; color: #ef6c00; }
    </style>
</head>
<body>

<div id="controls">
    <h2>物理参数设置</h2>
    <div class="btns">
        <button id="btn-play">播放/暂停</button>
        <button id="btn-step" class="reset">步进</button>
        <button id="btn-reset" class="reset" style="grid-column: span 2;">重置模拟并清除轨迹</button>
    </div>
    <div id="data-panel">
        <div id="ab-status" class="status-box status-contact">状态：计算中</div>
        <div class="data-row"><span>A 速度 (vA):</span> <span id="va-val">0.00</span></div>
        <div class="data-row"><span>B 速度 (vB):</span> <span id="vb-val">0.00</span></div>
        <div class="data-row"><span>vC 水平/竖直:</span> <span><span id="vcx">0</span> / <span id="vcy">0</span></span></div>
        <hr>
        <div class="data-row"><span>A 水平动量 (pAx):</span> <span id="pax">0.00</span></div>
        <div class="data-row"><span>B 水平动量 (pBx):</span> <span id="pbx">0.00</span></div>
        <div class="data-row"><span>C 水平动量 (pCx):</span> <span id="pcx">0.00</span></div>
        <div class="data-row"><span>C 竖直动量 (pCy):</span> <span id="pcy">0.00</span></div>
        <div class="data-row" style="background:#fff9db"><span>系统总 Px:</span> <span id="total-px">0.00</span></div>
        <div class="data-row" style="background:#f3e5f5"><span>系统总 Py:</span> <span id="total-py">0.00</span></div>
        <div class="data-row"><span>系统能量 E:</span> <span id="total-e">0.00</span> J</div>
    </div>
    <div class="group">
        <label>初始释放状态: 
            <select id="init-side">
                <option value="right">右侧释放</option>
                <option value="left">左侧释放</option>
            </select>
        </label>
        <label>释放角度: <span id="angle-val" class="val">90°</span></label>
        <input type="range" id="angle-range" min="0" max="90" step="1" value="90">
    </div>

    <div class="group">
        <label>画面缩放: <span id="zoom-val" class="val">100%</span></label>
        <input type="range" id="zoom-range" min="0.1" max="2.0" step="0.05" value="1.0">
        <label>重力 g: <span id="g-val" class="val">9.8</span></label>
        <input type="range" id="g-range" min="0" max="20" step="0.1" value="9.8">
    </div>

    <div class="group">
        <label>质量 mA | mB | mC (kg):</label>
        <div style="display:flex; gap:5px;">
            <input type="number" id="ma-in" style="width:30%" value="2.0">
            <input type="number" id="mb-in" style="width:30%" value="2.0">
            <input type="number" id="mc-in" style="width:30%" value="1.0">
        </div>
        <label style="margin-top:8px;">绳长 L (m): <span id="l-val" class="val">1.5</span></label>
        <input type="range" id="l-range" min="0.5" max="3.0" step="0.1" value="1.5">
    </div>

    <div class="group">
        <label>地面摩擦系数 μ: <span id="mu-val" class="val">0.00</span></label>
        <input type="range" id="mu-range" min="0" max="1" step="0.01" value="0.00">
        <label>播放倍速: <span id="speed-val" class="val">1.0x</span></label>
        <input type="range" id="speed-range" min="0.1" max="3.0" step="0.1" value="1.0">
        <label><input type="checkbox" id="pause-on-sep"> 分离瞬间自动暂停</label>
        <label><input type="checkbox" id="include-b" checked> 放入物体 B</label>
        <label><input type="checkbox" id="fix-b"> 固定物体 B</label>
    </div>

    <div class="group">
        <label><input type="checkbox" id="show-trail" checked> 保留 C 球轨迹</label>
        <label><input type="checkbox" id="show-vel"> 显示速度矢量</label>
        <label><input type="checkbox" id="show-force"> 显示受力分析 (重力/拉力)</label>
    </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
</div>

<div id="canvas-container">
    <canvas id="simCanvas"></canvas>
    
</div>

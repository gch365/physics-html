    <title>带电粒子在独立场、组合场与叠加场中的运动——物理仿真实验室|148</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f5f6fa; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'PingFang SC', sans-serif; overflow: hidden; background: var(--bg); }
        
        /* 核心布局切换 */
        #app { display: flex; height: 100vh; flex-direction: row; }
        
        #control-panel { 
            width: 320px; 
            background: white; 
            border-right: 1px solid #ddd; 
            padding: 15px; 
            overflow-y: auto; 
            z-index: 100; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        #canvas-container { 
            flex: 1; 
            position: relative; 
            background: #fff; 
            display: flex;
            align-items: stretch;
        }

        canvas { 
            width: 100%; 
            height: 100%; 
            cursor: crosshair; 
            touch-action: none; /* 防止移动端拖拽时页面滚动 */
        }

        /* 移动端适配 (手机竖屏) */
        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #control-panel { 
                width: 100%; 
                height: 45vh; 
                border-right: none; 
                border-top: 1px solid #ddd; 
                padding: 10px;
                order: 2; /* 面板在下 */
            }
            #canvas-container { 
                height: 55vh; 
                order: 1; /* 画布在上 */
            }
            .stats-overlay {
                top: 10px !important;
                left: 10px !important;
                padding: 8px !important;
                font-size: 10px !important;
            }
        }

        /* 样式增强 */
        .group { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee; }
        .group-title { font-weight: bold; margin-bottom: 8px; color: var(--primary); font-size: 13px; border-left: 3px solid var(--accent); padding-left: 8px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        button { padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s; background: #ecf0f1; }
        button:hover { background: #dcdde1; }
        button.active { background: var(--accent); color: white; }
        .slider-item { margin: 8px 0; }
        .slider-item label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        .slider-row { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { flex: 1; }
        .val-display { width: 45px; font-size: 11px; font-family: monospace; color: #e67e22; font-weight: bold; }
        .stats-overlay { background: rgba(255,255,255,0.9); padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; pointer-events: none; line-height: 1.5; z-index: 50; }
        .stats-title { font-weight: bold; border-bottom: 1px solid #ddd; margin-bottom: 5px; color: #2c3e50; }
        .check-item { font-size: 12px; display: block; margin: 5px 0; cursor: pointer; }
        hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
    </style>
</head>
<body>

<div id="app">
    <div id="control-panel">
        <h3 style="margin:0 0 10px 0; color:var(--primary); font-size: 16px;">带电粒子在组合场与叠加场中的运动</h3>
        
        <div class="group">
            <div class="group-title">实验控制</div>
            <div class="btn-grid">
                <button id="playBtn" class="active">▶ 运行</button>
                <button onclick="resetSim()">↺ 重置轨迹</button>
            </div>
        </div>
        <div class="stats-overlay" id="stats">
            <div class="stats-title">数据面板</div>
            等待运行...
        </div>
        <div class="group">
            <div class="group-title">添加物理场区域</div>
            <div class="btn-grid">
                <button onclick="addField('E', 'rect')">+矩形电场</button>
                <button onclick="addField('B', 'rect')">+矩形磁场</button>
                <button onclick="addField('E', 'circle')">+圆形电场</button>
                <button onclick="addField('B', 'circle')">+圆形磁场</button>
                <button onclick="addField('E', 'tri')">+三角形电场</button>
                <button onclick="addField('B', 'tri')">+三角形磁场</button>
            </div>
        </div>

        <div id="editor-zone"></div>

        <div class="group">
            <div class="group-title">粒子属性</div>
            <div class="slider-item">
                <label>电荷量 q (C)</label>
                <div class="slider-row"><input type="range" id="q-val" min="-10" max="10" step="1" value="2"><span class="val-display" id="q-txt">2</span></div>
            </div>
            <div class="slider-item">
                <label>质量 m (kg)</label>
                <div class="slider-row"><input type="range" id="m-val" min="0.5" max="10" step="0.5" value="1"><span class="val-display" id="m-txt">1</span></div>
            </div>
            <div class="slider-item">
                <label>初速度 v₀</label>
                <div class="slider-row"><input type="range" id="v0-val" min="0" max="150" step="5" value="50"><span class="val-display" id="v0-txt">50</span></div>
            </div>
            <div class="slider-item">
                <label>角度 (°)</label>
                <div class="slider-row"><input type="range" id="deg-val" min="0" max="360" step="1" value="0"><span class="val-display" id="deg-txt">0</span></div>
            </div>
        </div>

        <div class="group">
            <div class="group-title">显示与矢量控制</div>
            <label class="check-item"><input type="checkbox" id="showAxes" checked> 显示坐标网格</label>
            <label class="check-item" style="color:#e67e22; font-weight:bold;"><input type="checkbox" id="enableSnap"> 开启网格吸附 (50px)</label>
            <hr>
            <label class="check-item" style="color:#2ecc71; font-weight:bold;"><input type="checkbox" id="showVectV" checked> 速度矢量 (v)</label>
            <label class="check-item" style="color:#9b59b6; font-weight:bold;"><input type="checkbox" id="showVectNet"> 合力矢量 (F合)</label>
            <label class="check-item"><input type="checkbox" id="showVectE"> 电场力矢量 (Fe)</label>
            <label class="check-item"><input type="checkbox" id="showVectB"> 洛伦兹力矢量 (f)</label>
            <label class="check-item"><input type="checkbox" id="showVectG"> 重力矢量 (G)</label>
            <hr>
            <label class="check-item"><input type="checkbox" id="enableG"> 开启重力 g: <input type="number" id="g-val" value="9.8" style="width:40px"></label>
        </div>
        <button onclick="fields=[]; selectField(null);" style="width:100%; background:#ff7675; color:white; border-radius:4px; padding:10px; margin-bottom:20px;">清空所有区域</button>
        <div class="group">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

    </div>

        <canvas id="canvas"></canvas>
    </div>
</div>

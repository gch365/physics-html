    <title>劈尖干涉检查表面平整度——物理仿真实验室|82</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --accent-color: #007aff;
            --success-color: #34c759;
            --error-color: #ff3b30;
        }

        body {
            font-family: 'PingFang SC', -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .main-container {
            width: 98vw;
            max-width: 1200px;
            height: 95vh;
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 15px;
            box-sizing: border-box;
        }

        @media (max-width: 850px) {
            body { align-items: flex-start; }
            .main-container {
                flex-direction: column;
                height: auto;
                width: 100vw;
                padding: 10px;
            }
            .control-panel { width: 100% !important; order: 2; }
            .view-panel { width: 100% !important; order: 1; min-height: 450px; }
        }

        .control-panel {
            width: 340px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        .view-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: relative;
        }

        h1 { font-size: 1.1rem; margin: 0; color: #000; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        h3 { font-size: 0.9rem; margin: 5px 0; color: #666; }
        .control-item { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; font-weight: 600; color: #888; }
        input[type="range"] { width: 100%; cursor: pointer; height: 20px; }
        .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button { flex: 1; padding: 10px 5px; border: 1px solid #eee; border-radius: 8px; background: #f8f9fa; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        button.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .test-zone { margin-top: 5px; padding: 12px; background: #f0f7ff; border-radius: 10px; text-align: center; }
        .btn-test { background: var(--accent-color); color: white; border: none; width: 100%; margin-bottom: 8px; font-weight: bold;}
        .result-msg { margin-top: 5px; font-size: 0.85rem; font-weight: bold; min-height: 1.2em; }

        .svg-container { width: 100%; max-width: 450px; position: relative; }
        
        #microscope-view {
            width: 80%;
            max-width: 300px;
            height: auto;
            border-radius: 50%;
            background: #111;
            border: 6px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
        }

        #answer-mask {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-weight: bold;
            border-radius: 12px;
            z-index: 10;
            border: 2px dashed #ccc;
            text-align: center;
        }
        .label-text { font-size: 12px; fill: #999; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="control-panel">
        <h1>劈尖干涉仿真</h1>
        
        <div class="control-item">
            <label>光源波长 (λ)</label>
            <input type="range" id="waveLen" min="400" max="750" value="530">
            <div id="colorIndicator" style="height:4px; border-radius:2px;"></div>
        </div>

        <div class="control-item">
            <label>劈尖夹角 (θ)</label>
            <input type="range" id="angle" min="8" max="25" value="12">
        </div>

        <div class="control-item">
            <h3>手动观察模式</h3>
            <div class="button-group">
                <button id="btnFlat" class="active">平整面</button>
                <button id="btnBump">凸起</button>
                <button id="btnDent">凹陷</button>
            </div>
        </div>

        <div class="test-zone">
            <h3>自我检测模式</h3>
            <button class="btn-test" id="btnRandom">随机生成挑战</button>
            <div class="button-group" style="margin-bottom:10px;">
                <button id="ansBump">选：凸起</button>
                <button id="ansDent">选：凹陷</button>
            </div>
            <div id="resultMsg" class="result-msg"></div>
        </div>
    </div>

    <div class="view-panel">
        <div class="svg-container">
            <div id="answer-mask">挑战进行中<br>请根据下方条纹判断</div>
            <!-- 修改点：将 viewBox 高度从 110 增加到 180，确保大角度显示 -->
            <svg viewBox="0 0 450 180" width="100%" id="sideViewSvg">
                <text x="0" y="20" font-weight="bold" font-size="14" fill="#333">侧视图 (Side View)</text>
                <!-- 底板：位置下移至 y=140 -->
                <rect x="10" y="140" width="400" height="10" fill="#e3f2fd" stroke="#90caf9" />
                <path id="defectShape" d="" fill="#ffca28" stroke="#ff8f00" />
                <!-- 上板：初始位置平移，绕 (10, 138) 旋转 -->
                <g id="topPlateGroup">
                    <rect x="10" y="128" width="400" height="10" fill="#e3f2fd" fill-opacity="0.7" stroke="#90caf9" />
                </g>
                <text x="10" y="170" class="label-text">棱边(薄)</text>
                <text x="360" y="170" class="label-text">底边(厚)</text>
            </svg>
        </div>

        <div style="width: 100%; text-align: center;">
            <svg viewBox="0 0 340 340" id="microscope-view">
                <defs>
                    <radialGradient id="lightGradient">
                        <stop offset="0%" id="gradStart" stop-color="white" />
                        <stop offset="100%" id="gradEnd" stop-color="black" />
                    </radialGradient>
                </defs>
                <circle cx="170" cy="170" r="170" fill="url(#lightGradient)" />
                <g id="fringeLayer"></g>
            </svg>
            <div style="font-weight: bold; font-size: 14px; margin-top: 5px; color: #666;">干涉条纹俯视图</div>
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

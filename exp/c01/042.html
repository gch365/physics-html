    <title>观察蜡块的运动——物理仿真实验室|42</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #e74c3c; /* 蜡块颜色 */
            --vx-color: #27ae60; /* 水平速度颜色 */
            --vy-color: #2980b9; /* 竖直速度颜色 */
            --v-total-color: #8e44ad; /* 合速度颜色 */
            --flash-color-main: #34495e; /* 主运动频闪点 */
            --flash-color-x: #1abc9c;   /* 水平频闪点 */
            --flash-color-y: #3498db;   /* 竖直频闪点 */
            --flash-proj-line-color: #999; /* 频闪投影连接线颜色 */
            --timer-color: #e67e22; /* 计时器颜色 */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background: #f8f9fa;
            padding: 10px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-container {
            flex: 1; /* 让 main-container 填充剩余高度 */
            display: flex;
            flex-direction: row; /* 桌面端默认左右布局 */
            position: relative;
            overflow: hidden;
        }

        /* 控制面板 */
        .controls {
            width: 350px; /* 桌面端固定宽度 */
            background: #f4f4f9;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
            overflow-y: auto; /* 桌面端允许垂直滚动 (如果内容过多) */
            font-size: 14px;
        }

        /* 计时器样式 */
        .timer-display {
            background: #2c3e50;
            color: #f1c40f;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 2px solid #34495e;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }

        .control-group {
            margin-bottom: 20px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .control-group h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
            padding-left: 8px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin: 10px 0 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label span {
            font-weight: normal;
            color: #555;
        }

        input[type="range"] {
            width: calc(100% - 10px);
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: var(--primary-color);
            color: white;
            transition: 0.3s;
            font-size: 15px;
        }

        button:hover { opacity: 0.9; }
        button.reset { background: #95a5a6; }

        input[type="checkbox"] {
            margin-right: 8px;
            transform: scale(1.2);
        }
        
        /* 画布区域 */
        #canvas-container {
            flex: 1; /* 占据剩余宽度 */
            position: relative;
            background: white;
            /* SVG 内部的 min-width/height 移除，让其完全自适应容器 */
        }

        svg {
            width: 100%;
            height: 100%;
            /* min-width, min-height 移除或设置为更小的值，以适应小屏幕 */
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 12px;
            border-radius: 5px;
        }
        .legend div {
            margin-bottom: 5px;
        }
        .legend div:last-child {
            margin-bottom: 0;
        }

        /* -------------------------------------- */
        /* 响应式布局：手机竖屏 (max-width: 768px) */
        /* -------------------------------------- */
        @media (max-width: 768px) {
            header {
                flex-direction: column; /* 标题和副标题垂直堆叠 */
                align-items: flex-start;
                padding: 10px;
            }

            .main-container {
                flex-direction: column; /* 手机竖屏时，控制区和演示区垂直堆叠 */
            }

            .controls {
                width: 100%; /* 占据全部宽度 */
                order: 1; /* 控制区在上方 */
                max-height: 50vh; /* 控制区最大高度为视口高度的50%，可滚动 */
                box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 底部阴影 */
                padding: 15px; /* 调整内边距 */
            }

            #canvas-container {
                order: 2; /* 演示区在下方 */
                flex: 1; /* 占据剩余所有空间 */
                min-height: 300px; /* 确保演示区有最小高度 */
            }

            .legend {
                top: 10px;
                right: 10px;
                font-size: 10px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <div style="font-weight: bold; font-size: 1.2em;">观察蜡块的运动 - 运动的合成与分解</div>
    </header>

    <div class="main-container">
        <!-- 仿真画布 (桌面端在左侧，手机端在下方) -->
        <div id="canvas-container">
            <svg id="svgScene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
                <!-- 坐标系参考 (辅助线) -->
                <line x1="100" y1="550" x2="900" y2="550" stroke="#eee" stroke-width="1" /> <!-- X轴线 -->
                <line x1="100" y1="50" x2="100" y2="550" stroke="#eee" stroke-width="1" /> <!-- Y轴线 -->

                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
                        <polygon points="0 0, 8 2.5, 0 5" fill="context-fill" />
                    </marker>
                    <!-- 定义蜡块图案 -->
                    <pattern id="waxPattern" patternUnits="userSpaceOnUse" width="10" height="10">
                        <rect x="0" y="0" width="10" height="10" fill="var(--accent-color)" />
                        <line x1="0" y1="0" x2="10" y2="10" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
                        <line x1="10" y1="0" x2="0" y2="10" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
                    </pattern>
                </defs>

                <!-- 轨迹线 -->
                <polyline id="pathMain" fill="none" stroke="#ddd" stroke-width="2" stroke-dasharray="5,5" />
                
                <!-- 频闪点层 -->
                <g id="flashPointsMain"></g>
                <g id="flashProjectionLines"></g>
                
                <!-- 投影效果 (分运动演示) -->
                <!-- 底部水平投影线 (与物理世界x轴对齐) -->
                <circle id="shadowX" r="5" fill="var(--flash-color-x)" opacity="0.6" />
                <g id="flashPointsX"></g>
                
                <!-- 左侧竖直投影线 (与物理世界y轴对齐) -->
                <circle id="shadowY" r="5" fill="var(--flash-color-y)" opacity="0.6" />
                <g id="flashPointsY"></g>

                <!-- 试管 -->
                <g id="testTube">
                    <rect x="-15" y="-460" width="30" height="460" rx="15" fill="rgba(200,230,255,0.3)" stroke="#99b" stroke-width="2" />
                    <rect x="-15" y="0" width="30" height="15" rx="5" fill="#99b" /> <!-- 管底塞子 -->
                    <!-- 蜡块 -->
                    <rect id="waxBlock" x="-12" width="24" height="20" rx="2" fill="url(#waxPattern)" />
                </g>

                <!-- 矢量层 -->
                <g id="vectorLayer">
                    <!-- 速度矢量 -->
                    <line id="v_x_arrow" class="v-vec" stroke="var(--vx-color)" stroke-width="2" marker-end="url(#arrowhead)" />
                    <line id="v_y_arrow" class="v-vec" stroke="var(--vy-color)" stroke-width="2" marker-end="url(#arrowhead)" />
                    <line id="v_total_arrow" class="v-vec" stroke="var(--v-total-color)" stroke-width="3" marker-end="url(#arrowhead)" />
                    
                    <!-- 位移矢量 -->
                    <line id="s_total_arrow" class="s-vec" stroke="#f39c12" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
                    <line id="s_x_line" class="s-vec" stroke="#f39c12" stroke-width="1" stroke-dasharray="2,2" />
                    <line id="s_y_line" class="s-vec" stroke="#f39c12" stroke-width="1" stroke-dasharray="2,2" />
                </g>
            </svg>
            
            <div class="legend">
                <div style="color:var(--vx-color)">■ 水平分运动 ($v_x$)</div>
                <div style="color:var(--vy-color)">■ 竖直分运动 ($v_y$)</div>
                <div style="color:var(--v-total-color)">■ 合运动 ($\vec{v}$)</div>
                <div style="color:var(--flash-color-main)">• 合运动频闪</div>
                <div style="color:var(--flash-color-x)">• 水平频闪</div>
                <div style="color:var(--flash-color-y)">• 竖直频闪</div>
                <div style="color:var(--flash-proj-line-color)">- - - 频闪投影连接线</div>
            </div>
        </div>

        <!-- 控制面板 (桌面端在右侧，手机端在上方) -->
        <div class="controls">
            <div class="btn-group">
                <button id="btnStart">开始</button>
                <button id="btnReset" class="reset">复位</button>
            </div>
            <!-- 计时器 -->
            <div class="timer-display" id="timerDisplay">0.00 s</div>
            <div class="control-group">
                <h3>水平分运动 (x 方向)</h3>
                <label>初速度 x<sub>0</sub>: <span id="val_vx0">0.5</span> m/s</label>
                <input type="range" id="input_vx0" min="0" max="2" step="0.05" value="0.5">
                <label>加速度 a<sub>x</sub>: <span id="val_ax">0</span> m/s²</label>
                <input type="range" id="input_ax" min="-0.5" max="0.5" step="0.01" value="0">
            </div>

            <div class="control-group">
                <h3>竖直分运动 (y 方向)</h3>
                <label>初速度 y<sub>0</sub>: <span id="val_vy0">0.6</span> m/s</label>
                <input type="range" id="input_vy0" min="0" max="2" step="0.05" value="0.6">
                <label>加速度 a<sub>y</sub>: <span id="val_ay">0</span> m/s²</label>
                <input type="range" id="input_ay" min="-0.5" max="0.5" step="0.01" value="0">
            </div>

            <div class="control-group">
                <h3>频闪记录</h3>
                <label>频闪间隔 T: <span id="val_flashInterval">0.5</span> s</label>
                <input type="range" id="input_flashInterval" min="0.05" max="1" step="0.01" value="0.5">
                <label><input type="checkbox" id="checkFlash" checked> 显示频闪点</label>
                <label><input type="checkbox" id="checkFlashProjectionLines" checked> 连接分运动投影</label>
            </div>

            <div class="control-group">
                <h3>显示设置</h3>
                <label><input type="checkbox" id="checkTrace" checked> 显示运动轨迹</label>
                <label><input type="checkbox" id="checkVel" checked> 显示速度矢量v</label>
                <label><input type="checkbox" id="checkDisp"> 显示位移矢量S</label>
            </div>
            
            <p style="font-size: 12px; color: #666; line-height: 1.6;">
                <b>提示：</b><br>
                1. $a_x=0, a_y=0$: 匀速直线运动<br>
                2. $a_x=0, a_y \ne 0$: 类似平抛运动的曲线<br>
                3. 改变加速度可以观察轨迹变化。
            </p>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
        </div>
    </div>
</div>

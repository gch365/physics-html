    <title>机械秒表使用与读数练习——物理仿真实验室|41</title>
    <style>
        :root {
            --physics-blue: #2c3e50;
            --physics-red: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
        }

        .main-ui {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 50px;
            max-width: 1300px;
            width: 100%;
            justify-content: center;
        }

        /* 秒表尺寸大幅增加 */
        .stopwatch-wrapper {
            position: relative;
            width: 700px; /* 尺寸放大 */
            height: 800px;
            user-select: none;
        }

        #watch-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15));
        }

        /* 鼠标手势提示 */
        .svg-btn {
            cursor: pointer;
            transition: transform 0.1s;
        }
        .svg-btn:active {
            /* transform: scale(0.95); */
            filter: brightness(0.8);
        }

        /* 控制台 */
        .control-panel {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }

        .instruction-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 15px;
            color: #444;
            line-height: 1.6;
        }
        .btn-start { 
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 5px; 
        }
        .btn-reset { 
            width: 100%;
            padding: 15px;
            background: var(--physics-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 5px; 
        }
        .btn-check {
            width: 100%;
            padding: 15px;
            background: var(--physics-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-random {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .answer-display {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fff5f5;
            border: 2px dashed var(--physics-red);
            border-radius: 10px;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .reading-step { margin-bottom: 10px; border-bottom: 1px solid #ffecec; padding-bottom: 5px; }
        .final-result { color: var(--physics-red); font-size: 1.4em; font-weight: bold; text-align: center; }

        @media (max-width: 1100px) {
            .main-ui { flex-direction: column; align-items: center; }
            .stopwatch-wrapper { width: 500px; height: 500px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>机械秒表使用与读数</h1>
</div>

<div class="main-ui">
    <!-- 左侧：超大秒表 -->
    <div class="stopwatch-wrapper">
        <svg id="watch-svg" viewBox="0 0 400 500">
            <!-- 结构绘制 -->
            <defs>
                <radialGradient id="grad-dial" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#ffffff" />
                    <stop offset="100%" style="stop-color:#f1f1f1" />
                </radialGradient>
            </defs>

            <!-- 计时/暂停按钮 ① -->
            <g class="svg-btn" id="svg-btn-start"  onclick="toggleTimer()">
                <rect x="175" y="25" width="50" height="85" fill="#bdc3c7" stroke="#7f8c8d" />
                <circle cx="200" cy="35" r="28" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2" />
                <text x="200" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">①计时</text>
            </g>

            <!-- 归零按钮 ② -->
            <g class="svg-btn" id="svg-btn-reset" transform="rotate(-45, 200, 260)" onclick="resetTimer()">
                <rect x="180" y="55" width="40" height="30" fill="#bdc3c7" stroke="#7f8c8d" />
                <circle cx="200" cy="55" r="20" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="2" />
                <text x="200" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">②归零</text>
            </g>

            <!-- 表体 -->
            <circle cx="200" cy="260" r="175" fill="#95a5a6" stroke="#333" stroke-width="2" />
            <circle cx="200" cy="260" r="165" fill="url(#grad-dial)" stroke="#2c3e50" stroke-width="5" />

            <!-- 小表盘 (分针盘 15min) -->
            <g id="min-dial-group">
                <circle cx="200" cy="185" r="50" fill="none" stroke="#2c3e50" stroke-width="1.5" />
                <g id="min-ticks"></g>
                <g id="min-numbers"></g> <!-- 新增：小表盘数字 -->
                <line id="min-hand" x1="200" y1="185" x2="200" y2="145" stroke="black" stroke-width="4" stroke-linecap="round" />
                <circle cx="200" cy="185" r="3" fill="black" />
            </g>

            <!-- 大表盘 (秒针盘 30s) -->
            <g id="sec-dial-group">
                <g id="sec-ticks"></g>
                <g id="sec-numbers"></g>
                <line id="sec-hand" x1="200" y1="260" x2="200" y2="105" stroke="black" stroke-width="2.5" stroke-linecap="round" />
                <circle cx="200" cy="260" r="6" fill="#2c3e50" />
            </g>
        </svg>
    </div>

    <!-- 右侧：教学面板 -->
    <div class="control-panel"> 
        <button class="btn-check" onclick="toggleAnswer()">核对正确读数</button>
        <div id="answer-area" class="answer-display">
            <div class="reading-step" id="step-min"></div>
            <div class="reading-step" id="step-logic"></div>
            <div class="reading-step" id="step-sec"></div>
            <div class="final-result" id="final-res"></div>
        </div>
        <br>
        <button class="btn-random" onclick="generateRandom()">随机产生测试题</button><br><br>
        <button class="btn-start" id="startBtn" onclick="toggleTimer()">启动 / 暂停</button>
        <button class="btn-reset" onclick="resetTimer()">归零</button>
        <div class="instruction-box">
            <strong>使用说明</strong>：点击秒表<strong>上方按钮①</strong>开始/暂停，点击<strong>侧边按钮②</strong>归零<br>
            <strong>读数要领：</strong><br>
            1. 观察分针盘，确定整分钟数。<br>
            2. 关键点：分针是否超过<strong>半分钟刻度</strong>？<br>
            3. 超过读红字（30-60s），没超过读黑字（0-30s）。
        </div>
    </div>
</div>

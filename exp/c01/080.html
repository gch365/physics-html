    <title>波形图与振动图像——物理仿真实验室|80</title>
    <style>
        :root {
            --primary: #2980b9;
            --accent: #e74c3c;
            --green: #27ae60;
            --bg: #f5f6fa;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .main-wrapper { flex-direction: column; overflow-y: auto; }
            .canvas-container { height: 320px !important; flex: none !important; }
            .control-panel { width: 100% !important; flex: none !important; }
            body { overflow: auto; }
        }

        .canvas-container {
            flex: 1;
            background: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #wave-svg { width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

        .control-panel {
            width: 380px;
            background: #fff;
            border-left: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
        }

        .card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
            border-left: 4px solid var(--primary);
            padding-left: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vt-graph-container {
            width: 100%;
            height: 160px;
            background: #fff;
            border: 1px solid #ddd;
            margin-top: 5px;
        }

        .ctrl-group { margin-bottom: 10px; }
        .ctrl-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 3px;
        }
        input[type="range"] { width: 100%; accent-color: var(--primary); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button {
            padding: 8px; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-alt { background: #95a5a6; color: white; }
        .btn-alt.active { background: var(--primary); }
        .btn-danger { background: var(--accent); color: white; }

        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; margin-bottom: 5px; cursor: pointer; }

        .axis { stroke: #333; stroke-width: 1.5; }
        .grid { stroke: #f0f0f0; stroke-width: 1; }
        .ghost-wave { stroke: #bdc3c7; stroke-width: 1.2; stroke-dasharray: 4,3; fill: none; }
        .tick-text { font-size: 10px; fill: #999; }
        .vt-axis { stroke: #666; stroke-width: 1; }
        .vt-curve { stroke: var(--accent); stroke-width: 2; fill: none; }
    </style>
</head>
<body>

<div class="header">波形图与振动图像</div>

<div class="main-wrapper">
    <div class="canvas-container">
        <svg id="wave-svg" viewBox="0 0 800 450" onclick="handleSvgClick(event)">
            <defs>
                <marker id="arr-r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 Z" fill="red" />
                </marker>
                <marker id="arr-g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M0,0 L6,3 L0,6 Z" fill="#27ae60" />
                </marker>
            </defs>
            <g id="grid-layer"></g>
            <g id="axis-layer">
                <line x1="50" y1="225" x2="760" y2="225" class="axis" />
                <line x1="80" y1="40" x2="80" y2="410" class="axis" />
                <text x="750" y="215" font-size="12">x(m)</text>
                <text x="55" y="50" font-size="12">y(m)</text>
            </g>
            <path id="ghost-path" class="ghost-wave" d="" />
            <g id="dots-layer"></g>
            <g id="arrows-layer"></g>
        </svg>
    </div>

    <div class="control-panel">
        <div class="section-title">
            质点振动图像 (y-t)
            <span id="selected-info" style="font-weight: normal; font-size:0.75rem; color: var(--accent);">点击质点选择</span>
        </div>
        <div class="vt-graph-container">
            <svg id="vt-svg" width="100%" height="100%" viewBox="0 0 340 160">
                <line x1="20" y1="80" x2="320" y2="80" class="vt-axis" />
                <line x1="40" y1="10" x2="40" y2="150" class="vt-axis" />
                <path id="vt-path" class="vt-curve" d="" />
                <circle id="vt-now-dot" r="4" fill="var(--accent)" />
                <text x="310" y="95" font-size="10">t(s)</text>
                <text x="25" y="20" font-size="10">y</text>
            </svg>
        </div>

        <div class="card" style="margin-top:10px;">
            <div class="ctrl-group">
                <label>时刻 t (s): <b id="s-t">0.00</b></label>
            </div>
            <div class="btn-grid">
                <button class="btn-alt active" id="dir-r" onclick="setDir(1)">向右传播</button>
                <button class="btn-alt" id="dir-l" onclick="setDir(-1)">向左传播</button>
            </div>
            <label class="checkbox-item"><input type="checkbox" id="chk-ghost" checked> 显示后一时刻 (预测未来)</label>
            <label class="checkbox-item"><input type="checkbox" id="chk-arrow" checked> 显示方向矢量</label>
        </div>
        <div class="btn-grid">
            <button class="btn-main" id="btn-play" onclick="togglePlay()">开始动画</button>
            <button class="btn-danger" onclick="resetSim()">重置</button>
        </div>
        <div class="section-title">参数调节</div>
        <div class="ctrl-group">
            <label>振幅 A (m) <span id="val-a">0.8</span></label>
            <input type="range" id="range-a" min="0.2" max="1.5" step="0.1" value="0.8">
        </div>
        <div class="ctrl-group">
            <label>波长 λ (m) <span id="val-l">4.0</span></label>
            <input type="range" id="range-l" min="1.0" max="8.0" step="0.2" value="4.0">
        </div>
        <div class="ctrl-group">
            <label>周期 T (s) <span id="val-t">2.0</span></label>
            <input type="range" id="range-t" min="0.5" max="5.0" step="0.1" value="2.0">
        </div>

        <div class="section-title">动画控制</div>
        <div class="ctrl-group">
            <label>播放倍速 <span id="val-speed">1.0x</span></label>
            <input type="range" id="range-speed" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="ctrl-group">
            <label>质点数量 <span id="val-dots">60</span></label>
            <input type="range" id="range-dots" min="20" max="120" step="5" value="60">
        </div>
        <div class="ctrl-group">
            <label>时间进度</label>
            <input type="range" id="range-time" min="0" max="10" step="0.01" value="0">
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

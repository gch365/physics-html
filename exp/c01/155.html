    <title>电场、电场强度、电场线、场源电荷与试探电荷问题——物理仿真实验室|155</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --bg-color: #ffffff;
            --panel-bg: rgba(248, 249, 250, 0.95); /* 略带透明度，更具现代感 */
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow: hidden; background-color: var(--bg-color);
        }

        /* 画布容器始终充满全屏 */
        #app { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

        #canvas-container { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1; /* 位于底层 */
            background: white; cursor: crosshair; 
        }
        canvas { width: 100%; height: 100%; display: block; }

        /* 控制台改为悬浮式样式 */
        #control-panel {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 330px;
            max-height: calc(100vh - 40px);
            background: var(--panel-bg);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-radius: 12px;
            overflow-y: auto;
            z-index: 10; /* 位于画布之上 */
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* 隐藏状态：向左滑出 */
        #control-panel.hidden {
            transform: translateX(-380px);
            opacity: 0;
            pointer-events: none;
        }

        /* 悬浮切换按钮 */
        #toggle-btn {
            position: absolute;
            left: 5px;
            top: 5px;
            z-index: 100;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #toggle-btn:hover { background: #1976D2; }

        h2 { color: #333; font-size: 1.2rem; margin-top: 0; border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; }
        .section { margin-bottom: 15px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: white; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; align-items: center; }
        
        input[type="range"] { width: 100%; cursor: pointer; }
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; }
        
        button.action-btn {
            background: var(--primary-color); color: white; border: none;
            padding: 10px; border-radius: 6px; cursor: pointer;
            width: 100%; margin-top: 10px; font-weight: bold;
        }
        button.action-btn:hover { background: #1976D2; }
        
        .test-charge-item {
            font-size: 0.85rem; border-left: 4px solid #4CAF50;
            padding: 8px; margin-top: 10px; background: #f9f9f9;
        }
        .info { font-size: 0.8rem; color: #666; line-height: 1.5; margin-top: 10px; }
    </style>
</head>
<body>

<div id="app">
   <!-- 切换按钮 -->
    <button id="toggle-btn">⚙️控制台</button>

    <!-- 悬浮控制台 -->
    <div id="control-panel">
        <h2 align="center">电场交互实验台</h2>
        
        <div class="section">
            <strong>1. 场源电荷 (Source Charges)</strong>
            <div id="sources-ctrl">
                <div style="margin-top:10px;">
                    <div class="label-row"><span>电荷 Q1:</span><span id="q1-val">5 μC</span></div>
                    <input type="range" id="q1-range" min="-10" max="10" step="1" value="5">
                </div>
                <div style="margin-top:10px;">
                    <div class="label-row"><span>电荷 Q2:</span><span id="q2-val">0 μC</span></div>
                    <input type="range" id="q2-range" min="-10" max="10" step="1" value="0">
                </div>
<div style="margin-top:10px;">
                    <div class="label-row"><span>电荷 Q3:</span><span id="q3-val">0 μC</span></div>
                    <input type="range" id="q3-range" min="-10" max="10" step="1" value="0">
                </div>
<div style="margin-top:10px;">
                    <div class="label-row"><span>电荷 Q4:</span><span id="q4-val">0 μC</span></div>
                    <input type="range" id="q4-range" min="-10" max="10" step="1" value="0">
                </div>
            </div>
        </div>

        <div class="section">
            <strong>2. 视觉辅助 (Visual Aids)</strong>
            <div class="checkbox-group" style="margin-top:10px;">
                <label><input type="checkbox" id="show-glow" checked> 启用增强光晕 (模拟场分布)</label>
                <label><input type="checkbox" id="show-lines" checked> 显示电场线 (Field Lines)</label>
                <label><input type="checkbox" id="show-linescolor" checked> 电场线统一颜色绘制</label>
                <label><input type="checkbox" id="show-vectors" checked> 显示场强方向 (网格箭头)</label>
                <label style="margin-left: 20px; color: #666;">
                    <input type="checkbox" id="show-strength-color"> 箭头深浅表示强弱
                </label>
                <label style="color: #673ab7; font-weight: bold;">
                    <input type="checkbox" id="show-individual-forces"> 显示各分力 (矢量叠加)
                </label>
            </div>
        </div>

        <div class="section">
            <strong>3. 试探电荷 (Test Charges)</strong>
            <div class="checkbox-group" style="margin-bottom: 10px;">
                <label style="color: #e91e63; font-weight: bold;">
                    <input type="checkbox" id="sim-motion"> 演示电荷运动 (牛顿定律)
                </label>
                <label><input type="checkbox" id="show-path" checked> 显示运动轨迹</label>
            </div>
            <button class="action-btn" id="add-test">+ 放入试探电荷</button>
            <button class="action-btn" id="clear-path" style="background: #607d8b;">清除轨迹/重置位置</button>
            <div id="test-list"></div>
        </div>

        <div class="info">
            <b>操作提示：</b><br>
            • <b>拖动</b>：可在画布上自由拖动电荷<br>
            • <b>运动</b>：开启“演示运动”后，电荷将受电场力产生加速度<br>
            • <b>轨迹</b>：自动绘制电荷运动经过的路径
        </div>
        <div class="info">

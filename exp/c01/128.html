<html lang="zh-CN">

    <title>绘制椭圆——物理仿真实验室|128</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --line-color: #3498db;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        /* 响应式布局 */
        @media (max-width: 850px) {
            body { flex-direction: column; overflow: auto; }
            #control-panel { width: 100% !important; box-sizing: border-box; }
            #canvas-container { height: 500px !important; flex-shrink: 0; }
        }

        /* 控制面板 */
        #control-panel {
            width: 360px;
            padding: 25px;
            background: white;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        /* 画布区域 */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        h2 { margin: 0 0 10px 0; color: var(--primary-color); border-bottom: 2px solid var(--line-color); padding-bottom: 10px; }
        .hint { font-size: 0.85rem; color: #666; margin-bottom: 10px; }

        .slider-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }

        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .val-tag { float: right; color: var(--line-color); }
        input[type="range"] { width: 100%; margin: 10px 0; cursor: pointer; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: var(--primary-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card small { display: block; opacity: 0.8; font-size: 0.7rem; }
        .stat-card b { font-size: 1.1rem; }

        .formula-zone {
            font-family: "Times New Roman", serif;
            background: #fffbe6;
            border: 1px dashed #ffe58f;
            padding: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .btn-reset {
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-reset:hover { background: #c0392b; }

        svg { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="canvas-container">
    <svg id="main-svg" viewBox="0 0 800 600">
        <!-- 网格参考 -->
        <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="800" height="600" fill="url(#grid)" />
        
        <!-- 轴线 -->
        <line x1="0" y1="300" x2="800" y2="300" stroke="#ccc" stroke-dasharray="4" />
        <line x1="400" y1="0" x2="400" y2="600" stroke="#ccc" stroke-dasharray="4" />

        <!-- 静态椭圆参考轮廓 -->
        <ellipse id="ref-ellipse" cx="400" cy="300" rx="150" ry="111.8" fill="none" stroke="#eee" stroke-width="2" />

        <!-- 绘制出的路径轨迹 -->
        <path id="draw-path" d="" fill="none" stroke="#3498db" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

        <!-- 绳子 -->
        <polyline id="string-line" points="300,300 400,200 500,300" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linejoin="round" />

        <!-- 焦点 -->
        <circle id="f1" cx="300" cy="300" r="6" fill="#2c3e50" />
        <circle id="f2" cx="500" cy="300" r="6" fill="#2c3e50" />
        <text id="f1-label" x="285" y="325" font-size="14" font-weight="bold">F₁</text>
        <text id="f2-label" x="485" y="325" font-size="14" font-weight="bold">F₂</text>

        <!-- 铅笔（交互拖动点） -->
        <g id="pen-node" style="cursor: grab;">
            <circle cx="0" cy="0" r="10" fill="rgba(231, 76, 60, 0.3)" />
            <circle cx="0" cy="0" r="5" fill="#e74c3c" />
            <path d="M0 0 L15 -25 L20 -20 Z" fill="#34495e" /> <!-- 简易笔头 -->
        </g>
    </svg>
</div>
<div id="control-panel">
    <h2>椭圆的绘制演示</h2>
    <p class="hint">原理：平面内到两定点距离之和等于定长的点轨迹。</p>

    <div class="slider-box">
        <label>焦距 2c (F₁F₂): <span class="val-tag" id="label-2c">200</span></label>
        <input type="range" id="range-2c" min="0" max="400" value="200">
        
        <label style="margin-top:15px;">绳长 L (2a): <span class="val-tag" id="label-L">300</span></label>
        <input type="range" id="range-L" min="10" max="500" value="300">
    </div>

    <div class="stats">
        <div class="stat-card">
            <small>长轴 2a</small>
            <b id="stat-2a">300</b>
        </div>
        <div class="stat-card">
            <small>短轴 2b</small>
            <b id="stat-2b">223.6</b>
        </div>
        <div class="stat-card">
            <small>焦距 c</small>
            <b id="stat-c">100</b>
        </div>
        <div class="stat-card">
            <small>离心率 e</small>
            <b id="stat-e">0.67</b>
        </div>
    </div>

    <div class="formula-zone">
        <b>数学关系：</b><br>
        定义：|PF₁| + |PF₂| = 2a<br>
        计算：b = √(a² - c²)<br>
        <span id="shape-info" style="color: #d35400; font-weight: bold;">当前状态：标准椭圆</span>
    </div>

    <button class="btn-reset" onclick="clearPath()">清空绘图轨迹</button>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
</div>

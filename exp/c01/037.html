    <div class="container">
        <header>
            <h1>同轴转动物理教学课件</h1>
        </header>
        <div class="content">
            <div class="simulation-container">
                <div class="simulation-title">同轴转动模拟</div>
                <div id="canvas-container">
                    <canvas id="simulation-canvas"></canvas>
                </div>
                <div class="controls">
                    <div class="physical-quantities">
                        <h3>物理量实时显示</h3>
                        <div class="quantity">
                            <span class="quantity-name">点A (边缘):</span>
                            <span id="point-a">计算中...</span>
                        </div>
                        <div class="quantity">
                            <span class="quantity-name">点B (内部):</span>
                            <span id="point-b">计算中...</span>
                        </div>
                        <div class="quantity">
                            <span class="quantity-name">角速度 ω:</span>
                            <span id="omega-value">计算中...</span>
                        </div>
                    </div>
                    
                </div>
            </div>
            
            <div class="theory-container">
                <div class="theory-title">参数控制</div>
                <div class="control-group">
                    <label for="speed-control">圆盘转速 (rad/s):</label>
                    <input type="range" id="speed-control" min="0" max="10" step="0.1" value="0.5">
                    <div class="value-display">
                        <span>0</span>
                        <span id="speed-value">0.5 rad/s</span>
                        <span>10</span>
                    </div>
                </div>
                <div class="control-group">
                    <label for="radius-control">点B距离圆心 (比例):</label>
                    <input type="range" id="radius-control" min="0.1" max="1" step="0.1" value="0.5">
                    <div class="value-display">
                        <span>0.1</span>
                        <span id="radius-value">0.5</span>
                        <span>1.0</span>
                    </div>
                </div>
                <div class="control-group">
                    <label for="disk-radius-control">圆盘半径 (比例):</label>
                    <input type="range" id="disk-radius-control" min="0.5" max="3.5" step="0.1" value="2.0">
                    <div class="value-display">
                        <span>0.5</span>
                        <span id="disk-radius-value">2</span>
                        <span>3.5</span>
                    </div>
                </div>
                <div class="theory-title">物理原理</div>
                <div class="theory-content">
                    <p>同轴转动是指物体围绕同一轴线旋转的运动形式。在这种运动中，所有点都具有相同的角速度，但线速度和向心加速度随半径变化。</p>
                    
                    <div class="formula">
                        <strong>角速度公式:</strong> ω = Δθ / Δt
                    </div>
                    
                    <div class="formula">
                        <strong>线速度公式:</strong> v = ω × r
                    </div>
                    
                    <div class="formula">
                        <strong>向心加速度公式:</strong> a = ω² × r = v² / r
                    </div>
                    
                    <p>在圆盘旋转过程中，圆心处的线速度和向心加速度为零，而边缘处达到最大值。</p>
                    
                </div>
            </div>
        </div>

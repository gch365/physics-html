<head>

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>静电喷漆——物理仿真实验室|165</title>
    <style>
        :root { --bg-color: #f4f7f6; }
        * { touch-action: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-color); overflow: hidden; }
        
        /* 响应式布局：手机竖屏时垂直堆叠，横屏时左右分布 */
        .main-container { display: flex; flex: 1; width: 100%; height: 100%; overflow: hidden; }
        @media (max-width: 800px) { .main-container { flex-direction: column; } }
        
        .controls { 
            width: 300px; background: white; padding: 15px; box-shadow: 2px 0 5px rgba(0,0,0,0.1); 
            z-index: 10; overflow-y: auto; flex: 0 0 auto; max-height: 40%;
        }
        @media (max-width: 800px) { .controls { width: 100%; max-height: 35%; } }

        .control-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.85em; }
        input[type="range"] { width: 100%; }
        
        .canvas-area { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; background-color: #fff; }
        svg { width: 100%; height: 100%; max-height: 100%; touch-action: none; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-area">
        <svg id="scene" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c" />
                </marker>
            </defs>

            <!-- 连线 (电缆) -->
            <line id="powerCable" x1="660" y1="480" x2="600" y2="300" stroke="#2c3e50" stroke-width="4" stroke-dasharray="4"/>
            
            <!-- 电源 -->
            <rect x="600" y="480" width="120" height="60" fill="#ecf0f1" stroke="#34495e" stroke-width="2"/>
            <text x="610" y="515" font-size="12">负高压发生器</text>
            <path d="M 660 540 L 660 580 L 400 580 L 400 400" stroke="#34495e" stroke-width="3" fill="none"/>
            <text x="380" y="420" font-size="12" fill="#c0392b">(+)</text>
            
            <!-- 工件 -->
            <rect id="workpiece" x="380" y="200" width="40" height="200" rx="2" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
            <text x="390" y="310" transform="rotate(-90 400 300)" fill="#7f8c8d" font-weight="bold">工件</text>
            
            <g id="fieldLinesGroup"></g>
            <g id="stuckParticlesGroup"></g> 
            <g id="particlesGroup"></g>

            <!-- 喷枪 -->
            <g id="sprayGun" cursor="grab" transform="translate(600, 300)">
                <rect x="0" y="-15" width="30" height="30" fill="#34495e" rx="3"/>
                <circle cx="30" cy="0" r="8" fill="#2c3e50"/>
                <text x="5" y="5" fill="white" font-size="10">喷枪</text>
            </g>
        </svg>
    </div>
    <div class="controls">
        <h3 style="margin-top:0">静电喷漆仿真</h3>
        <div class="control-group">
            <label>电场线显示</label>
            <input type="checkbox" id="showFields" checked>
        </div>
        <div class="control-group">
            <label>调节电压</label>
            <input type="range" id="voltageRange" min="0" max="100" value="50">
        </div>
        <div class="control-group">
            <label>喷漆速率</label>
            <input type="range" id="rateRange" min="0" max="10" value="3">
        </div>
        <div class="control-group">
            <label>扩散角度</label>
            <input type="range" id="spreadRange" min="0" max="180" value="40">
        </div>
        <div class="control-group">
            <label>油漆颜色</label>
            <input type="color" id="colorPicker" value="#f1c40f">
        </div>
        <button onclick="resetParticles()" style="padding: 5px 10px; cursor:pointer;">清除漆面</button>
        <div class="control-group">
        <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>        <!-- 尾部文件结束 -->

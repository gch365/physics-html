    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-card: #ffffff;
            --bg-page: #f1f5f9;
            --text-main: #1e293b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 98vw;
            height: 95vh;
            max-width: 1400px;
            background: var(--bg-card);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            overflow: hidden;
        }

        /* 左侧控制区 30% */
        .controls {
            flex: 3;
            min-width: 320px;
            padding: 25px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        /* 右侧显示区 70% */
        .canvas-area {
            flex: 7;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        h1 { font-size: 1.4rem; margin: 0; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 12px; }
        
        .control-group {
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #f1f5f9;
        }

        label { 
            display: flex; 
            justify-content: space-between; 
            font-weight: 600; 
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        label span { color: var(--primary); font-family: monospace; }

        input[type=range] {
            width: 100%;
            height: 6px;
            background: #cbd5e1;
            border-radius: 5px;
            appearance: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 18px; height: 18px;
            background: var(--primary);
            border-radius: 50%;
        }

        /* 按钮样式 */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: white;
            font-size: 0.9rem;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background-color: var(--success); }
        .btn-pause { background-color: var(--warning); }
        .btn-reset { background-color: #64748b; }

        .stats-card {
            margin-top: auto;
            background: #1e293b;
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .stat-value { font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: bold; color: #fbbf24; }

        @media (max-width: 900px) {
            .container { flex-direction: column; height: 100vh; width: 100vw; border-radius: 0; }
            .controls { flex: none; width: auto; padding: 15px; gap: 10px; }
            .canvas-area { flex: 1; }
            .btn { padding: 8px; }
        }

        canvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>

<div class="container">
    <div class="controls">
        <h1>气体压强产生机理</h1>
        
        <!-- 实验参数控制 -->
        <div class="control-group">
            <label>下落高度 (h) <span id="val-height">35 cm</span></label>
            <input type="range" id="input-height" min="150" max="550" value="350">
        </div>

        <div class="control-group">
            <label>豆粒流量 (N) <span id="val-flow">中等</span></label>
            <input type="range" id="input-flow" min="1" max="30" value="8">
        </div>

        <!-- 实验状态控制按钮 -->
        <div class="btn-group">
            <button id="btn-toggle" class="btn btn-start">开始实验</button>
            <button id="btn-reset" class="btn btn-reset">重置实验</button>
        </div>

        <div class="stats-card">
            <div class="stat-row">
                <span style="font-size:0.8rem; color:#94a3b8">实时冲击力:</span>
                <span id="force-val" class="stat-value">0.00 N</span>
            </div>
            <div class="stat-row">
                <span style="font-size:0.8rem; color:#94a3b8">平均压力模拟:</span>
                <span id="avg-force-val" class="stat-value">0.00 N</span>
            </div>
        </div>
        
        <div style="font-size: 0.75rem; color: #94a3b8; line-height: 1.4;">
            <b>教学重点：</b><br>
            1. 高度↑ → 速度↑ → 单次冲量↑<br>
            2. 流量↑ → 碰撞频率↑ → 压力更稳定

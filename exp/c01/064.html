    <title>同步卫星及不同轨道卫星运行参数演示——物理仿真实验室|64</title>
    <style>
        :root {
            --primary: #2196F3;
            --accent: #FF5722;
            --bg: #000428;
            --panel: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden; background: #eee;
        }

        .container { display: flex; height: 100vh; flex-direction: row; }

        /* 仿真视图 */
        #simulation-container {
            flex: 1; position: relative;
            background: radial-gradient(circle at center, #001540 0%, #000428 100%);
            overflow: hidden;
            touch-action: none; /* 防止移动端拖动时页面滚动 */
        }

        /* 右侧控制面板 */
        #control-panel {
            width: 360px; background: var(--panel);
            box-shadow: -2px 0 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
            padding: 20px; overflow-y: auto; z-index: 100;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #control-panel { width: 100%; height: 40%; }
        }

        /* 轨道交互样式 */
        .orbit-line {
            fill: none;
            stroke-width: 1.5;
            transition: stroke-width 0.2s, stroke 0.2s;
            cursor: pointer;
        }
        .orbit-hit-area { /* 增加交互感应范围 */
            fill: none;
            stroke: transparent;
            stroke-width: 20;
            cursor: ns-resize;
        }
        .orbit-group:hover .orbit-line {
            stroke-width: 4;
            stroke: #fff;
        }

        /* UI 组件 */
        h2 { margin: 0 0 15px 0; color: #333; font-size: 1.3rem; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        .data-card {
            background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 12px;
            border-left: 5px solid var(--primary); font-size: 0.9rem; position: relative;
        }
        .data-card.sync { border-left-color: #4CAF50; }
        .data-card.custom { border-left-color: var(--accent); }
        
        .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }
        .param-item { color: #666; font-size: 0.85rem; }
        .param-val { color: #000; font-weight: bold; font-family: monospace; }

        .controls-section { margin-bottom: 20px; background: #f0f7ff; padding: 15px; border-radius: 8px; }
        .slider-group { margin: 10px 0; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        input[type="range"] { width: 100%; cursor: pointer; }

        button {
            width: 100%; padding: 10px; margin: 5px 0;
            border: none; border-radius: 5px; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }
        .btn-add { background: var(--accent); color: white; }
        .btn-toggle { background: var(--primary); color: white; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        
        .del-btn { position: absolute; right: 10px; top: 10px; cursor: pointer; color: #999; }
        .del-btn:hover { color: red; }
    </style>
</head>
<body>

<div class="container">
    <div id="simulation-container">
        <svg id="scene" width="100%" height="100%">
            <!-- 动态坐标系，用于缩放 -->
            <g id="viewport">
                <g id="orbits-layer"></g>
                <g id="earth-group">
                    <!-- 地球贴图 -->
                    <image id="earth-img" xlink:href="Earth.png" x="-50" y="-50" width="100" height="100" />
                    <circle r="50" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
                </g>
                <g id="satellites-layer"></g>
            </g>
        </svg>
    </div>

    <div id="control-panel">
        <b>同步卫星及不同轨道卫星运行参数演示</b>
        <h2>卫星参数实时看板</h2>
        
        <div class="controls-section">
            <div class="slider-group">
                <label>🔍 画面缩放: <span id="zoom-val">1.0</span>x</label>
                <input type="range" id="zoom-slider" min="0.2" max="3" step="0.1" value="1">
            </div>
            <button class="btn-toggle" onclick="toggleEarthRotation()">开启/关闭地球自转 (24h)</button>
            <button class="btn-add" onclick="addSatellite()">➕ 添加自定义卫星</button>
        </div>

        <div id="sync-card-container"></div>
        <div id="sat-list"></div>

        <div style="font-size: 0.8rem; color: #666; margin-top: auto; padding-top: 15px; border-top: 1px dashed #ccc;">
            <strong>操作指南：</strong><br>
            1. 鼠标移动到轨道线上，线变粗后可按下并上下拖动改变高度。<br>
            2. 使用缩放滑块可以查看更远或更近的轨道细节。
        </div>

    <!-- 尾部文件开始 -->

        <font size="-1">
            <hr /></font>

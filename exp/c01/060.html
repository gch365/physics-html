    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>电流表及电压表读数练习——物理仿真实验室|60</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            gap: 20px;
            box-sizing: border-box;
        }

        /* 响应式布局：手机屏幕上下排布 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .left-panel, .right-panel {
                width: 100% !important;
            }
        }

        /* 左侧电表显示区 */
        .left-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 12px;
            padding: 10px;
        }

        #meter-container {
            width: 100%;
            max-width: 600px;
            transition: transform 0.3s ease;
            transform-origin: center;
        }

        /* 右侧控制面板 */
        .right-panel {
            flex: 1;
            background: var(--bg-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        h2 { margin: 0 0 10px 0; color: var(--primary-color); font-size: 1.5rem; }
        label { font-weight: bold; color: #555; }

        select, input, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #34495e; }
        button#start-btn { background-color: #27ae60; }
        button#submit-btn { background-color: #2980b9; }

        #feedback {
            padding: 15px;
            border-radius: 6px;
            display: none;
            line-height: 1.6;
        }

        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .wrong { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .rules-info {
            font-size: 0.85rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：SVG电表 -->
    <div class="left-panel">
        <div id="meter-container">
            <svg id="meter-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                <!-- 表壳 -->
                <rect x="10" y="10" width="380" height="280" rx="15" fill="#333" />
                <rect x="25" y="25" width="350" height="200" rx="10" fill="#eee" />
                
                <!-- 刻度线绘制区域 -->
                <g id="scales"></g>

                <!-- 表头符号 (A/V) -->
                <text id="meter-type-label" x="200" y="170" text-anchor="middle" font-size="30" font-weight="bold" fill="#000">A</text>

                <!-- 指针 -->
                <g id="pointer-group">
                    <line id="pointer" x1="200" y1="260" x2="200" y2="50" stroke="#e74c3c" stroke-width="3" stroke-linecap="round" />
                    <circle cx="200" cy="260" r="8" fill="#222" />
                </g>

                <!-- 表壳压指针 -->
                <rect x="10" y="225" width="380" height="50" rx="15" fill="#333" />

                <!-- 零刻度调节旋钮 -->
                <circle cx="200" cy="260" r="12" fill="#ccc" stroke="#999" stroke-width="1" />
                <line x1="192" y1="260" x2="208" y2="260" stroke="#666" stroke-width="2" />
                

            </svg>
        </div>
    </div>

    <!-- 右侧：交互控制 -->
    <div class="right-panel">
        <h2>电表读数练习</h2>
        
        <div class="control-group">
            <label>请输入读数：</label>
            <input type="number" id="user-answer" step="0.001" placeholder="在此输入你的结果">
            <button id="submit-btn">提交答案</button>
        </div>

        <div id="feedback"></div>

        <div class="rules-info" id="rule-desc">
            ※ 提示：请注意估读规则。
        </div>
        
        <div class="control-group">
            <label>选择电表类型及量程：</label>
            <select id="range-select">
                <option value="A-0.6">电流表 (0 ~ 0.6A)</option>
                <option value="A-3">电流表 (0 ~ 3A)</option>
                <option value="V-3">电压表 (0 ~ 3V)</option>
                <option value="V-15">电压表 (0 ~ 15V)</option>
            </select>
        </div>

        <button id="start-btn">生成新题目</button>

        <hr>
        <div class="zoom-controls">
            <span>缩放显示：</span>
            <input type="range" id="zoom-range" min="0.5" max="2" step="0.1" value="1">
        </div>

    <title>光的衍射——物理仿真实验室|88</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #1a1a1e;
            --accent: #00d1ff;
            --text: #e0e0e0;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, "Noto Sans SC", sans-serif;
            overflow: hidden;
        }

        .container { display: flex; height: 100vh; flex-direction: row; }

        /* 左侧面板 */
        .controls {
            width: 320px; background: var(--panel);
            padding: 20px; border-right: 1px solid #333;
            display: flex; flex-direction: column; gap: 18px;
            overflow-y: auto; z-index: 10;
        }

        /* 右侧展示 */
        .display { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; }

        /* 顶部示意图 */
        .visual-header {
            height: 200px; background: #000; border-radius: 12px;
            display: flex; border: 1px solid #222; overflow: hidden;
        }
        .path-svg { flex: 1.5; border-right: 1px solid #222; }
        .shape-svg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; }

        /* 衍射画布 */
        .canvas-container {
            flex: 1; background: #000; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; border: 1px solid #222;
        }
        canvas { width: 98%; height: 90%; cursor: crosshair; }

        /* UI 元素 */
        h1 { font-size: 1.2rem; margin: 0; color: var(--accent); }
        .group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #999; display: flex; justify-content: space-between; }
        .val { color: var(--accent); font-family: monospace; }
        input[type=range] { accent-color: var(--accent); cursor: pointer; }
        select { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; }
        
        .theory-card {
            background: rgba(0, 209, 255, 0.05);
            border-left: 4px solid var(--accent);
            padding: 12px; font-size: 0.85rem; line-height: 1.5;
        }

        @media (max-width: 800px) {
            .container { flex-direction: column; overflow-y: auto; }
            .controls { width: 100%; height: auto; border-right: none; }
            .display { height: 300px; flex: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <main class="display">
        <div class="visual-header">
            <div class="path-svg">
                <svg width="100%" height="100%" viewBox="0 0 500 200" id="svgScene">
                    <!-- 背景射线 -->
                    <defs>
                        <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.2" />
                            <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:0" />
                        </radialGradient>
                    </defs>
                    <path id="lightPath" d="M50 100 L250 100" stroke="red" stroke-width="1" stroke-dasharray="4" />
                    <circle cx="50" cy="100" r="5" fill="#fff" id="source" />
                    <text x="40" y="125" fill="#888" font-size="12">光源 S</text>
                    
                    <!-- 障碍物 -->
                    <rect x="250" y="40" width="8" height="120" fill="#444" />
                    <rect id="gapMarker" x="250" y="95" width="8" height="10" fill="#000" />
                    <text x="240" y="30" fill="#888" font-size="12">障碍物 H</text>
                    
                    <!-- 衍射光束 -->
                    <path id="diffSplay" d="M258 100 L450 60 M258 100 L450 140" stroke="rgba(255,0,0,0.2)" fill="none" />
                    <rect x="460" y="20" width="5" height="160" fill="#333" />
                    <text x="450" y="15" fill="#888" font-size="12">观察屏 P</text>
                </svg>
            </div>
            <div class="shape-svg">
                <div style="font-size: 11px; color: #666; margin-bottom: 8px;">障碍物几何形状</div>
                <svg width="100" height="100" viewBox="0 0 100 100" id="previewSvg">
                    <rect x="0" y="0" width="100" height="100" fill="#222" />
                    <g id="previewShape"></g>
                </svg>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <div style="position: absolute; bottom: 10px; color: #444; font-size: 12px;">实时仿真：衍射光强分布图样</div>
        </div>
    </main>
    <aside class="controls">
        <h1>光的衍射</h1>
        
        <div class="group">
            <label>光源模式</label>
            <select id="lightMode">
                <option value="mono">单色相干光</option>
                <option value="white">白光 (复色光)</option>
            </select>
        </div>

        <div id="wlGroup" class="group">
            <label>波长 λ: <span class="val" id="wlVal">650</span> nm</label>
            <input type="range" id="wavelength" min="400" max="750" value="650">
        </div>

        <div class="group">
            <label>障碍物/孔形状</label>
            <select id="shape">
                <option value="slit">单缝 (Slit)</option>
                <option value="circle">圆孔 (Circular)</option>
                <option value="square">方孔 (Square)</option>
                <option value="disk">圆盘 (Disk - 泊松亮斑)</option>
            </select>
        </div>

        <div class="group">
            <label id="sizeLab">孔径/缝宽 a: <span class="val" id="sizeVal">0.05</span> mm</label>
            <input type="range" id="size" min="0.01" max="0.5" step="0.01" value="0.05">
        </div>

        <div class="group">
            <label>光屏增益 (感光度): <span class="val" id="expVal">5</span></label>
            <input type="range" id="exposure" min="0.5" max="10" step="0.5" value="5">
        </div>

        <div class="theory-card" id="theory">
            <strong>物理观察：</strong><br>
            单缝衍射中，中央条纹最亮最宽，两侧出现不等间距条纹。缝越窄，衍射现象越明显。
        </div>
        
        <div style="font-size: 11px; color: #555; text-align: center;">基于夫琅禾费衍射模型建模</div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

    <div class="container">
        <div class="teaching-points">
                <h3>知识点</h3>
                <ul>
                    <li><strong>平行四边形定则</strong>：合力是以两个分力为邻边所作的平行四边形的对角线</li>
                    <li><strong>矢量性</strong>：力是矢量，既有大小又有方向，合成时需要考虑方向</li>
                    <li><strong>角度影响</strong>：当两分力大小不变时，夹角越大，合力越小</li>
                    <li><strong>极值情况</strong>：当两力同向时合力最大，反向时合力最小</li>
                    <li><strong>分解原则</strong>：力的分解是合成的逆运算，通常按实际效果分解</li>
                </ul>

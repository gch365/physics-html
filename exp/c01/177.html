    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>带电粒子在电场与重力场中的运动——物理仿真实验室|177</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --panel-bg: #f8f9fa;
            --primary-color: #007bff;
            --text-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            flex-direction: row;
        }

        .controls {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .simulation-area {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
        }

        h2 { font-size: 1.2rem; margin-top: 0; color: var(--primary-color); }
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        .value-display { font-weight: bold; color: #555; float: right; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn-start { background: #28a745; color: white; }
        .btn-pause { background: #ffc107; color: white; }
        .btn-reset { background: #dc3545; color: white; }
        button:hover { opacity: 0.8; }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .controls { width: 100%; height: 45%; border-right: none; border-bottom: 1px solid #ddd; }
            .simulation-area { height: 55%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>带电粒子在电场与重力场中的运动<br><small>参数设置</small></h2>
        
        <div class="control-group">
            <label>电荷量 q (μC) <span class="value-display" id="qVal">10</span></label>
            <input type="range" id="q" min="-50" max="50" step="1" value="10">
        </div>

        <div class="control-group">
            <label>质量 m (g) <span class="value-display" id="mVal">10</span></label>
            <input type="range" id="m" min="1" max="50" step="1" value="10">
        </div>

        <div class="control-group">
            <label>重力加速度 g (m/s²) <span class="value-display" id="gVal">9.8</span></label>
            <input type="range" id="g" min="0" max="20" step="0.1" value="9.8">
        </div>

        <div class="control-group">
            <label>电场强度 E (kN/C) <span class="value-display" id="eVal">5</span></label>
            <input type="range" id="e" min="0" max="20" step="0.5" value="5">
        </div>

        <div class="control-group">
            <label>电场方向 (°) <span class="value-display" id="eAngleVal">0</span></label>
            <input type="range" id="eAngle" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <label>初速度 v₀ (m/s) <span class="value-display" id="vVal">5</span></label>
            <input type="range" id="v0" min="0" max="15" step="0.1" value="5">
        </div>

        <!-- 修正③：增加可以修改轨道半径的控件 -->
        <div class="control-group">
            <label>轨道半径 R (px) <span class="value-display" id="rVal">150</span></label>
            <input type="range" id="r" min="50" max="250" step="5" value="150">
        </div>

        <hr>
        
        <div class="checkbox-group">
            <label><input type="checkbox" id="showEField" checked> 显示电场线</label>
            <label><input type="checkbox" id="showTrail" checked> 显示轨迹</label>
            <label><input type="checkbox" id="showForceVectors" checked> 显示力矢量</label>
            <label><input type="checkbox" id="showVelVector" checked> 显示速度矢量</label>
        </div>

        <div class="btn-group">
            <button class="btn-start" id="startBtn">开始</button>
            <button class="btn-pause" id="pauseBtn">暂停</button>
            <button class="btn-reset" id="resetBtn">更新参数</button>
        </div>
        <div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

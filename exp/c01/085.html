    <style>
        :root {
            --primary: #007aff;
            --bg: #f5f5f7;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .panel {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 360px;
        }

        h2 { margin-top: 0; font-size: 1.2rem; color: #333; border-left: 5px solid var(--primary); padding-left: 12px; }

        .control-item { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; }

        .btn-group { display: flex; gap: 8px; margin-bottom: 20px; }
        button { flex: 1; padding: 10px; border: 1px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button.active { background: var(--primary); color: white; border-color: var(--primary); }

        #physics-svg {
            width: 100%;
            height: 200px;
            background: #fdfdfd;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }

        .viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        canvas {
            background: #000;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
            touch-action: none;
        }

        #measure-tag {
            margin-top: 12px;
            font-family: 'Consolas', monospace;
            background: #333;
            color: #0f0;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .formula-card {
            background: #f8faff;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #555;
            line-height: 1.5;
        }

        @media (max-width: 850px) {
            .container { flex-direction: column; }
            .panel { min-width: 100%; }
        }
    </style>
</head>

<div class="container">
    <!-- 左面板：控制与原理 -->
    <div class="panel">
        <h2>牛顿环等厚干涉——实验控制面板</h2>
        
        <div class="control-item">
            <label>光源选择</label>
            <div class="btn-group">
                <button id="btn-mono" class="active" onclick="setMode('mono')">单色光</button>
                <button id="btn-white" onclick="setMode('white')">白光</button>
            </div>

        <div id="wv-box" class="control-item">
            <label>波长 λ: <span id="val-wv">750</span> nm</label>

        <div class="control-item">
            <label>透镜曲率半径 R: <span id="val-r">2.0</span> m</label>

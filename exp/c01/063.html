    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>探究平抛运动的特点实验数据处理练习——物理仿真实验室|63</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --coord-color: #2980b9;
            --real-origin-color: #27ae60;
            --bg-light: #f8f9fa;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'PingFang SC', system-ui; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; background: white; }

        #controls {
            width: 320px; background: var(--bg-light); border-right: 1px solid #ddd;
            padding: 20px; display: flex; flex-direction: column; gap: 12px;
            z-index: 100; box-sizing: border-box; overflow-y: auto;
        }

        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; cursor: grab; background: white; }
        #canvas-container:active { cursor: grabbing; }

        h2 { font-size: 1.1rem; margin: 0; color: var(--primary); border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 3px; }
        label { font-size: 0.8rem; color: #666; display: flex; justify-content: space-between; }
        .val { font-weight: bold; color: var(--accent); }
        
        button {
            padding: 10px; border: none; border-radius: 4px;
            background: var(--primary); color: white;
            cursor: pointer; font-size: 0.9rem; transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.check { background: var(--real-origin-color); }
        
        #info-panel {
            padding: 10px; background: #fff; border: 1px solid #cce5ff;
            border-radius: 6px; font-size: 0.8rem; line-height: 1.5; display: none;
        }

        .point-tip {
            position: absolute; padding: 5px 10px; background: rgba(0,0,0,0.8);
            color: white; border-radius: 4px; font-size: 12px; pointer-events: none;
            display: none; transform: translate(-50%, -130%); z-index: 1000;
        }

        svg { width: 100%; height: 100%; touch-action: none; }
        .traj-line { stroke: var(--accent); stroke-width: 2.5; fill: none; pointer-events: none; }
        .marker { fill: white; stroke: var(--accent); stroke-width: 1.5; cursor: pointer; transition: 0.2s; }
        .marker:hover { r: 7; fill: var(--accent); }
        .axis-line { stroke: var(--coord-color); stroke-width: 2.5; marker-end: url(#arrow); }
        .axis-text { fill: var(--coord-color); font-size: 14px; font-weight: bold; }
        .mask { fill: white; stroke: none; pointer-events: none; }
    </style>
</head>
<body>

<div id="app">
    <div id="controls">
        <b>探究平抛运动的特点实验数据处理练习</b>
        <h2>实验参数</h2>
        <div class="group">
            <label>初速度 v₀ (m/s) <span id="v0-v" class="val">2.0</span></label>
            <input type="range" id="v0-s" min="1.0" max="5.0" step="0.1" value="2.0">
        </div>
        <div class="group">
            <label>重力加速度 g (m/s²) <span id="g-v" class="val">9.8</span></label>
            <input type="range" id="g-s" min="8.0" max="12.0" step="0.1" value="9.8">
        </div>
        <div class="group">
            <label>方格边长 L (cm) <span id="l-v" class="val">5.0</span></label>
            <input type="range" id="l-s" min="3.0" max="10.0" step="0.5" value="5.0">
        </div>

        <button id="btn-start">开始练习 (随机初速度)</button>
        <button id="btn-check" class="check">核对答案</button>
        
        <div id="info-panel">
            <strong style="color:var(--coord-color)">【局部坐标系分析】</strong><br>
            选取连续三点 A, B, C：<br>
            Δx = L = <span id="res-dx"></span> m<br>
            读取 y'<sub>1</sub>, y'<sub>2</sub>, y'<sub>3</sub> 坐标：<br>
            Δy = y'<sub>3</sub> - 2y'<sub>2</sub> + y'<sub>1</sub> = <span id="res-dy"></span> m<br>
            T = √(Δy/g) = <span id="res-t"></span> s<br>
            v<sub>0</sub> = Δ x / T = <span id="res-v0"></span> m/s
        </div>

        <br>
        <br>
        <br>
        <br>
        <br>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
    </div>

    <div id="canvas-container">
        <div id="point-tip" class="point-tip"></div>
        <svg id="svg">
            <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee" stroke-width="1"/>
                </pattern>
                <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--coord-color)" />
                </marker>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />

            <g id="main-layer">
                <g id="real-origin" style="display:none">
                    <line x1="-20" y1="0" x2="20" y2="0" stroke="var(--real-origin-color)" stroke-width="3" />
                    <line x1="0" y1="-20" x2="0" y2="20" stroke="var(--real-origin-color)" stroke-width="3" />
                    <text x="10" y="-10" fill="var(--real-origin-color)" font-weight="bold">抛出点 (0,0)</text>
                </g>
                <path id="traj" class="traj-line" />
                <g id="marker-group"></g>
                <g id="local-coord" style="display:none">
                    <line x1="0" y1="0" x2="150" y2="0" class="axis-line" />
                    <line x1="0" y1="0" x2="0" y2="150" class="axis-line" />
                    <text x="155" y="5" class="axis-text">x'</text>
                    <text x="-5" y="165" class="axis-text">y'</text>
                </g>
            </g>
            <rect id="blocker" class="mask" style="display:none" x="0" y="0" width="100%" height="100%" />
        </svg>
    </div>
</div>

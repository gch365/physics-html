    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --line-color: #3498db;
            --rect-fill: rgba(241, 196, 15, 0.3);
            --rect-stroke: #f39c12;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #ffffff;
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 20px;
            box-sizing: border-box;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            color: var(--accent-color);
            font-weight: bold;
            font-size: 25px;
        }

        #graph-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #fff;
            position: relative;
            touch-action: none;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .stats {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.95rem;
            border-top: 2px dashed #eee;
            padding-top: 15px;
        }

        .stat-item {
            padding: 8px;
            background: #fdfdfd;
        }

        .formula {
            grid-column: 1 / -1;
            text-align: center;
            color: #555;
            margin-bottom: 5px;
            background: #fffbe6;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ffe58f;
        }

        .highlight {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            h2 { font-size: 1.1rem; }
            .stats { grid-template-columns: 1fr; }
            .controls { grid-template-columns: 1fr; }
        }

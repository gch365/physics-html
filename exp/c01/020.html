<body>
    <div class="container">
        <h1>带电粒子在有界磁场中的运动轨迹</h1>
        <div class="main-content">
            <div class="simulation-area">
                <div class="button-group">
                    <button id="startBtn">开始模拟</button>
                    <button id="pauseBtn">暂停</button>
                    <button id="resetBtn">重置</button>
                </div>
                <div class="canvas-container">
                    <div class="magnetic-field">
                        <div class="field-direction" id="fieldDirection">磁场方向: 垂直纸面向里(×)</div>
                    </div>
                    <canvas id="particleCanvas" width="800" height="500"></canvas>
                </div>
            </div>
            <div class="controls-area">
                <div class="controls">
                    <div class="control-group" align="center">
                        <label for="velocity"><font color="red">参数控制</font></label>
                    </div>
                    <div class="control-group">
                        <label for="velocity">入射速度(v)：<span id="velocityValue">200</span>m/s</label>
                        <input type="range" id="velocity" min="1" max="500" value="200" step="1">
                        
                    </div>
                    <div class="control-group">
                        <label for="angle">入射角度：<span id="angleValue">30</span>°</label>
                        <input type="range" id="angle" min="0" max="180" value="30" step="1">
                        
                    </div>
                    <div class="control-group">
                        <label for="charge">电荷量(q)：<span id="chargeValue">1</span>C</label>
                        <input type="range" id="charge" min="-5" max="5" value="1" step="0.1">
                        
                    </div>
                    <div class="control-group">
                        <label for="mass">质量(m)：<span id="massValue">5</span>kg</label>
                        <input type="range" id="mass" min="1" max="20" value="5" step="0.1">
                        
                    </div>
                    <div class="control-group">
                        <label for="fieldStrength">磁场强度(B)：<span id="fieldStrengthValue">2.5</span>T</label>
                        <input type="range" id="fieldStrength" min="0.1" max="10" value="2.5" step="0.1">
                        
                    </div>
                    <div class="control-group">
                        <label for="fieldDirectionSelect">磁场方向</label>
                        <select id="fieldDirectionSelect">
                            <option value="in">垂直纸面向里(×)</option>
                            <option value="out">垂直纸面向外(·)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="startX">入射位置(X)：<span id="startXValue">200</span>像素</label>
                        <input type="range" id="startX" min="100" max="700" value="200" step="1">
                        
                    </div>
                    <div class="control-group">
                        <label for="startDistance">初始离磁场边界距离(Y)：<span id="startDistanceValue">50</span>像素</label>
                        <input type="range" id="startDistance" min="10" max="200" value="50" step="1">
                        
                    </div>
                </div>
            </div>
        </div>
        <div class="info-panel">
            <p><strong>物理原理：</strong>带电粒子在磁场中受到洛伦兹力F=qv×B，运动轨迹为匀速圆周运动。</p>
            <p><strong>入射角度与出射角度：</strong>角度表示速度方向与磁场边界的夹角。</p>
            <p id="calculationInfo">计算信息将在此显示...</p>
        </div>
    </div>

    <title>速度选择器(带电粒子在叠加场中的运动)仿真——物理仿真实验室|32</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(30, 41, 59, 0.95);
            --accent: #38bdf8;
            --text: #f1f5f9;
            --warning: #fb7185;
            --vector-e: #fbbf24;
            --vector-m: #22d3ee;
            --pos-color: #ef4444; /* 正电荷红 */
            --neg-color: #3b82f6; /* 负电荷蓝 */
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        canvas { flex-grow: 1; background: #000; }

        #ui-panel {
            background: var(--panel); color: var(--text); padding: 5px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; border-top: 1px solid #334155; z-index: 100;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .label-row { display: flex; justify-content: space-between; font-size: 11px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        
        .btn-row { display: flex; gap: 5px; margin-top: 5px; }
        button {
            flex: 1; padding: 6px; border: none; border-radius: 4px;
            background: #475569; color: white; cursor: pointer; font-size: 11px;
        }
        button:hover { background: #64748b; }
        button.active { background: var(--accent); color: #000; font-weight: bold; }
        
        #data-monitor {
            position: absolute; top: 5px; left: 5px;
            background: rgba(15, 23, 42, 0.85); padding: 2px;
            border-radius: 8px; border: 1px solid var(--accent);
            color: var(--text); pointer-events: none; font-size: 13px; line-height: 1.1;
        }
        .highlight { color: var(--accent); font-family: monospace; font-weight: bold; }
        .hit-msg { color: var(--warning); font-weight: bold; display: none; margin-top: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div id="data-monitor">
        <div style="font-weight:bold; border-bottom:1px solid #444; margin-bottom:5px;" align="center">速度选择器(带电粒子在叠加场中的运动)仿真<br>物理状态监测</div>
        <div align="center">电场力 Fe: <span id="fe_text" class="highlight">0</span> N | 洛伦兹力 Fm: <span id="fm_text" class="highlight">0</span> N</div>
        <div align="center">瞬时速度 v: <span id="v_text" class="highlight">0</span> m/s</div>
        <div id="hit_msg" class="hit-msg" align="center">⚠️ 粒子已触碰极板反弹</div>
        <div id="status_msg" style="margin-top:5px; font-size:12px;" align="center"><b>⚠️ 动画未启动<b></div>
    </div>

    <canvas id="mainCanvas"></canvas>

    <div id="ui-panel">
        <div class="control-group">
            <div class="btn-row">
                <button id="pauseBtn">启动模拟</button>
                <button onclick="resetSimulation()" style="flex:1; background:var(--accent); color:black; font-weight:bold;">发射粒子</button>
                <button id="decompBtn" class="active">分运动轨迹:开</button>
                <button id="forceBtn" class="active">受力分析:开</button>
            </div>
            <div class="btn-row">
                
            </div>
            
        </div>
        <div class="control-group">
            <div class="btn-row">
                <select id="side_select" style="flex:1; background:#1e293b; color:white; border:1px solid #444;">
                    <option value="left">左侧射入</option>
                    <option value="right">右侧射入</option>
                </select>
                <select id="q_sign_select" style="background:#1e293b; color:white; border:1px solid #444; padding:3px;">
                    <option value="1">正电荷 (+q)</option>
                    <option value="-1">负电荷 (-q)</option>
                </select>
                <button onclick="applyBalance()" style="background:#059669">一键调至平衡</button>
            </div>
            <div class="label-row"><span>动画速度(太大会出现错误)【注意：更改参数后请重新点击“发射粒子”】</span><span id="sim_val" class="highlight">0.3</span></div>
            <input type="range" id="sim_slider" min="0.1" max="3" step="0.1" value="0.3">
        </div>
        <div class="control-group">
            <div class="label-row"><span>电场强度 E</span><span id="e_val" class="highlight">100</span></div>
            <input type="range" id="e_slider" min="-300" max="300" value="100">
            <div class="label-row"><span>磁感应强度 B</span><span id="b_val" class="highlight">3.0</span></div>
            <input type="range" id="b_slider" min="-10" max="10" step="0.1" value="3.0">
        </div>
        <div class="control-group">
            <div class="label-row"><span>荷质比 q/m</span><span id="qm_val" class="highlight">1.0</span></div>
            <input type="range" id="qm_slider" min="0.1" max="5" step="0.1" value="1.0">
            <div class="label-row"><span>入射初速度 v₀</span><span id="v_val" class="highlight">100</span></div>
            <input type="range" id="v_slider" min="10" max="250" value="100">
        </div>
    </div>

</div>

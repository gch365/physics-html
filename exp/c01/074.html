    <title>全反射演示实验——物理仿真实验室|74</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1100px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; overflow: hidden; }
        
        /* 控制区 */
        .controls { flex: 1; min-width: 320px; padding: 25px; border-right: 1px solid #eee; }
        .control-item { margin-bottom: 18px; }
        h2 { color: var(--primary); margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 0.9rem; }
        .value-tag { color: var(--accent); float: right; }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
        .color-picker { display: flex; gap: 8px; margin-top: 5px; }
        .c-btn { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #eee; cursor: pointer; transition: 0.2s; }
        .c-btn.active { border-color: #333; transform: scale(1.1); }

        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #444; }
        .btn-group { display: flex; gap: 10px; margin: 20px 0; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; background: var(--accent); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
        #criticalBtn { background: #e67e22; }
        #criticalBtn:hover { background: #d35400; }

        .info-card { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); font-size: 0.85rem; line-height: 1.6; }
        
        /* 演示区 */
        .display { flex: 1.5; min-width: 350px; background: white; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; }
        #svg-canvas { width: 100%; height: auto; max-height: 85vh; }
        .angle-label { font-size: 12px; font-weight: bold; fill: #444; }

        @media (max-width: 768px) { .container { flex-direction: column; } .controls { border-right: none; } }
    </style>
</head>

<div class="container">
    <section class="display">
        <svg id="svg-canvas" viewBox="0 0 400 400">
            <!-- 介质背景 -->
            <rect id="bg-top" x="0" y="0" width="400" height="200" fill="#eef" />
            <rect id="bg-bottom" x="0" y="200" width="400" height="200" fill="#fff" />
            
            <!-- 界面与法线 -->
            <line x1="0" y1="200" x2="400" y2="200" stroke="#333" stroke-width="2" />
            <line x1="200" y1="0" x2="200" y2="400" stroke="#999" stroke-dasharray="5,5" />

            <!-- 角度弧线 -->
            <g id="angle-markers">
                <path id="arc-in" fill="none" stroke="#666" stroke-width="1" />
                <path id="arc-tra" fill="none" stroke="#666" stroke-width="1" />
                <text id="txt-theta1" class="angle-label"></text>
                <text id="txt-theta2" class="angle-label"></text>
            </g>
            
            <!-- 光线路径 -->
            <path id="ray-in" d="" fill="none" stroke-width="3" />
            <path id="ray-ref" d="" fill="none" stroke-width="3" />
            <path id="ray-tra" d="" fill="none" stroke-width="3" />
            
            <text x="10" y="25" font-size="12" font-weight="bold">介质 1</text>
            <text x="10" y="385" font-size="12" font-weight="bold">介质 2</text>
        </svg>
    </section>
    <section class="controls">
        <h2>全反射实验控制台</h2>
        
        <div class="control-item">
            <label>光源颜色 (观察色散差异)</label>
            <div class="color-picker" id="colorPicker">
                <div class="c-btn active" data-color="#FF0000" data-offset="-0.06" style="background:#FF0000" title="红光"></div>
                <div class="c-btn" data-color="#00FF00" data-offset="0.00" style="background:#00FF00" title="绿光"></div>
                <div class="c-btn" data-color="#0055FF" data-offset="0.06" style="background:#0055FF" title="蓝光"></div>
                <div class="c-btn" data-color="#AA00FF" data-offset="0.12" style="background:#AA00FF" title="紫光"></div>
            </div>
        </div>

        <div class="control-item">
            <label>介质1 折射率 n<sub>1</sub> <span class="value-tag" id="val-n1">1.60</span></label>
            <input type="range" id="n1" min="1.0" max="2.4" step="0.01" value="1.60">
        </div>

        <div class="control-item">
            <label>介质2 折射率 n<sub>2</sub> <span class="value-tag" id="val-n2">1.00</span></label>
            <input type="range" id="n2" min="1.0" max="2.4" step="0.01" value="1.00">
        </div>

        <div class="control-item">
            <label>入射角 θ<sub>1 <span class="value-tag" id="val-theta1">30.0°</span></label>
            <input type="range" id="theta1" min="0" max="89.5" step="0.1" value="30.0">
        </div>

        <div class="control-item checkbox-group">
            <input type="checkbox" id="showLabels"> <label for="showLabels" style="display:inline; margin:0;">显示角度标记</label>

        <div class="btn-group">
            <button id="drawBtn">🖊 动态绘出光线</button>
            <button id="criticalBtn">跳转到临界角</button>
        </div>

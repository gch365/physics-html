<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">
    <meta name="author" content="物理仿真实验室">
    <!-- 头部文件结束 -->
    <title>参考系——物理仿真实验室|142</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #ffffff;
            --sky-blue: #87CEEB; /* 调整后的天蓝色 */
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .container {
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* 左侧侧边栏 */
        .sidebar {
            float: left;
            width: 260px;
            height: 100%;
            padding: 14px;
            box-sizing: border-box;
            border-right: 2px solid #eee;
            background: #fdfdfd;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        .poem {
            font-family: "STKaiti", "KaiTi", serif;
            font-size: 1rem;
            line-height: 1.5;
            color: #333;
            margin-bottom: 12px;
            padding: 10px;
            border-left: 4px solid var(--accent-color);
            background: #fff;
        }

        .controls {
            margin-top: 10px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .ref-toggle {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            font-weight: bold;
        }

        button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 右侧动画演示区 */
        .main-visual {
            height: 100%;
            overflow: hidden;
            position: relative;
            background: #87CEEB;
        }

        #canvas-svg {
            width: 100%;
            height: 100%;
        }

        .explanation {
            font-size: 0.9rem;
            color: #555;
            line-height: 1.5;
            margin-top: auto;
            background: #f1f8e9;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #dcedc8;
        }

        .value-display {
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>参考系交互教学</h2>
        <div class="poem">
            飞花两岸照船红，<br>
            百里榆堤半日风。<br>
            <strong>卧看满天云不动，</strong><br>
            <strong>不知云与我俱东。</strong>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>选择参考系：</label>
                <div class="ref-toggle">
                    <button id="ref-ground" class="active">地面</button>
                    <button id="ref-boat">船 (诗人)</button>
                </div>
            </div>

            <div class="control-group">
                <label>船的航行速度 (向东): <span id="boat-v-val" class="value-display">3</span> m/s</label>
                <input type="range" id="boat-v" min="0" max="10" step="0.1" value="3">
            </div>

            <div class="control-group">
                <label>云的飘动速度 (向东): <span id="cloud-v-val" class="value-display">3</span> m/s</label>
                <input type="range" id="cloud-v" min="0" max="10" step="0.1" value="3">
            </div>
        </div>

        <div class="explanation" id="exp-text">
            <b>物理原理：</b>当船与云速度相同时，以船为参考系，云的相对速度为0。
        </div>
        <div class="explanation" id="exp-text">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div>
</footer>     <!-- 尾部文件结束 -->
        </div>
    </div>

    <div class="main-visual">
        <svg id="canvas-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
            <!-- 天空背景 (淡蓝色) -->
            <rect width="800" height="500" fill="#87CEEB" />
            
            <!-- 远山层 -->
            <g id="mountains-layer"></g>
            
            <!-- 云层 (白色) -->
            <g id="clouds-layer"></g>

            <!-- 岸边与树木 -->
            <g id="shore-layer">
                <rect y="360" width="800" height="140" fill="#9CCC65" />
            </g>

            <!-- 水域 -->
            <rect y="400" width="800" height="100" fill="#E1F5FE" />
            <g id="waves-layer"></g>

            <!-- 优化后的船 -->
            <g id="boat-group">
                <!-- 船身 -->
                <path d="M -70 0 L 70 0 L 55 25 L -55 25 Z" fill="#5D4037" />
                <!-- 船舱/顶棚 -->
                <path d="M -40 0 Q 0 -45 40 0" fill="#8D6E63" stroke="#3E2723" stroke-width="2" />
                <!-- 诗人 -->
                <circle cx="0" cy="-5" r="8" fill="#FFCCBC" />
                <rect x="-10" y="2" width="20" height="5" fill="#FFFFFF" rx="2" />
                <text x="-25" y="45" font-size="14" font-weight="bold" fill="#3E2723">观察者(我)</text>
            </g>
        </svg>
    </div>
</div>

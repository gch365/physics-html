    <style>
        :root {
            --bg: #000;
            --panel: #1a1a1a;
            --accent: #00a8ff;
            --text: #fff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #111;
            padding: 12px;
            text-align: center;
            font-size: 1.2rem;
            border-bottom: 1px solid #333;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            main { flex-direction: column; overflow-y: auto; }
            #controls { width: 100% !important; border-right: none !important; }
            #stage { height: 400px; min-height: 400px; }
        }

        #controls {
            width: 300px;
            background: var(--panel);
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .item { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #999; }
        .val { float: right; color: var(--accent); font-family: monospace; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { opacity: 0.9; }
        button.tir { background: #e67e22; }

        #stage {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;

<body>

<header>三棱镜分光及光谱带仿真</header>

<main>
    <section id="stage">
        <div id="tir-msg" style="position:absolute; top:20px; left:20px; color:#ff4757; font-weight:bold;"></div>
        <svg id="svg" viewBox="0 0 800 500">
            <!-- 白色光屏 -->
            <rect x="740" y="50" width="20" height="400" fill="#ffffff" rx="2" />
            <text x="750" y="40" fill="#fff" font-size="12" text-anchor="middle">观测屏</text>
            
            <!-- 光屏光谱层 -->
            <g id="screen-hits"></g>

            <!-- 三棱镜 -->
            <polygon id="prism" fill="rgba(100, 200, 255, 0.1)" stroke="#444" stroke-width="1" />
            
            <!-- 连续光谱路径层 -->
            <g id="spectrum-paths"></g>
            
            <!-- 法线 -->
            <line id="norm1" stroke="#333" stroke-dasharray="5,5" />
            <line id="norm2" stroke="#333" stroke-dasharray="5,5" />
        </svg>
    </section>
    <section id="controls">
        <div class="item">
            <label>三棱镜顶角: <span id="v-apex" class="val">60°</span></label>
            <input type="range" id="s-apex" min="30" max="85" value="60">
        </div>
        <div class="item">
            <label>入射角 (白光): <span id="v-inc" class="val">-60°</span></label>
            <input type="range" id="s-inc" min="-80" max="80" value="-60">
        </div>
        <div class="item">
            <label>介质折射率 (n): <span id="v-n" class="val">1.52</span></label>
            <input type="range" id="s-n" min="1.1" max="2.0" step="0.01" value="1.52">
        </div>

        <button id="btn-play">▶ 播放传播动画</button>
        <button id="btn-tir" class="tir">✨ 寻找临界全反射</button>

        <div class="hint">
            <b>物理规律提示：</b><br>
            • 红光波长长，折射率小，偏转最少（靠上）。<br>
            • 紫光波长短，折射率大，偏转最多（靠下）。<br>
            • 光屏实时捕捉出射光带。
        </div>
<!-- 尾部文件开始 -->
<footer>

        <font size="-1">

</footer>     <!-- 尾部文件结束 -->

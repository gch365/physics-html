    <title>电磁感应阻尼式单杆模型——物理仿真实验室|53</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --panel-bg: #ffffff;
            --accent: #0984e3;
            --danger: #d63031;
            --success: #27ae60;
            --warning: #e67e22;
            --purple: #6c5ce7;
            /* 移动端友好的字体大小 */
            --mobile-text: 14px;
        }
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: "Helvetica Neue", Helvetica, "Segoe UI", system-ui, sans-serif;
            background-color: var(--bg-color);
            color: #2d3436;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden; /* 防止横向滚动 */
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        header h2 {
            margin: 0;
            font-size: 1.3rem; /* 适配手机 */
            color: #2c3e50;
        }

        /* 主布局改为单列流式布局 */
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* 仿真与图表容器 */
        .canvas-section {
            display: flex;
            flex-direction: column; /* 默认竖向排列 */
            gap: 10px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        /* 仿真窗口样式 */
        .canvas-container {
            position: relative;
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid #d1d8e0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
            flex: 2;
        }

        /* 为Canvas设置响应式样式 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .label-tag {
            position: absolute; top: 6px; left: 10px; font-size: 11px;
            font-weight: bold; color: #7f8c8d; background: rgba(255,255,255,0.85);
            padding: 2px 6px; border-radius: 4px; pointer-events: none; z-index: 10;
        }
        /* 图表区域：在手机上垂直堆叠，在大屏上可以改为网格 */
        .graphs-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* 数据与控制面板优化 */
        .stats-grid, .controls-grid {
            display: grid;
            grid-template-columns: 1fr; /* 手机端强制单列 */
            gap: 8px;
            width: 100%;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d8e0;
        }
        /* 控制组样式调整 */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-item { font-size: 0.85rem; color: #636e72; border-bottom: 1px solid #f1f2f6; }
        .stat-item b { color: var(--danger); font-family: "Consolas", monospace; }
        
        .energy-summary {
            grid-column: 1 / -1; display: flex; justify-content: center;
            gap: 30px; margin-top: 5px; padding-top: 5px;
            border-top: 1px solid #dfe6e9; font-weight: bold; font-size: 0.95rem;
        }


        .control-group { display: flex; flex-direction: column; gap: 2px; }
        .control-group label { font-size: 0.75rem; font-weight: bold; display: flex; justify-content: space-between; }
        input[type="range"] { height: 18px; }

        .checkbox-area {
            grid-column: 1 / -1; display: flex; flex-wrap: wrap;
            justify-content: center; gap: 15px; background: #fff;
            padding: 6px; border-radius: 6px; font-size: 0.8rem;
        }

        .btn-row { display: flex; justify-content: center; gap: 20px; padding: 5px 0; flex-shrink: 0; }
        button {
            padding: 10px 40px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; color: white; transition: 0.2s;
        }
        .btn-play { background: var(--accent); }
        .btn-reset { background: #636e72; }
        /* 响应式断点：当屏幕足够宽时（如平板横屏），恢复部分两列布局 */
        @media (min-width: 768px) {
            .canvas-section {
                flex-direction: row;
            }

            #simBox {
                flex: 2;
            }

            .graphs-grid {
                flex: 1;
            }

            .stats-grid, .controls-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }

            .btn-row {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<header><h2>电磁感应阻尼式单杆模型</h2></header>

<div class="main-layout">
    <div class="btn-row">
        <button id="playBtn" class="btn-play">运行 / 暂停</button>
        <button id="resetBtn" class="btn-reset">重置实验</button>
    </div>
    <div class="canvas-section">
        <div id="simBox" class="canvas-container">
            <div class="label-tag">物理场景仿真 (B:磁场 L:导轨宽度)</div>
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="graphs-row">
            <div class="canvas-container">
                <div class="label-tag">速度-时间 (v-t)</div>
                <canvas id="vGraph"></canvas>
            </div>
            <div class="canvas-container">
                <div class="label-tag">加速度-时间 (a-t)</div>
                <canvas id="aGraph"></canvas>
            </div>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">速度 v: <b id="v_val">0.00</b> m/s</div>
        <div class="stat-item">加速度 a: <b id="a_val">0.00</b> m/s²</div>
        <div class="stat-item">电动势 E: <b id="e_val">0.00</b> V</div>
        <div class="stat-item">电流 I: <b id="i_val">0.00</b> A</div>
        <div class="stat-item">安培力 Fa: <b id="fa_val">0.00</b> N</div>
        <div class="stat-item">摩擦力 Ff: <b id="ff_val">0.00</b> N</div>
        <div class="stat-item">外阻热 QR: <b id="qr_val">0.00</b> J</div>
        <div class="stat-item">内阻热 Qr: <b id="qrin_val">0.00</b> J</div>
        <div class="stat-item">摩擦热 Qf: <b id="qf_val">0.00</b> J</div>
        <div class="energy-summary">
            <span>初始机械能: <span id="e0_val">0.00</span> J</span>
            <span>系统总能 (Ek+ΣQ): <span id="etot_val" style="color:var(--success)">0.00</span> J</span>
        </div>
    </div>

    <div class="controls-grid">
        <div class="control-group">
            <label>磁感应强度 B (T): <span id="b_l">1.0</span></label>
            <input type="range" id="b_i" min="-2.0" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>杆质量 m (kg): <span id="m_l">1.0</span></label>
            <input type="range" id="m_i" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>初速度 v₀ (m/s): <span id="v0_l">10.0</span></label>
            <input type="range" id="v0_i" min="-20" max="20" step="1" value="10">
        </div>
        <div class="control-group">
            <label>轨道间距 L (m): <span id="l_l">1.0</span></label>
            <input type="range" id="l_i" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>外阻 R (Ω): <span id="r_l">1.0</span></label>
            <input type="range" id="r_i" min="0.1" max="10.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>内阻 r (Ω): <span id="rin_l">0.5</span></label>
            <input type="range" id="rin_i" min="0.0" max="5.0" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>摩擦系数 μ: <span id="mu_l">0.05</span></label>
            <input type="range" id="mu_i" min="0.00" max="0.50" step="0.01" value="0.05">
        </div>
        <div class="checkbox-area">
            <label><input type="checkbox" id="chk_v" checked> 速度</label>
            <label><input type="checkbox" id="chk_fa" checked> 安培力</label>
            <label><input type="checkbox" id="chk_ff" checked> 摩擦力</label>
            <label><input type="checkbox" id="chk_a" checked> 加速度</label>
            <label><input type="checkbox" id="chk_i" checked> 电流方向</label>
        </div>
    </div>
</div>

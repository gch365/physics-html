    <title>管道(杆)模型的竖直圆周运动——物理仿真实验室|69</title>
    <style>
        :root {
            --primary: #2c3e50;
            --outer-color: #e67e22;
            --inner-color: #9b59b6;
            --v-color: #27ae60;
            --fc-color: #3498db;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #fff;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        main {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            overflow: hidden;
        }

        #canvas-container {
            flex: 2;
            min-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            position: relative;
        }

        svg { width: 100%; height: 100%; max-width: 500px; }

        #controls {
            flex: 1;
            min-width: 320px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; }
        
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 10px;
            background: #eee;
            border-radius: 6px;
        }

        .checkbox-grid label { font-weight: normal; font-size: 12px; }

        .data-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-main { background: var(--primary); color: white; }
        .btn-auto { background: #e74c3c; color: white; }
        .btn-reset { background: #95a5a6; color: white; }
        button:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            main { flex-direction: column; overflow-y: auto; }
            #canvas-container { height: 320px; flex: none; }
        }
    </style>
</head>
<body>

<header>管道(杆)模型的竖直圆周运动</header>

<main>
    <div id="canvas-container">
        <svg id="sim-svg" viewBox="0 0 400 400">
        <g transform="translate(0,-50)">
            <!-- 能量线 -->
            <line id="energy-line" x1="50" y1="0" x2="350" y2="0" stroke="#ccc" stroke-dasharray="4,2" />
            
            <!-- 轨道背景 -->
            <circle id="track-bg" cx="200" cy="200" r="150" fill="none" stroke="#f9f9f9" stroke-width="20" />
            
            <!-- 轨道虚线边界 -->
            <circle id="track-outer" cx="200" cy="200" r="160" fill="none" stroke="#ddd" stroke-dasharray="5,3" stroke-width="1" />
            <circle id="track-inner" cx="200" cy="200" r="140" fill="none" stroke="#ddd" stroke-dasharray="5,3" stroke-width="1" />

            <!-- 接触壁高亮层 -->
            <circle id="high-outer" cx="200" cy="200" r="160" fill="none" stroke="var(--outer-color)" stroke-width="3" stroke-opacity="0" />
            <circle id="high-inner" cx="200" cy="200" r="140" fill="none" stroke="var(--inner-color)" stroke-width="3" stroke-opacity="0" />

            <!-- 圆心标记 -->
            <g stroke="#333" stroke-width="1">
                <line x1="195" y1="200" x2="205" y2="200" />
                <line x1="200" y1="195" x2="200" y2="205" />
                <circle cx="200" cy="200" r="2" fill="#333"/>
            </g>

            <!-- 小球 -->
            <circle id="ball" cx="200" cy="350" r="10" fill="#34495e" />

            <!-- 细矢量组 -->
            <g id="vectors">
                <line id="v-mg" x1="0" y1="0" x2="0" y2="0" stroke="red" stroke-width="1.2" marker-end="url(#arr-red)" />
                <line id="v-fn" x1="0" y1="0" x2="0" y2="0" stroke="orange" stroke-width="1.2" marker-end="url(#arr-orange)" />
                <line id="v-fc" x1="0" y1="0" x2="0" y2="0" stroke="var(--fc-color)" stroke-width="1.2" marker-end="url(#arr-blue)" />
                <line id="v-vel" x1="0" y1="0" x2="0" y2="0" stroke="var(--v-color)" stroke-width="1.2" marker-end="url(#arr-green)" />
            </g>

            <!-- 箭头定义 -->
            <defs>
                <marker id="arr-red" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="red" /></marker>
                <marker id="arr-orange" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="orange" /></marker>
                <marker id="arr-purple" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--inner-color)" /></marker>
                <marker id="arr-blue" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--fc-color)" /></marker>
                <marker id="arr-green" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--v-color)" /></marker>
            </defs>
        </g>
        </svg>
    </div>

    <div id="controls">
        <div class="group">
            <label>轨道半径 R (m) <span id="txt-r">1.50</span></label>
            <input type="range" id="in-r" min="0.5" max="1.8" step="0.1" value="1.5">
        </div>
        <div class="group">
            <label>小球质量 m (kg) <span id="txt-m">1.00</span></label>
            <input type="range" id="in-m" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <div class="group">
            <label>初速度 v₀ (m/s) <span id="txt-v0">7.67</span></label>
            <input type="range" id="in-v0" min="0" max="15" step="0.1" value="7.7">
        </div>
        <div class="group">
            <label>重力加速度 g (m/s²) <span id="txt-g">9.80</span></label>
            <input type="range" id="in-g" min="0" max="20" step="0.1" value="9.8">
        </div>

        <button class="btn-auto" onclick="matchCritical()">一键匹配恰好过顶初速 (√4gR)</button>

        <div class="checkbox-grid">
            <label><input type="checkbox" id="c-force" checked> 受力分析 (G, Fn)</label>
            <label><input type="checkbox" id="c-fc" checked> 向心力 Fc</label>
            <label><input type="checkbox" id="c-vel" checked> 速度矢量 v</label>
            <label><input type="checkbox" id="c-h"> 能量最高点</label>
            <label style="grid-column: span 2; border-top: 1px solid #ddd; padding-top: 5px; margin-top: 5px;">
                <input type="checkbox" id="c-highlight" checked> 启用接触壁高亮显示
            </label>
        </div>

        <div class="btn-group" style="display:flex; gap:8px;">
            <button class="btn-main" id="btn-play" style="flex:2">开始播放</button>
            <button class="btn-reset" id="btn-reset" style="flex:1">重置</button>
        </div>

        <div class="data-card">
            <div>实时速度 v: <span id="d-v">0.00</span> m/s</div>
            <div>轨道弹力 Fn: <span id="d-fn">0.00</span> N</div>
            <div id="d-wall" style="margin-top:6px; padding:4px; border-radius:4px; font-weight:bold; transition: 0.3s;">接触壁: --</div>
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

</main>

    <title>开普勒行星运动定律——物理仿真实验室|127</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-color: #1a202c;
            --accent-color: #4facfe;
            --text-color: #e2e8f0;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden;
        }

        .container { display: flex; flex-direction: row; height: 100vh; width: 100vw; }

        /* 左侧画布 */
        #canvas-container {
            flex: 1; position: relative;
            background: radial-gradient(circle at center, #1a2a3a 0%, #0b0e14 100%);
            display: flex; align-items: center; justify-content: center;
        }
        canvas { max-width: 100%; max-height: 100%; }

        /* 右侧控制面板 */
        #controls {
            width: 400px; background-color: var(--panel-color);
            padding: 20px; box-shadow: -2px 0 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 12px;
            overflow-y: auto; z-index: 10; border-left: 1px solid #2d3748;
        }

        h1 { font-size: 1.3rem; color: var(--accent-color); margin: 0; }
        h2 { font-size: 1rem; border-left: 4px solid var(--accent-color); padding-left: 10px; margin: 10px 0; }
        p { font-size: 0.85rem; line-height: 1.5; color: #a0aec0; }

        .tab-group { display: flex; background: #000; border-radius: 6px; padding: 3px; }
        .tab-btn {
            flex: 1; padding: 8px; border: none; background: none; color: #718096;
            cursor: pointer; transition: 0.3s; border-radius: 4px; font-size: 0.8rem;
        }
        .tab-btn.active { background: var(--accent-color); color: white; }

        /* 按钮样式 */
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 10px; border-radius: 6px; border: 1px solid var(--accent-color);
            background: transparent; color: var(--accent-color); cursor: pointer;
            font-weight: bold; transition: 0.2s; font-size: 0.85rem;
        }
        .btn:hover { background: rgba(79, 172, 254, 0.1); }
        .btn.active { background: var(--accent-color); color: white; }

        /* 数据看板 */
        .data-card {
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px;
            border: 1px solid #2d3748; margin-top: 5px;
        }
        .data-item { display: flex; justify-content: space-between; margin-bottom: 4px; font-family: monospace; font-size: 0.9rem; }
        
        /* 表格自适应 */
        .table-wrapper { overflow-x: auto; margin-top: 10px; border: 1px solid #2d3748; border-radius: 4px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.65rem; text-align: center; white-space: nowrap; }
        .data-table th, .data-table td { border: 1px solid #2d3748; padding: 5px 3px; }
        .data-table th { background: #1a202c; color: var(--accent-color); }

        select {
            width: 100%; padding: 8px; background: #0f172a; color: white;
            border: 1px solid #2d3748; border-radius: 4px; margin-bottom: 5px;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #controls { width: 100%; height: 40%; }
            #canvas-container { height: 60%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="canvas-container">
        <canvas id="keplerCanvas"></canvas>
    </div>

    <div id="controls">
        <h1>开普勒定律交互教学</h1>
        
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchLaw(1)">第一定律</button>
            <button class="tab-btn" onclick="switchLaw(2)">第二定律</button>
            <button class="tab-btn" onclick="switchLaw(3)">第三定律</button>
        </div>

        <div class="btn-row">
            <button id="pauseBtn" class="btn" onclick="togglePause()">⏸ 暂停动画</button>
            <button id="circleBtn" class="btn" onclick="toggleCircular()">⭕ 圆轨道近似</button>
        </div>

        <div id="description">
            <h2 id="law-title">第一定律：轨道定律</h2>
            <p id="law-text">所有行星绕太阳运动的轨道都是椭圆，太阳处在椭圆的一个焦点上。</p>
        </div>

        <div id="interactive-area">
            <h2>观察对象选择</h2>
            <select id="planetSelect" onchange="selectPlanet(this.value)">
                <option value="-1" selected>--- 默认显示全部轨道 ---</option>
                <option value="0">水星 (Mercury)</option>
                <option value="1">金星 (Venus)</option>
                <option value="2">地球 (Earth)</option>
                <option value="3">火星 (Mars)</option>
                <option value="4">演示彗星 (Comet)</option>
            </select>

            <div id="second-law-data" class="data-card" style="display:none;">
                <div class="data-item"><span>距日距离 r:</span> <span id="val-r" style="color:#79c0ff">--</span> AU</div>
                <div class="data-item"><span>瞬时速度 v:</span> <span id="val-v" style="color:#79c0ff">--</span> km/s</div>
            </div>

            <div id="third-law-ui" class="table-wrapper" style="display:none;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>行星</th>
                            <th>a</th><th>a²</th><th>a³</th>
                            <th>T</th><th>T²</th><th>T³</th>
                        </tr>
                    </thead>
                    <tbody id="planet-data-body"></tbody>
                </table>
                <p style="font-size:0.7rem; color:#718096; margin:5px;">* a单位: AU, T单位: 年. 请寻找哪两列成正比?</p>
            </div>
        </div>
        <div style="margin-top: auto; font-size: 0.8rem; color: #666;">
            * 为了演示效果，部分行星轨道离心率略有微调。

    <title>自由落体频闪照片类问题——物理仿真实验室|66</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            flex-direction: row;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; overflow-y: auto; }
            .control-panel { width: 100% !important; height: auto !important; }
            .sim-viewport { height: 500px !important; flex-shrink: 0; }
        }

        /* 左侧控制面板 */
        .control-panel {
            width: 380px;
            padding: 20px;
            box-sizing: border-box;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f9f9f9;
            overflow-y: auto;
        }

        h1 { font-size: 1.2rem; color: var(--primary-color); margin: 0; }
        .instruction { font-size: 0.85rem; color: #666; background: #fff; padding: 10px; border-left: 4px solid var(--accent-color); }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 0.85rem; }
        .value-disp { color: var(--accent-color); font-weight: bold; }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-start { background-color: var(--success-color); color: white; }
        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-calc { background-color: var(--accent-color); color: white; opacity: 0.4; cursor: not-allowed; }
        .btn-calc.active { opacity: 1; cursor: pointer; }

        #result-area {
            margin-top: 5px;
            padding: 12px;
            background: #e8f4fd;
            border-radius: 4px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.6;
        }

        /* 右侧仿真区 */
        .sim-viewport {
            flex-grow: 1;
            position: relative;
            background: white;
            display: flex;
            justify-content: center;
        }

        #svg-canvas { width: 100%; height: 100%; touch-action: none; }
        
        /* 交互元素样式 */
        .strobe-ball { cursor: pointer; transition: r 0.2s, fill 0.2s; }
        .strobe-ball:hover { fill: #f39c12; }
        .strobe-ball.selected { fill: #e67e22; stroke: #d35400; stroke-width: 2; }
        .ruler-text { font-size: 11px; fill: #777; pointer-events: none; }
        .reading-tag { font-size: 11px; fill: #e67e22; font-weight: bold; }
    </style>
</head>

<div class="container">
    <div class="sim-viewport">
        <svg id="svg-canvas" viewBox="0 0 400 800" preserveAspectRatio="xMidYMin meet">
            <!-- 刻度尺背景 -->
            <rect x="50" y="0" width="40" height="800" fill="#f8f8f8" />
            <g id="ruler-ticks"></g>
            
            <!-- 频闪点和读数 -->
            <g id="strobe-group"></g>
            <g id="reading-group"></g>

            <!-- 运动物体 -->
            <circle id="ball" cx="150" cy="10" r="10" fill="#e74c3c" />
            <line id="guide-line" x1="50" x2="200" y1="10" y2="10" stroke="#ddd" stroke-dasharray="4" />
        </svg>
    </div>
    <div class="control-panel">
        <h1>自由落体频闪实验</h1>
        <div class="instruction">
            <strong>实验步骤：</strong><br>
            1. 设定参数，点击“释放小球”。<br>
            2. 停止后，在右侧<strong>依次点击三个相邻</strong>的蓝色频闪点。<br>
            3. 点击“核对数据答案”进行加速度推导。
        </div>
        
        <div class="btn-group">
            <button class="btn-start" id="start-btn">释放小球</button>
            <button class="btn-reset" id="reset-btn">重置实验</button>
        </div>
        
        <div class="form-group">
            <label>重力加速度 g (m/s²): <span id="g-val" class="value-disp">9.80</span></label>
            <input type="range" id="g-input" min="1.0" max="20.0" step="0.1" value="9.8">
        </div>

        <div class="form-group">
            <label>频闪时间间隔 T (s): <span id="t-val" class="value-disp">0.10</span></label>
            <input type="range" id="t-input" min="0.05" max="0.3" step="0.01" value="0.1">
        </div>

        <div id="selection-info" style="font-size:0.85rem; color:#e67e22; font-weight:bold;">
            已选择点: <span id="selected-count">0</span>/3
        </div>

        <button class="btn-calc" id="calc-btn" disabled>核对数据答案</button>

        <div id="result-area">
            <strong>数据处理过程：</strong>
            <div id="calc-steps"></div>
        </div>

    <!-- 尾部文件开始 -->

        <font size="-1">

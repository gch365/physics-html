    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>α粒子散射的实验——物理仿真实验室|107</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --panel-bg: #fdfdfd;
            --accent: #2980b9;
            --gold: #f1c40f;
            --glow: #7fff00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', sans-serif;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部标题与控制区 */
        #ui-layer {
            padding: 15px;
            background: var(--panel-bg);
            border-bottom: 2px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .title-group h1 { margin: 0; font-size: 1.3rem; color: #2c3e50; }
        .controls { display: flex; gap: 20px; align-items: center; }

        /* 核心显示区 */
        #stage {
            flex: 1;
            display: flex;
            position: relative;
            background: white;
        }

        /* 左侧：实验装置图 */
        #experiment-view {
            flex: 1.2;
            position: relative;
            border-right: 1px solid #eee;
        }

        /* 右侧：放大的显微镜视场 */
        #microscope-view {
            flex: 0.8;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-left: 5px solid #444;
        }

        #eyepiece {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            border: 8px solid #555;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.3);
        }

        #eyepiece::after {
            content: "荧光屏实时视场 (S)";
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 14px;
            white-space: nowrap;
        }

        /* 粒子闪烁动画 */
        .scintillation {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--glow);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--glow), 0 0 30px var(--glow);
            filter: blur(1px);
            opacity: 0;
            animation: flash-anim 0.4s ease-out forwards;
        }

        @keyframes flash-anim {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(2); }
        }

        /* 底部信息 */
        #status-bar {
            left: 20px;
            bottom: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* 开关样式 */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            color: var(--accent);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            #stage { flex-direction: column; }
            #microscope-view { flex: 1; border-left: none; border-top: 5px solid #444; }
            #eyepiece { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div class="title-group">
        <h1>α粒子散射实验交互模拟</h1>
    </div>
    <div class="controls">
        <div id="status-bar">
            探测角度: <span id="angle-val">0</span>° 
            <small id="desc">正在接收正向穿透粒子...</small>
        </div>
        <label class="switch-container">
            <input type="checkbox" id="toggle-path"> 显示粒子轨迹
        </label>
        <div style="font-size: 0.8rem; color: #666;">← 拖动显微镜旋转</div>
        
    </div>
</div>

<div id="stage">
    <div id="microscope-view">
        <div id="eyepiece"></div>
    </div>
    <div id="experiment-view">
        <svg id="main-svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet" style="width:100%; height:100%;">
            <!-- 刻度轨道 -->
            <circle cx="300" cy="250" r="200" fill="none" stroke="#eee" stroke-width="1" stroke-dasharray="5,5" />
            
            <!-- 放射源 -->
            <g transform="translate(50, 225)">
                <rect x="0" y="0" width="50" height="50" fill="#7f8c8d" />
                <rect x="45" y="15" width="15" height="20" fill="#333" />
                <circle cx="25" cy="25" r="8" fill="#2c3e50" />
                <text x="0" y="-10" font-size="12" fill="#666">放射源 R</text>
            </g>

            <!-- 金箔 -->
            <g transform="translate(297, 180)">
                <rect x="0" y="0" width="6" height="140" fill="url(#goldGrad)" />
                <text x="-10" y="-15" font-size="12" font-weight="bold" fill="#b8860b">金箔 F</text>
            </g>

            <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#d4af37" />
                    <stop offset="50%" style="stop-color:#f1c40f" />
                    <stop offset="100%" style="stop-color:#d4af37" />
                </linearGradient>
            </defs>

            <!-- 粒子层 -->
            <g id="particle-layer"></g>

            <!-- 显微镜组 -->
            <g id="m-group" style="cursor: grab;">
                <circle cx="300" cy="250" r="205" fill="none" stroke="transparent" stroke-width="40" />
                <g id="m-body" transform="translate(300, 250)">
                    <line x1="0" y1="0" x2="200" y2="0" stroke="#ddd" stroke-width="1" stroke-dasharray="4" />
                    <rect x="180" y="-12" width="60" height="24" rx="3" fill="#444" />
                    <rect x="240" y="-16" width="12" height="32" rx="2" fill="#222" />
                    <!-- 探测屏 S -->
                    <ellipse cx="180" cy="0" rx="4" ry="15" fill="#9ff" />
                    <text x="195" y="-20" font-size="11" fill="#444">显微镜 M</text>
                </g>
            </g>
        </svg>
    </div>
</div>

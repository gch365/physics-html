            box-shadow: 0 4px 8px rgba(0,0,0,0.1);

            flex: 3;
            padding: 20px;

            background-color: #e9f5ff;
        }

            padding: 20px;
            background-color: #fafafa;

            height: 100px;
            border-bottom: 2px solid #555;
            margin-top: 100px;
        }

            background-repeat: no-repeat;

    <h1>追及问题动态模拟</h1>

    <div class="main-container">
        <div class="simulation-area" id="simulationArea">
            <div class="track">
                <div class="car" id="car1">
                    <span class="info-label" id="car1Info">v=0 m/s</span>
                </div>
                <div class="car" id="car2">
                    <span class="info-label" id="car2Info">v=0 m/s</span>
                </div>
                <div class="distance-marker" id="distanceMarker">
                    <span id="distanceLabel">Δx = 0 m</span>
                </div>
            </div>
        </div>
        <div class="controls-area">
            <h2>参数控制区</h2>
            <div class="control-group car1">
                <h3>小车1 (蓝色，被追赶者)</h3>
                <label for="v0_1">初速度 (m/s):</label>
                <input type="number" id="v0_1" value="10"><br>
                <label for="a_1">加速度 (m/s²):</label>
                <input type="number" id="a_1" value="0"><br>
            </div>
            <div class="control-group car2">
                <h3>小车2 (红色，追赶者)</h3>
                <label for="x0_2">初始距离 (m):</label>
                <input type="number" id="x0_2" value="100"><br>
                <label for="v0_2">初速度 (m/s):</label>
                <input type="number" id="v0_2" value="20"><br>
                <label for="a_2">加速度 (m/s²):</label>
                <input type="number" id="a_2" value="0"><br>
            </div>
            <div class="action-buttons">
                <button id="startBtn">启动</button>
                <button id="pauseBtn">暂停</button>
                <button id="resetBtn">重置</button>
            </div>
        </div>
    </div>

    <div class="graphs-area">
        <div class="graph-container">
            <h3>v-t (速度-时间) 图像</h3>
            <canvas id="vtCanvas" width="600" height="400"></canvas>
        </div>
        <div class="graph-container">
            <h3>x-t (位移-时间) 图像</h3>
            <canvas id="xtCanvas" width="600" height="400"></canvas>
        </div>
    </div>

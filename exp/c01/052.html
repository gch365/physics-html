<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">
    <meta name="author" content="物理仿真实验室">
    <!-- 头部文件结束 -->
    <title>宇宙速度教学演示——物理仿真实验室|52</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --v-color: #27ae60;
            --f-color: #e74c3c;
            --panel-bg: #fdfdfd;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Segoe UI", "PingFang SC", sans-serif;
            overflow: hidden; background: #fff;
        }

        .layout { display: flex; height: 100vh; }

        /* 左侧面板 */
        .sidebar {
            width: 380px; background: var(--panel-bg); border-right: 1px solid #ddd;
            padding: 20px; box-sizing: border-box; overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 100;
        }

        /* 仿真区 */
        .simulation { flex-grow: 1; position: relative; background: #FFFFFF; }

        h2 { font-size: 1.3rem; margin: 0; color: var(--primary); border-left: 5px solid var(--accent); padding-left: 10px; }
        .card { background: white; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: #666; }
        
        select, input[type="range"] { width: 100%; margin-bottom: 10px; }
        .val-display { display: flex; justify-content: space-between; font-family: monospace; color: var(--accent); font-weight: bold; }

        .btn-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button {
            padding: 10px; border: none; border-radius: 4px; cursor: pointer;
            font-weight: bold; transition: 0.2s; background: var(--accent); color: white;
        }
        button:hover { filter: brightness(1.1); }
        button.action { background: #8e44ad; grid-column: span 2; }
        button.reset { background: #95a5a6; }
        button.clear-trail { background: #e67e22; grid-column: span 2; }

        /* 星球百科样式 */
        .planet-facts { font-size: 0.8rem; line-height: 1.6; color: #444; margin-top: 5px; }
        .fact-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #eee; }

        #live-data {
            position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7);
            padding: 15px; border-radius: 8px; color: #fff; font-family: monospace;
            pointer-events: none; border: 1px solid #444; line-height: 1.5;
        }

        @media (max-width: 768px) {
            .layout { flex-direction: column; }
            .sidebar { width: 100%; height: 45%; }
            .simulation { height: 55%; }
        }
    </style>
</head>
<body>

<div class="layout">
    <main class="simulation">
        <svg id="canvas" viewBox="-500 -500 1000 1000" width="100%" height="100%">
            <!-- 剪切路径：确保星球图片显示为圆形 -->
            <defs>
                <clipPath id="circle-clip">
                    <circle cx="0" cy="0" r="150" />
                </clipPath>
                <marker id="head-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 z" fill="#27ae60" />
                </marker>
                <marker id="head-f" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                    <path d="M0,0 L0,8 L8,4 z" fill="#e74c3c" />
                </marker>
            </defs>

            <g id="viewport">
                <!-- 星球 -->
                <!-- 备用圆形（图片加载前显示） -->
                <circle id="planet-color" cx="0" cy="0" r="150" fill="#333" />
                <!-- 星球图片 -->
                <image id="planet-texture" x="-150" y="-150" width="300" height="300"  xlink:href="url(#circle-clip)" preserveAspectRatio="xMidYMid slice" />
                
                <!-- 山峰 -->
                <polygon id="mountain" fill="#7f8c8d" />
                
                <!-- 物体 -->
                <circle id="ball" cx="0" cy="0" r="5" fill="#000000" stroke="#000" stroke-width="1" />
                
                <!-- 动态矢量 -->
                <line id="vec-v" stroke="#27ae60" stroke-width="3" marker-end="url(#head-v)" />
                <line id="vec-f" stroke="#e74c3c" stroke-width="3" marker-end="url(#head-f)" />

                <!-- 历史轨迹层 (放在最上面) -->
                <g id="history-layer"></g>
                
                <!-- 当前运行轨迹 -->
                <polyline id="active-trail" fill="none" stroke="#ff0000" stroke-width="2.5" />
            </g>
        </svg>

        <div id="live-data">
            轨道高度: <span id="cur-h">0</span> km<br>
            实时速度: <span id="cur-v">0</span> km/s<br>
            向心加速度: <span id="cur-a">0</span> m/s²<br>
            运行状态: <span id="stat-status">就绪</span>
        </div>
    </main>
    <aside class="sidebar">
        <h2>宇宙速度模拟</h2>

        <!-- 2. 发射设置 -->
        <div class="card">
            <label>山峰高度 (km)</label>
            <div class="val-display"><span id="lbl-h">0</span> km</div>
            <input type="range" id="in-h" min="0" max="10000" value="0">
            
            <label>初速度 (km/s)</label>
            <div class="val-display"><span id="lbl-v">7.91</span> km/s</div>
            <input type="range" id="in-v" min="0" max="30" step="0.01" value="7.91">
            
            <div class="btn-stack">
                <button class="action" onclick="setCircularSpeed()">设为当前高度圆轨道速度</button>
                <button onclick="launch()">发射</button>
                <button class="reset" onclick="resetSim()">重置位置</button>
                <button class="clear-trail" onclick="clearAllTrails()">清除所有历史轨迹</button>
            </div>
        </div>
        
        <!-- 1. 选择星球 -->
        <div class="card">
            <label>中心天体</label>
            <select id="sel-planet"></select>
            <div id="planet-facts" class="planet-facts"></div>
        </div>

        

        <!-- 3. 显示设置 -->
        <div class="card">
            <label>视觉辅助</label>
            <label style="font-weight: normal;"><input type="checkbox" id="chk-img" checked> 显示星球实拍贴图</label>
            <label style="font-weight: normal;"><input type="checkbox" id="chk-v" checked> <span style="color:var(--v-color)">速度矢量 (切线方向)</span></label>
            <label style="font-weight: normal;"><input type="checkbox" id="chk-f" checked> <span style="color:var(--f-color)">引力矢量 (指向地心)</span></label>
        </div>

        <!-- 4. 环境控制 -->
        <div class="card">
            <label>画面缩放</label>
            <input type="range" id="in-zoom" min="0.1" max="4" step="0.1" value="1.2">
            <label>演化倍率 (建议 60-120)</label>
            <input type="range" id="in-warp" min="1" max="300" value="60">
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
    </aside>
</div>

    <title>光的干涉——物理仿真实验室|87</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            min-height: 600px;
        }

        /* 左侧控制面板 */
        .controls {
            width: 320px;
            background-color: var(--panel-color);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            overflow-y: auto;
            z-index: 10;
        }

        h1 { font-size: 1.5rem; color: var(--accent-color); margin-top: 0; }
        .control-group { margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .value-disp { float: right; color: var(--accent-color); font-weight: bold; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1;
            padding: 8px;
            cursor: pointer;
            background: #444;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button.active { background: var(--accent-color); }

        /* 右侧演示区 */
        .simulation {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            background: #000;
            position: relative;
        }

        .view-title {
            position: absolute;
            left: 20px;
            font-size: 0.8rem;
            color: #888;
            pointer-events: none;
        }

        /* 顶部波阵面模拟区 */
        #ray-view {
            flex: 0.6; 
            min-height: 200px;
            position: relative;
            border-bottom: 1px solid #222;
        }

        /* 底部干涉图样区 */
        #pattern-view {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        canvas { max-width: 100%; border-radius: 4px; }

        /* 响应式调整 */
        @media (max-width: 850px) {
            .container { flex-direction: column; height: auto; }
            .controls { width: 100%; box-sizing: border-box; }
            #ray-view { height: 300px; flex: none; }
            #pattern-view { height: 200px; flex: none; }
        }

        .formula { font-style: italic; font-family: "Times New Roman", serif; text-align: center; font-size: 1.1rem; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- 演示区域 -->
    <div class="simulation">
        <div id="ray-view">
            <!-- <span class="view-title" style="top: 1px;">光路结构演示 (Top View)</span> -->
            <svg id="svg-canvas" width="100%" height="100%"></svg>
        </div>
        <div id="pattern-view">
            <!-- <span class="view-title" style="top: 1px;">光屏干涉图样 (Screen View)</span> -->
            <canvas id="screen-canvas"></canvas>
        </div>
    </div>
    <!-- 控制面板 -->
    <div class="controls">
        <h1>光的干涉</h1>
        <div class="control-group">
            <label>光源模式</label>
            <div class="btn-group">
                <button id="btn-mono" class="active" onclick="setMode('mono')">单色光</button>
                <button id="btn-white" onclick="setMode('white')">白光</button>
            </div>
            <div id="mono-controls">
                <label>波长 λ <span id="lambda-val" class="value-disp">550 nm</span></label>
                <input type="range" id="lambda" min="380" max="750" value="550">
            </div>
        </div>

        <div class="control-group">
            <label>光强 Intensity <span id="intensity-val" class="value-disp">80%</span></label>
            <input type="range" id="intensity" min="10" max="100" value="80">
        </div>

        <div class="control-group">
            <label>单缝 S1 宽度 <span id="s1-val" class="value-disp">0.1 mm</span></label>
            <input type="range" id="s1w" min="0.05" max="0.3" step="0.01" value="0.1">
            <label>S1 到 S2 距离 <span id="l1-val" class="value-disp">20 cm</span></label>
            <input type="range" id="l1" min="10" max="50" value="20">
        </div>

        <div class="control-group">
            <label>双缝 S2 间距 d <span id="d-val" class="value-disp">0.25 mm</span></label>
            <input type="range" id="slit-d" min="0.1" max="0.8" step="0.01" value="0.25">
            <label>S2 到屏距离 L <span id="l2-val" class="value-disp">1.0 m</span></label>
            <input type="range" id="l2" min="0.5" max="5" step="0.1" value="1.0">
        </div>
        <p class="formula">Δx = (L/d) · λ</p>
        <div id="scale-info" style="font-size: 1rem; margin-top: 5px; "></div>
        <div style="font-size: 1rem; ">
            注意：为方便观察，几何尺寸比例经过微调，干涉条纹计算基于物理公式。
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

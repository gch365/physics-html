    <title>旋转圆模型——物理仿真实验室|48</title>
    <style>
        :root {
            --sidebar-width: 320px;
            --primary: #2196F3;
            --accent: #FF5722;
            --highlight: #E91E63;
            --bg: #f8f9fa;
            --panel-bg: white;
            --text-color: #333;
            --sub-text-color: #666;
            --border-color: #eee;
        }

        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg); overflow: hidden;
        }

        .container { display: flex; width: 100vw; height: 100vh; }
        @media (max-width: 850px) {
            .container { flex-direction: column; }
            .sidebar { width: 100% !important; height: 40% !important; overflow-y: auto; }
            .canvas-area { height: 60% !important; }
        }

        .sidebar {
            width: var(--sidebar-width); height: 100%;
            background: var(--panel-bg); box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            padding: 15px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto;
        }

        h1 { font-size: 1.1rem; margin: 0 0 5px 0; color: var(--text-color); border-left: 5px solid var(--primary); padding-left: 10px; }
        
        .data-panel {
            background: #e3f2fd;
            color: #1a237e;
            padding: 12px; border-radius: 6px;
            font-family: 'Courier New', monospace; font-size: 0.85rem;
            line-height: 1.4; border: 1px solid #bbdefb;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .control-group { border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 8px; }
        .control-group label { display: block; font-size: 0.75rem; color: var(--sub-text-color); margin-bottom: 2px; }
        .val-text { float: right; color: var(--primary); font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; height: 4px; background: #e0e0e0; border-radius: 2px; outline: none; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: var(--primary); cursor: pointer;
        }

        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 5px; }
        .checkbox-group { display: flex; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--sub-text-color); cursor: pointer; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        button { padding: 10px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-launch { background: var(--primary); color: white; grid-column: span 2; }
        .btn-draw { background: #607d8b; color: white; }
        .btn-draw.active { background: var(--accent); }
        .btn-erase { background: #cfd8dc; color: #333; }
        .btn-reset { background: #ef5350; color: white; grid-column: span 2; }

        .tip { font-size: 0.7rem; color: #999; line-height: 1.4; margin-top: 10px; }

        .canvas-area { flex-grow: 1; position: relative; background: #fff; touch-action: none; }
        #svg-canvas { width: 100%; height: 100%; cursor: crosshair; display: block; }

        .mode-indicator {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            padding: 5px 15px; border-radius: 20px; background: rgba(0,0,0,0.7);
            color: white; font-size: 0.8rem; pointer-events: none; z-index: 5;
        }

        #guide-center { stroke: #FFC107; stroke-width: 1.5; stroke-dasharray: 4,4; }
        #guide-boundary { stroke: #4CAF50; stroke-width: 1.5; stroke-dasharray: 6,3; }
        #dist-line { stroke: #9e9e9e; stroke-width: 1; stroke-dasharray: 2,2; }
        #dist-value-text { fill: #666; font-size: 12px; }

        #hl-center { fill: none; stroke: var(--highlight); stroke-width: 2; }
        #hl-center-label { fill: var(--highlight); font-size: 13px; font-weight: bold; }
        #hl-v-vector { stroke: var(--accent); stroke-width: 3; }

        .b-field-label {
            position: absolute; top: 10px; right: 10px;
            font-size: 1.2rem; background: rgba(255,255,255,0.7);
            padding: 5px 10px; border-radius: 20px; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="canvas-area">
        <div id="mode-indicator" class="mode-indicator">模式：选择轨迹</div>
        <div id="b-field-indicator" class="b-field-label">B: ⊗</div>
        
        <svg id="svg-canvas">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)" />
                </marker>
                <pattern id="dot-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <circle cx="2" cy="2" r="1" fill="#ddd"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#dot-grid)" />
            <g id="aux-layer"></g>
            <g id="geometry-helpers">
                <circle id="guide-center" fill="none" />
                <circle id="guide-boundary" fill="none" />
                <line id="dist-line" />
                <text id="dist-value-text" style="display:none"></text>
            </g>
            <line id="barrier" stroke="#333" stroke-width="6" stroke-linecap="round" />
            <g id="tracks-layer"></g>
            <g id="highlight-elements">
                <circle id="hl-center" r="5" style="display:none" />
                <text id="hl-center-label" style="display:none"></text>
                <line id="hl-v-vector" marker-end="url(#arrowhead)" style="display:none" />
            </g>
            <circle id="source-point" r="10" fill="var(--accent)" cursor="move" />
        </svg>
    </div>
    <div class="sidebar">
        <h1>旋转圆模型</h1>

        <div class="btn-grid">
            <button class="btn-launch" onclick="startAnimationDemonstration()">演示粒子运动</button>
            <button class="btn-draw" id="btn-draw-mode" onclick="toggleDrawMode()">辅助线工具</button>
            <button class="btn-erase" onclick="clearAuxLines()">橡皮擦</button>
            <button class="btn-reset" onclick="resetScene()">重置场景</button>
        </div>
        <div class="data-panel" id="data-display"></div>

        <div class="control-group">
            <label>磁感应强度 B: <span class="val-text" id="b-val">0.5</span></label>
            <input type="range" id="b-slider" min="-2.0" max="2.0" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>初速度 v: <span class="val-text" id="v-val">80</span></label>
            <input type="range" id="v-slider" min="10" max="200" value="80">
        </div>

        <div class="control-group">
            <label>荷质比 q/m: <span class="val-text" id="qm-val">1.0</span></label>
            <input type="range" id="qm-slider" min="0.1" max="4.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>粒子数量: <span class="val-text" id="num-val">12</span></label>
            <input type="range" id="num-slider" min="1" max="120" value="12">
        </div>

        <div class="control-group">
            <label>挡板垂直偏移 (by): <span class="val-text" id="by-val">150</span></label>
            <input type="range" id="by-slider" min="-300" max="300" value="150">
            <label>挡板水平偏移 (bx): <span class="val-text" id="bx-val">0</span></label>
            <input type="range" id="bx-slider" min="-300" max="300" value="0">
            <label>挡板宽度: <span class="val-text" id="bw-val">250</span></label>
            <input type="range" id="bw-slider" min="0" max="600" value="250">
            <label>挡板旋转角度: <span class="val-text" id="ba-val">0</span>°</label>
            <input type="range" id="ba-slider" min="-180" max="180" value="0">
        </div>

        <div class="checkbox-grid">
            <label class="checkbox-group"><input type="checkbox" id="check-center" checked>圆心圆</label>
            <label class="checkbox-group"><input type="checkbox" id="check-boundary" checked>包络圆</label>
            <label class="checkbox-group"><input type="checkbox" id="check-dist" checked>距离标尺</label>
            <label class="checkbox-group"><input type="checkbox" id="check-type" checked>正电荷 (+q)</label>
        </div>
        
        <p class="tip">遵循左手定则：B>0 为 ⊗ (入)，B<0 为 ⊙ (出)。</p>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

</div>

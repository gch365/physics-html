    <title>炮舰射击(运动的合成与分解)——物理仿真实验室|57</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --v-boat: #2980b9;
            --v-rel: #e67e22;
            --v-abs: #27ae60;
            --disp: #8e44ad;
        }

        body {
            margin: 0; padding: 0; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* 控制面板 */
        #panel {
            background: #f1f3f5; padding: 12px 20px; border-bottom: 2px solid #dee2e6;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center; font-size: 13px; z-index: 100;
        }

        .control-group { display: flex; align-items: center; gap: 8px; border-right: 1px solid #ccc; padding-right: 12px; }
        .control-group:last-child { border-right: none; }

        input[type="number"] { width: 45px; padding: 3px; }
        button { padding: 5px 10px; cursor: pointer; border-radius: 4px; border: 1px solid #adb5bd; background: white; }
        button:hover { background: #e9ecef; }
        #fireBtn { background: var(--accent); color: white; border: none; font-weight: bold; }
        
        .auto-label { color: #d35400; font-weight: bold; }

        /* 画布区域 */
        #stage { flex: 1; position: relative; background: #fff; }
        canvas { display: block; }

        /* 解析框 */
        #solutionBox {
            position: absolute; right: 20px; top: 20px; width: 300px;
            background: rgba(255,255,255,0.98); padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid var(--v-abs);
            display: none; font-size: 13px; line-height: 1.5; z-index: 101;
        }

        .math-block { background: #f8f9fa; padding: 6px; border-radius: 4px; margin: 5px 0; font-family: 'Times New Roman', serif; }
        .msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 35px; font-weight: bold; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<div id="panel">
    <div class="control-group">
        <label>船速 v₁:</label><input type="number" id="v1Input" value="2.5" step="0.5">
        <label>射速 v₂:</label><input type="number" id="v2Input" value="6.0" step="0.5">
    </div>
    <div class="control-group">
        <label>角度:</label>
        <input type="range" id="angleRange" min="-60" max="60" value="0">
        <span id="angleText" style="width:30px">0°</span>
    </div>
    <div class="control-group">
        <label class="auto-label"><input type="checkbox" id="autoFireCheck"> 自动射击(到达正下方时)</label>
    </div>
    <div class="control-group">
        <button id="fireBtn">手动发射</button>
        <button id="resetBtn">重置</button>
        <button id="toggleSolution">解析</button>
        
    </div>
    <div class="control-group" style="font-size: 12px;">
        <label><input type="checkbox" id="checkTraj" checked> 轨迹</label>
        <label><input type="checkbox" id="checkRel"> 参考系连线</label>
        <label><input type="checkbox" id="checkVel" checked> 矢量</label>
        <label><input type="checkbox" id="checkDisp"> 位移分解</label>
    </div>
</div>

<div id="stage">
    <div id="msg" class="msg"></div>
    <canvas id="mainCanvas"></canvas>
    <div id="solutionBox">
        <h3 style="margin-top:0">物理定量分析</h3>
        <div id="calcParams" class="math-block"></div>
        <p><b>运动合成原理：</b></p>
        <div id="calcSpeed" class="math-block"></div>
        <p><b>命中分析：</b></p>
        <div id="calcHit" class="math-block"></div>
        <p style="font-size:12px; color:#666">注：当使用“自动射击”且角度为0°时，由于合速度偏东，炮弹将无法击中目标。</p>
    </div>
</div>

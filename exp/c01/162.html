<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <title>平行板电容器的电容——物理仿真实验室|162</title>
    <style>
        :root { --primary-color: #2c3e50; --accent-color: #e74c3c; --bg-color: #ffffff; --panel-bg: #f8f9fa; }
        /* 基础结构调整，去除 fixed 限制，改为流式布局 */
        body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background-color: var(--bg-color); color: #333; }
        .main-container { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
        .controls { width: 320px; background: var(--panel-bg); padding: 20px; border-right: 1px solid #ddd; overflow-y: auto; }
        .canvas-area { flex: 1; position: relative; background: white; display: flex; justify-content: center; align-items: center; }
        .control-group { margin-bottom: 20px; padding: 10px; border: 1px solid #eee; border-radius: 8px; background: white; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #34495e; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .value-display { float: right; color: var(--accent-color); font-weight: bold; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #3498db; color: white; cursor: pointer; font-size: 16px; margin-bottom: 10px; transition: 0.3s; }
        .btn:hover { background: #2980b9; } .btn.active { background: #27ae60; } .btn.danger { background: #e74c3c; }
        #sim-svg { width: 100%; height: 100%; max-width: 800px; max-height: 600px; }
        .plate { fill: #95a5a6; stroke: #34495e; stroke-width: 2; }
        .dielectric { fill: rgba(241, 196, 15, 0.3); stroke: #f39c12; stroke-dasharray: 4; }
        .wire { fill: none; stroke: #2c3e50; stroke-width: 2; }
        .charge-pos { fill: #e74c3c; font-size: 12px; font-weight: bold; }
        .charge-neg { fill: #3498db; font-size: 12px; font-weight: bold; }
        .field-line { stroke: #f39c12; stroke-width: 1.5; stroke-opacity: 0.6; }
        .ground-symbol { stroke: #2c3e50; stroke-width: 1.5; }
        .power-symbol { stroke: #2c3e50; stroke-width: 2; }
        .electrometer-base { fill: #34495e; }
        .electrometer-dial { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; }
        .needle { stroke: #c0392b; stroke-width: 3; stroke-linecap: round; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: 0 0; }
        /* 移动端适配 */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .controls { width: 100%; border-right: none; border-bottom: 1px solid #ddd; box-sizing: border-box; }
            .canvas-area { min-height: 300px; padding: 10px; }
            .btn { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="canvas-area">
        <svg id="sim-svg" viewBox="0 0 600 400">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/>
                </marker>
                <g id="ground-mark">
                    <line x1="0" y1="0" x2="0" y2="10" class="ground-symbol" />
                    <line x1="-8" y1="10" x2="8" y2="10" class="ground-symbol" />
                    <line x1="-5" y1="13" x2="5" y2="13" class="ground-symbol" />
                    <line x1="-2" y1="16" x2="2" y2="16" class="ground-symbol" />
                </g>
            </defs>

            <g id="field-lines-group"></g>

            <path id="wire-left" class="wire" d="M 100 200 L 180 200" />
            <path id="wire-right" class="wire" d="M 350 200 L 450 200" />
            <path id="wire-meter" class="wire" d="M 450 200 L 450 260" />

            <!-- 优化电源符号 -->
            <g id="power-symbol" class="power-symbol">
                <line x1="290" y1="0" x2="290" y2="20" stroke-width="4" />
                <line x1="300" y1="5" x2="300" y2="15" stroke-width="2" />
                <line x1="290" y1="10" x2="100" y2="10" />
                <line x1="100" y1="10" x2="100" y2="200" />
                <line x1="300" y1="10" x2="450" y2="10" />
                <line x1="450" y1="10" x2="450" y2="200" />
            </g>

            <!-- 左极板接地 -->
            <use id="ground-left" href="#ground-mark" x="185" y="310" />
            <!-- 静电计接地 -->
            <use id="ground-meter" href="#ground-mark" x="485" y="380" />
            
            <rect id="dielectric-slab" class="dielectric" x="200" y="100" width="0" height="200" rx="5" />
            <rect id="plate-left" class="plate" x="180" y="100" width="10" height="200" rx="2" />
            <rect id="plate-right" class="plate" x="340" y="100" width="10" height="200" rx="2" />

            <g id="charges-group-left"></g>
            <g id="charges-group-right"></g>

            <g id="electrometer" transform="translate(450, 320)">
                <path class="electrometer-base" d="M -55 0 A 55 55 0 0 0 55 0" fill="none" />
                <circle class="electrometer-base" cx="0" cy="-80" r="10" />
                <circle class="electrometer-dial" cx="0" cy="0" r="50" />
                <path class="electrometer-dial" d="M -40 0 A 40 40 0 0 1 40 0" fill="none" />

                <rect class="electrometer-base" x="-20" y="80" width="40" height="10" />
                <rect class="electrometer-base" x="-5" y="55" width="10" height="35" />
                <line id="meter-needle" class="needle" x1="0" y1="-40" x2="0" y2="40" />
                <circle fill="#2c3e50" cx="0" cy="0" r="4" />
            </g>
            <path id="wire-meter" class="wire" d="M 485 360 L 485 380" />
            <path id="wire-meter" class="wire" d="M 450 260 L 450 360" />
        </svg>
    </div>
    <div class="controls">
        <div align="center"><font size="+1"><b> 平行板电容器的决定因素</b></font></div> 
        <div class="control-group">
            <button id="powerBtn" class="btn">充电并断开电源 (Q恒定)</button>
            <label style="margin-top:10px;"><input type="checkbox" id="show-field"> 显示电场线</label>
        </div>
        <div class="control-group">
            <label>板间距离 (d) <span class="value-display" id="d-val">2.0 cm</span></label>
            <input type="range" id="slider-d" min="10" max="150" value="50">
        </div>
        <div class="control-group">
            <label>正对面积 (S) <span class="value-display" id="s-val">100%</span></label>
            <input type="range" id="slider-s" min="20" max="100" value="100">
        </div>
        <div class="control-group">
            <label>相对介电常数 (εr) <span class="value-display" id="e-val">1.0</span></label>
            <input type="range" id="slider-e" min="10" max="50" value="10">
        </div>
        <div class="control-group">
            <label>电源电动势 (E) <span class="value-display" id="v-val">10 V</span></label>
            <input type="range" id="slider-v" min="0" max="20" value="10">
        </div>
        <div id="data-panel" style="font-size: 14px; line-height: 1.6; color: #2c3e50;">
            <div>电容量 C ≈ <span id="c-data">1.00</span> pF</div>
            <div>电荷量 Q ≈ <span id="q-data">10.0</span> pC</div>
            <div>电压 U ≈ <span id="u-data">10.0</span> V</div>
            <div style="font-weight: bold; color: #e67e22;">场强 E ≈ <span id="ef-data">0.2</span> V/cm</div>
        </div>
        <button onclick="resetSim()" class="btn danger" style="margin-top: 20px;">重置实验</button>
        <div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

    </div>
</div>

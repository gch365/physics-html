    <div class="container">
        <div class="demo-area">
            <h2>小船渡河运动——演示区</h2>
            <canvas id="riverCanvas" width="600" height="400"></canvas>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #e74c3c;"></div>
                    <span>水流速度</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #2ecc71;"></div>
                    <span>船速</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #9b59b6;"></div>
                    <span>合速度</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #f39c12;"></div>
                    <span>运动轨迹</span>
                </div>
            </div>
            <div class="explanation">
                <h3>物理原理说明</h3>
                <p>小船渡河问题属于运动的合成与分解问题。船的实际运动（合运动）可以看作是船在静水中的运动（分运动）和水流运动（分运动）的合成。</p>
                <p>合速度 = 船速 + 水速（矢量相加）</p>
                <p>渡河时间 = 河宽 / 船速垂直于河岸的分量</p>
                <p>渡河位移 = 合速度 × 渡河时间</p>
            </div>
        </div>
        <div class="control-area">
            <h2>控制区</h2>
            <div class="control-group">
                <label for="waterSpeed">水流速度 (m/s)</label>
                <input type="range" id="waterSpeed" min="0" max="10" step="0.1" value="2">
                <div class="value-display">当前值: <span id="waterSpeedValue">2.0</span> m/s</div>
            </div>
            <div class="control-group">
                <label for="boatSpeed">船速大小 (m/s)</label>
                <input type="range" id="boatSpeed" min="0.5" max="10" step="0.1" value="3">
                <div class="value-display">当前值: <span id="boatSpeedValue">3.0</span> m/s</div>
            </div>
            <div class="control-group">
                <label for="boatAngle">船速方向 (度)</label>
                <input type="range" id="boatAngle" min="-90" max="90" step="1" value="30">
                <div class="value-display">当前值: <span id="boatAngleValue">30</span>° (0°表示船头正对河岸)</div>
            </div>
            <button id="startBtn">开始演示</button>
            <button id="resetBtn">重置</button>
            <div class="control-group">
                <h3>运动参数</h3>
                <p>河宽: 300 米</p>
                <p>渡河时间: <span id="crossingTime">0.00</span> 秒</p>
                <p>合速度大小: <span id="resultantSpeed">0.00</span> m/s</p>
                <p>合速度方向: <span id="resultantAngle">0.00</span>°</p>
                <p>实际位移: <span id="displacement">0.00</span> 米</p>
            </div>
        </div>
    </div>

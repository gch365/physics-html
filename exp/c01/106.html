    <title>观察布朗运动——物理仿真实验室|106</title>
    <style>
        :root {
            --accent-color: #2c3e50;
            --highlight: #3498db;
            --bg-body: #ffffff;
        }

        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-body);
            color: var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 95vw;
            height: 90vh;
            max-width: 1200px;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: 12px;
            border: 1px solid #eee;
        }

        .sidebar {
            flex: 0 0 320px;
            padding: 30px;
            background: #fcfcfc;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        h2 { margin: 0 0 10px 0; font-size: 1.3rem; border-left: 4px solid var(--highlight); padding-left: 10px; }
        .hint { font-size: 0.85rem; color: #666; line-height: 1.6; }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; }
        .control-group label span { color: var(--highlight); }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--highlight); }

        .btn-reset {
            padding: 12px;
            background: var(--highlight);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-reset:hover { background: #2980b9; }

        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #fff;
            user-select: none;
        }

        .scope-circle {
            position: relative;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            border: 15px solid #222;
            background: #000;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            cursor: crosshair;
        }

        canvas { position: absolute; top: 0; left: 0; }

        .osd {
            position: absolute;
            bottom: 20px;
            color: #888;
            font-size: 0.85rem;
            pointer-events: none;
            text-align: center;
        }

        @media (max-width: 800px) {
            body { overflow: auto; align-items: flex-start; }
            .container { flex-direction: column; height: auto; width: 100vw; border-radius: 0; }
            .sidebar { flex: none; width: auto; padding: 20px; border-right: none; border-bottom: 1px solid #eee; }
            .scope-circle { width: 300px; height: 300px; margin: 20px 0; border-width: 10px; }
            .main-view { height: 450px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-view">
        <div class="scope-circle" id="scope">
            <canvas id="bgLayer"></canvas>
            <canvas id="trailLayer"></canvas>
            <canvas id="particleLayer"></canvas>
        </div>
    </div>
    <div class="sidebar">
        <h2>布朗运动追踪</h2>
        <div class="control-group">
            <label>环境温度 (T) <span id="v-temp">25</span> °C</label>
            <input type="range" id="i-temp" min="0" max="100" value="25">
        </div>

        <div class="control-group">
            <label>炭粒直径 (d) <span id="v-size">4.0</span> μm</label>
            <input type="range" id="i-size" min="1" max="15" step="0.5" value="4">
        </div>

        <div class="control-group">
            <label>显微镜倍率 (M) <span id="v-mag">400</span> x</label>
            <input type="range" id="i-mag" min="100" max="1500" step="100" value="400">
        </div>

        <button class="btn-reset" onclick="resetTracking()">清除当前轨迹</button>
        <p class="hint"><b>操作：</b><br>1. <b>点击</b>视野中任何一个小颗粒即可开始追踪其无规则运动轨迹。<br>2. <b>拖动</b>画面可观察载玻片的不同区域。</p>
        <div class="hint" style="margin-top:20px; padding-top:15px; border-top:1px dashed #ddd;">
            <strong>物理原理提示：</strong>
            <br>1. 颗粒越小，运动越明显。
            <br>2. 温度越高，运动越明显。
            <br>3. 布朗运动不是分子的运动，而是分子无规则运动的反映。观察到的折线并不是分子的运动轨迹，而是固体微粒在大量液体分子撞击下，每隔一定时间的位置连线。
        </div>
    <!-- 尾部文件开始 -->
<footer>

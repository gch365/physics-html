        </div>

        <div class="group">
            <label>速度 v₀ & 入射角 α</label>

                <span class="val" id="v0_txt">12.0</span>

        <h2>辅助分析</h2>

            <label class="check-item"><input type="checkbox" id="showO2" checked> 轨迹圆心 O₂</label>
            <label class="check-item"><input type="checkbox" id="showLine" checked> 双心连线 (O₁O₂)</label>

        </div>

        
        <h2>历史版本：<a href="index1.php">V1.0版</a></h2>
        <h2>教学提示</h2>
        当入射角为 0° 时（速度方向指向圆心），观察出射速度的反向延长线。系统会自动绘制辅助线以验证几何关系。<br>
        <h2>几何关系说明</h2>
            1. 当 α=0 时，轨迹圆心在切线上。<br>
            2. 磁场圆心 O₁ 到入射/出射点距离相等。<br>
            3. O₁O₂ 是入射点与出射点连线的中垂线。

    <title>核反应控制及链式反应——物理仿真实验室|132</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-color: #1e1e1e;
            --u-color: #39ff14; /* 荧光绿 */
            --cd-color: #bdc3c7;
            --n-color: #ffffff;
            --danger: #ff0000;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: #f0f0f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container { display: flex; width: 100%; height: 100%; }

        @media (max-width: 900px) {
            .container { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100% !important; border-right: none; height: auto !important; }
            .main-sim { height: 50vh !important; flex: none; }
        }

        /* 侧边控制台 */
        .sidebar {
            width: 380px;
            background: var(--panel-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px solid #333;
            box-sizing: border-box;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 10px 0; color: var(--u-color); font-size: 1.4em; border-left: 4px solid var(--u-color); padding-left: 10px; }

        .stat-card {
            background: #000;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #444;
        }

        .stat-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95em; }
        .stat-val { font-family: 'Consolas', monospace; color: #00d1ff; font-weight: bold; }
        
        .status-badge {
            padding: 5px; border-radius: 4px; font-size: 0.85em; font-weight: bold;
            text-align: center; margin-top: 10px; transition: 0.3s;
        }
        .status-sub { background: #333; color: #888; }
        .status-super { background: var(--danger); color: #fff; box-shadow: 0 0 15px rgba(255,0,0,0.4); }

        .control-block { background: #2c2c2c; padding: 5px; border-radius: 8px; }
        label { display: block; margin-bottom: 10px; font-size: 0.9em; color: #ccc; }
        input[class="rangeu"] { width: 100%; cursor: pointer; accent-color: var(--u-color); }
        input[class="rangecd"] { width: 100%; cursor: pointer; accent-color: var(--cd-color); }

        .btn-row { display: flex; gap: 10px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold; font-size: 0.9em; transition: 0.2s;
        }
        .btn-main { background: #27ae60; color: white; }
        .btn-inject { background: #e67e22; color: white; }
        .btn-reset { background: #c0392b; color: white; }
        button:hover { filter: brightness(1.2); }

        /* 图表区 */
        .chart-area {
            flex: 1; min-height: 200px; background: #000; border-radius: 8px;
            position: relative; border: 1px solid #333; margin-top: 10px;
        }
        canvas#chartCanvas { width: 100%; height: 100%; }
        .chart-label { position: absolute; top: 8px; left: 10px; font-size: 11px; color: #666; pointer-events: none; }

        /* 右侧模拟区 */
        .main-sim { flex: 1; position: relative; background: #000; }
        canvas#simCanvas { width: 100%; height: 100%; }

        .legend {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; font-size: 0.85em;
            border: 1px solid #333;
        }
        .leg-i { display: flex; align-items: center; margin-bottom: 5px; }
        .leg-dot { width: 12px; height: 12px; margin-right: 10px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-sim" id="sim-parent">
        <canvas id="simCanvas"></canvas>
        <div class="legend" style="display: none;">
            <div class="leg-i"><div class="leg-dot" style="background:var(--u-color)"></div> 铀-235 燃料棒</div>
            <div class="leg-i"><div class="leg-dot" style="background:var(--cd-color)"></div> 镉控制棒 (吸中子)</div>
            <div class="leg-i"><div class="leg-dot" style="background:var(--n-color); border-radius:50%"></div> 中子 (Neutron)</div>
        </div>
    </div>
    <div class="sidebar">
        <h2>核反应控制仿真</h2>
        <div class="stat-card">
            <div class="stat-line"><span>反应堆铀质量:</span><span id="val-mass" class="stat-val">0.00 kg</span></div>
            <div class="stat-line"><span>中子数量:</span><span id="val-neutrons" class="stat-val">0</span></div>
            <div id="status-display" class="status-badge status-sub">次临界状态 (反应会熄灭)</div>
        </div>
        <div class="btn-row">
            <button class="btn-main" id="btn-run">开始/暂停</button>
            <button class="btn-inject" onclick="injectNeutron()">注入单中子</button>
        </div>
        <div class="control-block">
            <label>铀-235 燃料棒插入深度: <span id="label-uranium">50</span>% | <span style="font-size: 10px; color: #666; margin-top:5px">临界质量阈值: 150.00 kg</span></label>
            <input type="range" class="rangeu" id="input-uranium" min="0" max="100" value="50">
            
        </div>

        <div class="control-block">
            <label>镉棒(控制棒,吸中子) 插入深度: <span id="label-cadmium">80</span>%</label>
            <input type="range" class="rangecd" id="input-cadmium" min="0" max="100" value="80">
        </div>
        <div class="btn-row">
            <button class="btn-reset" id="btn-reset"><font size="+2">紧急停堆 / 重置</font></button>
        </div>
        

        <div class="chart-area">
            <span class="chart-label">中子数(N) - 时间(t) 曲线</span>
            <canvas id="chartCanvas"></canvas>
        </div>
        <div class="control-block">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

    </div>
</div>

    <title>放大法观察桌面的微小形变——物理仿真实验室|126</title>
    <style>
        :root {
            --primary: #2c3e50;

        header {

        }

        .container {
            display: flex;

            padding: 15px;
            gap: 15px;
            overflow: hidden;
        }

        @media (max-width: 850px) {
            .container { flex-direction: column; overflow-y: auto; }

        }

        .panel {
            flex: 1;

            flex: 2;
            background: white;

<body>

<header>
    <h2 style="margin:0">实验：通过平面镜观察桌面的微小形变</h2>
</header>

<div class="container">

    <div class="visual-area">
        <svg id="main-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
            <!-- 1. 桌腿（底层） -->
            <rect x="180" y="380" width="20" height="100" fill="var(--table-dark)" />
            <rect x="600" y="380" width="20" height="100" fill="var(--table-dark)" />

            <!-- 2. 刻度尺 -->
            <rect x="740" y="50" width="15" height="350" fill="#eee" stroke="#666" />
            <g id="ticks" stroke="#333" stroke-width="1"></g>

            <!-- 3. 桌面（受压弯曲部分） -->
            <path id="table-surf" d="" stroke="var(--table-wood)" stroke-width="16" fill="none" stroke-linecap="round" />

            <!-- 4. 压力箭头 -->
            <g id="f-arrow" opacity="0">
                <line x1="400" y1="280" x2="400" y2="335" stroke="var(--accent)" stroke-width="4" marker-end="url(#head)" />
                <text x="415" y="320" fill="var(--accent)" class="label" font-size="20">F</text>
            </g>

            <!-- 5. 镜子 M 和 N（随动系统） -->
            <g id="mirrorN">
                <rect x="-15" y="0" width="30" height="4" fill="#7f8c8d" />
                <rect x="-2" y="-50" width="4" height="50" fill="#bdc3c7" />
                <rect x="-4" y="-120" width="8" height="75" fill="#3498db" stroke="#2c3e50" />
                <text x="-35" y="-100" class="label" font-size="22">N</text>
            </g>

            <g id="mirrorM">
                <rect x="-15" y="0" width="30" height="4" fill="#7f8c8d" />
                <rect x="-2" y="-50" width="4" height="50" fill="#bdc3c7" />
                <rect x="-4" y="-120" width="8" height="75" fill="#3498db" stroke="#2c3e50" />
                <text x="15" y="-100" class="label" font-size="22">M</text>
            </g>

            <!-- 6. 光路系统 -->
            <path id="ray" d="" fill="none" stroke="var(--laser)" stroke-width="2" filter="drop-shadow(0 0 2px #ff0055aa)" />
            <circle id="spot" r="5" fill="var(--laser)" opacity="0">
                <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite" />
            </circle>

            <defs>
                <marker id="head" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)" />
                </marker>
            </defs>
        </svg>
    </div>
    <div class="panel">
        <h3 style="margin-top:0">操作面板</h3>
        <p>调节压力F并观察右侧光路变化：</p>
        
        <div class="slider-box">
            <label>施加压力F: <b id="f-val" style="color:var(--accent)">0</b> N</label>
            <input type="range" id="force-slider" min="0" max="58" value="0">
        </div>

        <button onclick="playAnimation()">演示光线传播过程</button>

        <div class="theory-card">
            <strong>实验原理：放大法</strong><br>
            本实验是物理学中“微小量放大”的经典案例：
            <ul>
                <li><strong>角度放大</strong>：桌面发生微小弯曲时，平面镜随之倾斜α角。根据反射定律，反射光线相对于入射光线的偏转角为2α。</li>
                <li><strong>光路放大</strong>：利用长距离的光轴，将角度变化转化为刻度尺上明显的线位移Δy。</li>
                <li><strong>串联放大</strong>：光线经 M、N 两次反射，进一步提高了观察的灵敏度。</li>
            </ul>

        </div>
        <div class="theory-card">

<footer>

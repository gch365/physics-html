    <title>向心加速度公式的推导——物理仿真实验室|112</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --vector-v: #27ae60;    
            --vector-dv: #e67e22;   
            --vector-an: #e74c3c;   
            --vector-fn: #8e44ad;   
            --geo-color: #3498db;   
            --bg-color: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .container { display: flex; flex-direction: row; height: 100vh; width: 100vw; }

        .controls {
            width: 360px; padding: 15px;
            background: #f8f9fa; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 10; overflow-y: auto;
        }

        .canvas-area {
            flex-grow: 1; position: relative;
            display: flex; justify-content: center; align-items: center;
            touch-action: none; background: white;
        }

        h1 { font-size: 1.1rem; color: var(--primary-color); margin: 5px 0; }
        .control-group {
            background: white; padding: 10px;
            border-radius: 6px; border: 1px solid #eee;
        }
        .control-group h2 { font-size: 0.85rem; margin: 0 0 8px 0; color: #666; border-bottom: 1px solid #eee; padding-bottom: 3px; }

        label {
            display: flex; align-items: center; gap: 8px;
            cursor: pointer; font-size: 0.82rem; margin-bottom: 4px;
        }

        .slider-group { margin-bottom: 10px; }
        .slider-group span { font-size: 0.8rem; color: #333; display: block; margin-bottom: 2px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .formula-box {
            background: #fffbe6; padding: 10px;
            border: 1px dashed #ffe58f; border-radius: 4px;
            font-size: 0.8rem; line-height: 1.4;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .controls { width: 100%; height: 45%; border-right: none; border-bottom: 1px solid #ddd; }
            .canvas-area { height: 55%; }
        }

        .point-handle { cursor: grab; stroke: rgba(0,0,0,0.05); stroke-width: 15px; }
        .point-handle:active { cursor: grabbing; }
        svg text { user-select: none; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="canvas-area">
        <svg id="mainSvg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 细长箭头定义 -->
                <marker id="arrowV" markerWidth="13" markerHeight="13" refX="12" refY="2.5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L12,2.5 L0,5 L2,2.5 Z" fill="#27ae60" />
                </marker>
                <marker id="arrowDelta" markerWidth="13" markerHeight="13" refX="12" refY="2.5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L12,2.5 L0,5 L2,2.5 Z" fill="#e67e22" />
                </marker>
                <marker id="arrowAn" markerWidth="13" markerHeight="13" refX="12" refY="2.5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L12,2.5 L0,5 L2,2.5 Z" fill="#e74c3c" />
                </marker>
                <marker id="arrowFn" markerWidth="13" markerHeight="13" refX="12" refY="2.5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L12,2.5 L0,5 L2,2.5 Z" fill="#8e44ad" />
                </marker>
                <marker id="arrowVAux" markerWidth="13" markerHeight="13" refX="12" refY="2.5" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L12,2.5 L0,5 L2,2.5 Z" fill="#95a5a6" />
                </marker>
            </defs>

            <!-- 轨道辅助线 -->
            <circle id="orbitA" cx="300" cy="300" r="180" fill="none" stroke="#eee" stroke-width="1" stroke-dasharray="5,5" />
            <circle id="orbitB" cx="300" cy="300" r="180" fill="none" stroke="#eee" stroke-width="1" stroke-dasharray="5,5" />
            <circle cx="300" cy="300" r="4" fill="#333" />
            <text x="285" y="325" font-size="14">O</text>

            <!-- 几何绘图 -->
            <g id="geoLayer">
                <line id="radiusA" x1="300" y1="300" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4" />
                <line id="radiusB" x1="300" y1="300" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4" />
                <line id="chordAB" stroke="#2c3e50" stroke-width="1.5" opacity="0" />
                <path id="arcAB" fill="none" stroke="#3498db" stroke-width="3" opacity="0" />
                <path id="angleArc" fill="none" stroke="#333" stroke-width="1" opacity="0" />
                <text id="txtAngle" font-size="12" opacity="0">Δθ</text>
            </g>

            <!-- 矢量层 -->
            <g id="vectorLayer">
                <line id="vecVA" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowV)" opacity="0" />
                <line id="vecVB" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowV)" opacity="0" />
                <line id="vecVAPrime" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowVAux)" opacity="0" />
                <line id="vecDeltaV" stroke="#e67e22" stroke-width="2" marker-end="url(#arrowDelta)" opacity="0" />
                <line id="vecAnA" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowAn)" opacity="0" />
                <line id="vecAnB" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowAn)" opacity="0" />
                <line id="vecFnA" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowFn)" opacity="0" />
                <line id="vecFnB" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowFn)" opacity="0" />
            </g>

            <!-- 交互点 -->
            <circle id="pointA" cx="0" cy="0" r="8" fill="#3498db" class="point-handle" />
            <circle id="pointB" cx="0" cy="0" r="8" fill="#e74c3c" class="point-handle" />
            <text id="labelA" font-weight="bold" font-size="14">A</text>
            <text id="labelB" font-weight="bold" font-size="14">B</text>
            <text id="labelS" fill="#3498db" font-weight="bold" opacity="0">s</text>
        </svg>
    </div>
    <div class="controls">
        <h1>向心加速度公式推导</h1>

        <div class="control-group">
            <h2>几何关系控制</h2>
            <label><input type="checkbox" id="showRadius" checked> 1. 显示半径 OA, OB</label>
            <label><input type="checkbox" id="showChord"> 2. 连接弦 AB</label>
            <label><input type="checkbox" id="showArc"> 3. 标记弧 AB</label>
            <label><input type="checkbox" id="showAngle"> 4. 标出夹角 Δθ</label>
        </div>

        <div class="control-group">
            <h2>速度与变化量</h2>
            <label><input type="checkbox" id="showVelocity" checked> 5. 显示速度矢量 v<sub>A</sub>, v<sub>B</sub></label>
            <label><input type="checkbox" id="showDeltaV"> 6. 矢量平移探究 Δv</label>
        </div>

        <div class="control-group">
            <h2>力与加速度</h2>
            <label><input type="checkbox" id="showAcc"> 7. 向心加速度矢量 a<sub>n</sub></label>
            <label><input type="checkbox" id="showForce"> 8. 向心力矢量 F<sub>n</sub></label>
        </div>

        <div class="control-group">
            <h2>运动参数设置</h2>
            <div class="slider-group">
                <span>点 A 半径 (r<sub>A</sub>): <strong id="valRA">120</strong></span>
                <input type="range" id="rangeRA" min="50" max="250" value="120">
            </div>
            <div class="slider-group">
                <span>点 B 半径 (r<sub>B</sub></sub></sub>): <strong id="valRB">120</strong></span>
                <input type="range" id="rangeRB" min="50" max="250" value="120">
            </div>
        </div>

        <div class="formula-box">
            <strong>教学提示：</strong>当 r<sub>A</sub> = r<sub>B</sub> 时，三角形 OAB 与速度矢量三角形的相似，拖动 A、B 点，当 Δθ→0 时，弦AB ≈ 弧AB，且 Δv 的方向趋向于指向圆心。修改半径可演示不同轨道的情况。
        </div>
        <div class="formula-box" style="margin-top: 15px; font-size: 0.9rem; border-top: 1px solid #eee; pt: 10px;">
            <!-- 动态显示公式 -->
            当 Δθ 极小时：<br>
            <span class="formula">|Δv| ≈ v · Δθ</span><br>
            因为 <span class="formula">Δθ = ωΔt = (v/r)Δt</span><br>
            所以 <span class="formula">a = Δv/Δt = v²/r</span>
        </div>
        <div class="control-group">
        <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>        <!-- 尾部文件结束 -->

    <title>示波器与示波管原理——物理仿真实验室|103</title>
    <style>
        :root {
            --panel-color: #d8d3c5;
            --crt-glass: rgba(180, 210, 230, 0.2);
            --electron-color: #00ff41;
            --plate-y: #ff5722;
            --plate-x: #2196f3;
            --phosphor-bg: #1a2c2c;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #f0f0f0;
            overflow: hidden;
            user-select: none;
        }

        .main-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding: 10px;
            box-sizing: border-box;
            gap: 15px;
        }

        /* 左侧面板：J2459 仿真器 */
        .left-panel {
            flex: 0 0 420px;
            background: var(--panel-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 1px 1px 3px #fff;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border: 2px solid #bbb;
            position: relative;
        }

        /* 示波器屏幕 */
        .crt-frame {
            background: #222;
            padding: 12px;
            border-radius: 50%;
            border: 10px solid #999;
            width: 200px;
            height: 200px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px #000;
        }
        #oscilloscope-canvas {
            background: var(--phosphor-bg);
            border-radius: 50%;
            width: 200px;
            height: 200px;
        }

        /* 旋钮布局 */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 10px;
        }
        .knob-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #333;
        }
        /* 旋钮样式 */
        .knob {
            width: 42px;
            height: 42px;
            background: radial-gradient(circle at 30% 30%, #fff, #ddd 70%, #999);
            border-radius: 50%;
            border: 2px solid #888;
            margin: 5px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            width: 4px;
            height: 12px;
            background: #e91e63;
            border-radius: 2px;
            transform: translateX(-50%);
        }

        /* 接口部分 */
        .terminals {
            display: flex;
            justify-content: space-around;
            margin-top: auto;
            padding: 15px 5px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        .terminal-unit { cursor: pointer; text-align: center; flex: 1; }
        .jack {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 4px solid #333;
            margin: 0 auto;
            transition: transform 0.1s;
        }
        .jack.red { background: #d00; box-shadow: inset 0 0 5px #000; }
        .jack.black { background: #222; box-shadow: inset 0 0 5px #000; }
        .jack-label { font-size: 11px; margin-top: 5px; font-weight: bold;}
        .sig-status { font-size: 10px; color: #555; height: 14px; margin-top: 2px;}

        /* 右侧部分 */
        .right-panel {
            flex: 1;
            background: white;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .crt-structure-view {
            flex: 1;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            position: relative;
        }
        .status-display {
            background: #333;
            color: #0f0;
            padding: 8px 15px;
            font-family: monospace;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            .left-panel { flex: none; width: 100%; }
        }

        .power-btn-container { display: flex; align-items: center; gap: 8px; }
        .pwr-btn {
            width: 34px; height: 34px; border: 2px solid #666; cursor: pointer; border-radius: 4px;
            background: #eee; font-weight: bold;
        }
        .pwr-btn.on { background: #f00; color: white; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左侧：J2459 仿真器 -->
    <div class="left-panel">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
            <div>
                <strong style="font-size: 1.2rem; display: block;">J2459型</strong>
                <span style="font-size: 0.9rem; color: #666;">学生示波器 (仿真版)</span>
            </div>
            <div class="power-btn-container">
                <div id="pwr-led" style="width:12px; height:12px; background:#400; border-radius:50%;"></div>
                <button id="pwr-btn" class="pwr-btn">开</button>
            </div>
        </div>

        <div class="crt-frame">
            <canvas id="oscilloscope-canvas"></canvas>
        </div>

        <div class="controls-grid">
            <div class="knob-unit"><span>辉度</span><div class="knob" id="knob-intensity"></div></div>
            <div class="knob-unit"><span>聚焦</span><div class="knob" id="knob-focus"></div></div>
            <div class="knob-unit"><span>Y位移</span><div class="knob" id="knob-y-shift"></div></div>
            <div class="knob-unit"><span>X位移</span><div class="knob" id="knob-x-shift"></div></div>
            
            <div class="knob-unit"><span>Y增益</span><div class="knob" id="knob-y-gain"></div></div>
            <div class="knob-unit"><span>X增益</span><div class="knob" id="knob-x-gain"></div></div>
            <div class="knob-unit" style="grid-column: span 2;">
                <span id="sweep-display">扫描范围: 50Hz</span>
                <div class="knob" id="knob-sweep" style="width:50px; height:50px;"></div>
            </div>
        </div>

        <div class="terminals">
            <div class="terminal-unit" onclick="changeSignal('Y')">
                <div class="jack red"></div>
                <div class="jack-label">Y输入</div>
                <div id="y-sig-name" class="sig-status">正弦波</div>
            </div>
            <div class="terminal-unit">
                <div class="jack black"></div>
                <div class="jack-label">地</div>
                <div class="sig-status">GND</div>
            </div>
            <div class="terminal-unit" onclick="changeSignal('X')">
                <div class="jack red"></div>
                <div class="jack-label">X输入</div>
                <div id="x-sig-name" class="sig-status">内置扫描</div>
            </div>
        </div>
    </div>

    <!-- 右侧：示波管内部原理 -->
    <div class="right-panel">
        <h3 style="margin: 0 0 10px 0;">示波管 (CRT) 微观物理过程同步仿真</h3>
        <div class="status-display" id="status-display">电源：OFF</div>
        <div class="crt-structure-view">
            <svg id="crt-svg" width="100%" height="100%" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet">
                <!-- 示波管外壳 -->
                <path d="M50 150 L300 150 L600 50 L600 350 L300 250 L50 250 Z" fill="var(--crt-glass)" stroke="#999" stroke-width="2" />
                <!-- 电子枪组件 -->
                <g>
                    <rect x="60" y="185" width="30" height="30" fill="#555" />
                    <circle cx="90" cy="200" r="10" fill="#777" />
                    <text x="50" y="250" font-size="12" font-weight="bold">电子枪</text>
                </g>
                <!-- Y偏转板 -->
                <g id="y-plates">
                    <rect x="180" y="145" width="60" height="5" fill="var(--plate-y)" />
                    <rect x="180" y="250" width="60" height="5" fill="var(--plate-y)" />
                    <text x="175" y="135" font-size="12" fill="#e64a19" font-weight="bold">YY' 偏转板</text>
                </g>
                <!-- X偏转板 -->
                <g id="x-plates">
                    <rect x="320" y="160" width="10" height="80" fill="var(--plate-x)" opacity="0.8" />
                    <rect x="360" y="160" width="10" height="80" fill="var(--plate-x)" opacity="0.8" />
                    <text x="315" y="150" font-size="12" fill="#1976d2" font-weight="bold">XX' 偏转板</text>
                </g>
                <!-- 荧光屏 -->
                <ellipse cx="600" cy="200" rx="15" ry="148" fill="#222" />
                <!-- 电子流容器 -->
                <g id="electron-stream"></g>
            </svg>
        </div>
        <div style="margin-top:10px; font-size: 13px; line-height: 1.5; color: #444; background: #fff9c4; padding: 10px; border-radius: 5px;">
            <strong>操作指南：</strong><br/>
            1. 点击红色电源按钮开机。<br/>
            2. <b>鼠标点击旋钮并绕其中心拖动</b>可旋转调节。调节 Y 增益可观察右侧第一组极板间电子轨迹的变化。<br/>
            3. 点击底部的输入端子可循环切换信号类型（支持麦克风实时输入）。
        </div>
            <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

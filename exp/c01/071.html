    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>多用电表读数练习——物理仿真实验室|71</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            display: flex;
            width: 95vw;
            max-width: 1200px;
            height: 90vh; /* 固定高度防止页面变动 */
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* 左侧：表盘区 */
        .dial-side {
            flex: 1.3;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-right: 1px solid #eee;
        }

        .multimeter-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            aspect-ratio: 1.52;
        }

        .multimeter-wrapper img {
            width: 100%;
            display: block;
        }

        #pointer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            transform-origin: 50% 94%;
        }

        /* 右侧：交互区 */
        .control-side {
            flex: 0.7;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto; /* 只有右侧可滚动 */
        }

        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }

        .config-card {
            background: var(--bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .range-text {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--error);
            text-align: center;
            margin: 10px 0;
            min-height: 1.5em;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-mode { background: var(--accent); color: white; }
        .btn-mode:hover { background: #2980b9; }
        .btn-submit { background: var(--primary); color: white; width: 100%; font-size: 1.1em; }
        .btn-submit:hover { background: #1a252f; }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2em;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        /* 解析过程样式 */
        #analysis-area {
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            display: none; /* 初始隐藏 */
            line-height: 1.6;
            font-size: 0.95em;
        }

        .step-title { font-weight: bold; color: var(--primary); margin-top: 8px; display: block; }
        .correct-bg { background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; }
        .wrong-bg { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; }

        @media (max-width: 800px) {
            .main-container { flex-direction: column; height: auto; }
            .dial-side { border-right: none; border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <!-- 左侧：动态表盘 -->
    <div class="dial-side">
        <div class="multimeter-wrapper">
            <img src="dial.png" alt="多用电表表盘">
            <svg id="pointer" viewBox="0 0 756 498">
                <defs>
                    <dropShadow id="shadow" dx="2" dy="0" stdDeviation="1" flood-opacity="0.3"/>
                </defs>
                <line x1="378" y1="468" x2="378" y2="80" stroke="#e74c3c" stroke-width="3" filter="url(#shadow)" />
                <circle cx="378" cy="468" r="6" fill="#333" />
            </svg>
        </div>
        
    </div>

    <!-- 右侧：教学交互 -->
    <div class="control-side">
        <h2>多用电表读数练习</h2>
        
        <div class="config-card">
            <div style="font-size:0.9em; color:#666;">当前挡位：</div>
            <div id="range-display" class="range-text">请选择练习类型</div>
            <div class="btn-group">
                <button class="btn-mode" onclick="newQuestion('V')">直流电压题</button>
                <button class="btn-mode" onclick="newQuestion('A')">直流电流题</button>
                <button class="btn-mode" onclick="newQuestion('R')">欧姆电阻题</button>
                <button class="btn-mode" onclick="newQuestion('ALL')">随机混合题</button>
            </div>
        </div>

        <div id="input-area" style="display:none">
            <input type="text" id="user-ans" placeholder="请输入你的读数" autocomplete="off">
            <button class="btn-submit" onclick="submitAnswer()">提交并查看逻辑解析</button>
        </div>

        <div id="analysis-area"></div>
        <div>
            说明：指针位置根据物理规律动态映射；本程序还在调试中，<font color="red">你可以用它随机产生读数练习，但校对答案还有偏差，</font>，提交的判断结果读数仅供参考，具体还需要老师们自己判断。在两端（极大值或极小值附件）读数尚不准确，<font color="red">随机出题也尽量在三分之一到三分之二之间，多用电表在这附近也相对准确些</font>
        </div>
<!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

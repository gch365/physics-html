    <h1 align="center">斜面上的物体受力分析</h1>
    <div class="container">
        
        
        <div class="display-area">
            <canvas id="physicsCanvas" width="600" height="500"></canvas>
        </div>
        
        <div class="controls-area">
            <div class="controls">
                <label for="angle">斜面角度(θ):</label>
                <input type="range" id="angle" min="0" max="60" value="10" step="1">
                <span id="angleValue">10°</span>
            </div>
            
            <div class="controls">
                <label for="mass">物体质量(kg):</label>
                <input type="range" id="mass" min="1" max="10" value="2" step="0.1">
                <span id="massValue">2kg</span>
            </div>
            
            <div class="controls">
                <label for="muStatic">静摩擦系数(μₛ):</label>
                <input type="range" id="muStatic" min="0.1" max="1" value="0.5" step="0.05">
                <span id="muStaticValue">0.5</span>
            </div>
            
            <div class="controls">
                <label for="muKinetic">动摩擦系数(μₖ):</label>
                <input type="range" id="muKinetic" min="0.05" max="0.9" value="0.3" step="0.05">
                <span id="muKineticValue">0.3</span>
            </div>
            
            <div class="controls">
                <label for="showResultant">显示合力:</label>
                <label class="switch">
                    <input type="checkbox" id="showResultant">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="force-info">
                <h3>受力分析结果:</h3>
                <p id="forceInfo">正在计算...</p>
            </div>
        </div>
        
        <div class="info-area">
            
            
            <div class="explanation">
                <h3>物理原理说明:</h3>
                <p>1. <strong>重力(G)</strong>: 方向竖直向下，大小为 G = m·g</p>
                <p>2. <strong>支持力(N)</strong>: 方向垂直于斜面向上，大小为 N = m·g·cosθ</p>
                <p>3. <strong>摩擦力(f)</strong>: <span id="frictionType">静摩擦力</span>，方向沿斜面向上，大小为 <span id="frictionFormula">f = m·g·sinθ</span></p>
                <p>4. <strong>合力(R)</strong>: 支持力与摩擦力的矢量和，R = √(N² + f²)</p>
                <p>临界角度: θ<sub>临界</sub> = arctan(μₛ) = <span id="criticalAngle">26.6°</span></p>
            </div>
        </div>

    </div>

    <title>水平面匀速圆周运动模型——物理仿真实验室|65</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --force-color: #e74c3c;
            --velocity-color: #2ecc71;
            --bg-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 响应式布局：手机端上下排，PC端左右排 */
        @media (max-width: 768px) {
            main { flex-direction: column; overflow-y: auto; }
            #canvas-container { min-height: 350px; }
            .controls { width: 100% !important; border-right: none !important; border-top: 1px solid #ddd; }
        }

        /* 控制面板样式 */
        .controls {
            width: 350px;
            padding: 20px;
            background: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: bold;
            font-size: 0.9em;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }

        /* 数据显示面板 */
        .data-panel {
            margin-top: 20px;
            padding: 15px;
            background: #f1f8ff;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .data-item {
            margin-bottom: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }

        /* 仿真区域样式 */
        #canvas-container {
            flex: 1;
            position: relative;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 600px;
        }

        .formula-info {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <h2>水平面匀速圆周运动模型</h2>
</header>

<main>
    <!-- 右侧画布区 -->
    <section id="canvas-container">
        <svg viewBox="-250 -250 500 500" id="sim-svg">
            <!-- 坐标参考线 -->
            <line x1="-250" y1="0" x2="250" y2="0" stroke="#eee" stroke-width="1" />
            <line x1="0" y1="-250" x2="0" y2="250" stroke="#eee" stroke-width="1" />
            
            <!-- 圆周轨道 -->
            <circle id="orbit" cx="0" cy="0" r="100" fill="none" stroke="#ccc" stroke-dasharray="5,5" />
            
            <!-- 绳子 -->
            <line id="string" x1="0" y1="0" x2="100" y2="0" stroke="#34495e" stroke-width="2" />
            
            <!-- 向心力矢量 (红色) -->
            <line id="vec-force" x1="100" y1="0" x2="50" y2="0" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrow-red)" />
            
            <!-- 速度矢量 (绿色) -->
            <line id="vec-velocity" x1="100" y1="0" x2="100" y2="-50" stroke="#2ecc71" stroke-width="4" marker-end="url(#arrow-green)" />
            
            <!-- 中心点 -->
            <circle cx="0" cy="0" r="4" fill="#2c3e50" />
            
            <!-- 小球 -->
            <circle id="ball" cx="100" cy="0" r="12" fill="#3498db" />

            <!-- 箭头定义 -->
            <defs>
                <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c" />
                </marker>
                <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#2ecc71" />
                </marker>
            </defs>
        </svg>
    </section>
    <!-- 左侧控制区 -->
    <section class="controls">
        <div class="control-group">
            <label>轨道半径 (r): <span id="val-r">100</span> m</label>
            <input type="range" id="input-r" min="50" max="180" value="100">
        </div>

        <div class="control-group">
            <label>角速度 (ω): <span id="val-w">2.0</span> rad/s</label>
            <input type="range" id="input-w" min="0.5" max="5" step="0.1" value="2">
        </div>

        <div class="control-group">
            <label>小球质量 (m): <span id="val-m">1.0</span> kg</label>
            <input type="range" id="input-m" min="0.1" max="5" step="0.1" value="1">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="show-force" checked> 显示受力 (F)</label>
            <label><input type="checkbox" id="show-velocity" checked> 显示速度 (v)</label>
        </div>

        <div class="data-panel">
            <div class="data-item">线速度 v = <span id="data-v">0</span> m/s</div>
            <div class="data-item">角速度 ω = <span id="data-w">0</span> rad/s</div>
            <div class="data-item">向心加速度 aₙ = <span id="data-a">0</span> m/s²</div>
            <div class="data-item" style="color:var(--force-color)">向心力 Fₙ = <span id="data-f">0</span> N</div>
        </div>

        <div class="formula-info">
            注：俯视图。忽略空气阻力，绳子拉力提供向心力。<br>
            公式参考：v = ωr，F = mω²r
        </div>
        <br><br><br><br><br>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

</main>

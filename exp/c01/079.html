    <style>
        :root {
            --bg-color: #050505;
            --panel-color: #222;
            --text-color: #ddd;
            --accent-color: #007bff;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; }
        #app { display: flex; width: 100vw; height: 100vh; }

        #controls {
            width: 320px; background: var(--panel-color); padding: 15px;
            border-right: 1px solid #444; display: flex; flex-direction: column; overflow-y: auto;
        }
        h2 { font-size: 1.2rem; color: #fff; margin: 0 0 15px 0; border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
        
        .top-btns { margin-bottom: 15px; }
        .clear-btn { width: 100%; background: #555; margin-bottom: 10px; border: 1px solid #777; }
        .clear-btn:hover { background: #d32f2f; border-color: #ff5252; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button {
            padding: 10px 5px; background: #333; color: white; border: 1px solid #555;
            border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 0.9rem;
        }
        button:hover { background: var(--accent-color); }

        .inspector { background: #151515; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        label { display: block; font-size: 0.85rem; margin: 10px 0 5px; color: #bbb; }
        input[type="range"] { width: 100%; cursor: pointer; height: 20px; }
        .checkbox-group { display: flex; align-items: center; margin: 10px 0; gap: 8px; font-size: 0.9rem; }
        
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; }
        canvas { display: block; }

        @media (max-width: 768px) {
            #app { flex-direction: column-reverse; }
            #controls { width: 100%; height: 45%; border-right: none; border-top: 1px solid #444; }
        }
    </style>
</head>

<div id="app">
    <div id="controls">
        <h2>光学实验室 v3.2</h2>
        
        <div class="top-btns">
            <button class="clear-btn" onclick="clearAll()">🗑 清空全部场景</button>
        </div>

        <div class="btn-grid">
            <button onclick="addSource()">+ 激光源</button>
            <button onclick="addObject('planeMirror')">+ 平面镜</button>
            <button onclick="addObject('convexLens')">+ 凸透镜</button>
            <button onclick="addObject('concaveLens')">+ 凹透镜</button>
            <button onclick="addObject('concaveMirror')">+ 凹面镜</button>
            <button onclick="addObject('convexMirror')">+ 凸面镜</button>
            <button onclick="addObject('glassBlock')">+ 玻璃砖</button>
            <button onclick="addObject('prism')">+ 三棱镜</button>
        </div>

        <div id="inspector-ui" class="inspector" style="display:none">
            <h3 id="obj-title" style="margin:0 0 10px 0; font-size:1rem; color:var(--accent-color)">编辑器材</h3>
            <div id="controls-factory"></div>
            <button style="width:100%; margin-top:15px; background:#8b0000; border:none; color:white; border-radius:4px; padding:8px;" onclick="deleteActive()">移除此器材</button>
        </div>

        <div style="margin-top:auto; font-size:0.8rem; color:#666; line-height:1.5; padding-top:10px;">
            物理特性：<br>
            • 激光默认初始向右射出。<br>
            • 阴影斜线侧为镜面背面。<br>
            • 支持最大 100 次反射/折射追踪。

    <title>飞机投弹平抛运动游戏——物理仿真实验室|13</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1400px;
            width: 100%;
        }
        
        header {
            text-align: center;
            color: white;
            width: 100%;
        }
        
        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        /* 左右布局 */
        .game-area {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .simulation-container {
            flex: 3;
            position: relative;
            height: 680px;
            background: linear-gradient(to bottom, #87CEEB 30%, #1E90FF 70%);
            border: 3px solid #4682B4;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        /* 云朵样式 */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.6);
            z-index: 10;
            animation: floatCloud 30s infinite linear;
        }
        
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        
        .cloud::before {
            width: 70%;
            height: 70%;
            top: -30%;
            left: 20%;
        }
        
        .cloud::after {
            width: 50%;
            height: 50%;
            top: -20%;
            right: 20%;
        }
        
        /* 优化的波浪效果 - SVG曲线 */
        .wave-container {
            position: absolute;
            bottom: 15px; /* 降低波浪位置 */
            left: 0;
            width: 100%;
            height: 25px;
            z-index: 74; /* 确保在船下方 */
        }
        
        .wave-svg {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25px;
        }
        
        .wave-path {
            stroke: rgba(173, 216, 230, 0.6); /* 淡蓝色 */
            stroke-width: 2px;
            fill: none;
            animation: waveFloat 3s infinite ease-in-out;
        }
        
        /* 游戏元素样式 */
        .plane {
            position: absolute;
            width: 120px;
            height: 40px;
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
            color: white;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            z-index: 100;
            transform: translateY(-50%);
        }
        
        .bomb {
            position: absolute;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #4b6cb7, #182848);
            border-radius: 50%;
            display: none;
            z-index: 90;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            font-size: 20px;
            line-height: 30px;
            text-align: center;
        }
        
        .ship {
            position: absolute;
            width: 120px;
            height: 60px;
            background: linear-gradient(135deg, #3ca55c, #b5ac49);
            bottom: 40px;
            left: 300px;
            text-align: center;
            line-height: 50px;
            color: white;
            font-weight: bold;
            z-index: 85; /* 确保轮船在波浪线上方 */
        }
        
        .water-level {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 2px;
            background-color: #0000FF;
            z-index: 75; /* 在波浪线之上 */
        }
        
        /* 控制面板样式 */
        .controls-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-height: 680px;
            overflow-y: auto;
        }
        
        .panel-title {
            background: linear-gradient(to right, #3498db, #8e44ad);
            color: white;
            padding: 5px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 1.4rem;
        }
        
        .control-group {
            margin-bottom: 5px;
            padding: 1px;
            background: linear-gradient(to bottom, #ecf0f1, #bdc3c7);
            border-radius: 10px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #95a5a6;
            outline: none;
        }
        
        .value-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #2c3e50;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            background: linear-gradient(to right, #2ecc71, #1abc9c);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }
        
        #resetBtn {
            background: linear-gradient(to right, #e74c3c, #c0392b);
        }
        
        /* 标度尺样式 */
        .scale-container {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            border-top: 2px solid #2c3e50;
            z-index: 70;
            overflow: hidden;
        }
        
        #scale {
            position: absolute;
            top: 0;
            height: 100%;
            width: 100%;
        }
        
        .scale-mark {
            position: absolute;
            bottom: 0;
            width: 1px;
            height: 20px;
            background-color: #333;
            transform-origin: bottom;
        }
        
        .scale-label {
            position: absolute;
            top: 10px;
            font-size: 12px;
            transform: translateX(-50%);
        }
        
        /* 信息显示区域 */
        .explanation {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            display: none;
            margin-top: 20px;
        }
        
        .explanation h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .trajectory-dot {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: rgba(231, 76, 60, 0.8);
            border-radius: 50%;
            z-index: 50;
            pointer-events: none;
        }
        
        .physics-formula {
            font-style: italic;
            background: #e0f7fa;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 1.1rem;
        }
        
        .important-point {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-left: 4px solid #4CAF50;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .status-value {
            font-size: 1.2rem;
            color: #2c3e50;
        }
        
        .success {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
        }
        
        /* 动画定义 */
        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100% + 150px)); }
        }
        
        /* 新波浪动画 - 仅上下浮动 */
        @keyframes waveFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>飞机投弹平抛运动游戏</h1>
        </header>
        
        <div class="game-area">
            <!-- 游戏显示区（左侧） -->
            <div class="simulation-container" id="simulation">
                <div class="plane" style="background-image: url('plane.png');background-repeat: no-repeat; background-size:100%;"></div>
                <div class="bomb" id="bomb">💣</div>
                <div class="ship" style="background-image: url('ship.png');background-repeat: no-repeat; background-size:100%;"></div>
                
                <!-- 波浪线将在这里通过JS添加 -->
                
                <div class="water-level"></div>
                <div class="scale-container">
                    <div id="scale"></div>
                </div>
            </div>
            
            <!-- 控制面板（右侧） -->
            <div class="controls-panel">
                <div class="panel-title">控制面板</div>

                <div class="action-buttons">
                    <button id="dropBtn">投弹</button>
                    <button id="resetBtn">重置</button>
                </div>
                
                <div class="status-bar">
                    <div class="status-item">
                        <div>当前状态</div>
                        <div id="gameStatus" class="status-value">准备中</div>
                    </div>
                    <div class="status-item">
                        <div>投弹次数</div>
                        <div id="bombCount" class="status-value">0</div>
                    </div>
                    <div class="status-item">
                        <div>命中率</div>
                        <div id="hitRate" class="status-value">0%</div>
                    </div>
                </div>
                <br>
                <div class="control-group">
                    <label for="planeHeight">✈️飞机高度 (<span id="planeHeightValue">80m</span>)</label>
                    <input type="range" id="planeHeight" min="10" max="120" value="80">
                    <div class="value-display">
                        <span>10m</span>
                        <span>120m</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="planeSpeed">✈️飞机速度 (<span id="planeSpeedValue">20m/s</span>)</label>
                    <input type="range" id="planeSpeed" min="20" max="100" value="20">
                    <div class="value-display">
                        <span>20m/s</span>
                        <span>100m/s</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="shipSpeed">🛳️轮船速度 (<span id="shipSpeedValue">5m/s</span>)</label>
                    <input type="range" id="shipSpeed" min="0" max="50" value="5">
                    <div class="value-display">
                        <span>0m/s</span>
                        <span>50m/s</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="shipDirection">🛳️轮船方向</label>
                    <select id="shipDirection" style="width:100%; padding:8px; border-radius:5px;">
                        <option value="right">向右</option>
                        <option value="left">向左</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="rule">📏标尺</label>
                    <select id="rule" style="width:100%; padding:8px; border-radius:5px;">
                        <option value="rulestop">不动</option>
                        <option value="ruleplane" selected="select">跟随飞机</option>
                        <option value="ruleship">跟随轮船</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="gravity">🌏️重力加速度 (<span id="gravityValue">10m/s²</span>)</label>
                    <input type="range" id="gravity" min="1" max="20" step="0.1" value="10">
                    <div class="value-display">
                        <span>1m/s²</span>
                        <span>20m/s²</span>
                    </div>
                </div>
                
            </div>
        </div>
        <div class="controls-panel">
            <p class="instructions">游戏说明：调整参数，按空格键或点击"投弹"按钮，计算飞机应在轮船前多少距离投弹才能命中目标</p>
        </div>
        <div class="success" id="successMsg" style="background-color: #DC143C; border-radius: 15px;"><h1>恭喜！成功命中目标！</h1></div>
        
        <div class="explanation" id="explanation">
            <h2>平抛运动计算原理</h2>
            <p id="calculation-steps">命中轮船后，将显示详细计算过程...</p>
        </div>
    </div>
    <!-- 音频元素 -->
    <audio id="launchSound">
        <!-- 发射音效 -->
        <source src="1.mp3" type="audio/mp3">
    </audio>
    <audio id="explosionSound">
        <!-- 爆炸音效 -->
        <source src="2.mp3" type="audio/mp3">
    </audio>

    <h2>带电粒子在圆形磁场中的运动<button id="restartBtn">开始运动</button></h2>
    <div class="container">
        <canvas id="simulationCanvas"></canvas>
        <div class="controls">
            <div class="control-group">
                <label for="magneticField">磁场大小(T)：<span class="value-display" id="magneticFieldValue">0.5T</span></label>
                <input type="range" id="magneticField" min="0.1" max="2" step="0.1" value="0.5">
            </div>
            <div class="control-group">
                <label for="magneticDirection">磁场方向：</label>
                <select id="magneticDirection">
                    <option value="1">垂直向屏幕外</option>
                    <option value="-1">垂直向屏幕内</option>
                </select>
            </div>
            <div class="control-group">
                <label for="fieldRadius">磁场半径(m)：<span class="value-display" id="fieldRadiusValue">100m</span></label>
                <input type="range" id="fieldRadius" min="50" max="200" step="10" value="100">
            </div>
            <div class="control-group">
                <label for="particleVelocity">粒子初速度(m/s)：<span class="value-display" id="particleVelocityValue">50m/s</span></label>
                <input type="range" id="particleVelocity" min="10" max="100" step="5" value="50">
            </div>
            <div class="control-group">
                <label for="particleMass">粒子质量(kg)：<span class="value-display" id="particleMassValue">5kg</span></label>
                <input type="range" id="particleMass" min="1" max="10" step="1" value="5">
            </div>
            <div class="control-group">
                <label for="particleCharge">粒子电荷量(C)：<span class="value-display" id="particleChargeValue">3C(正电荷)</span></label>
                <input type="range" id="particleCharge" min="1" max="10" step="1" value="3">
                <div class="radio-group">
                    <input type="radio" id="positiveCharge" name="chargeSign" value="1" checked>
                    <label for="positiveCharge">正电荷</label>
                    <input type="radio" id="negativeCharge" name="chargeSign" value="-1">
                    <label for="negativeCharge">负电荷</label>
                </div>
            </div>
            <div class="control-group">
                <label for="incidentAngle">入射角度(度)：<span class="value-display" id="incidentAngleValue">0°</span></label>
                <input type="range" id="incidentAngle" min="-60" max="60" step="5" value="0">
            </div>
            
        </div>
        <div>
            <div class="control-group">
                <label>显示选项</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="showIncident" checked>
                    <label for="showIncident">显示入射方向</label>
                    <input type="checkbox" id="showExit" checked>
                    <label for="showExit">显示出射方向</label>
                    <input type="checkbox" id="showTrajectory" checked>
                    <label for="showTrajectory">显示粒子轨迹</label>
                    <input type="checkbox" id="showExtendedLines" checked>
                    <label for="showExtendedLines">显示延长线</label>
                    <input type="checkbox" id="showCenter" checked>
                    <label for="showCenter">显示磁场圆心</label>
                    <input type="checkbox" id="showFullCircle" checked>
                    <label for="showFullCircle">显示完整圆形轨迹</label>
                    <input type="checkbox" id="showCircleCenter" checked>
                    <label for="showCircleCenter">显示圆形轨迹圆心</label>
                </div>
            </div>
        </div>

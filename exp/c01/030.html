    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 5px 0 5px;
            font-size: 1.5rem;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .controls {
            flex: 0 0 300px;
            padding-right: 20px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }
            .controls {
                flex: 1;
                width: 100%;
                padding-right: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 20px;
            }
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
        }

        .checkbox-label input {
            margin-right: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="number"] {
            width: 70px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        input[type="range"] {
            flex-grow: 1;
            cursor: pointer;
        }
        
        #speed-display {
            font-size: 0.9rem;
            font-weight: 500;
            width: 40px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-start { background-color: #22c55e; color: white; }
        .btn-start.paused { background-color: #f59e0b; }
        .btn-start:hover { background-color: #16a34a; }
        .btn-start.paused:hover { background-color: #d97706; }
        .btn-reset { background-color: #ef4444; color: white; }
        .btn-reset:hover { background-color: #dc2626; }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .simulation-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        canvas {
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            display: block;
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 1px;
            background: #f8fafc;
            padding: 1px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            text-align: center;
        }
        
        .hint-box {
            background-color: #f0fdf4;
            border-left: 4px solid #22c55e;
            padding: 10px;
            font-size: 0.85rem;
            color: #14532d;
            line-height: 1.4;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>水平传送带模型</h1>

    <div class="container">
        <!-- 仿真区域 -->
        <div class="simulation-area" id="sim-container">
            <div class="btn-group">
                <button class="btn-start" id="btn-start">开始</button>
                <button class="btn-reset" id="btn-reset">重置</button>
            </div>
            <canvas id="simCanvas"></canvas>
            <div class="status-bar">
                <span id="disp-status">状态: --</span>
                <span id="disp-t">t: 0.00 s</span>
                <span id="disp-v">v<sub>物</sub>: 0.00 m/s</span>
                <span id="disp-a">a: 0.00 m/s²</span>
                <span id="disp-x">Δx<sub>物</sub>: 0.00 m</span>
            </div>
            <canvas id="chartCanvas"></canvas>
        </div>
        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <label>传送带速度 v<sub>带</sub> (m/s)</label>
                <div class="input-row"><input type="number" id="input-v-belt" value="4" step="1"><input type="range" id="range-v-belt" min="-10" max="10" value="4" step="1"></div>
            </div>

            <div class="control-group">
                <label>物块初速度 v<sub>0</sub> (m/s)</label>
                <div class="input-row"><input type="number" id="input-v-obj" value="0" step="1"><input type="range" id="range-v-obj" min="-10" max="10" value="0" step="1"></div>
            </div>

            <div class="control-group">
                <label>物块初始位置 x<sub>0</sub> (m)</label>
                <div class="input-row"><input type="number" id="input-x-obj" value="0" step="0.5"><input type="range" id="range-x-obj" value="0" step="0.5"></div>
            </div>

            <div class="control-group">
                <label>动摩擦因数 μ</label>
                <div class="input-row"><input type="number" id="input-mu" value="0.2" step="0.05" min="0" max="1"><input type="range" id="range-mu" min="0" max="1" value="0.2" step="0.05"></div>
            </div>
            
            <div class="control-group">
                <label>播放速度</label>
                <div class="input-row"><input type="range" id="range-speed" min="0.1" max="4" value="1" step="0.1"><span id="speed-display">1.0x</span></div>
            </div>
            
            <div class="control-group">
                <label class="checkbox-label"><input type="checkbox" id="show-displacement-markers" checked>显示位移标注</label>
                <label class="checkbox-label"><input type="checkbox" id="pause-on-covelocity">在共速时暂停</label>
            </div>

            
            <div class="hint-box">
                <strong>教学提示：</strong><br>
                在任意时刻点击“暂停”，分析此刻的v、a和f。对比物块与传送带位移，思考摩擦力做功。
            </div>
        </div>

    </div>

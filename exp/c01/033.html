    <style>
        :root {
            --steel: linear-gradient(180deg, #e0e0e0 0%, #ffffff 45%, #ffffff 55%, #b0b0b0 100%);

            --accent: #e67e22;

<div class="container">
    <header style="text-align:center;">
        <h2>螺旋测微器的使用及读数练习</h2>
    </header>

    <div id="canvas-box">
        <svg id="viewport" viewBox="0 50 1000 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#bdc3c7"/>
                    <stop offset="50%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#95a5a6"/>
                </linearGradient>
                <!-- 刻度只在锥形区域显示 -->
                <clipPath id="coneClip">
                    <path d="M 0 145 L 55 110 L 55 290 L 0 255 Z" />
                </clipPath>
            </defs>

            <!-- 1. 丝杆 (最底层) -->
            <rect id="spindle" x="120" y="180" width="600" height="40" fill="#dcdde1" stroke="#95a5a6" />

            <!-- 2. U型尺架 (宽度优化版) -->
            <g id="frameGroup">
                <path d="M 110 200 L 110 320 A 150 150 0 0 0 340 320 L 340 200" fill="none" stroke="#2c3e50" stroke-width="45" stroke-linecap="round"/>
                <rect x="110" y="175" width="25" height="50" fill="#7f8c8d" />
            </g>

            <!-- 3. 固定套筒 (加长版，长度增加50%) -->
            <g id="sleeveGroup">
                <rect x="310" y="165" width="25" height="70" fill="#7f8c8d" />
                <!-- 长度从原来的380增加至580 -->
                <rect x="330" y="165" width="580" height="70" fill="url(#metalGrad)" stroke="#7f8c8d" />
                <line x1="330" y1="200" x2="900" y2="200" stroke="black" stroke-width="1.5" />
                <g id="mainTicks"></g>
                
                <!-- 4. 固定在套筒末端的微调旋钮 (棘轮) -->
                <g id="fixedKnob">
                    <rect x="900" y="140" width="70" height="120" rx="4" fill="url(#metalGrad)" stroke="#7f8c8d" />
                    <!-- 旋钮旋转纹理 -->
                    <g id="knobTexture"></g>
                    <!-- 装饰轴帽 -->
                    <rect x="970" y="170" width="10" height="60" rx="2" fill="#7f8c8d" />
                </g>
            </g>

            <!-- 4. 可动刻度筒 (Thimble) -->
            <g id="thimble">
                <!-- 尾部 -->
                <rect x="200" y="135" width="60" height="130" rx="3" fill="url(#metalGrad)" stroke="#7f8c8d" />
                <!-- 锥形部分 (刻度在此) -->
                <path d="M 0 145 L 55 110 L 55 290 L 0 255 Z" fill="url(#metalGrad)" stroke="#7f8c8d" />
                <!-- 刻度线组 -->
                <g id="thimbleTicks" clip-path="url(#coneClip)"></g>
                <!-- 圆柱主体 -->
                <rect x="55" y="110" width="160" height="180" fill="url(#metalGrad)" stroke="#7f8c8d" />
                <!-- 滚花装饰 -->
                <rect x="195" y="110" width="20" height="180" fill="#000" opacity="0.1" />
                
                
            </g>
        </svg>
    </div>

    <div class="controls">
        <div>
            <label>精确控制 (0-12mm):</label>
            <input type="range" id="slider" min="0" max="12" step="0.001" value="3.782">
            <div style="margin-top:15px; display:flex; gap:8px;">
                <button class="btn" onclick="adjust(-0.01)">-0.01</button>
                <button class="btn" onclick="adjust(0.01)">+0.01</button>
                <button class="btn" onclick="adjust(-0.001)">-0.001</button>
                <button class="btn" onclick="adjust(0.001)">+0.001</button>
            </div>
        </div>
        <p style="font-size: 0.9em; color: #666;">操作：在右侧点击粗调旋钮或微调旋钮<b>上下拖拽</b></p>
        <div style="text-align: right;">
            <button class="btn" onclick="randomSet()" style="background:#2980b9;">随机出题</button>
            <button class="btn" id="showBtn" onclick="toggleResult()" style="background:#27ae60;">显示读数</button>
            <div id="result" class="readout">
                <div id="analysis"></div>
                <div class="value-display">读数: <span id="valTxt"></span> mm</div>
            </div>
        </div>
    </div>

<html lang="zh-CN">
<head>

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>回旋加速器——物理仿真实验室|109</title>
    <style>
        :root { --main: #2196F3; --field: #FF9800; --bg: #ffffff; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { background: #2c3e50; color: white; padding: 10px; text-align: center; font-size: 1.2rem; }
        #container { display: flex; flex: 1; overflow: hidden; }
        #canvas-zone { flex: 1; position: relative; background: #fff; }
        canvas { width: 100%; height: 100%; }
        
        #hud {
            top: 5px; left: 15px; background: rgba(255,255,255,0.95);
            padding: 15px; border-radius: 8px; border: 1px solid #ccc;
            pointer-events: none; font-family: 'Consolas', monospace; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .data-line { margin: 5px 0; display: flex; justify-content: space-between; gap: 30px; }
        .data-val { color: var(--main); font-weight: bold; }
        .highlight { color: #e67e22; font-size: 1.1em; }

        #controls {
            width: 330px; background: #fdfdfd; border-left: 1px solid #ddd;
            padding: 20px; overflow-y: auto; box-shadow: -2px 0 5px rgba(0,0,0,0.05);
        }
        .group { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 5px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-run { background: var(--main); color: white; }
        .btn-sync { background: #4CAF50; color: white; }
        .btn-reset { background: #607d8b; color: white; }
        button:hover { opacity: 0.85; }
        
        @media (max-width: 768px) {
            #container { flex-direction: column; }
            #controls { width: 90%; height: 45%; border-left: none; border-top: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div id="header">回旋加速器 (忽略电场运动时间模型)</div>

<div id="container">
    <div id="canvas-zone">
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div class="group">
            <button class="btn-run" onclick="togglePause()" id="pause-btn">暂停/继续</button>
            <button class="btn-reset" onclick="resetSim()">重置并清除轨迹</button>
        </div>
        <div id="hud">
            <div class="data-line">加速次数: <span id="h-count" class="data-val highlight">0</span></div>
            <div class="data-line">速率 v: <span id="h-v" class="data-val">0</span> m/s</div>
            <div class="data-line">动能 Ek: <span id="h-ek" class="data-val">0</span> eV</div>
            <div class="data-line">轨道半径 r: <span id="h-r" class="data-val">0</span> m</div>
            <div class="data-line">粒子周期 Tp: <span id="h-tp" class="data-val">0</span> μs</div>
            <div class="data-line">AC 周期 Tac: <span id="h-tac" class="data-val">0</span> μs</div>
            <div id="info" style="margin-top:10px; font-weight:bold; color: #d35400; text-align: center;"></div>
        </div>
        <br>
        <div class="group">
            <div class="row"><label>加速电压 U (V)</label><span id="v-U" class="data-val">200</span></div>
            <input type="range" id="i-U" min="50" max="1000" value="200">
            
            <div class="row" style="margin-top:10px;"><label>交流电周期 Tac (μs)</label><span id="v-Tac" class="data-val">2.00</span></div>
            <input type="range" id="i-Tac" min="0.5" max="130" step="0.01" value="2.00">
            <button class="btn-sync" onclick="syncTac()">一键同步理论周期 (Tac = Tp)</button>
        </div>

        <div class="group">
            <div class="row"><label>磁感应强度 B (T)</label><span id="v-B" class="data-val">1.0</span></div>
            <input type="range" id="i-B" min="-2" max="2" step="0.1" value="1.0">

            <div class="row"><label>盒缝间距 d (m)</label><span id="v-d" class="data-val">20</span></div>
            <input type="range" id="i-d" min="5" max="50" value="20">

            <div class="row"><label>D盒半径 R (m)</label><span id="v-R" class="data-val">300</span></div>
            <input type="range" id="i-R" min="150" max="400" value="300">
        </div>

        <div class="group">
            <label>粒子荷质比预设</label>
            <select id="i-type" style="width:100%; padding:8px; border-radius:4px; border:1px solid #ddd;">
                <option value="1,1">质子 (q=+1, m=1)</option>
                <option value="2,4">α粒子 (q=+2, m=4)</option>
                <option value="-1,1">负离子 (q=-1, m=1)</option>
            </select>
            <label style="margin-top:15px;"><input type="checkbox" id="i-force" checked> 显示受力矢量 (F_B, F_E)</label>
        </div>
        <div class="group">
            <div class="row"><label>仿真精度</label><span id="v-sSteps" class="data-val">100</span></div>
            <input type="range" id="i-sSteps" min="1" max="1000" step="1" value="100">
        </div>
<!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer><!-- 尾部文件结束 -->

</div>

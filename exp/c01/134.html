    <title>电子的双缝干涉——物理仿真实验室|134</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-color: #161b22;
            --accent-color: #58a6ff;
            --electron-color: #7ee787;
            --text-color: #c9d1d9;
            --slider-color: #30363d;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 10px;
            background: #21262d;
            border-bottom: 1px solid #30363d;
            text-align: center;
        }

        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }

        main {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            min-height: 0;
        }

        @media (max-width: 900px) {
            main { flex-direction: column; overflow-y: auto; }
            .panel { min-height: 350px; flex: none; }
        }

        .panel {
            flex: 1;
            background: var(--panel-color);
            border: 1px solid #30363d;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .panel-header {
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            font-size: 0.85rem;
            border-bottom: 1px solid #30363d;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }

        .screen-container {
            flex: 1;
            margin: 20px 15px;
            background: #000;
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
        }

        #setup-svg { width: 100%; height: 100%; }
        #screen-canvas { width: 100%; height: 100%; display: block; }

        .settings-bar {
            background: #161b22;
            padding: 10px 20px;
            border-top: 1px solid #30363d;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
        }

        .control-group label span { color: var(--accent-color); font-family: monospace; }

        input[type=range] { width: 100%; cursor: pointer; }

        .controls {
            padding: 15px;
            background: #21262d;
            border-top: 1px solid #30363d;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .stat-box {
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 6px 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            color: var(--electron-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #2ea043; }
        button:disabled { background: #1a4d2e; cursor: not-allowed; opacity: 0.6; }
        button.secondary { background: #30363d; }
        button.danger { background: #da3633; }

        .physics-info {
            position: absolute;
            bottom: 5px;
            left: 10px;
            font-size: 10px;
            color: #484f58;
        }
    </style>
</head>
<body>

<header>
    <h1>电子双缝干涉：概率波与统计分布模拟</h1>
</header>

<main>
    <div class="panel">
        <div class="panel-header">
            <span>接收屏实况 (点阵累积)</span>
            <span style="font-size: 0.75rem; color: #58a6ff;">Δx = Lλ/d</span>
        </div>
        <div class="screen-container">
            <canvas id="screen-canvas"></canvas>
        </div>
        <div class="physics-info">※ 单个电子位置不确定，群体表现波动规律</div>
    </div>
    <div class="panel">
        <div class="panel-header">实验装置原理图 (动态飞行模拟)</div>
        <svg id="setup-svg" viewBox="0 0 400 300">
            <!-- 电子枪组 -->
            <g id="electron-gun-group">
                <rect x="10" y="135" width="30" height="30" fill="#30363d" />
                <rect x="40" y="146" width="6" height="8" fill="#8b949e" />
            </g>
            <!-- 双缝板 -->
            <g id="slits-group" stroke="#8b949e" stroke-width="4">
                <line id="slit-top" x1="200" y1="20" x2="200" y2="135" />
                <line id="slit-mid" x1="200" y1="145" x2="200" y2="155" />
                <line id="slit-bottom" x1="200" y1="165" x2="200" y2="280" />
            </g>
            <!-- 探测屏位置 (动态移动) -->
            <g id="detector-group">
                <line id="detector-line" x1="385" y1="20" x2="385" y2="280" stroke="var(--accent-color)" stroke-width="2" stroke-dasharray="4" />
                <text id="detector-text" x="345" y="15" fill="#8b949e" font-size="10">探测位置</text>
            </g>
            <g id="animation-layer"></g>
        </svg>
    </div>
</main>

<div class="settings-bar">
    <div class="control-group">
        <label>缝间距 (d) <span id="val-d">32</span></label>
        <input type="range" id="range-d" min="15" max="70" value="32">
    </div>
    <div class="control-group">
        <label>屏距 (L) <span id="val-L">220</span></label>
        <input type="range" id="range-L" min="100" max="350" value="220">
    </div>
    <div class="control-group">
        <label>初速度 (v) <span id="val-v">100</span></label>
        <input type="range" id="range-v" min="50" max="200" value="100">
    </div>
    <div class="control-group">
        <label>枪缝距离 (D) <span id="val-gun">160</span></label>
        <input type="range" id="range-gun" min="50" max="150" value="160">
    </div>
</div>

<div class="controls">
    <div class="stat-box">计数: <span id="counter">0</span></div>
    <button id="btn-fire-1">发射 1 个</button>
    <button id="btn-fire-100" class="secondary">发射 100 个</button>
    <button id="btn-fire-1000" class="secondary">连续发射 1000 个</button>
    <button id="btn-reset" class="danger">重置实验</button>
    
</div>

    <div class="header">
        <h1>碰撞的分类及碰撞过程动态演示
        <br><small>
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
            </small>
        </h1>
    </div>
    <div class="main-container">
        <div class="simulation-container">
            <canvas id="simulationCanvas"></canvas>
            <div class="system-info" id="systemInfo" style="display: none;">
                <strong>系统参数</strong><br>
                总动量: <span id="totalMomentum">0</span> kg·m/s<br>
                总动能: <span id="totalEnergy">0</span> J
            </div>
        </div>
        <div class="controls">
            <div class="control-panel">
                <div class="panel-group">
                    <h2>小球1设置</h2>
                    <div class="control-row">
                        <label for="mass1">质量(kg):</label>
                        <input type="number" id="mass1" min="1" max="50" value="10">
                    </div>
                    <div class="control-row">
                        <label for="velocity1">初速度(m/s):</label>
                        <input type="number" id="velocity1" min="0" max="20" value="5">
                    </div>
                    <div class="control-row">
                        <label for="direction1">方向(°):</label>
                        <input type="number" id="direction1" min="0" max="360" value="0">
                    </div>
                </div>
                <div class="panel-group">
                    <h2>小球2设置</h2>
                    <div class="control-row">
                        <label for="mass2">质量(kg):</label>
                        <input type="number" id="mass2" min="1" max="50" value="5">
                    </div>
                    <div class="control-row">
                        <label for="velocity2">初速度(m/s):</label>
                        <input type="number" id="velocity2" min="0" max="20" value="0">
                    </div>
                    <div class="control-row">
                        <label for="direction2">方向(°):</label>
                        <input type="number" id="direction2" min="0" max="360" value="180">
                    </div>
                </div>
                <div class="panel-group">
                    <h2>碰撞设置</h2>
                    <div class="control-row">
                        <label for="elasticity">弹性系数:</label>
                        <input type="range" id="elasticity" min="0" max="1" step="0.1" value="1">
                        <span class="value-display" id="elasticityValue">1.0</span>
                    </div>
                    <div class="control-row">
                        <label for="distance">初始距离:</label>
                        <input type="range" id="distance" min="50" max="300" value="150">
                        <span class="value-display" id="distanceValue">150px</span>
                    </div>
                </div>
                <div class="panel-group">
                    <h2>物理参数</h2>
                    <div class="control-row">
                        <label>动量守恒:</label>
                        <span id="momentumValue">满足</span>
                    </div>
                    <div class="control-row">
                        <label>能量守恒:</label>
                        <span id="energyValue">满足</span>
                    </div>
                    <div class="control-row">
                        <label>碰撞次数:</label>
                        <span id="collisionCount">0</span>
                    </div>
                    <div class="physics-params">
                        <table>
                            <tr>
                                <th>小球</th>
                                <th>质量(kg)</th>
                                <th>速度(m/s)</th>
                                <th>动量(kg·m/s)</th>
                                <th>动能(J)</th>
                            </tr>
                            <tr>
                                <td>小球1</td>
                                <td id="ball1Mass">10.00</td>
                                <td id="ball1Velocity">+5.00</td>
                                <td id="ball1Momentum">+50.00</td>
                                <td id="ball1Energy">125.00</td>
                            </tr>
                            <tr>
                                <td>小球2</td>
                                <td id="ball2Mass">5.00</td>
                                <td id="ball2Velocity">0.00</td>
                                <td id="ball2Momentum">0.00</td>
                                <td id="ball2Energy">0.00</td>
                            </tr>
                            <tr>
                                <td colspan="2"><strong>系统总计</strong></td>
                                <td></td>
                                <td id="sysMomentum">+50.00</td>
                                <td id="sysEnergy">125.00</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="buttons">
                
            </div>
            <div class="instructions">
                <strong>使用说明：</strong>调整小球的质量、初速度和方向，设置弹性系数（0为完全非弹性碰撞，1为弹性碰撞）。点击"开始"按钮观察碰撞过程，小球速度会实时显示。碰撞后可以查看动量守恒和能量守恒状态。
            </div>
        </div>
    </div>

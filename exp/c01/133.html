<html lang="zh-CN">
<head>

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>探究光电效应的实验规律——物理仿真实验室|133</title>
    <style>
        :root { --primary-bg: #ffffff; --control-bg: #f8f9fa; --accent-color: #2196F3; --text-color: #333; }
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 0; background: var(--primary-bg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #2c3e50; color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        main { display: flex; flex: 1; overflow: hidden; }
        #canvas-container { flex: 1.6; background: #fff; display: flex; justify-content: center; align-items: center; position: relative; }
        svg { width: 100%; height: 100%; max-width: 800px; }
        #controls { flex: 1; background: var(--control-bg); border-left: 1px solid #ddd; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .card { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .card h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--accent-color); border-bottom: 2px solid #e3f2fd; }
        .control-row { margin-bottom: 8px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: #555; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent-color); }
        select { width: 100%; padding: 6px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .data-box { background: #e3f2fd; padding: 6px; border-radius: 4px; text-align: center; }
        .data-label { font-size: 0.7rem; color: #666; display: block; margin-bottom: 2px; }
        .data-value { font-size: 0.95rem; font-weight: bold; color: #1976D2; }
        #status-indicator { padding: 6px 10px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; margin-top: 5px; text-align: center; }
        .status-ok { background: #4caf50; color: white; }
        .status-no { background: #f44336; color: white; }
        .electron { fill: #f06; }
        .switch-btn { cursor: pointer; padding: 8px; background: #eee; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; width: 100%; transition: 0.2s; font-weight: bold; }
        .switch-active { background: #ff9800; color: white; border-color: #e68a00; }
        #light-type-hint { font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

<header>探究光电效应的实验规律</header>

<main>
    <div id="canvas-container">
        <svg id="exp-svg" viewBox="0 0 600 500">
            <!-- 仿真电路 -->
            <g stroke="#333" stroke-width="2.5" fill="none">
                <path d="M 175 220 L 100 220 L 100 450 L 290 450" />
                <path id="k-wire" d="M 375 220 L 520 220 L 520 340 L 320 340 L 320 380" />
                <path d="M 100 300 L 280 300" />
                <path d="M 520 300 L 320 300" />
                <path d="M 220 390 L 100 390" />
                <path d="M 420 390 L 520 390 L 520 450 L 310 450" />
            </g>

            <circle cx="300" cy="300" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
            <text x="300" y="308" text-anchor="middle" font-size="18" font-weight="bold">V</text>
            <circle cx="520" cy="260" r="18" fill="#fff" stroke="#333" stroke-width="2"/>
            <text x="520" y="265" text-anchor="middle" font-size="14" font-weight="bold">μA</text>

            <rect x="220" y="380" width="200" height="18" rx="2" fill="#ddd" stroke="#333" />
            <g id="slider-group"><path d="M 320 380 L 320 340" stroke="#333" stroke-width="3" /><path d="M 320 380 L 315 370 L 325 370 Z" fill="#333" /></g>

            <g id="battery-group">
                <line id="batt-l" x1="290" y1="440" x2="290" y2="460" stroke="#333" stroke-width="4" />
                <line id="batt-r" x1="310" y1="445" x2="310" y2="455" stroke="#333" stroke-width="2" />
            </g>

            <rect x="150" y="100" width="250" height="180" rx="30" fill="rgba(235, 245, 255, 0.3)" stroke="#2196F3" stroke-width="2" />
            <line x1="175" y1="140" x2="175" y2="240" stroke="#333" stroke-width="10" />
            <text x="175" y="130" text-anchor="middle" font-weight="bold">A</text>
            <text id="pole-a" x="160" y="198" font-size="24" font-weight="bold" fill="#f44336">+</text>
            <line x1="375" y1="140" x2="375" y2="240" stroke="#333" stroke-width="10" />
            <text x="375" y="130" text-anchor="middle" font-weight="bold">K</text>
            <text id="pole-k" x="390" y="198" font-size="24" font-weight="bold" fill="#2196F3">-</text>

            <polygon id="light-beam" points="180,50 210,20 375,140 375,240" fill="yellow" opacity="0.3" />
            <g id="electron-container"></g>
        </svg>
    </div>

    <div id="controls">
        <div class="card">
            <div class="data-grid">
                <div class="data-box"><span class="data-label">最大初动能 E<sub>k</sub></span><span id="ek-val" class="data-value">0.00</span><small style="font-size:0.6rem">eV</small></div>
                <div class="data-box"><span class="data-label">遏止电压 U<sub>c</sub></span><span id="uc-val" class="data-value">0.00</span><small style="font-size:0.6rem">V</small></div>
                <div class="data-box" style="grid-column: span 2; background: #fff3e0;"><span class="data-label">光电流 I</span><span id="curr-val" style="font-size:1.2rem">0.00</span><small style="font-size:0.6rem"> μA</small></div>
            </div>
            <div id="status-indicator" class="status-no">未发生光电效应</div>
        </div>
        <div class="card">
            <h3>1. 阴极材料 </h3>
            <select id="metal-select">
                <option value="4.54|10.95">钨 (W) - [f₀: 10.95, W₀: 4.54 eV]</option>
                <option value="3.20|7.73">钙 (Ca) - [f₀: 7.73, W₀: 3.20 eV]</option>
                <option value="2.29|5.53">钠 (Na) - [f₀: 5.53, W₀: 2.29 eV]</option>
                <option value="2.25|5.44">钾 (K) - [f₀: 5.44, W₀: 2.25 eV]</option>
                <option value="2.13|5.15" selected>铯 (Cs) - [f₀: 5.15, W₀: 2.13 eV]</option>
            </select>
        </div>
        <div class="card">
            <h3>2. 电源极性控制</h3>
            <button id="polarity-btn" class="switch-btn">当前连接：正向加速</button>
        </div>
        <div class="card">
            <h3>3. 入射光调节</h3>
            <div class="control-row">
                <label>频率 v: <span id="f-val">6.00</span> × 10<sup>14</sup> Hz <span id="light-type-hint"></span></label>
                <input type="range" id="f-slider" min="2" max="18" step="0.01" value="6.00">
            </div>
            <div class="control-row">
                <label>强度 I: <span id="i-val">50</span>%</label>
                <input type="range" id="i-slider" min="0" max="100" step="1" value="50">
            </div>
        </div>
        <div class="card">
            <h3>4. 电压滑片调节</h3>
            <label>滑片端电压 U: <span id="u-val">0.0</span> V</label>
            <input type="range" id="u-slider" min="0" max="12" step="0.1" value="0">
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
    </div>
</main>

    <title>观察振荡电路中电压的波形示——物理仿真实验室|116</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #ffffff;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--primary-color);
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 10px;
            background: #f4f4f4;
            border-bottom: 1px solid #ddd;
        }

        main {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            height: calc(100vh - 60px);
        }

        .left-panel {
            flex: 1;
            min-width: 350px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .right-panel {
            flex: 1.5;
            min-width: 350px;
            padding: 15px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* 电路图 */
        #circuit-svg {
            width: 100%;
            height: 180px;
            background: #fff;
        }
        .wire { stroke: #333; stroke-width: 2; fill: none; }
        .component { stroke: #333; stroke-width: 2; fill: none; }
        .switch-arm { stroke: var(--accent-color); stroke-width: 3; transition: 0.2s; }
        .label { font-size: 14px; fill: #333; font-style: italic; }

        /* 控制区 */
        .controls {
            background: #f9f9f9;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 13px; margin-bottom: 2px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .val-txt { float: right; font-weight: bold; color: #2980b9; }

        /* 数据展示 */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .data-card {
            background: #fff;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
        }
        .data-card b { display: block; font-size: 15px; color: #c0392b; margin-top: 2px; }
        .period-card { grid-column: span 2; background: #eef7ff; border-color: #3498db; }

        /* 示波器 */
        #chart-container {
            flex: 1;
            position: relative;
            background: #fff;
            border: 1px solid #ccc;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #34495e;
            color: white;
            font-size: 14px;
        }
        button:hover { background: #2c3e50; }
        #btn-oscillate { background: #e67e22; }

        @media (max-width: 768px) {
            main { overflow-y: auto; }
            .left-panel, .right-panel { flex: none; width: 100%; height: auto; }
            #chart-container { height: 280px; }
        }
    </style>
</head>
<body>

<header>
    <h3 style="margin:0">观察振荡电路中电压的波形</h3>
</header>

<main>
    <div class="right-panel">
        <div id="chart-container">
            <canvas id="oscCanvas"></canvas>
        </div>
    </div>
    <div class="left-panel">
        <div class="controls">
            <div class="control-group">
                <label>电源电压 E (V): <span id="e-val" class="val-txt">6.0</span></label>
                <input type="range" id="param-e" min="0" max="12" step="0.5" value="6">
            </div>
            <div class="control-group">
                <label>电感量 L (mH): <span id="l-val" class="val-txt">200</span></label>
                <input type="range" id="param-l" min="0" max="1000" value="200">
            </div>
            <div class="control-group">
                <label>电容量 C (μF): <span id="c-val" class="val-txt">470</span></label>
                <input type="range" id="param-c" min="0" max="2000" value="470">
            </div>
            <div class="control-group">
                <label>电阻 R (Ω): <span id="r-val" class="val-txt">1.0</span></label>
                <input type="range" id="param-r" min="0" max="20" step="0.1" value="1">
            </div>
            <div class="btn-group">
                <button id="btn-charge">S接电源 (充电)</button>
                <button id="btn-oscillate">S接线圈 (振荡)</button>
            </div>
        </div>
        <div class="data-grid">
            <div class="data-card period-card">理论振荡周期 T = 2π√(LC)<b id="d-t-period">0.0609 s</b></div>
            <div class="data-card">电荷量 q (mC)<b id="d-q">0.00</b></div>
            <div class="data-card">电流 i (A)<b id="d-i">0.00</b></div>
            <div class="data-card">电场能 Ee (mJ)<b id="d-ee">0.00</b></div>
            <div class="data-card">磁场能 Em (mJ)<b id="d-em">0.00</b></div>
        </div>
        <svg id="circuit-svg" viewBox="0 0 400 200">
            <path d="M 100 50 L 50 50 L 50 150 L 200 150 L 200 90" class="wire" />
            <path d="M 200 80 L 200 50" class="wire" />
            <path d="M 300 50 L 350 50 L 350 150 L 200 150" class="wire" />
            <!-- L -->
            <path d="M 50 70 C 30 75, 30 85, 50 85 C 30 90, 30 100, 50 100 C 30 105, 30 115, 50 115 C 30 120, 30 130, 50 130" class="component" />
            <text x="65" y="105" class="label">L</text>
            <!-- C -->
            <line x1="180" y1="80" x2="220" y2="80" class="component" />
            <line x1="180" y1="90" x2="220" y2="90" class="component" />
            <text x="225" y="90" class="label">C</text>
            <!-- E -->
            <line x1="335" y1="95" x2="365" y2="95" class="component" />
            <line x1="345" y1="105" x2="355" y2="105" class="component" />
            <text x="370" y="105" class="label">E</text>
            <!-- S -->
            <circle cx="200" cy="50" r="3" fill="#000" />
            <circle cx="100" cy="50" r="3" fill="#000" />
            <circle cx="300" cy="50" r="3" fill="#000" />
            <line id="switch-arm" x1="200" y1="50" x2="290" y2="48" class="switch-arm" />
            <text x="195" y="35" class="label" style="font-weight:bold">S</text>
        </svg>
            <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

</main>

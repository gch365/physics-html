<html lang="zh-CN">
<head>

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>探究气体等温变化的规律——物理仿真实验室|113</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #ffffff;
            --border-color: #bdc3c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
        body { 
            font-family: "Microsoft YaHei", sans-serif; 
            background-color: var(--bg-color); 
            color: var(--primary-color);
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 左侧实验区 */
        .experiment-panel {
            flex: 1;
            min-width: 360px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 2px solid #eee;
            user-select: none;
        }

        /* 右侧数据区 */
        .data-panel {
            flex: 1.2;
            min-width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        h2 { margin-bottom: 15px; font-size: 1.4rem; text-align: center; color: #1a1a1a; }

        #sim-svg {
            width: 100%;
            max-width: 400px;
            height: auto;
            background: #fff;
        }

        .tick-label { font-size: 10px; fill: #444; font-family: Arial; }
        .gauge-bg { fill: #fdfdfd; stroke: #333; stroke-width: 2; }
        
        #moving-unit { cursor: grab; }
        #moving-unit:active { cursor: grabbing; }

        .controls {
            margin-top: 15px;
            width: 100%;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }

        input[type=range] {
            width: 90%;
            margin: 15px 0;
            cursor: pointer;
            touch-action: auto;
        }

        .btn-group { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 8px 15px;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
        }
        button:hover { background-color: #2980b9; }
        button.reset { background-color: #95a5a6; }

        .table-wrapper { height: 180px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid var(--border-color); padding: 6px; text-align: center; }
        th { background: #f2f2f2; position: sticky; top: 0; }

        .chart-container {
            flex-grow: 1;
            min-height: 300px;
            border: 1px solid #eee;
            background: #fafafa;
            border-radius: 5px;
        }
        canvas { width: 100%; height: 100%; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .experiment-panel, .data-panel { border-right: none; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="experiment-panel">
        <svg id="sim-svg" viewBox="0 0 200 440">
            <!-- 铁架台 -->
            <rect x="20" y="20" width="5" height="400" fill="#95a5a6"/>
            <rect x="5" y="415" width="100" height="10" rx="2" fill="#34495e"/>

            <!-- 固定支架 -->
            <path d="M25 280 L80 280 L80 310 L25 310 Z" fill="#bdc3c7" stroke="#7f8c8d"/>

            <!-- 注射器外筒 (优化长度) -->
            <rect x="80" y="240" width="30" height="125" fill="rgba(200,230,255,0.15)" stroke="#7f8c8d" stroke-width="1.5"/>
            
            <!-- 体积标尺 (细化刻度 0.2L) -->
            <g id="scale-marks"></g>

            <!-- 底部密封盖 -->
            <rect x="88" y="360" width="14" height="12" fill="#2c3e50" rx="2"/>

            <!-- 封闭气体视觉反馈 -->
            <rect id="gas-fill" x="81" y="250" width="28" height="100" fill="#3498db" fill-opacity="0.25"/>

            <!-- 可拖动整体：压力表 + 长连接头 + 活塞 -->
            <g id="moving-unit">
                <!-- 活塞主体 -->
                <rect x="81" y="150" width="28" height="40" fill="#f1f1f1" stroke="#bdc3c7"/>
                <rect x="81" y="188" width="28" height="6" fill="#2c3e50"/> 
                
                <!-- 加长的连接接头 -->
                <rect x="91" y="75" width="8" height="75" fill="#bdc3c7"/>
                <rect x="85" y="75" width="20" height="15" rx="2" fill="#7f8c8d"/>
                
                <!-- 压力计表盘 -->
                <g id="gauge-group">
                    <path d="M50 70 A 50 50 0 1 1 150 70 L 135 95 L 65 95 Z" class="gauge-bg" />
                    <text x="100" y="52" text-anchor="middle" font-size="8" font-weight="bold">压强计 (10⁵Pa)</text>
                    <circle cx="100" cy="75" r="3" fill="#333"/>
                    <line id="needle" x1="100" y1="75" x2="100" y2="35" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
                </g>
                <!-- 交互热区 -->
                <rect x="50" y="20" width="100" height="170" fill="transparent" />
            </g>
        </svg>

    </div>

    <div class="data-panel">
        <h2>探究气体等温变化规律</h2>
        <div class="controls">
            <p style="font-size: 13px; color: #666;">（密封瞬间体积随机，此时压强为大气压）</p>
            <input type="range" id="volume-slider" min="0.8" max="4.0" step="0.05">
            <div style="font-size: 16px; margin: 8px 0;">
                V =  <span id="v-val" style="color:#e67e22; font-weight:bold;">--</span> L | 
                P =  <span id="p-val" style="color:#e74c3c; font-weight:bold;">--</span> 10<sup>5</sup> Pa
            </div>
            <div class="btn-group">
                <button onclick="recordData()">记录当前数据</button>
                <button class="reset" onclick="location.reload()">重新开始(随机体积)</button>
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>V (L)</th>
                        <th>P 10<sup>5</sup></th>
                        <th>1/V (L⁻¹)</th>
                    </tr>
                </thead>
                <tbody id="data-table"></tbody>
            </table>
        </div>

        <div class="btn-group" style="margin-bottom: 10px;">
            <button onclick="drawGraph('pv')">P - V 图像</button>
            <button onclick="drawGraph('p1v')">P - 1/V 图像</button>
        </div>

        <div class="chart-container">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>
</div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>

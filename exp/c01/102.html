    <title>示波器的使用——物理仿真实验室|102</title>
    <style>
        :root {
            --panel-color: #d8d3c5;
            --label-color: #333;
            --knob-color: #f0f0f0;
            --screen-bg: #1a2c2c;
            --phosphor: #50ff50;
        }

        body {
            background: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: "STheme", "Microsoft YaHei", sans-serif;
            user-select: none;
            flex-direction: column;
        }

        /* 示波器外壳 */
        .oscilloscope {
            width: 420px;
            background: var(--panel-color);
            border-radius: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 2px 2px 5px #fff;
            padding: 20px;
            border: 2px solid #bbb;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .model-name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        /* 屏幕部分 */
        .upper-section {
            display: flex;
            gap: 15px;
        }

        .screen-area {
            background: #222;
            padding: 10px;
            border-radius: 50%;
            border: 8px solid #999;
            box-shadow: inset 0 0 20px #000;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #crt-screen {
            background: var(--screen-bg);
            border-radius: 50%;
            width: 210px;
            height: 210px;
            transition: background 1s;
        }

        .power-controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* 电源开关 */
        .power-btn {
            width: 40px;
            height: 40px;
            background: #eee;
            border: 2px solid #888;
            cursor: pointer;
            box-shadow: 0 3px 0 #666;
        }
        .power-btn.active {
            background: #ccc;
            box-shadow: 0 1px 0 #666;
            transform: translateY(2px);
        }
        .power-led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #500;
        }
        .power-led.on {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* 旋钮样式 */
        .knob-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            margin: 5px;
        }

        /* 旋钮样式 */
        .knob {
            width: 42px;
            height: 42px;
            background: radial-gradient(circle at 30% 30%, #fff, #ddd 70%, #999);
            border-radius: 50%;
            border: 2px solid #888;
            margin: 5px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            touch-action: none;
        }
        .knob::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            width: 4px;
            height: 12px;
            background: #e91e63;
            border-radius: 2px;
            transform: translateX(-50%);
        }

        /* 下部面板 */
        .lower-panel {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 1px solid #aaa;
            padding-top: 15px;
        }

        .label { font-size: 10px; font-weight: bold; text-align: center; margin-bottom: 2px;}

        .big-knob { width: 50px; height: 50px; }

        .input-terminals {
            grid-column: span 4;
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .terminal {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
        }

        .jack {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 3px solid #333;
            margin-top: 5px;
        }
        .jack.red { background: #d00; }
        .jack.black { background: #333; }

        /* 信号切换提示 */
        .mode-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.8);
            padding: 5px;
            border-radius: 5px;
            font-size: 10px;
        }
    </style>
</head>
<body>

<div class="oscilloscope">
    <div class="header">
        <div class="model-name">J2459型 学生示波器</div>
        <div style="font-size: 10px; color: #666;">DC－3MHz</div>
    </div>

    <div class="upper-section">
        <!-- 荧光屏 -->
        <div class="screen-area">
            <canvas id="crt-screen"></canvas>
        </div>

        <!-- 电源及顶层控制 -->
        <div class="power-controls">
            <div class="label">电源</div>
            <button class="power-btn" id="powerSwitch"></button>
            <div class="power-led" id="powerLed"></div>
            
            <div class="knob-container">
                <div class="label">辉度</div>
                <div class="knob" id="knob-intensity" style="transform: rotate(40deg);"></div>
            </div>
            <div class="knob-container">
                <div class="label">聚焦</div>
                <div class="knob" id="knob-focus"></div>
            </div>
        </div>
    </div>

    <!-- 控制面板 -->
    <div class="lower-panel">
        <div class="knob-container">
            <div class="label">Y位移</div>
            <div class="knob" id="knob-y-shift"></div>
        </div>
        <div class="knob-container">
            <div class="label">Y增益</div>
            <div class="knob" id="knob-y-gain"></div>
        </div>
        <div class="knob-container">
            <div class="label">扫描位移</div>
            <div class="knob" id="knob-x-shift"></div>
        </div>
        <div class="knob-container">
            <div class="label">X增益</div>
            <div class="knob" id="knob-x-gain"></div>
        </div>

        <div class="knob-container" style="grid-column: span 2;">
            <span id="sweep-display">扫描范围: 5000Hz</span>
            <div class="knob big-knob" id="knob-sweep" style="transform: rotate(-45deg);"></div>
            <div style="font-size: 9px;">10 100 1K 10K</div>
        </div>

        <div class="knob-container" style="grid-column: span 2;">
            <div class="label">扫描微调</div>
            <div class="knob big-knob" id="knob-sweep-fine"></div>
        </div>
    </div>

    <div class="input-terminals">
        <div class="terminal"><div class="label">同步</div>
            <select id="signalType" style="font-size: 9px;">
                <option value="sine">正弦波</option>
                <option value="cosine">余弦波</option>
                <option value="square">方波</option>
                <option value="lissajous">李萨如图</option>
            </select>
        </div>
        <div class="terminal"><div class="label">Y输入</div><div class="jack red"></div></div>
        <div class="terminal"><div class="label">地</div><div class="jack black"></div></div>
        <div class="terminal"><div class="label">X输入</div><div class="jack red"></div></div>
        
    </div>
</div>
<div style="font-size:10px">

    <footer>
    <div align="center">
        <font size="-1">
            <hr /></font>

<body>
    <div class="container">
        <h1>齿轮传动教学演示</h1>
        <div class="controls">
            <div class="control-group">
                <label for="gear1Radius">齿轮1半径(cm):</label>
                <input type="range" id="gear1Radius" min="5" max="15" value="10" step="0.1">
                <span id="gear1RadiusValue">10</span>
            </div>
            <div class="control-group">
                <label for="gear2Radius">齿轮2半径(cm):</label>
                <input type="range" id="gear2Radius" min="5" max="15" value="7" step="0.1">
                <span id="gear2RadiusValue">7</span>
            </div>
            <div class="control-group">
                <label for="rotationSpeed">转速(rpm):</label>
                <input type="range" id="rotationSpeed" min="1" max="60" value="30" step="1">
                <span id="rotationSpeedValue">30</span>
            </div>
        </div>
        <svg id="gearCanvas" viewBox="0 0 800 400"></svg>
        <div class="info">
            <h3>物理量说明:</h3>
            <p><strong>线速度(v):</strong> 齿轮边缘点的瞬时速度，v = r × ω (m/s)</p>
            <p><strong>角速度(ω):</strong> 齿轮转动的角速度，ω = 2π × rpm / 60 (rad/s)</p>
            <p><strong>向心加速度(a):</strong> a = v² / r = ω² × r (m/s²)</p>
        </div>
    </div>

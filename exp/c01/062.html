    <title>刻度尺测量及读数练习——物理仿真实验室|62</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --wood: #d2b48c;
        }

        body { margin: 0; font-family: "PingFang SC", sans-serif; background: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
        .container { display: flex; width: 100%; height: 100%; }

        /* 左侧面板 */
        .control-panel {
            width: 350px; background: white; padding: 20px; box-sizing: border-box;
            border-right: 1px solid #bbb; display: flex; flex-direction: column; gap: 15px;
            z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        h1 { font-size: 1.1rem; margin: 0; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        .hint { font-size: 0.8rem; color: #666; background: #f0f7ff; padding: 8px; border-radius: 4px; border: 1px solid #d0e0f0; }

        .ui-section { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; font-weight: bold; }

        select, input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-second { background: var(--accent); color: white; }
        .btn-check { background: var(--success); color: white; grid-column: span 2; margin-top: 5px; }
        button:hover { filter: brightness(1.1); }

        #msg-box { padding: 12px; border-radius: 4px; font-size: 0.88rem; display: none; line-height: 1.6; border: 1px solid transparent; }

        /* 右侧仿真区 */
        .sim-viewport { flex-grow: 1; background: #fff; position: relative; overflow: hidden; touch-action: none; }
        #svg-main { width: 100%; height: 100%; cursor: grab; background-color: #fafafa; }
        #svg-main:active { cursor: grabbing; }
        
        /* 物理对象样式 */
        .ruler-body { fill: rgba(255, 252, 210, 0.95); stroke: #888; cursor: move; }
        .wood-block { fill: var(--wood); stroke: #8b4513; stroke-width: 2; cursor: move; }
        .handle { fill: var(--accent); stroke: white; stroke-width: 2; cursor: alias; }
        .ruler-mark { stroke: #333; stroke-width: 1; }
        .ruler-text { font-size: 11px; font-family: Arial; pointer-events: none; font-weight: bold; }

        @media (max-width: 768px) {
            .container { flex-direction: column-reverse; }
            .control-panel { width: 100%; height: 45%; }
            .sim-viewport { height: 55%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="control-panel">
        <h1>刻度尺测量及读数练习</h1>
        <div class="hint">
            • <b>画面平移</b>：按住空白处拖拽鼠标<br>
            • <b>操作物体</b>：拖拽物体中心移动，拖蓝色点旋转<br>
            • <b>一键测量</b>：物体归正并自动吸附
        </div>

        <div class="ui-section">
            <label>1. 画布缩放: <span id="zoom-val">100</span>%</label>
            <input type="range" id="zoom-range" min="0.4" max="5" step="0.1" value="1">
            <div class="btn-grid">
                <button class="btn-main" onclick="resetExercise()">刷新题目</button>
                <button class="btn-second" onclick="autoAlign()">一键测量</button>
            </div>
        </div>

        <div class="ui-section">
            <label>2. 刻度尺精度 (分度值)</label>
            <select id="precision-select" onchange="drawMarks()">
                <option value="1">1mm (须估读到0.01cm)</option>
                <option value="2">2mm (分度值0.2mm)</option>
                <option value="5">5mm (分度值0.5mm)</option>
            </select>
        </div>

        <div class="ui-section">
            <label>3. 填写读数 (cm)</label>
            <input type="number" id="user-ans" step="0.001" placeholder="例如: 5.43">
            <button class="btn-check" onclick="checkAnswer()">提交检查</button>
        </div>

        <div id="msg-box"></div>
        <br>
        <br>
        <br>

    <div class="sim-viewport" id="viewport">
        <!-- 重点：确保 SVG 有明确的宽高，并响应所有点击 -->
        <svg id="svg-main" preserveAspectRatio="xMidYMid meet">
            <!-- 全局平移缩放层 -->
            <g id="camera-group">
                <!-- 辅助网格层 -->
                <defs>
                    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                        <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#f0f0f0" stroke-width="1.5"/>
                    </pattern>
                </defs>
                <rect x="-3000" y="-3000" width="6000" height="6000" fill="url(#grid)" pointer-events="none" />

                <!-- 木块组 -->
                <g id="wood-group">
                    <rect id="wood-rect" class="wood-block" x="0" y="0" width="100" height="60" />
                    <circle id="wood-rotate" class="handle" r="14" />
                </g>

                <!-- 刻度尺组 -->
                <g id="ruler-group">
                    <rect id="ruler-rect" class="ruler-body" x="-10" y="0" width="620" height="90" rx="3" />
                    <g id="marks-layer"></g>
                    <circle id="ruler-rotate" class="handle" r="14" />
                </g>
            </g>
        </svg>
    </div>
</div>

    <title>有阻力的带电粒子在磁场中运动（阻尼螺旋线）——物理仿真实验室|131</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --panel-bg: #f8f9fa;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #fff; overflow: hidden;
        }

        .container { display: flex; height: 100vh; flex-direction: row; }

        /* 响应式：手机端上下布局 */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .controls { width: 100% !important; height: 50% !important; overflow-y: auto; }
            .canvas-container { height: 50% !important; }
        }

        .controls {
            width: 360px; background: var(--panel-bg);
            border-right: 1px solid #ddd; padding: 15px;
            box-sizing: border-box; display: flex;
            flex-direction: column; gap: 8px; font-size: 13px; z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
        }

        h2 { margin: 0 0 5px 0; font-size: 18px; color: var(--primary-color); border-bottom: 2px solid var(--accent-color); }
        .control-group { display: flex; flex-direction: column; gap: 3px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        input[type="range"] { flex: 1; margin: 0 10px; cursor: pointer; }
        
        .data-panel {
            background: #eef; padding: 10px; border-radius: 4px;
            font-family: 'Courier New', monospace; border: 1px solid #ccd; line-height: 1.4;
            margin-top: 5px;
        }

        .btn-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 6px; 
            margin-top: 5px; 
        }
        button {
            padding: 8px 4px; cursor: pointer; border: none; border-radius: 4px;
            background: var(--accent-color); color: white; font-weight: bold; font-size: 12px;
            transition: 0.2s;
        }
        button:hover { filter: brightness(1.1); }
        button.secondary { background: #95a5a6; }
        button.danger { background: #2c3e50; }
        button.warning { background: #f39c12; }
        button.active { outline: 2px solid #27ae60; background: #27ae60; }
        button.reset-all {  background: #2c3e50; margin-top: 2px; } /* 重置按钮横跨两列 */

        .canvas-container { flex: 1; position: relative; background: white; cursor: crosshair; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #ui-canvas { pointer-events: none; }
        
        .legend { font-size: 11px; color: #666; display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 画布显示区 -->
    <div class="canvas-container" id="canvas-wrapper">
        <canvas id="bg-canvas"></canvas>
        <canvas id="trail-canvas"></canvas>
        <canvas id="ui-canvas"></canvas>
    </div>
    <div class="controls">
        <h2>阻尼螺旋线仿真</h2>
        <!-- 实时数据输出 -->
        <div class="data-panel" id="data-output">
            速度 v: ---<br>
            洛伦兹力 F: ---<br>
            瞬时半径 R: ---
        </div>

        <!-- 交互按钮组 -->
        <div class="btn-grid">
            <button id="btn-start">开始发射</button>
            <button id="btn-pause" class="secondary">暂停/继续</button>
            <button id="btn-reset-all" class="reset-all">全部重置</button>
            <button id="btn-draw-mode" class="warning">手绘挡板</button>
            <button id="btn-clear-barriers" class="danger">清除挡板</button>
            <button id="btn-clear-trails" class="danger">清除轨迹</button>
            
            
        </div>
        <!-- 物理参数控制 -->
        <div class="control-group">
            <div class="row"><span>磁感应强度 B (T):</span> <b id="val-B">2.0</b></div>
            <input type="range" id="input-B" min="-10" max="10" step="0.5" value="2.0">
            <div class="legend"><span>正: 向里(×)</span> <span>负: 向外(·)</span></div>
        </div>

        <div class="control-group">
            <div class="row"><span>电荷量 q (C):</span> <b id="val-q">1.0</b></div>
            <input type="range" id="input-q" min="-5" max="5" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="row"><span>质量 m (kg):</span> <b id="val-m">1.0</b></div>
            <input type="range" id="input-m" min="0.1" max="5" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="row"><span>初速度 v₀:</span> <b id="val-v">100</b></div>
            <input type="range" id="input-v" min="0" max="500" step="5" value="100">
        </div>

        <div class="control-group">
            <div class="row"><span>发射角度 (°):</span> <b id="val-angle">0</b></div>
            <input type="range" id="input-angle" min="0" max="360" step="1" value="0">
        </div>

        <div class="control-group">
            <div class="row"><span>阻力系数 k:</span> <b id="val-k">0.00</b></div>
            <input type="range" id="input-k" min="0" max="1" step="0.01" value="0.00">
        </div>

        <div class="control-group">
            <div class="row"><span>挡板衰减率:</span> <b id="val-damping">0.50</b></div>
            <input type="range" id="input-damping" min="0" max="1" step="0.05" value="0.50">
        </div>

        <div class="control-group">
            <label><input type="checkbox" id="check-force" checked> 显示受力 F_L (红)</label>
            <label><input type="checkbox" id="check-vel" checked> 显示速度 V (绿)</label>
        </div>
        <div class="control-group">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

    <title>游标卡尺读数练习(试题图版)——物理仿真实验室|73</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #ffffff;
            --panel-color: #f8f9fa;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
        
        #app { display: flex; height: 100vh; flex-direction: row; }

        /* 侧边控制栏 - 核心修复：移动端可滚动 */
        #sidebar {
            width: 320px; 
            background: var(--panel-color); 
            border-right: 1px solid #dee2e6;
            padding: 20px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column; 
            gap: 15px; 
            z-index: 100; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            overflow-y: auto; /* 允许纵向滚动 */
            -webkit-overflow-scrolling: touch; /* iOS 丝滑滚动 */
            flex-shrink: 0; /* 防止被压缩 */
        }

        /* 画布区域 */
        #canvas-container { flex: 1; position: relative; overflow: hidden; background: white; touch-action: none; }
        #svg-canvas { width: 100%; height: 100%; cursor: grab; }
        #svg-canvas:active { cursor: grabbing; }

        h2 { margin: 0; font-size: 1.1rem; color: var(--primary-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; }
        .card { border: 1px solid #e9ecef; padding: 12px; border-radius: 8px; background: white; flex-shrink: 0; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.85rem; color: #495057; }
        
        select, input, button {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ced4da;
            font-size: 0.95rem; box-sizing: border-box; margin-bottom: 8px;
        }

        button { background: var(--primary-color); color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #34495e; }
        button.quiz-btn { background: #28a745; }
        button.quiz-btn:hover { background: #218838; }
        button.show-btn { background: var(--accent-color); }
        button.show-btn:hover { background: #2980b9; }

        #display-val-box {
            display: none; text-align: center; padding: 10px; 
            background: #e3f2fd; border: 1px solid #90caf9; 
            border-radius: 6px; margin-top: 5px;
        }
        #display-val-box span { font-size: 1.4rem; font-weight: bold; color: #1976d2; font-family: 'Courier New', Courier, monospace; }

        #feedback {
            padding: 12px; border-radius: 8px; display: none; 
            font-size: 0.85rem; line-height: 1.5; border: 1px solid transparent;
        }
        .res-correct { background: #d4edda; color: #155724; border-color: #c3e6cb; }
        .res-half { background: #fff3cd; color: #856404; border-color: #ffeeba; }
        .res-wrong { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }

        .analysis { background: rgba(0,0,0,0.04); padding: 8px; border-radius: 4px; margin-top: 8px; border: 1px dashed #999; font-size: 0.8rem; }

        /* 移动端适配修复 */
        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #sidebar { 
                width: 100%; 
                height: 40%; /* 锁定高度占比 */
                order: 2; 
                border-right: none; 
                border-top: 1px solid #ddd;
                padding: 15px;
            }
            #canvas-container { height: 60%; order: 1; }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h2>游标卡尺互动实验</h2>
        
        <div class="card">
            <label>1. 设置精度</label>
            <select id="type-select" onchange="resetStage()">
                <option value="10">10分度 (0.1mm)</option>
                <option value="20">20分度 (0.05mm)</option>
                <option value="50" selected>50分度 (0.02mm)</option>
            </select>
            <button class="quiz-btn" onclick="startQuiz()">随机出题 (1-12cm)</button>
        </div>

        <div class="card">
            <label>2. 读数观察</label>
            <button class="show-btn" id="toggle-show-btn" onclick="toggleReadingDisplay()">显示当前读数</button>
            <div id="display-val-box">
                <span id="current-reading-val">0.00</span> mm
            </div>
        </div>

        <div id="quiz-area" class="card" style="display:none;">
            <label>3. 模拟考核</label>
            <input type="text" id="user-input" placeholder="输入读数数值" autocomplete="off">
            <button onclick="submitAnswer()">提交检查</button>
        </div>

        <div id="feedback"></div>
        <div class="card">
            <label>设置刻度密集程度</label>
            <select id="mmtopx-select" onchange="mmtopx()">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4" selected>4</option>
                <option value="5">5</option>
            </select>
        </div>
        <div style="font-size: 0.7rem; color: #7f8c8d; margin-top: 10px; padding-bottom: 20px;">
            提示：<br>
            • 游标移动后，系统会自动更新标准答案<br>
            • 误差宽容度：±1 分度格<br>
            • 请注意各精度下的有效数字<br>
        </div>

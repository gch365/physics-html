    <div class="container">
        <h1>分力与夹角关系(合力一定)</h1>
        <div class="controls">
            <div class="control-left">
                <label for="angle">分力夹角(θ):</label>
                <input type="range" id="angle" min="0" max="179" value="90" step="1">
                <span id="angleValue" class="value-display">90°</span>
                <br><br>
                <label for="force">合力大小(F):</label>
                <input type="range" id="force" min="10" max="200" value="100" step="1">
                <span id="forceValue" class="value-display">100N</span>
            </div>
            <div class="control-right" id="paramsDisplay">
                <div class="param-display">当前分力大小: <span class="param-value" id="force1Value">70.7N</span></div>
                <div class="param-display">分力夹角: <span class="param-value" id="currentAngle">90°</span></div>
                <div class="param-display">合力大小: <span class="param-value" id="currentForce">100N</span></div>
                <div class="param-display" style=" display: none;">分力比例: <span class="param-value" id="forceRatio">1:1</span></div>
            </div>
        </div>
        <canvas id="forceCanvas"></canvas>
        <div class="info">
            <h3>物理原理说明：</h3>
            <p>当两个大小相等的分力(F₁=F₂)合成一个合力F时，它们之间的关系为：</p>
            <p>F = 2 × F₁ × cos(θ/2)</p>
            <p>其中θ是两个分力之间的夹角。</p>
            <p>从公式可以看出，当θ=0°时，分力最大(F₁=F₂=F/2)；当θ=180°时，分力最小(F₁=F₂=∞)。</p>
            <p><strong>提示：</strong>您可以直接拖动蓝色或绿色的分力箭头来调整夹角。</p>
        </div>

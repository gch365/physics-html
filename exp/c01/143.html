<html lang="zh-CN">
<head>

    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">
    <meta name="author" content="物理仿真实验室">
    <!-- 头部文件结束 -->
    <title>玻尔原子理论的基本假设——物理仿真实验室|143</title>
    <style>
        :root {
            --primary: #228be6;
            --bg: #ffffff;
            --text: #2c3e50;
            --orbit: #ced4da;
            --electron: #343a40;
            --photon-in: #f06595;
            --photon-out: #51cf66;
            --arrow-color: #339af0;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'PingFang SC', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        .status-bar {
            height: 40px; background: #f8f9fa;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; border-bottom: 1px solid #dee2e6;
            transition: all 0.3s;
        }

        .main-container {
            display: flex; flex: 1; overflow: hidden; gap: 5px; padding: 5px;
        }

        .box {
            flex: 1; position: relative; display: flex; flex-direction: column;
            border: 1px solid #f1f3f5; border-radius: 8px; overflow: hidden;
        }

        svg { width: 100%; height: 100%; }

        .controls {
            padding: 5px; background: #f8f9fa;
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 5px; border-top: 1px solid #dee2e6;
        }

        .input-group { display: flex; align-items: center; gap: 8px; }
        input { 
            width: 70px; padding: 6px; border: 2px solid var(--primary); 
            border-radius: 4px; font-size: 1rem; outline: none;
        }

        button {
            padding: 8px 16px; border: none; border-radius: 4px;
            background: var(--primary); color: white; cursor: pointer;
            font-weight: bold; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .hint-text { font-size: 0.8rem; color: #868e96; width: 100%; text-align: center; margin-top: 5px; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; overflow-y: auto; }
            .box { height: 320px; flex: none; }
        }
    </style>
</head>
<body>

<div class="controls">
    <div id="status-display" class="status-bar">玻尔原子结构：n=1至n=5能级演示</div>
    <div class="input-group">
        <label>入射光能量:</label>
        <input type="number" id="energy-input" value="10.20" step="0.01">
        <button onclick="absorbPhoton()">激发跃迁</button>
    </div>
    <div class="hint-text">
        演示提示：n1→n5=<b>13.06eV</b> | 点击下方能级线演示<b>辐射跃迁</b>
    </div>
</div>

<div class="main-container">
    <div class="box">
        <svg id="orbit-svg" viewBox="0 0 500 500">
            <text x="20" y="30" fill="#adb5bd" font-size="14">原子轨道图 (r = n²r₁)</text>
            <circle cx="250" cy="250" r="8" fill="#ff6b6b" /> <!-- 原子核 -->
            <text x="245" y="256" fill="white" font-size="16" font-weight="bold">+</text>
            <g id="orbit-group"></g>
            <circle id="electron" r="5" fill="var(--electron)" />
            <path id="photon-path" fill="none" stroke-width="3" d="" visibility="hidden" />
        </svg>
    </div>

    <div class="box">
        <svg id="energy-svg" viewBox="0 0 300 500">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-color)" />
                </marker>
            </defs>
            <text x="20" y="30" fill="#adb5bd" font-size="14">能级图与跃迁矢量</text>
            <line x1="50" y1="460" x2="50" y2="40" stroke="#333" stroke-width="1" />
            <text x="20" y="50" fill="#333" font-size="12">E/eV</text>
            <g id="level-group"></g>
            <!-- 跃迁箭头 -->
            <line id="transition-arrow" x1="150" y1="0" x2="150" y2="0" stroke="var(--arrow-color)" stroke-width="3" marker-end="url(#arrowhead)" visibility="hidden" />
            <circle id="level-pointer" r="6" fill="#f06595" cx="150" />
        </svg>
    </div>
    <div class="controls">
        <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>         <!-- 尾部文件结束 -->

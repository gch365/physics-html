    <div class="container">
        <h1>摆线运动合成模拟</h1>
        <div class="button-group">
            <button id="startBtn">开始</button>
            <button id="pauseBtn">暂停</button>
            <button id="resetBtn">重置</button>
            <button id="clearBtn">清除轨迹</button>
        </div>
        <div class="demo-area">
            <canvas id="motionCanvas"></canvas>
        </div>
        <div class="bottom-panels">
            <div class="control-area">
                <div class="control-group">
                    <h3>匀速直线运动控制</h3>
                    <div class="slider-container">
                        <label>速度大小(m/s): <span class="value-display" id="linearSpeedValue">20</span></label>
                        <input type="range" id="linearSpeed" min="0" max="1000" value="20" step="1">
                    </div>
                    <div class="slider-container">
                        <label>速度方向(度): <span class="value-display" id="linearAngleValue">0</span></label>
                        <input type="range" id="linearAngle" min="0" max="360" value="0" step="1">
                    </div>
                </div>
                <div class="control-group">
                    <h3>匀速圆周运动控制</h3>
                    <div class="slider-container">
                        <label>角速度(rad/s): <span class="value-display" id="angularSpeedValue">10</span></label>
                        <input type="range" id="angularSpeed" min="-50" max="50" value="10" step="1">
                    </div>
                    <div class="slider-container">
                        <label>圆周半径(m): <span class="value-display" id="circleRadiusValue">2</span></label>
                        <input type="range" id="circleRadius" min="1" max="100" value="2" step="1">
                    </div>
                </div>
                
            </div>
            <div class="explanation">
                <h3>物理原理说明</h3>
                <p>摆线运动是质点同时参与两个运动的合成：</p>
                <ol>
                    <li><strong>匀速直线运动</strong>：速度为v，方向与x轴夹角为θ</li>
                    <li><strong>匀速圆周运动</strong>：角速度为ω，半径为R</li>
                </ol>
                <p>质点的位置随时间t的变化规律为：</p>
                <p>x(t) = v·cosθ·t + R·cos(ωt)</p>
                <p>y(t) = v·sinθ·t + R·sin(ωt)</p>
                <p>通过调整参数可以观察到不同的摆线轨迹，包括直线、圆、椭圆、摆线等特殊情况。</p>
                <p>当圆周运动角速度与直线运动速度满足特定关系时，可以形成闭合的轨迹。</p>
            </div>
        </div>

    <title>缩放圆模型（可自定义挡板）——物理仿真实验室|51</title>
    <style>
        :root {
            --panel-bg: #f4f7f9;
            --accent-color: #3498db;
            --text-color: #2c3e50;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #fff;
        }
        /* 响应式布局：默认横向，手机纵向 */
        .container {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            #controls { width: 100% !important; height: 40% !important; overflow-y: auto; }
            #stage-container { height: 60% !important; }
        }

        /* 控制面板 */
        #controls {
            width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid #ddd;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
        }
        .value-display {
            color: var(--accent-color);
            font-family: monospace;
        }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #2980b9; }
        button.active { background: #e74c3c; }
        button#playBtn { background: #27ae60; }

        /* 画布区 */
        #stage-container {
            flex-grow: 1;
            position: relative;
            touch-action: none;
        }
        svg { width: 100%; height: 100%; background: #fff; }

        /* 参数提示浮窗 */
        #tip {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <main id="stage-container">
        <svg id="svgStage">
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e67e22" />
                </marker>
            </defs>
            <g id="bFieldLayer"></g>
            <g id="centerLineLayer"></g>
            <g id="trajectoryLayer"></g>
            <g id="animPathLayer"></g>
            <g id="barrierLayer"></g>
            <line id="velocityVector" stroke="#e67e22" stroke-width="3" marker-end="url(#arrow)" />
            <circle id="emitter" cx="50%" cy="50" r="8" fill="#e67e22" style="cursor: move;" />
            <g id="particleLayer"></g>
        </svg>
        <div id="tip"></div>
    </main>
    <aside id="controls">
        <h3 style="margin:0 0 10px 0; font-size: 18px;">缩放圆模型（可自定义挡板）</h3>
        <div class="control-item">
            <div class="label-row"><span>粒子数量</span><span id="v-pCount" class="value-display">15</span></div>
            <input type="range" id="pCount" min="1" max="50" value="15">
        </div>

        <div class="control-item">
            <div class="label-row"><span>荷质比 q/m</span><span id="v-qmRatio" class="value-display">1.0</span></div>
            <input type="range" id="qmRatio" min="-2.0" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-item">
            <div class="label-row"><span>最大初速度</span><span id="v-vMax" class="value-display">250</span></div>
            <input type="range" id="vMax" min="50" max="500" value="250">
        </div>

        <div class="control-item">
            <div class="label-row"><span>磁感应强度 B</span><span id="v-bField" class="value-display">0.8</span></div>
            <input type="range" id="bField" min="-2.0" max="2.0" step="0.1" value="0.8">
        </div>

        <div class="control-item">
            <div class="label-row"><span>入射角度 θ</span><span id="v-vAngle" class="value-display">0°</span></div>
            <input type="range" id="vAngle" min="0" max="360" value="0">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="showCenterLine" checked> 显示圆心连线</label>
            <label><input type="checkbox" id="showVect" checked> 显示初速度矢量</label>
            <label><input type="checkbox" id="showFullcircle" checked> 显示完整圆轨迹</label>
        </div>
        <button id="drawBarrierBtn">画挡板 (点击两点)</button>
        <button id="playBtn">演示粒子运动</button>
        <button id="resetBtn" style="background:#95a5a6;">清除挡板</button>
        <div style="font-size: 12px; color: #7f8c8d; margin-top: auto;">
            * 拖动橙色发射点改变位置<br>
            * 点击完整轨迹查看具体数值

<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>

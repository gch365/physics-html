<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>频率（音调）与振幅（响度）——物理仿真实验室|93</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #ffffff; --panel-bg: #f4f7f6; }
        * { box-sizing: border-box; } /* 确保边距不撑开容器 */

        body { 
            margin: 0; 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: -webkit-fill-available; /* 适配移动端浏览器高度 */
        }

        header { 
            background: var(--primary); 
            color: white; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            flex-shrink: 0;
        }

        header strong { font-size: 14px; }

        .main-container { 
            display: flex; 
            flex: 1; 
            flex-direction: column; /* 手机端默认纵向排列 */
            overflow: hidden; 
        }
         /* 侧边栏/控制区 */
        .sidebar { 
            width: 100%; 
            padding: 10px; 
            border-right: none; 
            border-bottom: 1px solid #ddd;
            display: flex; 
            flex-direction: row; /* 手机端内部横向滚动 */
            gap: 10px; 
            overflow-x: auto; 
            background: var(--panel-bg);
            flex-shrink: 0;
        }

        /* 显示区 */
        .display-area { 
            flex: 1; 
            display: flex; 
            padding: 10px; 
            gap: 10px; 
            min-height: 400px;
            overflow: hidden;
        }

        .canvas-box { 
            flex: 1; 
            background: #000; 
            border-radius: 8px; 
            position: relative; 
            border: 2px solid #333; 
            box-shadow: inset 0 0 10px #000;
            min-height: 200px;
        }

        .canvas-label { 
            position: absolute; 
            top: 5px; 
            left: 5px; 
            color: #00ff00; 
            font-size: 10px; 
            background: rgba(0,0,0,0.7); 
            padding: 2px 4px; 
            z-index: 5; 
            border-radius: 3px; 
            pointer-events: none;
        }

        canvas { width: 100%; height: 100%; display: block; }

        .control-card { 
            background: white; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            min-width: 260px; /* 保证控制面板在横向滚动时不被压缩 */
            flex-shrink: 0;
        }

        .mode-row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; font-size: 13px; }
        
        .keyboard-area { background: #1a1a1a; padding: 20px 0; border-top: 2px solid #333; overflow-x: auto; /* 允许横向滑动找高低音 */height: 220px}
        .keyboard { display: flex; justify-content: center; min-width: max-content; padding: 0 40px; width: max-content; /* 核心：让键盘宽度由内容决定 */}
        .key { width: 45px; height: 150px; background: white; border: 1px solid #555; margin: 0 1px; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 15px; border-radius: 0 0 5px 5px; transition: 0.05s; user-select: none; font-size: 12px; }
        .key.active { background: #ffe082 !important; height: 146px; border-bottom: 4px solid #e67e22; }
        .key.chord-selected { background: #ffccbc; border: 2px solid #e67e22; }
        .key.low { border-top: 6px solid #e74c3c; }
        .key.mid { border-top: 6px solid #2ecc71; }
        .key.high { border-top: 6px solid #3498db; }
        .btn { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 5px; transition: 0.2s; }
        .btn-play { background: #27ae60; }
        .btn-stop { background: #c0392b; }
        input[type="number"] { width: 100px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        #gate { position: fixed; top:0; left:0; width:100%; height:100%; background: white; z-index: 1000; display: flex; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
    </style>
</head>
<body>

<div id="gate">
    <h1 style="color:var(--primary)">音频发生器</h1>
    <p>用计算机呈现声音的振动图像 | 乐音和音阶 | 频率与响度</p>
    <button class="btn" style="width:240px; padding:18px; font-size:1.1rem; background: var(--accent);" onclick="initAudio()">初始化实验室</button>
</div>

<header>
    <strong>声波特征综合实验台</strong>
    <div id="freq-info" style="font-family:monospace; font-size: 14px; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px;">系统就绪</div>
</header>

<div class="main-container" id="container">
    <div class="sidebar">
        <!-- 基础振幅 -->
        <div class="control-card">
            <label style="font-size: 13px; font-weight: bold;">主振幅 (响度)</label>
            <input type="range" id="master-amp" min="0" max="100" value="60">
        </div>

        <!-- 自定义全频段发生器 -->
        <div class="control-card">
            <strong style="font-size:14px; color: var(--accent);">自定义全频段信号源</strong>
            <div class="mode-row" style="margin-top:8px;">
                <span>频率 (Hz):<span id="freq-display" style="width: 60px; text-align: right; color: var(--accent); font-weight: bold;">440Hz</span></span>
                <input type="range" id="custom-freq-input" min="0" max="24000" value="440" step="1">
            </div>
            <button id="custom-freq-btn" class="btn btn-play" onclick="toggleCustomFreq()">开启持续发声</button>
            <small style="font-size: 10px; color: #888;">* 0 - 1MHz (超过20kHz需专业设备采集)</small>
        </div>

        <!-- 编曲模式（含间隔记录） -->
        <div class="control-card">
            <div class="mode-row"><strong>编曲模式 (记录节奏/空隙)</strong><input type="checkbox" id="record-mode"></div>
            <div id="record-box" style="display:none">
                <div id="record-list" style="font-size:11px; color:#666; height:60px; overflow-y:auto; border:1px solid #eee; margin-bottom:5px; padding:4px; line-height: 1.4;"></div>
                <button class="btn" onclick="playRecord()">原样回放录制内容</button>
                <button class="btn" style="background:#7f8c8d" onclick="clearRecord()">清空磁带</button>
            </div>
        </div>

        <!-- 和弦模式 -->
        <div class="control-card">
            <div class="mode-row"><strong>和弦模式 (循环叠加)</strong><input type="checkbox" id="chord-mode"></div>
            <div id="chord-box" style="display:none">
                <label style="font-size: 12px;">节拍周期 (ms): <span id="tempo-val">600</span></label>
                <input type="range" id="chord-tempo" min="200" max="2000" value="600">
                <button id="chord-loop-btn" class="btn btn-play" onclick="toggleChordLoop()">开启循环播放</button>
            </div>
        </div>

        <!-- 经典曲目 -->
        <div class="control-card">
            <strong style="font-size:14px;">经典物理曲目</strong>
            <button class="btn" style="background:#2980b9; margin-top:5px;" onclick="playTwinkle()">小星星 (Do=264Hz)</button>
            <button class="btn" style="background:#8e44ad" onclick="playJoy()">欢乐颂 (Do=264Hz)</button>
        </div>
    </div>

    <div class="display-area">
        <div class="canvas-box">
            <div class="canvas-label">示波器 (波形快照)</div>
            <canvas id="oscCanvas"></canvas>
        </div>
        <div class="canvas-box">
            <div class="canvas-label">连续振动图像 (频率与振幅时域记录)</div>
            <canvas id="timeCanvas"></canvas>
        </div>
    </div>
</div>

<div class="keyboard-area"><div class="keyboard" id="piano"></div></div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

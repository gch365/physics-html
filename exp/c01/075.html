    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>汽车过拱形与凹形路面——物理仿真实验室|75</title>
    <style>
        :root { --primary: #2c3e50; --danger: #e74c3c; --success: #27ae60; --info: #3498db; --gray: #7f8c8d; }
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { font-family: 'PingFang SC', sans-serif; background: #fff; overflow: hidden; color: var(--primary); height: 100vh; }
        
        #app { display: flex; height: 100vh; width: 100vw; flex-direction: row; }
        
        #controls {
            width: 320px; padding: 5px; background: #f8f9fa; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 5px; overflow-y: auto;
        }

        #simulation { flex-grow: 1; position: relative; background: #fff; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        .card { background: white; padding: 5px; border-radius: 8px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card:disabled, .card.locked { opacity: 0.6; pointer-events: none; background: #f0f0f0; }
        h2 { font-size: 0.9rem; margin-bottom: 8px; color: var(--primary); border-left: 4px solid var(--info); padding-left: 8px; }
        
        .stat-row { display: flex; justify-content: space-between; margin: 4px 0; font-family: monospace; font-size: 13px; font-weight: bold; }
        .btn-group { display: flex; gap: 8px; margin-top: 5px; }
        
        button { flex: 1; padding: 12px 8px; cursor: pointer; border: none; border-radius: 4px; background: var(--info); color: white; font-weight: bold; font-size: 13px; }
        button.stop { background: var(--danger); }
        button.reset { background: var(--gray); }

        input[type="range"] { width: 100%; margin: 8px 0; }
        label { font-size: 0.75rem; cursor: pointer; display: block; margin: 2px 0; font-weight: bold; }
        select { width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid #ccc; background: white; }

        #overlay {
            position: absolute; top: 10px; left: 10px; pointer-events: none;
            background: rgba(255,255,255,0.85); padding: 10px; border-radius: 6px;
            border: 2px solid var(--info); max-width: 200px; z-index: 100;
        }

        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #controls { width: 100%; height: 45%; border-right: none; border-top: 1px solid #ddd; }
            #simulation { height: 55%; flex-grow: 0; }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="simulation">
        <canvas id="canvas"></canvas>
        <div id="overlay" style="display: none;">
        </div>
    </div>

    <div id="controls">
        <h2>汽车过拱形与凹形路面</h2>
        <div class="card">
            <h2><span id="phyState">状态：就绪</span>|<span id="phyDetail">请调节参数或点击播放</span></h2>
            <div class="stat-row">车速 v: <span id="vVal">0.0</span> m/s</div>
            <div class="stat-row" style="color:var(--info)">压力 Fn: <span id="fnVal">0</span> N</div>
            <div class="stat-row" style="color:var(--danger)">最大压力: <span id="fMax">0</span> N</div>
            <div class="stat-row" style="color:var(--success)">最小压力: <span id="fMin">0</span> N</div>
        </div>
        <div class="btn-group">
            <button id="btnLeft">←减速</button>
            <button id="btnRight">加速→</button>
        </div>
        <div class="card">
            <h2>实验控制</h2>
            <div class="btn-group">
                <button id="togglePlay" class="stop">暂停演示</button>
                <button id="resetData" class="reset">清除轨迹</button>
            </div>
            <div style="margin-top:10px;">
                <label><input type="checkbox" id="pauseAtMid"> 经过中心点自动暂停</label>
                <label><input type="checkbox" id="recordGraph" checked> 记录压力轨迹</label>
                <label><input type="checkbox" id="showForces" checked> 显示受力分析 (矢量)</label>
                <label><input type="checkbox" id="showVel" checked> 显示速度矢量</label>
            </div>
        </div>
        <div class="card" id="roadSettingsCard">
            <h2>路面物理环境 (运行中锁定)</h2>
            <select id="roadType">
                <option value="convex">凸形路面 (拱桥)</option>
                <option value="concave">凹形路面 (谷地)</option>
                <option value="flat">水平路面</option>
            </select>
            <label>起始位置: <span id="startShow">150</span></label>
            <input type="range" id="roadStart" min="100" max="500" value="150">
            <label>路面宽度: <span id="widthShow">800</span></label>
            <input type="range" id="roadWidth" min="200" max="900" value="800">
            <label>起伏高度: <span id="ampShow">80</span></label>
            <input type="range" id="amplitude" min="20" max="150" value="80">
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

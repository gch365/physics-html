<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">
    <meta name="author" content="物理仿真实验室">

    <title>LC振荡电路——物理仿真实验室|108</title>
    <style>
        :root {
            --bg: #ffffff; --e-field: #FF5722; --b-field: #00BCD4; --i-vec: #E91E63; --wire: #333;
        }
        body { margin: 0; font-family: "PingFang SC", sans-serif; background: var(--bg); }
        .container { display: flex; height: 100vh; width: 100vw; }
        /* 移动端自适应：上下布局 */
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
                height: auto;
            }
            #left-panel, #right-panel {
                width: 100% !important;
                height: 50vh;
            }
            .controls {
                position: relative !important;
                bottom: 0 !important;
                width: 100% !important;
                padding: 10px !important;
                box-sizing: border-box;
            }
        }
        #left-panel { flex: 1.2; position: relative; border-right: 1px solid #eee; background: #fafafa; display: flex; flex-direction: column; }
        #right-panel { flex: 0.8; padding: 15px; display: flex; flex-direction: column; background: white; box-sizing: border-box; }
        
        .status-box {
            top: 10px; left: 10px; background: rgba(255,255,255,0.95);
            padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; z-index: 10; line-height: 1.5; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .energy-bar { display: inline-block; height: 8px; background: #eee; width: 50px; margin-left: 5px; border-radius: 4px; overflow: hidden; vertical-align: middle;}
        .energy-fill-e { height: 100%; background: var(--e-field); }
        .energy-fill-m { height: 100%; background: var(--b-field); }

        .controls { padding: 12px; border-top: 1px solid #eee; background: #fff; }
        .slider-row { display: flex; align-items: center; margin-bottom: 5px; gap: 8px; font-size: 16px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .val-disp { min-width: 35px; font-weight: bold; color: #2196F3; }
        
        .toggle-group { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; border: 1px dashed #ccc; padding: 8px; border-radius: 5px; }
        .toggle-group label { font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

        .btn-group { display: flex; gap: 5px; }
        button { flex: 1; padding: 6px; cursor: pointer; border: none; border-radius: 4px; background: #2196F3; color: white; font-weight: bold; font-size: 12px; }
        button:hover { background: #1976D2; }
        .btn-reset { background: #757575; }
        
        #circuit-svg { flex: 1; width: 100%; }
        canvas { width: 100%; height: 48%; }
    </style>
</head>
<body>

<div class="container">
    <div id="left-panel">

        <svg id="circuit-svg" viewBox="0 0 400 300">
            <defs>
                <marker id="arrE" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--e-field)" /></marker>
                <marker id="arrB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--b-field)" /></marker>
                <marker id="arrIMain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--i-vec)" /></marker>
                <marker id="arrICoil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--i-vec)" /></marker>
            </defs>

            <!-- 导线 -->
            <path d="M 120 100 L 120 60 L 280 60 L 280 100" fill="none" stroke="var(--wire)" stroke-width="2"/>
            <path d="M 120 200 L 120 240 L 280 240 L 280 210" fill="none" stroke="var(--wire)" stroke-width="2"/>

            <!-- 电容器 -->
            <line x1="80" y1="100" x2="160" y2="100" stroke="var(--wire)" stroke-width="4" />
            <line x1="80" y1="200" x2="160" y2="200" stroke="var(--wire)" stroke-width="4" />
            <g id="e-field-layer"></g>
            <g id="q-signs-layer"></g>

            <!-- 线圈部分 -->
            <rect x="250" y="90" width="30" height="120" fill="#f0f0f0" stroke="#ccc" rx="2" />
            <g id="coil-back"></g>
            <g id="coil-front"></g>
            <g id="b-field-layer"></g>

            <!-- 主电流矢量 -->
            <g id="i-main-layer">
                <line id="vec-i-line" x1="160" y1="60" x2="240" y2="60" stroke="var(--i-vec)" stroke-width="3" />
            </g>
        </svg>

        <div class="controls">
            <div class="status-box">
                状态: <span id="stage-text" style="color:var(--i-vec); font-weight:bold;">--</span>  | 
                电场能 Ue: <div class="energy-bar"><div id="bar-e" class="energy-fill-e"></div></div>  | 
                磁场能 Um: <div class="energy-bar"><div id="bar-m" class="energy-fill-m"></div></div> | 
                周期 T: <span id="lab-T">--</span> s | 电荷q: <span id="lab-q">--</span> | 回路电流i: <span id="lab-i">--</span>
            </div>
            <div class="slider-row"><label>电感L</label><input type="range" id="set-L" min="0.5" max="3" step="0.1" value="1.5"><span class="val-disp" id="val-L">1.5</span>
                                  <label>电容C</label><input type="range" id="set-C" min="0.5" max="3" step="0.1" value="1.5"><span class="val-disp" id="val-C">1.5</span></div>
            <div class="slider-row"><label>回路电阻R</label><input type="range" id="set-R" min="0" max="1" step="0.05" value="0"><span class="val-disp" id="val-R">0.0</span>
                                  <label>演示速度</label><input type="range" id="set-speed" min="0.1" max="2" step="0.1" value="1"><span class="val-disp" id="val-speed">1.0x</span></div>
            
            <div class="toggle-group">
                <label><input type="checkbox" id="chk-e" checked>显示电场方向</label>
                <label><input type="checkbox" id="chk-b" checked>显示磁场与线圈电流</label>
                <label><input type="checkbox" id="chk-q" checked>显示极板正负极</label>
                <label><input type="checkbox" id="chk-i" checked>显示回路电流方向</label>
            </div>

            <div class="btn-group">
                <button id="btn-pause">暂停</button>
                <button id="btn-step" style="background:#FF9800">步进</button>
                <button id="btn-reset" class="btn-reset">重置</button>
            </div>
                <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
        </div>
    </div>
    <div id="right-panel">
        <canvas id="chart-q"></canvas>
        <canvas id="chart-i"></canvas>
    </div>
</div>

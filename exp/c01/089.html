    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>单摆探究实验室——物理仿真实验室|89</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --accent: #2563eb;
            --text-dark: #1e293b;
            --val-color: #0369a1;
            --trend-up: #ef4444;
            --trend-down: #22c55e;
            --trend-peak: #f59e0b;
        }

        body {
            margin: 0; padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        header {
            background: #1e293b; color: white;
            padding: 8px 20px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 100;
        }

        main { display: flex; flex: 1; overflow: hidden; }

        /* 左侧控制栏 */
        #controls {
            width: 400px; background: var(--panel-bg);
            border-right: 1px solid #cbd5e1;
            display: flex; flex-direction: column;
            overflow-y: auto; z-index: 10;
        }

        .control-section {
            padding: 5px; border-bottom: 1px solid #e2e8f0;
        }

        .control-section h3 {
            margin: 0 0 10px 0; font-size: 0.95rem;
            color: var(--accent); border-left: 4px solid var(--accent);
            padding-left: 10px;
        }

        /* 仿真画布区 */
        #display-area {
            flex: 1; position: relative; background: white;
            display: flex; justify-content: center; align-items: flex-start;
        }
        canvas#simCanvas { width: 100%; height: 100%; }

        /* 滑块样式 */
        .input-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 0.85rem; }
        .input-item label { flex: 1; }
        .input-item input[type="range"] { flex: 1.2; }
        .input-item span { width: 50px; text-align: right; font-weight: bold; color: var(--val-color); }

        /* 数据表格 */
        .data-grid {
            width: 100%; border-collapse: collapse; font-size: 1rem; margin-top: 5px;
        }
        .data-grid th { background: #f8fafc; text-align: left; padding: 4px; border: 1px solid #e2e8f0; }
        .data-grid td { padding: 4px; border: 1px solid #e2e8f0; font-family: monospace; }
        
        .trend-tag { font-weight: bold; padding: 1px 3px; border-radius: 3px; font-size: 0.75rem; }

        /* 计时器面板 */
        #stopwatch {
            background: #1e293b; color: #4ade80; padding: 5px 5px;
            border-radius: 2px; font-size: 2rem; font-family: monospace;
            display: flex;  align-items: center; gap: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .sw-btns { display: flex; gap: 10px; }
        .sw-btns button { padding: 5px 12px; font-size: 0.8rem; }

        canvas#graphCanvas { width: 100%; height: 120px; border: 1px solid #e2e8f0; border-radius: 4px; background: #fff; }

        button {
            padding: 8px 16px; border: none; border-radius: 4px;
            background: var(--accent); color: white; cursor: pointer; font-weight: bold;
        }
        button:active { opacity: 0.8; }
        button.secondary { background: #64748b; }
        button.danger { background: #ef4444; }

        @media (max-width: 900px) {
            main { flex-direction: column; overflow-y: auto; }
            #controls { width: 100%; height: auto; }
            #display-area { height: 450px; }
        }
    </style>
</head>
<body>

<header>单摆探究实验室</header>

<main>
    <div id="display-area">
        <canvas id="simCanvas"></canvas>
    </div>
    <div id="controls">
        <div id="stopwatch">
            <div id="sw-time">0.00s</div>
            <div class="sw-btns">
                <button id="sw-start">启动</button>
                <button id="sw-pause" class="secondary">暂停</button>
                <button id="sw-clear" class="danger">清零</button>
            </div>
        </div>
        <div class="control-section">
            <h3>振动图像 (x-t)</h3>
            <canvas id="graphCanvas"></canvas>
        </div>
        <div class="control-section">
            <h3>实时分析看板</h3>
            <table class="data-grid">
                <tr><th>物理量</th><th>数值</th><th>方向</th><th>特征趋势</th></tr>
                <tr><td>摆角 θ</td><td id="d-theta">0</td><td>-</td><td id="tr-theta">-</td></tr>
                <tr><td>位移 x</td><td id="d-x">0</td><td id="dir-x">-</td><td id="tr-x">-</td></tr>
                <tr><td>速度 v</td><td id="d-v">0</td><td id="dir-v">-</td><td id="tr-v">-</td></tr>
                <tr><td>加速度 a</td><td id="d-a">0</td><td id="dir-a">-</td><td id="tr-a">-</td></tr>
                <tr><td>回复力 F</td><td id="d-f">0</td><td id="dir-f">-</td><td id="tr-f">-</td></tr>
            </table>
            <div style="margin-top:8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 1rem;">
                <div>理论周期: <span id="d-T" style="color:var(--accent)">0</span> s</div>
                <div>运行时间: <span id="d-t" style="color:var(--accent)">0</span> s</div>
                <div>动能 Ek: <span id="d-ek" style="color:var(--accent)">0</span> J</div>
                <div>势能 Ep: <span id="d-ep" style="color:var(--accent)">0</span> J</div>
            </div>
        </div>
        <div class="control-section">
            <h3>实验参数设置</h3>
            <div class="input-item">
                <label>摆长 L (m):</label>
                <input type="range" id="param-L" min="0.5" max="5.0" step="0.1" value="2.0">
                <span id="val-L">3.0</span>
            </div>
            <div class="input-item">
                <label>重力 g (m/s²):</label>
                <input type="range" id="param-g" min="0" max="20" step="0.1" value="9.8">
                <span id="val-g">9.8</span>
            </div>
            <div class="input-item">
                <label>球半径 R (px):</label>
                <input type="range" id="param-R" min="5" max="40" step="1" value="10">
                <span id="val-R">10</span>
            </div>
            <div class="input-item">
                <label>阻尼系数 b:</label>
                <input type="range" id="param-b" min="0" max="1" step="0.01" value="0">
                <span id="val-b">0</span>
            </div>
            <div class="input-item">
                <label>初始振幅 (°):</label>
                <input type="range" id="param-A" min="1" max="90" step="1" value="7">
                <span id="val-A">7</span>
            </div>
            <div class="input-item">
                <label>球质量 m (kg):</label>
                <input type="range" id="param-m" min="0.1" max="5.0" step="0.1" value="1.0">
                <span id="val-m">1.0</span>
            </div>
        </div>
        <div class="control-section">
            <h3>仿真显示控制</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; font-size:0.8rem;">
                <label><input type="checkbox" id="show-disp"> 位移矢量</label>
                <label><input type="checkbox" id="show-vel"> 速度矢量</label>
                <label><input type="checkbox" id="show-res"> 回复力矢量</label>
                <label><input type="checkbox" id="show-forces"> 受力分析</label>
            </div>
            <div class="btn-group" style="margin-top:12px; display:flex; gap:10px;">
                <button id="btn-play">暂停</button>
                <button id="btn-reset" class="secondary">重置</button>
            </div>
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
    </div>
</main>

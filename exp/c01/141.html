    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>汽车爬坡换挡(变速箱)及机车的两种启动方式——物理仿真实验室|141</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --info: #3498db;
            --success: #27ae60;
        }

        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #fff; display: flex; height: 100vh; overflow: hidden; }
        #main-container { display: flex; width: 100%; height: 100%; }

        /* 左侧演示区 */
        #visual-area { flex: 1; position: relative; background: linear-gradient(to bottom, #dbe9f6 0%, #fff 100%); overflow: hidden; border-right: 2px solid #ddd; }
        
        /* 右侧控制区 */
        #control-panel { width: 420px; padding: 15px; background: #fdfdfd; box-shadow: -5px 0 15px rgba(0,0,0,0.1); overflow-y: auto; z-index: 100; }

        @media (max-width: 1000px) { #main-container { flex-direction: column; } #visual-area { height: 35%; } #control-panel { width: 100%; height: 65%; } }

        /* 看板与图标 */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #2c3e50; color: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-family: 'Consolas', monospace; font-size: 0.8rem; }
        .data-item b { color: #f1c40f; }

        .graph-container { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 5px; margin-bottom: 15px; position: relative; }
        canvas { width: 100%; height: 130px; display: block; }

        /* 控件 */
        .ctrl-group { margin-bottom: 10px; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid #eee; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.8rem; color: #34495e; }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn-row { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .main-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 0.8rem; min-width: 80px; }
        #pause-btn { background: #f39c12; }
        #reset-btn { background: #7f8c8d; }
        .mode-btn { background: #95a5a6; }
        .mode-btn.active { background: var(--info); }
        #start-sim-btn { background: var(--success); width: 100%; font-size: 1rem; margin-top: 5px; display: none; }
        #brake-btn { background: #95a5a6; width: 100%; margin-top: 5px; }
        #brake-btn.active { background: var(--accent); }

        .gear-box { display: flex; gap: 4px; }
        .gear-btn { flex: 1; padding: 8px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .gear-btn.active { background: var(--primary); color: white; }

        /* 场景 */
        #road-scene { position: absolute; bottom: 0; width: 100%; height: 30%; background: #95a5a6; transform-origin: left bottom; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #ground { position: absolute; bottom: 0; width: 1000%; height: 80%; background: repeating-linear-gradient(90deg, #555 0, #555 80px, #666 80px, #666 160px); border-top: 4px solid #333; }
        #gear-inspect { background: rgba(255,255,255,0.95); padding: 10px; border-radius: 12px; border: 2px solid var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-tag { position: absolute; top: 15px; left: 15px; background: var(--primary); color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; z-index: 50; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="visual-area">
        <div class="status-tag" id="status-tag">就绪：请选择启动模式</div>

        <div id="road-scene">
            <div id="ground"></div>
            <div id="trees-layer"></div>
            <svg id="car" viewBox="0 0 200 100" style="position:absolute; bottom:30px; left:60px; width:180px; z-index:10;">
                <path d="M10 60 L35 25 L145 25 L185 60 L195 60 L195 85 L10 85 Z" fill="#34495e" />
                <rect x="40" y="30" width="40" height="25" fill="#cae9ff" />
                <rect x="90" y="30" width="45" height="25" fill="#cae9ff" />
                <g id="wheel-f" transform="translate(155, 85)"><circle r="15" fill="#222"/><path d="M-15 0 L15 0 M0 -15 L0 15" stroke="#777" stroke-width="2"/></g>
                <g id="wheel-r" transform="translate(45, 85)"><circle r="15" fill="#222"/><path d="M-15 0 L15 0 M0 -15 L0 15" stroke="#777" stroke-width="2"/></g>
            </svg>
        </div>
    </div>

    <div id="control-panel">
        <div class="btn-row">
            <button id="pause-btn" class="main-btn" onclick="togglePause()">暂停/继续</button>
            <button id="reset-btn" class="main-btn" onclick="resetAll()">重置实验</button>
        </div>
        
        <label>① 选择起步教学类型</label>
        <div class="btn-row">
            <button id="btn-mode-a" class="main-btn mode-btn" onclick="selectMode('const_a')">匀加速启动 (CA)</button>
            <button id="btn-mode-p" class="main-btn mode-btn" onclick="selectMode('const_p')">恒功率启动 (CP)</button>
        </div>

        <div class="ctrl-group" id="group-target-a" style="display:none; border: 1px solid var(--info); background: #f0faff;">
            <label>② 设置起步加速度 (a): <span id="lbl-target-a">1.5</span> m/s²</label>
            <input type="range" id="inp-target-a" min="0.5" max="5.0" step="0.1" value="1.5">
        </div>

        <button id="start-sim-btn" class="main-btn" onclick="startSimulation()">③ 点击确认起步</button>
        <div class="ctrl-group">
            <label>油门踩踏 (Throttle): <span id="lbl-throttle">0</span>%</label>
            <input type="range" id="inp-throttle" min="0" max="100" value="0">
            <button id="brake-btn" class="main-btn">制动刹车 (Brake)</button>
        </div>
        <div class="dashboard">
            <div class="data-item">额定功率: <b id="ds-p-rat">120</b> kW</div>
            <div class="data-item">实际功率: <b id="ds-p-act">0.0</b> kW</div>
            <div class="data-item">牵引力 F: <b id="ds-f-tract">0</b> N</div>
            <div class="data-item">总阻力 f: <b id="ds-f-res">0</b> N</div>
            <div class="data-item">车速: <b id="ds-v">0.0</b> km/h</div>
            <div class="data-item">加速度 a: <b id="ds-a">0.0</b> m/s²</div>
            <div class="data-item">发动机: <b id="ds-rpm-e">0</b> RPM</div>
            <div class="data-item">车轮: <b id="ds-rpm-w">0</b> RPM</div>
        </div>
        <div class="graph-container">
            <canvas id="vt-graph"></canvas>
            <div style="position:absolute; top:2px; right:5px; font-size:10px; color:#999;">物理图线 (v-t 动态模拟)</div>
        </div>

        <div id="gear-inspect">
            <div style="font-size: 11px; font-weight: bold; text-align:center; margin-bottom:5px;">变速箱原理 (蓝色:发动机齿轮 | 红色:驱动轴齿轮)</div>
        
            <svg width="220" height="160" id="svg-gearbox">
                <g id="g-engine" transform="translate(60, 80)">
                    <circle id="engine-gear-c" r="20" fill="none" stroke="var(--info)" stroke-width="3" stroke-dasharray="5,2"/>
                    <circle r="4" fill="var(--info)"/>
                </g>
                <g id="g-drive" transform="translate(150, 80)">
                    <circle id="drive-gear-c" r="70" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5,2"/>
                    <circle r="4" fill="var(--accent)"/>
                </g>
            </svg>
            <div id="gear-ratio-tag" style="font-size: 11px; text-align: center; color:#555;">总传动比: 14.50</div>
        </div>
        <div class="ctrl-group">
            <label>手动换挡 (换低档增加牵引力上限)</label>
            <div class="gear-box">
                <button class="gear-btn active" onclick="setGear(1)">1</button>
                <button class="gear-btn" onclick="setGear(2)">2</button>
                <button class="gear-btn" onclick="setGear(3)">3</button>
                <button class="gear-btn" onclick="setGear(4)">4</button>
                <button class="gear-btn" onclick="setGear(5)">5</button>
            </div>
        </div>

        <div class="ctrl-group">
            <label>车辆参数</label>
            <label style="font-weight:normal; font-size:0.75rem;">额定输出功率 P_e: <span id="lbl-p-rat">120</span> kW</label>
            <input type="range" id="inp-p-rat" min="40" max="500" value="120">
            <label style="font-weight:normal; font-size:0.75rem;">车辆质量 m: <span id="lbl-mass">1500</span> kg</label>
            <input type="range" id="inp-mass" min="500" max="5000" value="1500">
        </div>

        <div class="ctrl-group">
            <label>环境阻力与坡度</label>
            <label style="font-weight:normal; font-size:0.75rem;">阻力模型: <select id="inp-res-type"><option value="const">恒定阻力 f=k</option><option value="prop">速度正比 f=k·v</option></select></label>
            <label style="font-weight:normal; font-size:0.75rem;">系数 k: <span id="lbl-res-k">500</span></label>
            <input type="range" id="inp-res-k" min="100" max="5000" value="500">
            <label style="font-weight:normal; font-size:0.75rem;">坡角 θ: <span id="lbl-slope">0</span>°</label>
            <input type="range" id="inp-slope" min="-15" max="30" value="0">
        </div>
        <div class="ctrl-group">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
        </div>
    </div>
</div>

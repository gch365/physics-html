<html lang="zh-CN">

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>缩放圆模型——物理仿真实验室|50</title>
    <style>
        :root { --primary: #2196F3; --accent: #f44336; --bg: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        
        #canvas-area { flex: 1; position: relative; touch-action: none; background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 30px 30px; }
        svg { width: 100%; height: 100%; }

        #panel { 
            background: #fdfdfd; border-top: 1px solid #ccc; padding: 10px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 10px; z-index: 10; max-height: 45vh; overflow-y: auto;
        }
        .group { border: 1px solid #eee; padding: 8px; border-radius: 4px; background: #fff; }
        .group label { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        input[type="range"] { width: 100%; cursor: pointer; }

        #dashboard {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8);
            color: #00ff00; padding: 12px; border-radius: 8px; font-family: monospace;
            font-size: 13px; pointer-events: none; border: 1px solid #555; z-index: 20;
        }

        .status-tip { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .badge { background: white; border: 1px solid #999; padding: 3px 10px; border-radius: 15px; font-size: 11px; margin-bottom: 5px; display: inline-block; }

        .traj { fill: none; stroke-width: 2; transition: stroke-width 0.2s; cursor: pointer; }
        .traj:hover { stroke-width: 4; }
        .traj.selected { stroke-width: 5; filter: drop-shadow(0 0 5px rgba(255,215,0,0.8)); stroke-opacity: 1 !important; }

        button { padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; width: 100%; margin-bottom: 5px; font-size: 16px; }
        .btn-mode { background: #607d8b; color: white; flex: 1; font-size: 11px; }
        .btn-mode.active { background: var(--accent); }

        #v0-direction-vector { stroke: #0d47a1; stroke-width: 3; marker-end: url(#arrow-blue); }
    </style>
</head>
<body>

<div id="app">
    <div id="canvas-area">
        <div class="status-tip">
            <div id="cur-mode" class="badge">模式: 选择与分析</div><br>
            <div class="badge">提示：调节参数即时预览，发射后粒子沿运动留迹</div>
        </div>

        <div id="dashboard">
            <div style="color:#aaa; border-bottom:1px solid #555; margin-bottom:5px;">数据看板</div>
            <div id="data-text">点击轨迹查看详情</div>
        </div>

        <svg id="main-svg">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
                </marker>
                 <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d47a1" />
                </marker>
            </defs>
            <g id="g-centerline" stroke="#bbb" stroke-dasharray="5,5" visibility="hidden"></g>
            <g id="g-aux" stroke="#4CAF50" stroke-width="2"></g>
            <g id="g-trajs"></g>
            <g id="g-parts"></g>
            
            <line id="v0-direction-vector" x1="0" y1="0" x2="0" y2="0" visibility="hidden" />
            <line id="v-vector" x1="0" y1="0" x2="0" y2="0" stroke="#333" stroke-width="3" marker-end="url(#arrow)" visibility="hidden" />
            
            <rect id="barrier" fill="#78909c" rx="2" />
            <circle id="emitter" r="6" fill="#ff5722" stroke="white" stroke-width="2" />
            <circle id="guide-dot" r="4" fill="#4CAF50" visibility="hidden" />
        </svg>
    </div>

    <div id="panel">
        <div class="group">
            <button class="btn-main" onclick="launch()">🚀 动态演示</button>
            <div style="display:flex; gap:5px;">
                
                <button id="m-select" class="btn-mode active" onclick="setMode('select')">选择</button>
                <button id="m-draw" class="btn-mode" onclick="setMode('draw')">画线</button>
                <button style="background:#ff9800; color:white;" onclick="clearAux()">清空</button>
            </div>
        </div>

        <div class="group">
            <label>粒子数: <span id="v-cnt">12</span></label>
            <input type="range" id="p-cnt" min="1" max="25" value="12">
            <label>发射方向: <span id="v-ang">0</span>°</label>
            <input type="range" id="p-ang" min="0" max="360" value="0">
        </div>

        <div class="group">
            <label>磁场 B: <span id="v-b">1.0</span></label>
            <input type="range" id="p-b" min="-3" max="3" step="0.1" value="1.0">
            <label>荷质比 q/m: <span id="v-qm">1.0</span></label>
            <input type="range" id="p-qm" min="-2" max="2" step="0.1" value="1.0">
        </div>

        <div class="group">
            <label>挡板位置 X: <span id="v-bx">0</span></label>
            <input type="range" id="p-bx" min="-400" max="400" value="0">
            <label>挡板位置 Y: <span id="v-by">150</span></label>
            <input type="range" id="p-by" min="0" max="500" value="150">
        </div>

        <div class="group">
            <label>挡板长度: <span id="v-bl">200</span></label>
            <input type="range" id="p-bl" min="10" max="600" value="200">
            <label>挡板角度: <span id="v-ba">0</span>°</label>
            <input type="range" id="p-ba" min="0" max="360" value="0">
        </div>
        <div class="group">
            <label><input type="checkbox" id="p-showc" onchange="toggleCenterLine()"> 显示圆心线</label>
            <label><input type="checkbox" id="p-show-v0-dir" onchange="toggleInitialV0Direction()"> 显示发射速度方向</label>
        </div>
    </div>
</div>

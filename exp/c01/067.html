<html lang="zh-CN">
<head>

    <!-- 头部文件开始 -->
    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">
    <meta name="keywords" content="物理仿真实验、高中物理实验动画、初中物理演示实验、物理实验模拟网站、免费物理实验资源">

    <title>飞机投弹问题规律探究——物理仿真实验室|67</title>
    <style>
        :root {
            --panel-width: 320px;
            --primary: #2c3e50;
            --accent: #3498db;
            --danger: #e74c3c;
            --success: #27ae60;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #fff; overflow: hidden;
        }

        .container { display: flex; height: 100vh; width: 100vw; }

        /* 控制面板 */
        .controls {
            width: var(--panel-width);
            background: #fdfdfd;
            border-right: 1px solid #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        /* 仿真画布 */
        .simulation {
            flex-grow: 1;
            position: relative;
            background: #fff;
        }

        h2 { font-size: 1.3rem; margin: 0 0 10px 0; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        .group { display: flex; flex-direction: column; gap: 5px; background: #f8f9fa; padding: 10px; border-radius: 8px; }
        label { font-size: 0.85rem; color: #555; display: flex; justify-content: space-between; }
        label span { font-weight: bold; color: var(--accent); }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; padding: 5px; }
        .checkbox-group label { justify-content: flex-start; gap: 10px; cursor: pointer; }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        #start-btn { background: var(--success); }
        #reset-btn { background: var(--danger); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        /* SVG 样式 */
        svg { width: 100%; height: 100%; }
        .ground { fill: #ecf0f1; stroke: #bdc3c7; stroke-width: 2; }
        .guide-line { stroke: var(--danger); stroke-width: 1; stroke-dasharray: 4,4; opacity: 0.6; }
        .dist-line { stroke: #8e44ad; stroke-width: 1.5; }
        .dist-text { fill: #8e44ad; font-size: 12px; font-weight: bold; }
        .land-dist-line { stroke: #2980b9; stroke-width: 1.5; }
        .land-dist-text { fill: #2980b9; font-size: 12px; font-weight: bold; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .controls { width: 100%; height: 45%; border-right: none; border-bottom: 1px solid #eee; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="simulation" id="sim-container">
        <svg id="svg-canvas" preserveAspectRatio="xMinYMin meet">
            <!-- 网格线背景 -->
            <defs>
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f0f0f0" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <line id="ground-line" x1="0" y1="550" x2="5000" y2="550" class="ground" stroke="#bdc3c7" stroke-width="4" />
            
            <g id="measure-layer"></g>
            <g id="bombs-group"></g>
            <line id="guide-line" x1="0" y1="0" x2="0" y2="550" class="guide-line" style="display:none" />
            
            <!-- 飞机图片组件 -->
            <image id="airplane" width="60" height="30" 
                href="plane.png"
                style="transform-origin: center;"
            />
        </svg>
    </div>
    <div class="controls">
        <h2>飞机投弹仿真</h2>
        <div class="btn-row">
            <button id="start-btn">开始模拟</button>
            <button id="reset-btn">重置</button>
        </div>
        <div class="group">
            <label>初速度 (v₀): <span id="v0-val">50</span> m/s</label>
            <input type="range" id="v0" min="20" max="120" value="50">
        </div>

        <div class="group">
            <label>加速度 (a): <span id="acc-val">0</span> m/s²</label>
            <input type="range" id="acc" min="-10" max="10" value="0" step="0.5">
        </div>

        <div class="group">
            <label>飞行高度 (H): <span id="h-val">300</span> m</label>
            <input type="range" id="h" min="100" max="500" value="300">
        </div>

        <div class="group">
            <label>投放间隔 (T): <span id="interval-val">1.0</span> s</label>
            <input type="range" id="interval" min="0.2" max="3" value="1.0" step="0.1">
        </div>

        <div class="checkbox-group">
            <label><input type="checkbox" id="show-guide" checked> 显示竖直参考线</label>
            <label><input type="checkbox" id="show-v-dist" checked> 显示空中竖直间距</label>
            <label><input type="checkbox" id="show-h-dist" checked> 显示落地水平间距</label>
        </div>
        <div style="font-size: 0.75rem; color: #7f8c8d; line-height: 1.4;">
            * 物理提示：若 a=0，炸弹在空中保持竖直对齐；若 a>0，炸弹在空中呈曲线分布且落点间距增大。
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

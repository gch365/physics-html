    <title>带电粒子在电场中的加速与偏转——物理仿真实验室|170</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --accent-color: #FF5722;
            --particle2-color: #00E676;
            --panel-bg: #2c3e50;
            --text-light: #ecf0f1;
            --bg-white: #ffffff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Segoe UI', "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background-color: var(--bg-white);
        }

        #app { display: flex; width: 100vw; height: 100vh; flex-direction: row; }

        @media (max-width: 768px) {
            #app { flex-direction: column; }
            #control-panel { width: 100% !important; height: 50% !important; order: 2; }
            #stage-container { height: 50% !important; order: 1; }
        }

        #control-panel {
            width: 350px; background: var(--panel-bg);
            color: var(--text-light); padding: 15px 20px;
            overflow-y: auto; box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            z-index: 100; box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        .param-group {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px; border-radius: 8px; margin-bottom: 10px;
            flex-shrink: 0;
        }

        h2 { font-size: 1.1rem; margin: 0 0 10px 0; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; }
        h3 { font-size: 0.85rem; color: var(--primary-color); margin: 5px 0; }

        label { display: block; font-size: 0.75rem; margin-bottom: 2px; opacity: 0.9; }
        input[type="range"] { width: 100%; margin-bottom: 5px; accent-color: var(--primary-color); cursor: pointer; }
        
        .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        input[type="number"] {
            width: 50px; background: #34495e; border: 1px solid #5d6d7e;
            color: white; border-radius: 4px; padding: 1px 4px; font-size: 0.8rem;
        }

        .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 5px; color: #ffeb3b; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; flex-shrink: 0;}
        button {
            padding: 8px 5px; border: none; border-radius: 4px; cursor: pointer;
            font-weight: bold; color: white; font-size: 0.8rem; transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        .btn-p1 { background: var(--accent-color); }
        .btn-p2 { background: var(--particle2-color); color: #1a252f; }
        .btn-dual { background: var(--primary-color); grid-column: span 1; }
        .btn-pause { background: #9b59b6; grid-column: span 1; }
        .btn-clear { background: #e74c3c; grid-column: span 2; }

        /* 实时看板样式：文字颜色修正为白色 */
        #data-overlay {
            margin-top: 20px;
            padding: 12px 0;
            border-top: 1px dashed rgba(255,255,255,0.3);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            line-height: 1.4;
            color: #ffffff; /* 确保默认文字为白色 */
            flex-grow: 1;
        }

        #stage-container {
            flex-grow: 1; position: relative; background: #fff;
            overflow: hidden; touch-action: none;
        }
        canvas, svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #svg-layer { pointer-events: none; z-index: 10; }
        #trackCanvas { z-index: 5; }
    </style>
</head>
<body>

<div id="app">
    <div id="control-panel">
      <h2>物理参数设置</h2>
        
        <div class="param-group">
            <h3>1. 加速电场</h3>
            <label>加速电压 $U_1$: <span id="val-u1">200</span> V</label>
            <input type="range" id="u1" min="50" max="1000" value="200">
            <label>板间距 $d_1$: <span id="val-d1">5</span> cm</label>
            <input type="range" id="d1" min="2" max="10" value="5">
        </div>

        <div class="param-group">
            <h3>2. 偏转电场与屏幕</h3>
            <label>偏转电压 $U_2$: <span id="val-u2">150</span> V</label>
            <input type="range" id="u2" min="-600" max="600" value="150">
            <label>极板长度 $L$: <span id="val-l">15</span> cm</label>
            <input type="range" id="l" min="5" max="25" value="15">
            <label>极板间距 $d_2$: <span id="val-d2">10</span> cm</label>
            <input type="range" id="d2" min="5" max="15" value="10">
            <label>荧光屏距离 $L_s$: <span id="val-ls">10</span> cm</label>
            <input type="range" id="ls" min="2" max="30" value="10">
        </div>

        <div class="param-group">
            <h3>3. 视觉辅助</h3>
            <div class="checkbox-row">
                <input type="checkbox" id="show-fields" checked> 
                <label for="show-fields">显示动态密度电场线</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="show-velocity" checked> 
                <label for="show-velocity">显示速度矢量 (v)</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="show-coords" checked> 
                <label for="show-coords">显示坐标系 (Grid)</label>
            </div>
        </div>

        <div class="param-group">
            <h3 style="color:var(--accent-color)">粒子 1 (红色)</h3>
            <div class="prop-row"><label>电量 q:</label><input type="number" id="q1" value="1"></div>
            <div class="prop-row"><label>质量 m:</label><input type="number" id="m1" value="1"></div>
            
            <h3 style="color:var(--particle2-color)">粒子 2 (绿色)</h3>
            <div class="prop-row"><label>电量 q:</label><input type="number" id="q2" value="1"></div>
            <div class="prop-row"><label>质量 m:</label><input type="number" id="m2" value="2"></div>
        </div>

        <div class="btn-group">
            <button class="btn-p1" onclick="launch(1)">发射粒子 1</button>
            <button class="btn-p2" onclick="launch(2)">发射粒子 2</button>
            <button class="btn-dual" onclick="launchDual()">同步发射</button>
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()">暂停</button>
            <button class="btn-clear" onclick="clearTracks()">清屏</button>
        </div>

        <div id="data-overlay">等待发射...</div>
        <div class="param-group">
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->
        </div>
    </div>

    <div id="stage-container">
        <canvas id="trackCanvas"></canvas>
        <svg id="svg-layer">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc" />
                </marker>
                <marker id="v-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2980b9" />
                </marker>
                <marker id="field-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(100,100,255,0.4)" />
                </marker>
                <marker id="axis-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#999" />
                </marker>
            </defs>
            <g id="coord-layer"></g>
            <g id="field-layer"></g>
            <g id="static-group"></g>
            <g id="dynamic-group"></g>
        </svg>
    </div>
</div>

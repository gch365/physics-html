    <title>电磁感应发电式单杆模型——物理仿真实验室|54</title>
    <style>
        :root {
            --primary: #2196F3;
            --accent: #E91E63;
            --bg: #ffffff;
            --data-bg: #f8f9fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; background: var(--bg);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        header { background: #333; color: white; padding: 10px; text-align: center; font-size: 1.1rem; }
        
        main { display: flex; flex: 1; overflow: hidden; }
        @media (max-width: 850px) {
            main { flex-direction: column; overflow-y: auto; }
            #sim-section { height: auto; }
            #controls { width: 100% !important; border-left: none !important; border-top: 1px solid #ddd; }
            #canvas-wrap { height: 300px; }
        }

        #sim-section { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; }
        
        /* 数据显示网格 */
        #data-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 6px; background: var(--data-bg); padding: 10px; border-radius: 6px; border: 1px solid #dee2e6;
        }
        .data-item { font-size: 0.8rem; color: #444; }
        .data-item span { font-weight: bold; color: #d32f2f; font-family: monospace; }
        .energy-tag { color: #2e7d32 !important; }

        #canvas-wrap { flex: 1; position: relative; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        canvas { width: 100%; height: 100%; display: block; }

        #charts { 
                flex: 1;
                height: 300px; /* 建议将高度翻倍，以便容纳两个纵向堆叠的图表 */
                display: flex;
                flex-direction: column; /* 新增此行，强制垂直排列 */
                gap: 10px;
        }
        .chart-box { flex: 1; background: #fff; border: 1px solid #eee; position: relative; }

        /* 控制面板 */
        #controls { width: 330px; background: #fefefe; border-left: 1px solid #ddd; padding: 15px; overflow-y: auto; }
        .group { margin-bottom: 12px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
        .group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; }
        .val { width: 45px; text-align: right; font-size: 0.85rem; color: var(--primary); font-weight: bold; }
        
        .btn-box { display: flex; gap: 8px; margin-bottom: 15px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold; }
        #btn-play { background: #4caf50; }
        #btn-play.pause { background: #ff9800; }
        #btn-reset { background: #f44336; }
        .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.8rem; }
    </style>
</head>

<header>电磁感应发电式单杆模型</header>

<main>
    <div id="sim-section">
        <div id="data-grid">
            <div class="data-item">时间 t: <span id="d-t">0.00</span> s</div>
            <div class="data-item">位移 x: <span id="d-x">0.00</span> m</div>
            <div class="data-item">速度 v: <span id="d-v">0.00</span> m/s</div>
            <div class="data-item">加速度 a: <span id="d-a">0.00</span> m/s²</div>
            <div class="data-item">电动势 E: <span id="d-E">0.00</span> V</div>
            <div class="data-item">电流 I: <span id="d-I">0.00</span> A</div>
            <div class="data-item">安培力 Fa: <span id="d-Fa">0.00</span> N</div>
            <div class="data-item">摩擦力 f: <span id="d-f">0.00</span> N</div>
            <div class="data-item">合外力 F合: <span id="d-Fn">0.00</span> N</div>
            <div class="data-item">拉力做功 WF: <span id="d-wf" class="energy-tag">0.00</span> J</div>
            <div class="data-item">动能 Ek: <span id="d-ek" class="energy-tag">0.00</span> J</div>
            <div class="data-item">负载热 QR: <span id="d-qr" class="energy-tag">0.00</span> J</div>
            <div class="data-item">内阻热 Qr: <span id="d-qri" class="energy-tag">0.00</span> J</div>
            <div class="data-item">摩擦热 Qf: <span id="d-qf" class="energy-tag">0.00</span> J</div>
            <div class="data-item" style="grid-column: span 2; background: #e3f2fd; padding: 2px;">
                总能量 (Ek+QR+Qr+Qf): <span id="d-total" style="color:#1565c0">0.00</span> J
            </div>
        </div>

        <div id="canvas-wrap">
            <canvas id="mainSim"></canvas>
        </div>

        <div id="charts">
            <div class="chart-box"><canvas id="vChart"></canvas></div>
            <div class="chart-box"><canvas id="aChart"></canvas></div>
        </div>
    </div>

    <div id="controls">
        <div class="btn-box">
            <button id="btn-play">启动模拟</button>
            <button id="btn-reset">重置实验</button>
        </div>

        <div class="group">
            <label>恒定拉力 F (N)</label>
            <div class="row">
                <input type="range" id="p-F" min="-5" max="5" step="0.1" value="1.0">
                <span class="val" id="v-F">1.0</span>
            </div>
        </div>

        <div class="group">
            <label>磁感强度 B (T)</label>
            <div class="row">
                <input type="range" id="p-B" min="-2.0" max="2.0" step="0.1" value="1.0">
                <span class="val" id="v-B">1.0</span>
            </div>
        </div>

        <div class="group">
            <label>金属杆质量 m (kg)</label>
            <div class="row">
                <input type="range" id="p-m" min="0.1" max="2.0" step="0.1" value="0.5">
                <span class="val" id="v-m">0.5</span>
            </div>
        </div>

        <div class="group">
            <label>负载电阻 R (Ω)</label>
            <div class="row">
                <input type="range" id="p-R" min="0.5" max="10" step="0.5" value="2.0">
                <span class="val" id="v-R">2.0</span>
            </div>
        </div>

        <div class="group">
            <label>杆内阻 r (Ω)</label>
            <div class="row">
                <input type="range" id="p-ri" min="0" max="5" step="0.1" value="0.5">
                <span class="val" id="v-ri">0.5</span>
            </div>
        </div>

        <div class="group">
            <label>摩擦系数 μ</label>
            <div class="row">
                <input type="range" id="p-mu" min="0" max="0.5" step="0.01" value="0.1">
                <span class="val" id="v-mu">0.10</span>
            </div>
        </div>

        <div class="group">
            <label>轨道间距 L (m)</label>
            <div class="row">
                <input type="range" id="p-L" min="0.4" max="1.5" step="0.1" value="0.8">
                <span class="val" id="v-L">0.8</span>
            </div>
        </div>

        <div class="group">
            <label>显示选项</label>
            <div class="check-list">
                <label><input type="checkbox" id="c-force" checked> 受力矢量</label>
                <label><input type="checkbox" id="c-vel" checked> 速度矢量</label>
                <label><input type="checkbox" id="c-acc" checked> 加速度矢量</label>
                <label><input type="checkbox" id="c-cur" checked> 电阻电流方向</label>
            </div>
        </div>
    </div>
</main>

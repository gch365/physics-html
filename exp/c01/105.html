    <div class="header">
        <h1>🔬 探究向心力大小与半径、角速度、质量的关系</h1>
    </div>
    
    <div class="container">
        <div class="simulation-panel">
            <svg class="svg-container" viewBox="0 0 500 500" id="mainSvg">
                <!-- 背景 -->
                <defs>
                    <radialGradient id="wheelGradientA" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#4a4a6a"/>
                        <stop offset="100%" style="stop-color:#2a2a4a"/>
                    </radialGradient>
                    <radialGradient id="wheelGradientB" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#4a6a4a"/>
                        <stop offset="100%" style="stop-color:#2a4a2a"/>
                    </radialGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- 标题 -->
                <text x="250" y="30" text-anchor="middle" fill="#00d4ff" font-size="16" font-weight="bold">向心力演示仪（俯视图）</text>
                
                <!-- 皮带 -->
                <path id="belt" stroke="#8B4513" stroke-width="10" fill="none" opacity="0.9"/>
                
                <!-- 轮子A（主动轮） -->
                <g id="wheelA">
                    <circle id="wheelACircle" fill="url(#wheelGradientA)" stroke="#00d4ff" stroke-width="2"/>
                    <circle id="wheelACenter" r="8" fill="#00d4ff"/>
                    <line id="wheelASpoke1" stroke="#666" stroke-width="30"/>
                    <line id="wheelASpoke2" stroke="#666" stroke-width="0"/>
                    <text id="wheelALabel" fill="#00d4ff" font-size="14" font-weight="bold">A(主动轮)</text>
                </g>
                
                <!-- 轮子B（从动轮） -->
                <g id="wheelB">
                    <circle id="wheelBCircle" fill="url(#wheelGradientB)" stroke="#00ff88" stroke-width="2"/>
                    <circle id="wheelBCenter" r="8" fill="#00ff88"/>
                    <line id="wheelBSpoke1" stroke="#666" stroke-width="30"/>
                    <line id="wheelBSpoke2" stroke="#666" stroke-width="0"/>
                    <text id="wheelBLabel" fill="#00ff88" font-size="14" font-weight="bold">B(从动轮)</text>
                </g>
                
                <!-- 钢球1轨道 -->
                <circle id="orbit1" fill="none" stroke="rgba(255,107,107,0.3)" stroke-width="0" stroke-dasharray="5,5"/>
                
                <!-- 钢球2轨道 -->
                <circle id="orbit2" fill="none" stroke="rgba(107,107,255,0.3)" stroke-width="0" stroke-dasharray="5,5"/>
                
                <!-- 钢球1 -->
                <g id="ball1Group" filter="url(#glow)">
                    <circle id="ball1" fill="#ff6b6b"/>
                    <text id="ball1Label" fill="#fff" font-size="10" text-anchor="middle" dominant-baseline="middle">1</text>
                </g>
                
                <!-- 钢球2 -->
                <g id="ball2Group" filter="url(#glow)">
                    <circle id="ball2" fill="#6b6bff"/>
                    <text id="ball2Label" fill="#fff" font-size="10" text-anchor="middle" dominant-baseline="middle">2</text>
                </g>
                
                <!-- 向心力箭头1
                <g id="force1Group">
                    <line id="force1" stroke="#ff6b6b" stroke-width="3" marker-end="url(#arrowRed)"/>
                </g>
                 -->
                <!-- 向心力箭头2
                <g id="force2Group">
                    <line id="force2" stroke="#6b6bff" stroke-width="3" marker-end="url(#arrowBlue)"/>
                </g>
                 -->
                <!-- 箭头定义 -->
                <defs>
                    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#ff6b6b"/>
                    </marker>
                    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#6b6bff"/>
                    </marker>
                </defs>
                
                <!-- 图例 -->
                <g transform="translate(250, 480)">
                    <circle cx="-80" cy="0" r="6" fill="#ff6b6b"/>
                    <text x="-65" y="4" fill="#ccc" font-size="11">钢球1</text>
                    <circle cx="20" cy="0" r="6" fill="#6b6bff"/>
                    <text x="35" y="4" fill="#ccc" font-size="11">钢球2</text>
                </g>
            </svg>
        </div>
        
        <div class="control-panel">
            <div class="control-group">
                <h3>⚙️ 轮子参数</h3>
                <div class="control-row">
                    <label>轮子半径比 (A:B)</label>
                    <select id="radiusRatio">
                        <option value="3:1">3:1</option>
                        <option value="2:1">2:1</option>
                        <option value="1:1" selected>1:1</option>
                        <option value="1:2">1:2</option>
                        <option value="1:3">1:3</option>
                    </select>
                </div>
            </div>
            
            <div class="control-group">
                <h3>⚫ 钢球参数</h3>
                <div class="control-row">
                    <label>质量比 (m₁:m₂)</label>
                    <select id="massRatio">
                        <option value="3:1">3:1</option>
                        <option value="2:1">2:1</option>
                        <option value="1:1" selected>1:1</option>
                        <option value="1:2">1:2</option>
                        <option value="1:3">1:3</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>到圆心距离比 (r₁:r₂)</label>
                    <select id="distanceRatio">
                        <option value="3:1">3:1</option>
                        <option value="2:1">2:1</option>
                        <option value="1:1" selected>1:1</option>
                        <option value="1:2">1:2</option>
                        <option value="1:3">1:3</option>
                    </select>
                </div>
            </div>
            
            <div class="control-group">
                <h3>🔄 转速控制</h3>
                <div class="speed-control">
                    <label style="font-size:12px;color:#ccc;">主动轮A转速: <span id="speedValue">1.0</span> rad/s</label>
                    <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="3" step="0.1" value="1">
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-start" id="startBtn">▶ 开始</button>
                <button class="btn btn-stop" id="stopBtn">⏹ 停止</button>
            </div>
            
            <div class="result-panel">
                <h3>📊 实时数据</h3>
                <div class="result-item">
                    <span>轮A角速度 ω<sub>A</sub></span>
                    <span class="result-value" id="omegaA">1.00 rad/s</span>
                </div>
                <div class="result-item">
                    <span>轮B角速度 ω<sub>B</sub></span>
                    <span class="result-value" id="omegaB">1.00 rad/s</span>
                </div>
                <div class="result-item">
                    <span>钢球1向心力 F₁</span>
                    <span class="result-value" id="force1Value">1.00 N</span>
                </div>
                <div class="result-item">
                    <span>钢球2向心力 F₂</span>
                    <span class="result-value" id="force2Value">1.00 N</span>
                </div>
                <div class="result-item">
                    <span>向心力比 F₁:F₂</span>
                    <span class="result-value" id="forceRatio">1:1</span>
                </div>
            </div>
            
            <div class="formula-panel">
                <h4>📐 向心力公式</h4>
                <div class="formula">F = mω²r = mv²/r = 4π²mr/T²</div>
            </div>
        </div>
    </div>
    <!-- 尾部文件开始 -->

        <font size="-1">
            <hr /></font>
    </div></div>

    <meta name="description" content="欢迎访问专业的物理学知识网站！我们提供全面的初高中物理仿真实验与动画演示，涵盖力学、电磁学、天体物理等核心实验（如开普勒定律、单摆、电磁感应模型），支持实验搜索、排行榜及实验需求定制。公益平台，助力物理教学与自主学习。">

    <title>托盘天平的使用及读数练习——物理仿真实验室|72</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --danger: #e74c3c; --success: #27ae60; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #fff; }
        .header { background: var(--primary); color: white; padding: 10px; text-align: center; }
        .main-container { display: flex; flex: 1; padding: 10px; gap: 15px; overflow: hidden; }
        @media (max-width: 900px) { .main-container { flex-direction: column; overflow-y: auto; } #canvas-box { min-height: 400px; } }

        #canvas-box { flex: 1.5; border: 1px solid #ddd; border-radius: 8px; position: relative; }
        #control-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 15px; background: #f9f9f9; border-radius: 8px; overflow-y: auto; }

        .section { background: white; padding: 10px; border-radius: 5px; border: 1px solid #eee; }
        .section-title { font-size: 13px; font-weight: bold; color: #666; margin-bottom: 8px; border-left: 3px solid var(--accent); padding-left: 8px; }

        .nut-ctrl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .btn-sm { padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 3px; font-size: 12px; }
        .btn-sm:hover { background: #eee; }

        .weight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .btn-w { padding: 8px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-w:hover { background: #7f8c8d; }

        .input-group { display: flex; gap: 5px; margin-top: 5px; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        .msg { padding: 10px; border-radius: 4px; font-size: 14px; margin-top: 10px; display: none; line-height: 1.4; }
        .active-problem { background: #fff3cd; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 1.2rem;">托盘天平的使用及读数练习</h2>
</div>

<div class="main-container">
    <div id="canvas-box">
        <svg id="svg" viewBox="0 0 600 400" width="100%" height="100%">
            <!-- 底座 -->
            <path d="M100 350 L500 350 L540 380 L60 380 Z" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
            <rect x="285" y="150" width="30" height="200" fill="#bdc3c7" stroke="#333"/>
            
            <!-- 分度盘 -->
            <path d="M260 80 Q300 40 340 80" fill="none" stroke="#333" stroke-width="2"/>
            <line x1="300" y1="35" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(-25, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(-20, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(-15, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(-10, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(-5, 300, 125)"/>
            <line x1="300" y1="35" x2="300" y2="60" stroke="#e74c3c" stroke-width="2"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(5, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(10, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(15, 300, 125)"/>
            <line x1="300" y1="45" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(20, 300, 125)"/>
            <line x1="300" y1="35" x2="300" y2="60" stroke="#e74c3c" stroke-width="2" transform="rotate(25, 300, 125)"/>

            <!-- 横梁旋转组 -->
            <g id="beam-group">
                <!-- 尖指针 -->
                <path d="M300 180 L297 80 L300 60 L303 80 Z" fill="#2c3e50" />
                <!-- 横梁主体 -->
                <rect x="80" y="185" width="440" height="35" fill="white" stroke="#333" stroke-width="2"/>
                <!-- 刻度线容器 -->
                <g id="ruler-ticks"></g>
                <text x="82" y="212" font-size="10">0</text>
                <text x="165" y="212" font-size="10" id="max-label">1</text>
                <text x="247" y="212" font-size="10" id="max-label">2</text>
                <text x="330" y="212" font-size="10" id="max-label">3</text>
                <text x="415" y="212" font-size="10" id="max-label">4</text>
                <text x="495" y="212" font-size="10" id="max-label">5g</text>

                <!-- 左右螺丝杆 -->
                <line x1="40" y1="202" x2="80" y2="202" stroke="#7f8c8d" stroke-width="4"/>
                <line x1="520" y1="202" x2="560" y2="202" stroke="#7f8c8d" stroke-width="4"/>

                <!-- 游码 -->
                <rect id="rider" x="85" y="178" width="14" height="42" fill="#e67e22" stroke="#d35400" cursor="ew-resize" />

                <!-- 调零螺母 -->
                <rect id="nut-l-svg" x="50" y="195" width="20" height="15" rx="2" fill="#7f8c8d" stroke="#333"/>
                <rect id="nut-r-svg" x="530" y="195" width="20" height="15" rx="2" fill="#7f8c8d" stroke="#333"/>

                <!-- 托盘系统 -->
                <g id="left-pan-sys">
                    <line x1="100" y1="200" x2="100" y2="150" stroke="#333" stroke-width="3"/>
                    <rect x="30" y="140" width="140" height="10" fill="#bdc3c7" stroke="#333"/>
                    <g id="left-items"></g>
                </g>
                <g id="right-pan-sys">
                    <line x1="500" y1="200" x2="500" y2="150" stroke="#333" stroke-width="3"/>
                    <rect x="430" y="140" width="140" height="10" fill="#bdc3c7" stroke="#333"/>
                    <g id="right-items"></g>
                </g>
            </g>
        </svg>
    </div>

    <div id="control-panel">
        <div class="section">
            <div class="section-title">设置：分度值</div>
            <label><input type="radio" name="scale" value="0.1" checked onchange="initScale()"> 0.1g (需估读)</label><br>
            <label><input type="radio" name="scale" value="0.2" onchange="initScale()"> 0.2g (不需估读)</label>
        </div>

        <div class="section">
            <div class="section-title">第一步：调零操作</div>
            <div class="nut-ctrl">
                <span>左螺母：</span>
                <div>
                    <button class="btn-sm" onclick="moveNut('L', -1)">◀左移</button>
                    <button class="btn-sm" onclick="moveNut('L', 1)">右移▶</button>
                </div>
            </div>
            <div class="nut-ctrl">
                <span>右螺母：</span>
                <div>
                    <button class="btn-sm" onclick="moveNut('R', -1)">◀左移</button>
                    <button class="btn-sm" onclick="moveNut('R', 1)">右移▶</button>
                </div>
            </div>
            <button class="btn-sm" style="width:100%; margin-top:5px; background:#eee;" onclick="autoZero()">快速调零(归零并平衡)</button>
        </div>

        <div class="section">
            <div class="section-title">第二步：测量</div>
            <button class="btn-w" style="width:100%; background:var(--primary); margin-bottom:10px;" onclick="tryGenerateProblem()">随机出题</button>
            <div class="weight-grid">
                <button class="btn-w" onclick="addWeight(100)">100g</button>
                <button class="btn-w" onclick="addWeight(50)">50g</button>
                <button class="btn-w" onclick="addWeight(20)">20g</button>
                <button class="btn-w" onclick="addWeight(10)">10g</button>
                <button class="btn-w" onclick="addWeight(5)">5g</button>
                <button class="btn-w" onclick="addWeight(1)">1g</button>
            </div>
            <div style="font-size:11px; color:#999; margin-top:5px;">点击右盘内砝码可取下</div>
        </div>

        <div class="section">
            <div class="section-title">第三步：读数提交</div>
            <div class="input-group">
                <input type="number" id="ans" placeholder="输入质量" step="0.01">
                <button class="btn-w" style="background:var(--success)" onclick="submitAnswer()">提交</button>
            </div>
            <div id="feedback" class="msg"></div>
        </div>
    <!-- 尾部文件开始 -->
<footer>
    <div align="center">
        <font size="-1">
            <hr /></font>
    </div></div>
</footer>     <!-- 尾部文件结束 -->

</div>

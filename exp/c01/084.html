    <h2>波的干涉仿真</h2>
    <div id="info-box" class="control-group">
        <strong>数据分析:</strong><hr>
        距离 S₁ (r₁): <span id="dist1">-</span> px<br>
        距离 S₂ (r₂): <span id="dist2">-</span> px<br>

        当前波长 λ: <span id="wave-length">-</span> px<br>
        Δr/λ = <span id="ratio">-</span><br>
        <div id="conclusion" style="margin-top:5px; font-weight:bold;">点击水面进行分析</div>
    </div>
    <div class="control-group">
        <h3>动画主控</h3>
        <div class="btn-row">
            <button id="btn-pause">暂停/运行</button>
            <button id="btn-reset" class="secondary">重置位置</button>
        </div>
        <label style="margin-top:10px;">播放速度 <span id="speed-val" class="val-display">1.0</span></label>
        <input type="range" id="speed" min="0" max="3" step="0.1" value="1.0">
        <label>进度步进 <span id="time-val" class="val-display">0</span></label>
        <input type="range" id="manual-time" min="0" max="100" step="0.1" value="0">
        <label>缩放比例(越小越流畅) <span id="scale-val" class="val-display">1</span></label>
        <input type="range" id="scale" min="0.1" max="1" step="0.1" value="1">
    </div>
    <div class="control-group">
        <h3>波源 S₁ </h3>
        <label>振幅 (A₁) <span id="a1-val" class="val-display">20</span></label>
        <input type="range" id="a1" min="0" max="50" value="20">
        <label>频率 (f₁) <span class="lambda-info">λ₁: <span id="l1-display">-</span></span><span id="f1-val" class="val-display">1.0</span></label>
        

        <input type="range" id="f1" min="0.5" max="3.0" step="0.1" value="1.0">
        <label>初相位 <span id="p1-val" class="val-display">0°</span></label>
        <input type="range" id="p1" min="0" max="360" step="10" value="0">
    </div>

    <div class="control-group">
        <h3>波源 S₂ </h3>
        <label>振幅 (A₂) <span id="a2-val" class="val-display">20</span></label>
        <input type="range" id="a2" min="0" max="50" value="20">
        <label>频率 (f₂) <span class="lambda-info">λ₂: <span id="l2-display">-</span></span><span id="f2-val" class="val-display">1.0</span></label>
        
        <input type="range" id="f2" min="0.5" max="3.0" step="0.1" value="1.0">
        <label>初相位 <span id="p2-val" class="val-display">0°</span></label>
        <input type="range" id="p2" min="0" max="360" step="10" value="0">
    </div>

    <div class="control-group">
        <h3>显示设置</h3>
        <label>水波颜色模式</label>
        <div class="mode-switch">
            <label><input type="radio" name="color-mode" value="light" checked><span>淡蓝(仿真)</span></label>
            <label><input type="radio" name="color-mode" value="dark"><span>深蓝(高对比)</span></label>

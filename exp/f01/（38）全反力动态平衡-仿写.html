<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全反力动态平衡（GZZX郭老师）</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#f5f7fa; color:#1f2933; }
  #topbar { background:#1f6feb; color:#fff; padding:10px 16px; font-size:18px; font-weight:600; letter-spacing:.5px; }
  #main { display:flex; gap:16px; padding:16px; flex-wrap:wrap; align-items:flex-start; box-sizing:border-box; }
  .graph-box { background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:10px; flex:1 1 560px; min-width:340px; display:flex; flex-direction:column; min-height:0; }
  .title { font-size:14px; font-weight:600; margin-bottom:6px; color:#334155; display:flex; align-items:center; }
  .legend { display:flex; gap:10px; font-size:11px; margin-left:auto; color:#555; }
  .legend i { display:inline-block; width:12px; height:3px; vertical-align:middle; margin-right:3px; }
  canvas { width:100%; flex:1 1 auto; min-height:300px; display:block; background:#fff; border-radius:6px; cursor:crosshair; }
  .params { width:280px; flex:0 0 280px; align-self:flex-start; background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:14px; }
  .params h3 { margin:0 0 10px; font-size:14px; color:#334155; }
  .ctl { margin-bottom:14px; }
  .lab { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; color:#475569; }
  .lab b { font-weight:600; }
  .lab span { color:#1f6feb; font-weight:600; }
  input[type=range] { width:100%; accent-color:#1f6feb; cursor:pointer; }
  .readout { background:#f1f5f9; border-radius:8px; padding:12px; font-size:13px; line-height:1.9; }
  .readout .row { display:flex; justify-content:space-between; }
  .readout .k { color:#64748b; }
  .readout .v { font-weight:700; }
  .caption { font-size:12px; color:#64748b; margin-top:8px; line-height:1.6; }
  @media (max-width:920px){ .params{ width:100%; flex:1 1 100%; } }
</style>
</head>
<body>
<div id="topbar">全反力动态平衡（GZZX郭老师）</div>
<div id="main">
  <div class="graph-box">
    <div class="title">半圆柱面上导体棒的三力平衡与全反力
      <div class="legend"><span><i style="background:#000"></i>半圆柱</span><span><i style="background:#ff9933"></i>G</span><span><i style="background:#ff3366"></i>F安</span><span><i style="background:#0099ff"></i>F全反</span></div>
    </div>
    <canvas id="cv"></canvas>
    <div class="caption">导体棒 A 在动摩擦因数 μ 的半圆柱面上缓慢上滑。拖动粉色点 P 改变位置，观察重力、安培力与全反力（支持力+摩擦力）的矢量平衡。</div>
  </div>
  <div class="params">
    <h3>参数设置</h3>
    <label class="ctl"><div class="lab"><b>动摩擦因数 μ</b><span id="muv">0.2</span></div>
      <input type="range" id="mu" min="0" max="1" step="0.05" value="0.2"></label>
    <div class="readout">
      <div class="row"><span class="k">角度 θ</span><span class="v" id="rtheta">—</span></div>
      <div class="row"><span class="k">重力 G</span><span class="v" id="rG">—</span></div>
      <div class="row"><span class="k">安培力 F安</span><span class="v" id="rFa">—</span></div>
      <div class="row"><span class="k">全反力 F全反</span><span class="v" id="rFan">—</span></div>
      <div class="row"><span class="k">支持力 FN</span><span class="v" id="rFn">—</span></div>
      <div class="row"><span class="k">摩擦力 Ff</span><span class="v" id="rFf">—</span></div>
    </div>
  </div>
</div>
<script>
const C_SEMI="#000", C_P="#ff6699", C_G="#ff9933", C_FA="#ff3366", C_FAN="#0099ff", C_FN="#000", C_FF="#000";
const C_ALPHA="#ff9933", C_BETA="#ff3366", C_GAMMA="#0099ff", AX="#94a3b8";
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const DPR=Math.max(1, window.devicePixelRatio||1);
const R=5, m=0.4, g=10;
let mu=0.2;
let P={x:-4.330127,y:2.5};

function fit(){ const w=Math.round(cv.clientWidth), h=Math.round(cv.clientHeight); cv.width=w*DPR; cv.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); return {w,h}; }
function niceStep(x){ const b=Math.pow(10,Math.floor(Math.log10(x))); const f=x/b; if(f<1.5)return b; if(f<3)return 2*b; if(f<7)return 5*b; return 10*b; }
function drawGrid(PX,PY,w,h,padL,padR,padT,padB){
  const X1=-9,X2=8,Y1=0,Y2=7;
  ctx.strokeStyle="#eef2f7"; ctx.lineWidth=1;
  const sx=niceStep((X2-X1)/8), sy=niceStep((Y2-Y1)/8);
  ctx.font="11px sans-serif"; ctx.fillStyle="#64748b"; ctx.textAlign="center"; ctx.textBaseline="top";
  for(let x=Math.floor(X1/sx)*sx;x<=X2+1e-9;x+=sx){ const px=PX(x); ctx.beginPath(); ctx.moveTo(px,padT); ctx.lineTo(px,h-padB); ctx.stroke(); ctx.fillText(x.toFixed(0),px,h-padB+4); }
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let y=Math.floor(Y1/sy)*sy;y<=Y2+1e-9;y+=sy){ const py=PY(y); ctx.beginPath(); ctx.moveTo(padL,py); ctx.lineTo(w-padR,py); ctx.stroke(); ctx.fillText(y.toFixed(0),padL-5,py); }
}
function arrow(x1,y1,dx,dy,col,w,label){
  const x2=x1+dx,y2=y1+dy;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(dy,dx), s=7+w;
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4)); ctx.lineTo(x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4)); ctx.closePath(); ctx.fill();
  if(label){ ctx.fillStyle=col; ctx.font="12px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillText(label,x2+6,y2); }
}
function angleArc(cx,cy,r,a1,a2,col){
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,r,a1,a2); ctx.stroke();
}
function vecAngle(v){ return Math.atan2(v.y,v.x); }

function draw(){
  const {w,h}=fit();
  const padL=52,padR=18,padT=18,padB=36;
  ctx.clearRect(0,0,w,h);
  const X1=-9,X2=8,Y1=0,Y2=7;
  const s=Math.min((w-padL-padR)/(X2-X1),(h-padT-padB)/(Y2-Y1))*0.95;
  const ox=padL-(X1+X2)/2*s+(w-padL-padR)/2, oy=padT+(Y1+Y2)/2*s+(h-padT-padB)/2;
  const PX=x=>ox+x*s, PY=y=>oy-y*s;
  drawGrid(PX,PY,w,h,padL,padR,padT,padB);
  // axes
  ctx.strokeStyle=AX; ctx.lineWidth=1.2; ctx.beginPath();
  ctx.moveTo(padL-5,PY(0)); ctx.lineTo(w-padR+5,PY(0));
  ctx.moveTo(PX(0),h-padB+5); ctx.lineTo(PX(0),padT-5);
  ctx.stroke();
  // semicircle
  ctx.strokeStyle=C_SEMI; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(PX(0),PY(0),R*s,Math.PI,0); ctx.stroke();
  // radius line PO
  ctx.strokeStyle=C_SEMI; ctx.lineWidth=1; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(PX(0),PY(0)); ctx.lineTo(PX(P.x),PY(P.y)); ctx.stroke();
  ctx.setLineDash([]);
  // forces
  const theta=Math.atan2(P.y,P.x);
  const opLen=Math.hypot(P.x,P.y); const ux=P.x/opLen, uy=P.y/opLen;
  const thetaDisplay=Math.acos(-ux);
  // reference: max static friction normal force and FA magnitude at equilibrium up-slope
  const FNmag0=m*g*Math.sin(thetaDisplay);
  const FfMag0=mu*FNmag0;
  const FAmag=FfMag0+m*g*Math.cos(thetaDisplay);
  const G={x:0,y:-m*g};
  // Ampere force: always along up-slope tangent (CW tangent of OP)
  const FA={x:uy*FAmag,y:-ux*FAmag};
  // equilibrium: total reaction = -(G+FA), changes with FA direction
  const fan={x:-(G.x+FA.x),y:-(G.y+FA.y)};
  // decompose fan into radial (FN) and tangential (Ff) components
  const FNmag=fan.x*ux+fan.y*uy; // signed radial component
  const FN={x:ux*FNmag,y:uy*FNmag};
  const Ff={x:fan.x-FN.x,y:fan.y-FN.y};
  const FfMag=Math.hypot(Ff.x,Ff.y);
  // friction condition check
  const frictionOK=FfMag<=mu*Math.abs(FNmag)+0.001;
  const B={x:P.x+Ff.x,y:P.y+Ff.y};
  const Cpt={x:P.x+FN.x,y:P.y+FN.y};
  const D={x:B.x+FN.x,y:B.y+FN.y};
  // force parallelogram dashed lines
  ctx.strokeStyle="#000"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(PX(B.x),PY(B.y)); ctx.lineTo(PX(D.x),PY(D.y)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX(Cpt.x),PY(Cpt.y)); ctx.lineTo(PX(D.x),PY(D.y)); ctx.stroke();
  ctx.setLineDash([]);
  // force vectors
  arrow(PX(P.x),PY(P.y),G.x*s,-G.y*s,C_G,2.5,"G");
  // Ampere force as ray
  ctx.strokeStyle=C_FA; ctx.lineWidth=1.2; ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.moveTo(PX(P.x),PY(P.y));
  ctx.lineTo(PX(P.x+FA.x*2.2),PY(P.y+FA.y*2.2)); ctx.stroke();
  ctx.globalAlpha=1;
  arrow(PX(P.x),PY(P.y),FA.x*s,-FA.y*s,C_FA,2.5,"F安");
  arrow(PX(P.x),PY(P.y),fan.x*s,-fan.y*s,C_FAN,2.5,"F全反");
  arrow(PX(P.x),PY(P.y),FN.x*s,-FN.y*s,C_FN,1.5,"FN");
  const ffColor=frictionOK?C_FF:"#dc2626";
  arrow(PX(P.x),PY(P.y),Ff.x*s,-Ff.y*s,ffColor,1.5,"Ff");
  // === vector triangle of G, F安, F全反 (equilibrium: G+FA+fan=0, closed) ===
  ctx.save(); ctx.translate(40,0);
  const tScale=0.42, tA={x:3.2,y:5.6};
  const tB={x:tA.x+G.x*tScale,y:tA.y+G.y*tScale};
  const tC={x:tB.x+FA.x*tScale,y:tB.y+FA.y*tScale};
  // triangle background
  const txMin=Math.min(tA.x,tB.x,tC.x)-0.4, txMax=Math.max(tA.x,tB.x,tC.x)+0.6;
  const tyMin=Math.min(tA.y,tB.y,tC.y)-0.5, tyMax=Math.max(tA.y,tB.y,tC.y)+0.5;
  ctx.fillStyle="rgba(241,245,249,0.85)"; ctx.strokeStyle="#cbd5e1"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(PX(txMin),PY(tyMax),PX(txMax)-PX(txMin),PY(tyMin)-PY(tyMax)); ctx.fill(); ctx.stroke();
  // triangle title
  ctx.fillStyle="#334155"; ctx.font="bold 12px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("力的矢量三角形",PX((txMin+txMax)/2),PY(tyMax-0.15));
  // G side (A->B, downward)
  ctx.strokeStyle=C_G; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(PX(tA.x),PY(tA.y)); ctx.lineTo(PX(tB.x),PY(tB.y)); ctx.stroke();
  ctx.fillStyle=C_G; ctx.font="11px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="middle";
  ctx.fillText("G",PX(tA.x)-4,PY((tA.y+tB.y)/2));
  // F安 side (B->C)
  ctx.strokeStyle=C_FA; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(PX(tB.x),PY(tB.y)); ctx.lineTo(PX(tC.x),PY(tC.y)); ctx.stroke();
  ctx.fillStyle=C_FA; ctx.textAlign="left"; ctx.textBaseline="bottom";
  ctx.fillText("F安",PX(tC.x)+3,PY(tC.y)+2);
  // F全反 side (C->A, closes triangle since G+FA+fan=0)
  ctx.strokeStyle=C_FAN; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(PX(tC.x),PY(tC.y)); ctx.lineTo(PX(tA.x),PY(tA.y)); ctx.stroke();
  ctx.fillStyle=C_FAN; ctx.textAlign="center"; ctx.textBaseline="bottom";
  ctx.fillText("F全反",PX((tA.x+tC.x)/2),PY(tA.y)-4);
  // vertex dots
  ctx.fillStyle="#64748b";
  for(const v of [tA,tB,tC]){ ctx.beginPath(); ctx.arc(PX(v.x),PY(v.y),3,0,7); ctx.fill(); }
  ctx.restore();
  // angle arcs between forces at P
  const aG=vecAngle({x:G.x,y:-G.y});
  const aFA=vecAngle({x:FA.x,y:-FA.y});
  const aFan=vecAngle({x:fan.x,y:-fan.y});
  const rArc=22;
  function mid(a,b){ let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return a+d/2; }
  angleArc(PX(P.x),PY(P.y),rArc,aFA,aFan,C_ALPHA); // alpha
  angleArc(PX(P.x),PY(P.y),rArc+8,aFan,aG,C_BETA); // beta
  angleArc(PX(P.x),PY(P.y),rArc+16,aG,aFA,C_GAMMA); // gamma
  // angle labels
  ctx.fillStyle=C_ALPHA; ctx.font="12px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("α",PX(P.x)+(rArc+12)*Math.cos(mid(aFA,aFan)),PY(P.y)-(rArc+12)*Math.sin(mid(aFA,aFan)));
  ctx.fillStyle=C_BETA; ctx.fillText("β",PX(P.x)+(rArc+20)*Math.cos(mid(aFan,aG)),PY(P.y)-(rArc+20)*Math.sin(mid(aFan,aG)));
  ctx.fillStyle=C_GAMMA; ctx.fillText("γ",PX(P.x)+(rArc+28)*Math.cos(mid(aG,aFA)),PY(P.y)-(rArc+28)*Math.sin(mid(aG,aFA)));
  // P point
  ctx.fillStyle=C_P; ctx.beginPath(); ctx.arc(PX(P.x),PY(P.y),5,0,7); ctx.fill();
  ctx.fillStyle="#000"; ctx.font="12px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="bottom"; ctx.fillText("P",PX(P.x)-6,PY(P.y)-6);
  // O point
  ctx.fillStyle="#4d4dff"; ctx.beginPath(); ctx.arc(PX(0),PY(0),4,0,7); ctx.fill();
  ctx.fillText("O",PX(0)-6,PY(0)-6);
  // readout
  document.getElementById("rtheta").textContent=(thetaDisplay*180/Math.PI).toFixed(1)+"°";
  document.getElementById("rG").textContent=(m*g).toFixed(2)+" N";
  document.getElementById("rFa").textContent=FAmag.toFixed(2)+" N";
  document.getElementById("rFan").textContent=Math.hypot(fan.x,fan.y).toFixed(2)+" N";
  document.getElementById("rFn").textContent=FNmag.toFixed(2)+" N";
  document.getElementById("rFf").textContent=FfMag.toFixed(2)+" N"+(frictionOK?"":" (超限)");
}

const muEl=document.getElementById("mu"), muOut=document.getElementById("muv");
muEl.addEventListener("input",()=>{ mu=parseFloat(muEl.value); muOut.textContent=mu.toFixed(2); draw(); });
// drag P on semicircle
cv.addEventListener("mousedown",e=>{
  const rect=cv.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const {w,h}=fit(); const padL=52,padR=18,padT=18,padB=36;
  const X1=-9,X2=8,Y1=0,Y2=7;
  const s=Math.min((w-padL-padR)/(X2-X1),(h-padT-padB)/(Y2-Y1))*0.95;
  const ox=padL-(X1+X2)/2*s+(w-padL-padR)/2, oy=padT+(Y1+Y2)/2*s+(h-padT-padB)/2;
  const x=(mx-ox)/s, y=-(my-oy)/s;
  let th=Math.atan2(y,x); if(th<0) th=0; if(th>Math.PI) th=Math.PI;
  P={x:R*Math.cos(th),y:R*Math.sin(th)};
  dragging=true;
  draw();
});
window.addEventListener("mousemove",e=>{
  if(!dragging) return;
  const rect=cv.getBoundingClientRect(); const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const {w,h}=fit(); const padL=52,padR=18,padT=18,padB=36;
  const X1=-9,X2=8,Y1=0,Y2=7;
  const s=Math.min((w-padL-padR)/(X2-X1),(h-padT-padB)/(Y2-Y1))*0.95;
  const ox=padL-(X1+X2)/2*s+(w-padL-padR)/2, oy=padT+(Y1+Y2)/2*s+(h-padT-padB)/2;
  const x=(mx-ox)/s, y=-(my-oy)/s;
  let th=Math.atan2(y,x); if(th<0) th=0; if(th>Math.PI) th=Math.PI; // keep upper semicircle
  P={x:R*Math.cos(th),y:R*Math.sin(th)}; draw();
});
window.addEventListener("mouseup",()=>dragging=false);
window.addEventListener("resize",draw);
draw();
</script>
</body>
</html>

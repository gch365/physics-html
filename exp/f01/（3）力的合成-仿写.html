<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>力的合成（GZZX郭老师）</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:#f5f7fa; color:#1f2933; }
  #topbar { background:#1f6feb; color:#fff; padding:10px 16px; font-size:18px; font-weight:600; letter-spacing:.5px; }
  #main { display:flex; gap:16px; padding:16px; flex-wrap:wrap; align-items:flex-start; }
  .graph-box { background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:10px; flex:1 1 560px; min-width:340px; }
  .title { font-size:14px; font-weight:600; margin-bottom:6px; color:#334155; display:flex; align-items:center; }
  .legend { display:flex; gap:14px; font-size:12px; margin-left:auto; color:#555; }
  .legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:4px; }
  canvas { width:100%; display:block; background:#fff; border-radius:6px; }
  .params { width:280px; flex:0 0 280px; background:#fff; border:1px solid #e3e8ef; border-radius:10px; padding:14px; }
  .params h3 { margin:0 0 10px; font-size:14px; color:#334155; }
  .ctl { margin-bottom:14px; }
  .lab { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; color:#475569; }
  .lab b { font-weight:600; }
  .lab span { color:#1f6feb; font-weight:600; }
  input[type=range] { width:100%; accent-color:#1f6feb; cursor:pointer; }
  .readout { background:#f1f5f9; border-radius:8px; padding:12px; font-size:13px; line-height:1.9; }
  .readout .row { display:flex; justify-content:space-between; }
  .readout .k { color:#64748b; }
  .readout .v { font-weight:700; }
  .caption { font-size:12px; color:#64748b; margin-top:8px; line-height:1.6; }
  @media (max-width:920px){ .params{ width:100%; flex:1 1 100%; } }
</style>
</head>
<body>
<div id="topbar">力的合成（GZZX郭老师）</div>
<div id="main">
  <div class="graph-box">
    <div class="title">力的合成（平行四边形法则）
      <div class="legend"><span><i style="background:#e8453c"></i>F₁</span><span><i style="background:#1f6feb"></i>F₂</span><span><i style="background:#0f9d58"></i>F合</span></div>
    </div>
    <canvas id="cv" height="680"></canvas>
    <div class="caption">以 F₁、F₂ 为邻边作平行四边形，其对角线即为合力 F合 = F₁ + F₂。夹角 φ 可调（原 GGB 中方向可拖动）。</div>
  </div>
  <div class="params">
    <h3>参数设置</h3>
    <label class="ctl"><div class="lab"><b>F₁ 大小 (N)</b><span id="a1v">8.0</span></div>
      <input type="range" id="a1" min="0" max="10" step="0.1" value="8"></label>
    <label class="ctl"><div class="lab"><b>F₂ 大小 (N)</b><span id="b1v">5.0</span></div>
      <input type="range" id="b1" min="0" max="10" step="0.1" value="5"></label>
    <label class="ctl"><div class="lab"><b>夹角 φ (°)</b><span id="pv">60</span></div>
      <input type="range" id="ph" min="0" max="180" step="1" value="60"></label>
    <div class="readout">
      <div class="row"><span class="k">|F₁|</span><span class="v" style="color:#e8453c" id="rF1">—</span></div>
      <div class="row"><span class="k">|F₂|</span><span class="v" style="color:#1f6feb" id="rF2">—</span></div>
      <div class="row"><span class="k">夹角 φ</span><span class="v" id="rphi">—</span></div>
      <div class="row"><span class="k">|F合|</span><span class="v" style="color:#0f9d58" id="rR">—</span></div>
      <div class="row"><span class="k">F合方向</span><span class="v" id="rAng">—</span></div>
    </div>
  </div>
</div>
<script>
let a=8, b=5, phi=60;
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const DPR=Math.max(1, window.devicePixelRatio||1);
const C1="#e8453c", C2="#1f6feb", CR="#0f9d58", AX="#94a3b8";
function fit(){ const w=Math.round(cv.clientWidth), h=680; cv.width=w*DPR; cv.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); return {w,h}; }
function arrow(c,x1,y1,x2,y2,col,w){
  c.strokeStyle=col; c.fillStyle=col; c.lineWidth=w; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
  const ang=Math.atan2(y2-y1,x2-x1), s=8+w;
  c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-s*Math.cos(ang-0.4),y2-s*Math.sin(ang-0.4)); c.lineTo(x2-s*Math.cos(ang+0.4),y2-s*Math.sin(ang+0.4)); c.closePath(); c.fill();
}
function draw(){
  const {w,h}=fit(); const cx=w/2, cy=h/2;
  ctx.clearRect(0,0,w,h);
  const pr=phi*Math.PI/180;
  const F1x=a, F1y=0, F2x=b*Math.cos(pr), F2y=b*Math.sin(pr);
  const Rx=F1x+F2x, Ry=F1y+F2y, Rmag=Math.hypot(Rx,Ry);
  // 固定比例尺：不随当前力值变化（否则改一个力会令另一力视觉长度也变）。
  // SCALE_MAX 取 10.5 => 比例约为原 21 的两倍 -> 力的视觉长度放大一倍。
  const SCALE_MAX = 10.5;
  const s=(Math.min(w,h)*0.40)/SCALE_MAX;
  const SX=x=>cx+x*s, SY=y=>cy-y*s;            // y 向上
  // 中心十字参考
  ctx.strokeStyle="#eef2f7"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(SX(-12/s),cy); ctx.lineTo(SX(12/s),cy); ctx.moveTo(cx,SY(-12/s)); ctx.lineTo(cx,SY(12/s)); ctx.stroke();
  const O=SX(0), Oy=SY(0);
  const P1=SX(F1x), P1y=SY(F1y), P2=SX(F2x), P2y=SY(F2y), PR=SX(Rx), PRy=SY(Ry);
  // 平行四边形（虚线）
  ctx.strokeStyle="#cbd5e1"; ctx.setLineDash([5,4]); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(P1,P1y); ctx.lineTo(PR,PRy); ctx.moveTo(P2,P2y); ctx.lineTo(PR,PRy); ctx.stroke(); ctx.setLineDash([]);
  // 两分力
  arrow(ctx,O,Oy,P1,P1y,C1,3);
  arrow(ctx,O,Oy,P2,P2y,C2,3);
  // 合力
  arrow(ctx,O,Oy,PR,PRy,CR,3.6);
  // 原点
  ctx.fillStyle="#334155"; ctx.beginPath(); ctx.arc(O,Oy,3.5,0,7); ctx.fill();
  // 标注
  ctx.font="bold 13px sans-serif"; ctx.textAlign="center";
  ctx.fillStyle=C1; ctx.fillText("F₁", (O+P1)/2, (Oy+P1y)/2-8);
  ctx.fillStyle=C2; ctx.fillText("F₂", (O+P2)/2+10, (Oy+P2y)/2);
  ctx.fillStyle=CR; ctx.fillText("F合", (O+PR)/2+10, (Oy+PRy)/2-8);
  // 读数
  const angDeg = Rmag>1e-6 ? Math.atan2(Ry,Rx)*180/Math.PI : 0;
  document.getElementById("rF1").textContent=a.toFixed(1)+" N";
  document.getElementById("rF2").textContent=b.toFixed(1)+" N";
  document.getElementById("rphi").textContent=phi+" °";
  document.getElementById("rR").textContent=Rmag.toFixed(2)+" N";
  document.getElementById("rAng").textContent=angDeg.toFixed(1)+" °";
}
document.getElementById("a1").addEventListener("input",e=>{ a=parseFloat(e.target.value); document.getElementById("a1v").textContent=a.toFixed(1); draw(); });
document.getElementById("b1").addEventListener("input",e=>{ b=parseFloat(e.target.value); document.getElementById("b1v").textContent=b.toFixed(1); draw(); });
document.getElementById("ph").addEventListener("input",e=>{ phi=parseInt(e.target.value); document.getElementById("pv").textContent=phi; draw(); });
window.addEventListener("resize",draw);
draw();
</script>
</body>
</html>

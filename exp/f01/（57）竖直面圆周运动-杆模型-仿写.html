<div class="wrap">
  <div class="stage">
    <h2>竖直面内圆周运动·杆模型（有支撑物）</h2>
    <p class="caption">小球 A 被刚性轻杆约束在半径 R 的圆周上，绕圆心 O 转动。角速度 ω 按单摆方程 ω+=β·dt、β=−g·x(A)/R² 演化（杆模型临界速度可取 0，能过最高点）。初速度由 k 决定：v₀=√(k·g·R)。点击「开始」播放，「重置」回到最低点。</p>

      <span><i style="background:#2e7d32"></i>重力 mg</span>&nbsp;
      <span><i style="background:#fb8c00"></i>杆作用力</span>
    </div>
  </div>

    <div class="ctl"><div class="lab"><b>初速度系数 k  (v₀=√(k g R))</b><span id="kv">1.90</span></div>
      <input type="range" id="k" min="1" max="10" step="0.05" value="1.9"></div>

    </div>
  </div>

  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=wdt;
  ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  const a=Math.atan2(p1[1]-p0[1], p1[0]-p0[0]), s=8;
  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]);
  ctx.lineTo(p1[0]-s*Math.cos(a-0.4), p1[1]-s*Math.sin(a-0.4));
  ctx.lineTo(p1[0]-s*Math.cos(a+0.4), p1[1]-s*Math.sin(a+0.4));
  ctx.closePath(); ctx.fill();
}

// 旋转（CCW，数学约定）
function rot(p, ang){
  const c=Math.cos(ang), s=Math.sin(ang);
  return { x: c*p.x - s*p.y, y: s*p.x + c*p.y };
}

function fitScale(){
  scale = Math.min(0.9*W/(2*(R+0.8)), 0.82*H/(2*R+1.2));
}

function draw(){
  fitScale();
  ctx.clearRect(0,0,W,H);

  // 背景图（cover 填充）
  if(BG_IMG.complete && BG_IMG.naturalWidth){
    const ar = BG_IMG.naturalWidth/BG_IMG.naturalHeight, car = W/H;
    let dw=W, dh=H, ox=0, oy=0;
    if(ar>car){ dw=H*ar; ox=(W-dw)/2; } else { dh=W/ar; oy=(H-dh)/2; }
    ctx.save(); ctx.globalAlpha=0.55;
    ctx.drawImage(BG_IMG, ox, oy, dw, dh);
    ctx.restore();
  } else {
    ctx.fillStyle='#eef4fb'; ctx.fillRect(0,0,W,H);
  }

  // 标题与文本（屏幕固定）
  ctx.fillStyle='#1565c0'; ctx.font='bold 20px "Microsoft YaHei",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('竖直方向的圆周运动—杆模型（有支撑物）', 16, 12);
  ctx.fillStyle='#333'; ctx.font='14px "Microsoft YaHei",sans-serif';
  ctx.fillText('圆环半径 R = '+R.toFixed(2), 16, 40);
  const kgR = k*g*R;
  ctx.fillText('初速度 v₀ = √(k·g·R) = √('+kgR.toFixed(2)+') ≈ '+Math.sqrt(kgR).toFixed(2), 16, 60);

  // 轨道引导圆：R±0.2（可见），R（虚线主轨道）
  ctx.lineWidth=1.2; ctx.strokeStyle='rgba(120,120,120,0.5)';
  [R-0.2, R+0.2].forEach(rr=>{
    ctx.beginPath(); ctx.arc(sx(0), sy(0), rr*scale, 0, 7); ctx.stroke();
  });
  ctx.setLineDash([6,5]); ctx.strokeStyle='rgba(21,101,192,0.45)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(sx(0), sy(0), R*scale, 0, 7); ctx.stroke(); ctx.setLineDash([]);

  // 向下参考虚线（α 的基准 (0,-1)）
  ctx.strokeStyle='rgba(46,125,128,0.4)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(0), sy(-(R+0.5))); ctx.stroke(); ctx.setLineDash([]);

  // 圆心 O
  ctx.fillStyle='#4d4dff'; ctx.beginPath(); ctx.arc(sx(0), sy(0), 5, 0, 7); ctx.fill();
  ctx.fillStyle='#222'; ctx.font='13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('O', sx(0)+8, sy(0));

  // 轨迹
  if(showTrace && trace.length>1){
    for(let i=1;i<trace.length;i++){
      ctx.strokeStyle='rgba(229,57,53,'+(i/trace.length*0.6)+')';
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(sx(trace[i-1].x), sy(trace[i-1].y));
      ctx.lineTo(sx(trace[i].x), sy(trace[i].y));
      ctx.stroke();
    }
  }

  // 角 α 弧（从向下基准到 OA）
  const aAng = Math.atan2(A.y, A.x);          // OA 方向角
  const alpha = Math.atan2(A.x, -A.y);        // 与向下基准夹角（弧度）
  ctx.strokeStyle='#2e7d32'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(sx(0), sy(0), 0.55*scale, -Math.PI/2, aAng, A.x<0); ctx.stroke();
  ctx.fillStyle='#2e7d32'; ctx.font='13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const am = 0.8*scale;
  ctx.fillText('α', sx(Math.cos((-Math.PI/2+aAng)/2)*am*0.6), sy(Math.sin((-Math.PI/2+aAng)/2)*am*0.6));

  // 杆 OA
  ctx.strokeStyle='#4d4dff'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(A.x), sy(A.y)); ctx.stroke();

  // 标记 B、C（依 bFlag 选择位置）
  let B, C;
  if(!bFlag){
    B = { x:0.3*A.x, y:0.3*A.y };
    C = { x:0.6*A.x, y:0.6*A.y };
  } else {
    const off = -(R - Math.hypot(A.x,A.y))/2;
    B = { x:(0+A.x)/3, y:(0+A.y)/3 + off };
    C = { x:2*(0+A.x)/3, y:2*(0+A.y)/3 + off };
  }
  ctx.fillStyle='#444';
  [B,C].forEach(p=>{ ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 4, 0, 7); ctx.fill(); });
  ctx.fillStyle='#222'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('B', sx(B.x)+6, sy(B.y)-2);
  ctx.fillText('C', sx(C.x)+6, sy(C.y)-2);

  // 小球 A
  const br = Math.max(0.2*scale, 7);
  const grad = ctx.createRadialGradient(sx(A.x)-br*0.3, sy(A.y)-br*0.3, br*0.2, sx(A.x), sy(A.y), br);
  grad.addColorStop(0,'#ff8a80'); grad.addColorStop(1,'#d32f2f');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(sx(A.x), sy(A.y), br, 0, 7); ctx.fill();
  ctx.strokeStyle='#b71c1c'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#222'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('A', sx(A.x)+br+2, sy(A.y)-2);

  // 速度矢量 v = ω·R·UnitOrthogonal(A-O)，CCW 正交 = (-Ay, Ax)
  const vw = { x:-omega*A.y, y:omega*A.x };
  const vlen = Math.hypot(vw.x, vw.y);
  let vDisp = Math.min(vlen, 1.6) * scale * (vlen>1e-9 ? 1 : 0);
  if(vlen>1e-9){ vDisp = Math.min(vlen, (R+0.4))*scale*0.5; }
  const vEnd = { x:A.x + vw.x/vlen*vDisp/scale, y:A.y + vw.y/vlen*vDisp/scale };
  arrow([sx(A.x),sy(A.y)], [sx(vEnd.x),sy(vEnd.y)], '#1e88e5', 3);
  ctx.fillStyle='#1e88e5'; ctx.font='13px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='bottom';
  ctx.fillText('v', sx(vEnd.x)+4, sy(vEnd.y));

  // 受力分析
  if(showForce){
    // 重力 mg 向下
    const gMag = Math.min(1.3, 1.3) * scale;
    arrow([sx(A.x),sy(A.y)], [sx(A.x), sy(A.y - gMag/scale)], '#2e7d32', 3);
    ctx.fillStyle='#2e7d32'; ctx.fillText('mg', sx(A.x)+4, sy(A.y - gMag/scale));
    // 杆作用力（沿 OA，指向圆心为正向；杆模型可正可负）
    const dist = Math.hypot(A.x, A.y) || 1e-9;
    const inU = { x:-A.x/dist, y:-A.y/dist };           // 指向圆心单位向量
    const Frod = omega*omega*R - g*(A.y)/dist;           // 杆沿径向（向圆心）的分量 (m=1)
    let fMag = Math.min(Math.abs(Frod), (R+0.4)) * scale * 0.5;
    const fEnd = { x:A.x + inU.x*(Frod>=0?fMag:-fMag)/scale, y:A.y + inU.y*(Frod>=0?fMag:-fMag)/scale };
    arrow([sx(A.x),sy(A.y)], [sx(fEnd.x),sy(fEnd.y)], '#fb8c00', 3);
    ctx.fillStyle='#fb8c00'; ctx.fillText('F杆', sx(fEnd.x)+4, sy(fEnd.y));
  }

  // 读数
  const beta = -g*A.x/(R*R);
  const E = 0.5*omega*omega*R*R + g*A.y;
  document.getElementById('rw').textContent = omega.toFixed(2);
  document.getElementById('rv').textContent = vlen.toFixed(2);
  document.getElementById('ra').textContent = (alpha*180/Math.PI).toFixed(1);
  document.getElementById('rb').textContent = beta.toFixed(2);
  document.getElementById('re').textContent = E.toFixed(2);
  const st = document.getElementById('st');
  if(playing){ st.className='status on'; st.textContent='运动仿真中（杆模型）'; }
  else { st.className='status off'; st.textContent='已暂停 / 待开始'; }
}

// ---- 积分一步（与 GGB s.onUpdate 一致）----
function step(){
  const beta = -g*A.x/(R*R);
  omega += beta*dt;
  const np = rot(A, omega*dt);
  A.x = np.x; A.y = np.y;
  if(showTrace){
    trace.push({x:A.x, y:A.y});
    if(trace.length>400) trace.shift();
  }
}

const playBtn = document.getElementById('play');
let lastTs = null;
function loop(ts){
  if(!playing) return;
  if(lastTs==null) lastTs=ts;
  let elapsed = (ts-lastTs)/1000; lastTs=ts;
  if(elapsed>0.1) elapsed=0.1;                 // 防止卡顿后跳变
  let acc = elapsed;
  while(acc > 0){
    const h = Math.min(dt, acc);
    // 用 dt 固定步长积分，acc 控制每帧步数
    step(); acc -= dt;
  }
  draw();
  requestAnimationFrame(loop);
}

playBtn.addEventListener('click', ()=>{
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 暂停' : '▶ 开始';
  lastTs = null;
  if(playing) requestAnimationFrame(loop); else draw();
});

document.getElementById('reset').addEventListener('click', ()=>{
  playing = false; playBtn.textContent='▶ 开始';
  A = {x:0, y:-R};
  omega = Math.sqrt(k*g*R);
  trace = [];
  draw();
});

// 滑块
function bindRange(id, vid, set, fmt){
  const el=document.getElementById(id), v=document.getElementById(vid);
  el.addEventListener('input', ()=>{ set(parseFloat(el.value)); v.textContent=fmt(parseFloat(el.value)); draw(); });
  v.textContent=fmt(parseFloat(el.value));
}
bindRange('R','Rv', val=>{ const ang=Math.atan2(A.x,A.y); R=val; const d=Math.hypot(A.x,A.y)||1e-9; const f=R/d; A.x*=f; A.y*=f; trace=[]; }, v=>v.toFixed(2));
bindRange('k','kv', val=>{ k=val; }, v=>v.toFixed(2));

document.getElementById('force').addEventListener('change', e=>{ showForce=e.target.checked; draw(); });
document.getElementById('trace').addEventListener('change', e=>{ showTrace=e.target.checked; if(!showTrace) trace=[]; draw(); });
document.getElementById('bmark').addEventListener('change', e=>{ bFlag=e.target.checked; draw(); });

resize(); draw();
</script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>（60）2024福建压轴题 · 美化课件版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:linear-gradient(160deg,#eef3fb,#e4ebf7 60%,#e9eef8);
     font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;overflow:hidden;color:#1f2b3d}
.topbar{flex:0 0 auto;background:linear-gradient(120deg,#1a63c4,#2f86ea 55%,#4a9bf5);color:#fff;
        padding:11px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 12px rgba(26,99,196,.28);z-index:5}
.topbar h1{font-size:17px;font-weight:600;letter-spacing:.4px}
.topbar .sub{font-size:12.5px;opacity:.9;font-weight:400}
.topbar .badge{margin-left:auto;font-size:11.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.32);
               padding:3px 10px;border-radius:20px;white-space:nowrap}
.app{flex:1 1 auto;display:flex;gap:12px;padding:12px;min-height:0}
.wrap{flex:1 1 auto;position:relative;min-width:0;border-radius:16px;background:#fff;
      box-shadow:0 4px 22px rgba(31,80,140,.10);overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.floats{position:absolute;inset:0;pointer-events:none}

/* ---- 图像浮层卡片 ---- */
.gcard{position:absolute;width:392px;height:318px;background:rgba(255,255,255,.97);border-radius:12px;
       box-shadow:0 8px 26px rgba(25,60,110,.20);border:1px solid #dde5f1;pointer-events:auto;
       display:flex;flex-direction:column;overflow:hidden}
.gcard .gh{flex:0 0 auto;height:30px;background:linear-gradient(90deg,#f2f6fd,#e9f0fb);border-bottom:1px solid #e0e8f4;
           display:flex;align-items:center;padding:0 8px;cursor:move;user-select:none;gap:7px}
.gcard .gh b{font-size:12.5px;color:#2b5fa8;font-weight:600;letter-spacing:.3px}
.gcard .gh .dots{flex:1}
.gcard .gh .dots i{display:inline-block;width:4px;height:4px;border-radius:50%;background:#b7c4d8;margin:0 1.5px;vertical-align:middle}
.gcard .gh .x{width:20px;height:20px;line-height:19px;text-align:center;border-radius:5px;font-size:14px;color:#7b8aa1;cursor:pointer}
.gcard .gh .x:hover{background:#dbe5f3;color:#2b5fa8}
.gcard canvas{flex:1 1 auto;width:100%;display:block}

/* ---- 右侧控制面板 ---- */
.panel{flex:0 0 300px;width:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.panel::-webkit-scrollbar{width:7px}.panel::-webkit-scrollbar-thumb{background:#c6d3e6;border-radius:4px}
.card{background:#fff;border-radius:14px;padding:10px 12px 11px;box-shadow:0 3px 14px rgba(31,80,140,.08);flex:0 0 auto}
.card h3{font-size:11px;font-weight:600;color:#8494ab;letter-spacing:1.4px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card h3::before{content:"";width:3px;height:11px;border-radius:2px;background:#2f86ea}
.row{display:flex;gap:7px}
.btn{flex:1;border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:7px 6px;border-radius:9px;
     background:#eff3fa;color:#3d587f;transition:all .13s;font-weight:500}
.btn:hover{background:#e2eaf7}
.btn.on{background:linear-gradient(135deg,#1a63c4,#3d92f2);color:#fff;box-shadow:0 3px 10px rgba(38,110,200,.32)}
.btn.play{background:linear-gradient(135deg,#12a56b,#28c07f);color:#fff;box-shadow:0 3px 10px rgba(20,150,100,.28)}
.btn.play:hover{filter:brightness(1.06)}
.chip{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:9px;background:#f6f8fc;cursor:pointer;
      font-size:12px;color:#42566f;transition:all .13s;margin-top:5px;border:1px solid transparent}
.chip:first-of-type{margin-top:0}
.chip:hover{background:#eef3fa}
.chip.on{background:#eaf2ff;border-color:#bcd8ff;color:#1a4e96;font-weight:600}
.chip .sw{width:17px;height:4px;border-radius:2px;flex:0 0 auto}
.chip .lb{flex:1}
.chip .ck{width:13px;height:13px;border-radius:4px;border:1.5px solid #c2cede;flex:0 0 auto;position:relative}
.chip.on .ck{background:#2f86ea;border-color:#2f86ea}
.chip.on .ck::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:7px;border:solid #fff;
                    border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}
.sl{display:flex;align-items:center;gap:9px;font-size:12px;color:#5b6d85}
.sl span{flex:0 0 34px}
.sl input{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:#dfe6f2;outline:none}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid #2f86ea;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sl b{flex:0 0 52px;text-align:right;font-weight:600;color:#2b5fa8;font-variant-numeric:tabular-nums}
.rd{display:grid;grid-template-columns:1fr 1fr;gap:6px 9px;font-size:12px}
.rd div{background:#f6f8fc;border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;gap:4px}
.rd i{font-style:normal;color:#8494ab}
.rd b{color:#1c3d66;font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:11px;color:#93a2b7;line-height:1.55;margin-top:7px}
.hint em{font-style:normal;color:#c25b1f}
</style>

<body>
<div class="topbar">
  <h1>（60）2024 福建高考·压轴题</h1>
  <span class="sub">弹簧连接体 A / B ＋ 滑轮悬挂带电球 C</span>
  <span class="badge">美化课件版 · 数据内核同 1:1 仿写</span>
</div>

<div class="app">
  <div class="wrap" id="wrap">
    <canvas id="stage"></canvas>
    <div class="floats" id="floats">
      <div class="gcard" id="cardV" style="display:none">
        <div class="gh"><b>速度—时间图像 v–t</b><span class="dots"><i></i><i></i><i></i></span><span class="x" data-close="V">✕</span></div>
        <canvas id="gv"></canvas>
      </div>
      <div class="gcard" id="cardX" style="display:none">
        <div class="gh"><b>位移—时间图像 x–t</b><span class="dots"><i></i><i></i><i></i></span><span class="x" data-close="X">✕</span></div>
        <canvas id="gx"></canvas>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="card">
      <h3>情境</h3>
      <div class="row">
        <button class="btn on" id="bFlag1">情境一</button>
        <button class="btn"    id="bFlag0">情境二</button>
      </div>
      <div class="hint" id="sceneHint"></div>
    </div>

    <div class="card">
      <h3>播放</h3>
      <div class="row">
        <button class="btn play" id="bPlay">▶ 播放</button>
        <button class="btn" id="bPause">❙❙ 暂停</button>
        <button class="btn" id="bReset">⟲ 复位</button>
      </div>
      <div class="sl" style="margin-top:10px"><span>t</span><input type="range" id="slT" min="0" max="1.1" step="0.005"><b id="tT">0.000 s</b></div>
      <div class="sl" style="margin-top:7px"><span>速度</span><input type="range" id="slSpd" min="0.25" max="3" step="0.25" value="1"><b id="tSpd">1.00×</b></div>
    </div>

    <div class="card">
      <h3>图像浮层</h3>
      <div class="chip" id="bG1"><span class="sw" style="background:#f0a324"></span><span class="lb">速度图像 v–t</span><span class="ck"></span></div>
      <div class="chip" id="bG2"><span class="sw" style="background:#ff6a00"></span><span class="lb">位移图像 x–t</span><span class="ck"></span></div>
      <div class="hint">卡片标题栏可拖动，✕ 收起</div>
    </div>

    <div class="card">
      <h3 id="segTitle">分段曲线叠加</h3>
      <div id="segs"></div>
      <div class="hint">叠加后按该段完整解析式绘制，定义域限制在坐标轴范围内。</div>
    </div>

    <div class="card">
      <h3>实时读数</h3>
      <div class="rd">
        <div><i>t</i><b id="rT">0.000</b></div>
        <div><i>x<sub>A</sub>/m</i><b id="rA">0.000</b></div>
        <div><i>x<sub>B</sub>/m</i><b id="rB">0.000</b></div>
        <div><i>Δx<sub>B-A</sub></i><b id="rD">0.020</b></div>
        <div><i>v<sub>A</sub></i><b id="rVA">0.000</b></div>
        <div><i>v<sub>B</sub></i><b id="rVB">0.000</b></div>
      </div>
      <div class="hint" id="keyHint"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* 物理内核与《（60）24福建压轴题-仿写.html》完全一致，取自 24福建压轴题(1).ggb */
const kv=5,K=2*kv, mA=0.3,mB=0.4,mC=0.2, Mt=mA+mB+mC, g=10, mu=0.5, Ftot=4, v0=2/3;
const w1=Math.sqrt(K/Mt), A1=mC*g/K, t1=Math.PI/(2*w1);
const w2=Math.sqrt(K/mA), A2=v0/w2;
const A3=Ftot/K, w3=w1, w4=w1, A4=2*Math.SQRT2/(3*w4), x4=0.1;
const t2=Math.acos(0.75)/w1, A5=2*Math.SQRT2/(3*w2), t3=Math.asin(0.1/A4)/w1, VB3=2*Math.SQRT2/3;

const xA1=t=>A1*(1-Math.cos(w1*t)), xA2=t=>A1+A2*Math.sin(w2*(t-t1));
const xA3=t=>A3*(1-Math.cos(w3*t)), xA4=t=>x4+A4*Math.sin(w4*(t-t2));
const xA5=t=>A1+A5*Math.sin(w2*(t-t2-t3));
const xB2=t=>A1+v0*(t-t1), xB5=t=>A1+VB3*(t-t2-t3);
const xB1=t=>xA1(t);                  /* GGB: xB1(t)=xA1(t) */
const vB1=t=>vA1(t), vB2=()=>v0;      /* GGB: vB1(t)=vA1(t), vB2(t)=v_0（惰性求值避开 TDZ） */
const vA1=t=>A1*w1*Math.sin(w1*t), vA2=t=>A2*w2*Math.cos(w2*(t-t1));
const vA3=t=>A3*w3*Math.sin(w3*t), vA4=t=>A4*w4*Math.cos(w4*(t-t2-t3));
const vA5=t=>A5*w2*Math.cos(w2*(t-t2-t3)), vB5=()=>VB3;
const xA=t=>st.flag?(t<t1?xA1(t):xA2(t)):(t<t2?xA3(t):(t<t2+t3?xA4(t):xA5(t)));
const xB=t=>st.flag?(t<t1?xA1(t):xB2(t)):(t<t2+t3?xA(t):xB5(t));
const vA=t=>st.flag?(t<t1?vA1(t):vA2(t)):(t<t2?vA3(t):(t<t2+t3?vA4(t):vA5(t)));
const vB=t=>st.flag?(t<t1?vA1(t):v0):(t<t2+t3?vA(t):VB3);

/* 装置固定几何（GGB 原值） */
const TBL=[[-0.6,0],[1.25,0],[1.25,-0.05],[-0.6,-0.05]];
const LEG1=[[-0.52,-0.05],[-0.46,-0.05],[-0.46,-0.72],[-0.52,-0.72]];
const LEG2=[[1.08,-0.05],[1.14,-0.05],[1.14,-0.72],[1.08,-0.72]];
const STPM=[[-0.5,0],[-0.47,0],[-0.47,0.1],[-0.5,0.1]];
const STPN=[[1.07,0],[1.1,0],[1.1,0.1],[1.07,0.1]];
const Dp=[1.3213604600067803,0.08690213303631869], Cp=[1.32,0.14];
const Ep=[1.3744747342125079,0.08723107546535887], Gp=[1.3189452235626127,0.13996248509359036];
const Bp=[1.224620459590319,0], Rp=[1.25,0];
const Rpr=Math.hypot(Cp[0]-Dp[0],Cp[1]-Dp[1]), Fx=1.3727;

const st={flag:true,flag1:false,flag2:false,f3:false,f4:false,f5:false,f6:false,f7:false,
          time:0,playing:true,speed:1,n:15,r:0.03};
const tmax=()=>st.flag?1.10:0.85;

/* ================= 装置画布 ================= */
const wrap=document.getElementById('wrap'), cv=document.getElementById('stage'), cx=cv.getContext('2d');
const BB={x0:-0.70,x1:1.82,y0:-1.02,y1:0.30};
let TR={s:1,ox:0,oy:0};
function resizeStage(){
  const d=Math.min(window.devicePixelRatio||1,2), w=wrap.clientWidth, h=wrap.clientHeight;
  cv.width=w*d; cv.height=h*d; cx.setTransform(d,0,0,d,0,0);
  const pad=26, s=Math.min((w-2*pad)/(BB.x1-BB.x0),(h-2*pad)/(BB.y1-BB.y0));
  TR={s, ox:(w-(BB.x1-BB.x0)*s)/2-BB.x0*s, oy:(h-(BB.y1-BB.y0)*s)/2+BB.y1*s};
  layoutCards(true);
}
const P=(x,y)=>[TR.ox+x*TR.s, TR.oy-y*TR.s];
const rgba=(c,a)=>'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';

function polyPath(c,map,pts){c.beginPath();pts.forEach((q,i)=>{const p=map(q[0],q[1]);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);});c.closePath();}
function line(c,map,A,B,col,w){const p=map(A[0],A[1]),q=map(B[0],B[1]);c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);
  c.lineWidth=w;c.lineCap='round';c.strokeStyle=col;c.stroke();}
function arrowHead(c,tip,ang,L,col,w){c.beginPath();
  c.moveTo(tip[0]-L*Math.cos(ang-0.42),tip[1]-L*Math.sin(ang-0.42));c.lineTo(tip[0],tip[1]);
  c.lineTo(tip[0]-L*Math.cos(ang+0.42),tip[1]-L*Math.sin(ang+0.42));
  c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.strokeStyle=col;c.stroke();}
function vector(c,map,A,B,col,w){line(c,map,A,B,col,w);const p=map(A[0],A[1]),q=map(B[0],B[1]);
  arrowHead(c,q,Math.atan2(q[1]-p[1],q[0]-p[0]),Math.max(11,w*2.6),col,w);}
function curveP(c,map,fn,t0,t1v,N,col,w){c.beginPath();
  for(let i=0;i<=N;i++){const t=t0+(t1v-t0)*i/N,p=map(fn(t)[0],fn(t)[1]);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]);}
  c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.strokeStyle=col;c.stroke();}

function drawStage(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  cx.clearRect(0,0,w,h);
  const bg=cx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#f7fafe');
  cx.fillStyle=bg; cx.fillRect(0,0,w,h);

  const S=TR.s, xAv=xA(st.time), xBv=xB(st.time), r=st.r, n=st.n, bh=2*r+0.02;
  const C1=[xAv,0],C2=[xAv,bh],C3=[xAv+0.6,bh],C4=[xAv+0.6,0];
  const D1=[0.02+xBv,bh],D2=[D1[0],0.2],D3=[D1[0]+0.12,0.2],D4=[D1[0]+0.12,bh];
  const Ap=[D4[0],D4[1]+0.06];
  const lenF=Math.hypot(Cp[0]-Ap[0],Cp[1]-Ap[1]);
  const Fp=[Fx,-0.21-(Gp[0]-0.02-0.12-lenF)], Ip=[Fp[0],Fp[1]-0.04];

  /* 桌体阴影 */
  {
    const a=P(TBL[0][0],TBL[0][1]),b=P(TBL[1][0],TBL[1][1]);
    const sh=cx.createLinearGradient(0,a[1],0,a[1]+40);
    sh.addColorStop(0,'rgba(60,90,130,.13)');sh.addColorStop(1,'rgba(60,90,130,0)');
    cx.fillStyle=sh;cx.fillRect(a[0],a[1]+6,b[0]-a[0],40);
  }

  /* 桌腿 / 桌面 */
  const woodTop=cx.createLinearGradient(0,P(0,0)[1],0,P(0,-0.05)[1]);
  function slab(pts,g1,g2){
    polyPath(cx,P,pts);
    const ys=pts.map(q=>P(q[0],q[1])[1]), gr=cx.createLinearGradient(0,Math.min(...ys),0,Math.max(...ys));
    gr.addColorStop(0,g1);gr.addColorStop(1,g2);cx.fillStyle=gr;cx.fill();
    cx.lineWidth=1.6;cx.strokeStyle='rgba(120,132,150,.55)';cx.stroke();
  }
  slab(LEG1,'#c9cfda','#aeb6c4'); slab(LEG2,'#c9cfda','#aeb6c4');
  slab(TBL,'#e3e8f0','#c3cad6');

  /* 挡板 M / N */
  [[STPM,0.95],[STPN,0.8]].forEach(([pts,al])=>{
    polyPath(cx,P,pts);cx.fillStyle='rgba(38,44,54,'+al+')';cx.fill();
    cx.lineWidth=1.4;cx.strokeStyle='rgba(20,24,32,.9)';cx.stroke();
  });

  /* 弹簧 */
  const spA=t=>{const L=C1[0]-STPM[1][0];return [r*Math.cos(n*t)/n+L/(2*Math.PI)*t-r/n+STPM[1][0], r*Math.sin(n*t)+r+0.01];};
  const spB=t=>{const L=STPN[0][0]-C4[0];return [r*Math.cos(n*t)/n-L/(2*Math.PI)*t-r/n+STPN[0][0], r*Math.sin(n*t)+r+0.01];};
  [spA,spB].forEach(fn=>{
    curveP(cx,P,fn,0,2*Math.PI,900,'rgba(58,66,80,.95)',Math.max(3.2,S*0.0075));
    curveP(cx,P,t=>{const q=fn(t);return [q[0],q[1]+0.004];},0,2*Math.PI,900,'rgba(255,255,255,.30)',Math.max(1,S*0.0022));
  });

  /* 木板 A / 物块 B */
  function body(pts,c1,c2,edge){
    polyPath(cx,P,pts);
    const ys=pts.map(q=>P(q[0],q[1])[1]),xs=pts.map(q=>P(q[0],q[1])[0]);
    const gr=cx.createLinearGradient(0,Math.min(...ys),0,Math.max(...ys));
    gr.addColorStop(0,c1);gr.addColorStop(1,c2);cx.fillStyle=gr;
    cx.save();cx.shadowColor='rgba(40,70,110,.22)';cx.shadowBlur=10;cx.shadowOffsetY=3;cx.fill();cx.restore();
    cx.lineWidth=1.8;cx.strokeStyle=edge;cx.stroke();
    return [(Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2];
  }
  const cA=body([C1,C2,C3,C4],'#ffe08f','#f6c64f','#d9a52f');
  const cB=body([D1,D2,D3,D4],'#ff9a4d','#f26a12','#cf5308');

  /* 绳 */
  line(cx,P,TBL[1],Dp,'rgba(58,66,80,.9)',Math.max(2.6,S*0.006));
  line(cx,P,Bp,TBL[1],'rgba(58,66,80,.9)',Math.max(2.6,S*0.006));
  line(cx,P,Ap,Cp,'#3c4450',Math.max(2.6,S*0.006));
  line(cx,P,Ep,Fp,'#3c4450',Math.max(2.6,S*0.006));

  /* 滑轮 */
  {
    const o=P(Dp[0],Dp[1]);
    cx.beginPath();cx.arc(o[0],o[1],Rpr*S,0,6.2832);cx.lineWidth=Math.max(5,S*0.011);
    cx.strokeStyle='#2b323d';cx.stroke();
    cx.beginPath();cx.arc(o[0],o[1],Rpr*S*0.30,0,6.2832);cx.fillStyle='#8e9aa9';cx.fill();
    polyPath(cx,P,[Bp,Dp,Rp]);cx.fillStyle='#2b323d';cx.fill();
  }
  /* 带电球 C */
  {
    const o=P(Ip[0],Ip[1]),rr=0.04*S;
    const gr=cx.createRadialGradient(o[0]-rr*0.35,o[1]-rr*0.4,rr*0.1,o[0],o[1],rr);
    gr.addColorStop(0,'#b9c1cb');gr.addColorStop(1,'#5b6470');
    cx.beginPath();cx.arc(o[0],o[1],rr,0,6.2832);cx.fillStyle=gr;cx.fill();
    cx.lineWidth=1.4;cx.strokeStyle='#454d58';cx.stroke();
  }
  /* 电场 */
  const showField=!((!st.flag&&st.time>=t2)||(st.flag&&st.time>0));
  if(showField){
    const up=st.flag, y0=up?-0.6:-0.22, y1=up?-0.22:-0.6;
    [1.3,1.45,1.6].forEach(x=>vector(cx,P,[x,y0],[x,y1],'rgba(30,110,190,.85)',Math.max(2.8,S*0.0065)));
  }
  /* 标签 */
  function tag(p,txt,col){
    cx.font='italic 600 '+Math.round(Math.max(13,S*0.031))+'px "Times New Roman",serif';
    cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=3.2;cx.strokeStyle='rgba(255,255,255,.88)';
    cx.strokeText(txt,p[0],p[1]);cx.fillStyle=col;cx.fillText(txt,p[0],p[1]);cx.textAlign='left';
  }
  tag(cA,'A','#a06a00'); tag(cB,'B','#8c3a04'); tag(P(Ip[0],Ip[1]+0.075),'C','#3f4854');
}

/* ================= 图像卡片 ================= */
const GV={c:document.getElementById('gv'),x:null,dom:{x0:0,x1:1.5,y0:-1.0,y1:1.2},lab:'v/(m·s⁻¹)'};
const GX={c:document.getElementById('gx'),x:null,dom:{x0:0,x1:1.3,y0:-1.0,y1:1.0},lab:'x/m'};
GV.x=GV.c.getContext('2d'); GX.x=GX.c.getContext('2d');
function gfit(G){
  const d=Math.min(window.devicePixelRatio||1,2),w=G.c.clientWidth,h=G.c.clientHeight;
  if(G.c.width!==Math.round(w*d)){G.c.width=w*d;G.c.height=h*d;G.x.setTransform(d,0,0,d,0,0);}
  const m={l:46,r:16,t:32,b:30};
  G.m=m;G.w=w;G.h=h;
  G.X=v=>m.l+(v-G.dom.x0)/(G.dom.x1-G.dom.x0)*(w-m.l-m.r);
  G.Y=v=>m.t+(G.dom.y1-v)/(G.dom.y1-G.dom.y0)*(h-m.t-m.b);
}
function gcurve(G,fn,x0,x1,N,col,w,dash){
  const c=G.x;c.save();c.beginPath();c.rect(G.m.l-1,G.m.t-1,G.w-G.m.l-G.m.r+2,G.h-G.m.t-G.m.b+2);c.clip();
  c.beginPath();let st0=false;
  for(let i=0;i<=N;i++){const t=x0+(x1-x0)*i/N,y=fn(t);if(!isFinite(y)){st0=false;continue;}
    const X=G.X(t),Y=G.Y(y);if(!st0){c.moveTo(X,Y);st0=true;}else c.lineTo(X,Y);}
  c.lineWidth=w;c.lineJoin='round';c.lineCap='round';c.strokeStyle=col;
  if(dash)c.setLineDash(dash);c.stroke();c.restore();
}
function drawGraph(G,kind){
  gfit(G);const c=G.x,T=st.time,f=st.flag;
  c.clearRect(0,0,G.w,G.h);
  /* 网格 */
  c.save();c.strokeStyle='#eef2f8';c.lineWidth=1;
  for(let v=Math.ceil(G.dom.y0*5)/5;v<=G.dom.y1;v+=0.2){const Y=G.Y(v);c.beginPath();c.moveTo(G.m.l,Y);c.lineTo(G.w-G.m.r,Y);c.stroke();}
  for(let v=0;v<=G.dom.x1+1e-9;v+=0.2){const X=G.X(v);c.beginPath();c.moveTo(X,G.m.t);c.lineTo(X,G.h-G.m.b);c.stroke();}
  c.restore();
  /* 轴 */
  const y0=G.Y(0),x0=G.X(0);
  c.strokeStyle='#40506a';c.lineWidth=1.8;c.beginPath();c.moveTo(x0,G.Y(G.dom.y0));c.lineTo(x0,G.Y(G.dom.y1));c.stroke();
  c.beginPath();c.moveTo(G.m.l,y0);c.lineTo(G.w-G.m.r,y0);c.stroke();
  arrowHead(c,[G.w-G.m.r,y0],0,9,'#40506a',1.8);arrowHead(c,[x0,G.Y(G.dom.y1)],-Math.PI/2,9,'#40506a',1.8);
  c.font='12px "Microsoft YaHei"';c.fillStyle='#5b6d85';c.textAlign='right';c.fillText('t/s',G.w-G.m.r,y0+16);
  c.textAlign='left';c.fillText(G.lab,x0+7,G.Y(G.dom.y1)+14);
  c.textAlign='center';
  for(let v=Math.ceil(G.dom.y0*5)/5;v<=G.dom.y1;v+=0.5){if(Math.abs(v)<1e-9)continue;
    c.fillStyle='#93a2b7';c.font='10.5px "Microsoft YaHei"';c.fillText(v.toFixed(1),G.m.l-7,G.Y(v)+3.5);}
  c.textAlign='left';

  const A=kind==='v'?vA:xA, B=kind==='v'?vB:xB;
  const REF = kind==='v'
    ? (f?[[['f3'],vA1,[102,102,102],3.4,'v_A1'],[['f3'],vB1,[0,100,0],2.6,'v_B1'],
          [['f4'],vA2,[0,90,220],3,'v_A2'],[['f4'],vB2,[153,51,255],3,'v_B2']]
       :[[['f5'],vA3,[56,140,131],3,'v_A3'],[['f6'],vA4,[204,0,0],3,'v_A4'],
         [['f7'],vA5,[153,51,0],3,'v_A5'],[['f7'],vB5,[21,101,192],2.8,'v_B5']])
    : (f?[[['f3'],xA1,[153,51,255],3.4,'x_A1'],[['f3'],xB1,[153,51,0],2.8,'x_B1'],
          [['f4'],xA2,[204,0,0],3,'x_A2'],[['f4'],xB2,[199,80,0],3,'x_B2']]
       :[[['f5'],xA3,[101,87,210],3,'x_A3'],[['f6'],xA4,[0,100,0],3,'x_A4'],
         [['f7'],xA5,[211,47,47],3,'x_A5'],[['f7'],xB5,[101,87,210],2.6,'x_B5']]);

  REF.forEach(([ks,fn,col,lw])=>{if(st[ks[0]])gcurve(G,fn,0,G.dom.x1,600,rgba(col,.55),lw,[6,4]);});

  gcurve(G,B,0,T,700,kind==='v'?'#ff6a00':'#ff6a00',kind==='v'?4.2:3.6);
  gcurve(G,A,0,T,700,kind==='v'?'#f0a324':'#f7c95c',kind==='v'?4.2:3.6);

  /* 关键时刻 */
  const mk=(tv,txt)=>{
    const X=G.X(tv);c.save();c.strokeStyle='#8fa2ba';c.lineWidth=1.4;c.setLineDash([4,3]);
    c.beginPath();c.moveTo(X,y0);c.lineTo(X,G.Y(A(tv)));c.stroke();c.restore();
    c.beginPath();c.arc(X,G.Y(A(tv)),3.6,0,6.2832);c.fillStyle='#1565c0';c.fill();
    c.font='italic 12px "Times New Roman"';c.fillStyle='#33455e';c.textAlign='center';c.fillText(txt,X,y0+15);c.textAlign='left';
  };
  if(f?T>=t1:(T>=t2)) mk(f?t1:t2, f?'t₁':'t₂');
  if(!f&&T>=t2+t3) mk(t2+t3,'t₂+t₃');
  /* 图例（置于绘图区上方的空白带内） */
  const items=kind==='v'
    ?[['#f0a324','v_A 描迹'],['#ff6a00','v_B 描迹']].concat(REF.filter(x=>st[x[0][0]]).map(x=>[rgba(x[2],.9),x[4]]))
    :[['#f7c95c','x_A 描迹'],['#ff6a00','x_B 描迹']].concat(REF.filter(x=>st[x[0][0]]).map(x=>[rgba(x[2],.9),x[4]]));
  const sub=null;                                   /* 下标绘制见下方内联逻辑 */
  c.font='11px "Microsoft YaHei"';
  let lx=G.m.l+2,ly=15;
  items.forEach(it=>{
    const tw=it[1].indexOf('_')>=0?26:c.measureText(it[1]).width, w=tw+20;
    if(lx+w>G.w-G.m.r){lx=G.m.l+2;ly+=15;}
    c.strokeStyle=it[0];c.lineWidth=2.8;c.lineCap='round';
    c.beginPath();c.moveTo(lx,ly-3.5);c.lineTo(lx+11,ly-3.5);c.stroke();
    c.fillStyle='#5b6d85';c.textAlign='left';
    if(it[1].indexOf('_')>=0){c.font='11px "Microsoft YaHei"';const p=it[1].split('_');
      c.fillText(p[0],lx+14,ly);const w1=c.measureText(p[0]).width;
      c.font='8.4px "Microsoft YaHei"';c.fillText(p[1],lx+14+w1,ly+2.6);}
    else c.fillText(it[1],lx+14,ly);
    lx+=w+4;});
}

/* ---- 浮层定位 / 拖动 ---- */
const cardV=document.getElementById('cardV'), cardX=document.getElementById('cardX');
let placed=false;
function layoutCards(force){
  const w=wrap.clientWidth,h=wrap.clientHeight,cw=392,ch=318;
  if(force&&!placed){
    const y=Math.max(10,h-ch-16);
    cardV.style.left='16px'; cardV.style.top=y+'px';
    const x2=16+cw+14;
    if(x2+cw<=w-16){cardX.style.left=x2+'px';cardX.style.top=y+'px';}
    else{cardX.style.left='16px';cardX.style.top=Math.max(10,y-ch-12)+'px';}
    placed=true;
  }
  [cardV,cardX].forEach(c=>{
    const L=parseFloat(c.style.left)||0,T=parseFloat(c.style.top)||0;
    c.style.left=Math.max(0,Math.min(Math.max(0,w-c.offsetWidth||1),L))+'px';
    c.style.top =Math.max(0,Math.min(Math.max(0,h-c.offsetHeight||1),T))+'px';
  });
}
[['gh',cardV],['gh',cardX]].forEach(([,card])=>{
  const hd=card.querySelector('.gh');
  hd.addEventListener('pointerdown',e=>{
    if(e.target.classList.contains('x'))return;
    const r=card.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
    const dx=e.clientX-r.left,dy=e.clientY-r.top;
    hd.setPointerCapture(e.pointerId);
    const mv=ev=>{card.style.left=Math.min(wr.width-card.offsetWidth,Math.max(0,ev.clientX-wr.left-dx))+'px';
                  card.style.top =Math.min(wr.height-card.offsetHeight,Math.max(0,ev.clientY-wr.top-dy))+'px';};
    const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up);};
    hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);
  });
});
document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>{
  const k=el.dataset.close; if(k==='V'){st.flag1=false;}else{st.flag2=false;} syncUI();
}));

/* ================= 面板 ================= */
const $=id=>document.getElementById(id);
const SEGS={
  one:[['f3','过程一  t ∈ [0, t₁]','#666666'],['f4','过程二  t > t₁','#005adc']],
  two:[['f5','阶段一  t ∈ [0, t₂]','#388c83'],['f6','阶段二  t ∈ (t₂, t₂+t₃]','#cc0000'],['f7','阶段三  t > t₂+t₃','#d32f2f']]
};
function buildSegs(){
  const box=$('segs');box.innerHTML='';
  (st.flag?SEGS.one:SEGS.two).forEach(([k,lb,col])=>{
    const d=document.createElement('div');d.className='chip'+(st[k]?' on':'');
    d.innerHTML='<span class="sw" style="background:'+col+'"></span><span class="lb">'+lb+'</span><span class="ck"></span>';
    d.onclick=()=>{st[k]=!st[k];syncUI();};box.appendChild(d);
  });
}
function syncUI(){
  $('bFlag1').classList.toggle('on',st.flag); $('bFlag0').classList.toggle('on',!st.flag);
  $('bG1').classList.toggle('on',st.flag1);  $('bG2').classList.toggle('on',st.flag2);
  $('bPlay').classList.toggle('on',st.playing);
  cardV.style.display=st.flag1?'flex':'none'; cardX.style.display=st.flag2?'flex':'none';
  $('slT').max=tmax();
  $('sceneHint').innerHTML=st.flag
    ?'A、B、C 一起由静止释放，前 ¼ 周期共速，t₁ 后 B 与 A 分离'
    :'对 A 施加恒力 F，t₂ 时 B 开始相对滑动，t₂+t₃ 后 A 单独振动';
  $('segTitle').textContent=st.flag?'分段曲线叠加（过程）':'分段曲线叠加（阶段）';
  buildSegs();
  $('keyHint').innerHTML='t₁ = <em>'+t1.toFixed(4)+'</em> s ｜ t₂ = <em>'+t2.toFixed(4)+'</em> s ｜ t₂+t₃ = <em>'+(t2+t3).toFixed(4)+'</em> s';
}
$('bFlag1').onclick=()=>{st.flag=true;st.time=Math.min(st.time,tmax());syncUI();};
$('bFlag0').onclick=()=>{st.flag=false;st.time=Math.min(st.time,tmax());syncUI();};
$('bG1').onclick=()=>{st.flag1=!st.flag1;syncUI();};
$('bG2').onclick=()=>{st.flag2=!st.flag2;syncUI();};
$('bPlay').onclick=()=>{st.playing=true;};
$('bPause').onclick=()=>{st.playing=false;};
$('bReset').onclick=()=>{st.time=0;st.playing=false;};
$('slT').oninput=e=>{st.time=parseFloat(e.target.value);st.playing=false;};
$('slSpd').oninput=e=>{st.speed=parseFloat(e.target.value);$('tSpd').textContent=st.speed.toFixed(2)+'×';};

/* ================= 主循环 ================= */
const RATE=0.2; let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,0.1);last=now;
  if(st.playing){st.time+=dt*RATE*st.speed;if(st.time>=tmax()){st.time=tmax();st.playing=false;}}
  drawStage();
  if(st.flag1)drawGraph(GV,'v');
  if(st.flag2)drawGraph(GX,'x');
  const av=xA(st.time),bv=xB(st.time);
  $('rT').textContent=st.time.toFixed(3);$('rA').textContent=av.toFixed(3);
  $('rB').textContent=bv.toFixed(3);$('rD').textContent=(bv-av).toFixed(3);
  $('rVA').textContent=vA(st.time).toFixed(3);$('rVB').textContent=vB(st.time).toFixed(3);
  $('slT').value=st.time;$('tT').textContent=st.time.toFixed(3)+' s';
  requestAnimationFrame(tick);
}
new ResizeObserver(resizeStage).observe(wrap);
window.addEventListener('resize',resizeStage);
(function(){const q=new URLSearchParams(location.search);
  if(q.get('flag')==='0')st.flag=false;
  if(q.get('g1')==='1')st.flag1=true; if(q.get('g2')==='1')st.flag2=true;
  ['f3','f4','f5','f6','f7'].forEach(k=>{if(q.get(k)==='1')st[k]=true;});
  if(q.has('t')){st.time=parseFloat(q.get('t'));st.playing=false;}
})();
resizeStage();syncUI();requestAnimationFrame(tick);
</script>

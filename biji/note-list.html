<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作纪要 · 列表</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
body{margin:0;padding:0;background:#f4f5f7;color:#1f2328}
.hidden{display:none!important}
a{color:#0969da}

/* 登录 */
#lock{max-width:420px;margin:14vh auto;background:#fff;padding:26px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
#lock h2{margin:0 0 6px;font-size:20px}
#lock p{color:#656d76;font-size:14px;margin:0 0 16px}
#lock input{width:100%;padding:11px;font-size:16px;border:1px solid #d0d7de;border-radius:8px;margin-bottom:10px}
#lock button{width:100%;padding:11px;font-size:16px;border:none;border-radius:8px;background:#0969da;color:#fff;cursor:pointer}
#lock .err{color:#cf222e;font-size:13px;min-height:18px}

/* 顶栏 */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d8dee4;padding:12px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.hrow h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}
.count{color:#656d76;font-size:13px;background:#eef1f4;padding:2px 8px;border-radius:10px;white-space:nowrap}
#search{flex:1;min-width:180px;padding:8px 12px;font-size:14px;border:1px solid #d0d7de;border-radius:8px;outline:none}
#search:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12)}
.btn{padding:7px 12px;font-size:13px;border:1px solid #d0d7de;border-radius:7px;background:#f6f8fa;cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef1f4}
.btn-primary{background:#0969da;color:#fff;border-color:#0969da}
.btn-primary:hover{background:#0a5cc4}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1180px;margin:8px auto 0}
.chip{padding:4px 11px;font-size:13px;border:1px solid #d0d7de;border-radius:14px;background:#fff;cursor:pointer;color:#3d444d}
.chip.active{background:#0969da;border-color:#0969da;color:#fff}

main{max-width:1180px;margin:16px auto 60px;padding:0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* 卡片 */
.card{background:#fff;border:1px solid #e3e7eb;border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card:hover{border-color:#b6c2cf;box-shadow:0 3px 12px rgba(31,35,40,.09);transform:translateY(-1px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#0969da;opacity:.75}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.card .date{font-size:12px;color:#656d76;font-variant-numeric:tabular-nums;white-space:nowrap}
.card h3{margin:0 0 7px;font-size:15px;font-weight:650;line-height:1.45;word-break:break-word}
.card .ex{font-size:13px;color:#57606a;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .thumbs{display:flex;gap:5px;margin-top:9px}
.card .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid #e3e7eb;background:#f6f8fa}
.card .badge{font-size:11px;color:#656d76;background:#eef1f4;padding:1px 6px;border-radius:8px;margin-left:6px}

/* 空/加载 */
.state{text-align:center;padding:60px 20px;color:#656d76;font-size:14px;line-height:1.9}
.spinner{width:22px;height:22px;border:2.5px solid #d8dee4;border-top-color:#0969da;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 详情弹层 */
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,26,.55);display:flex;align-items:flex-start;justify-content:center;padding:3vh 16px;overflow:auto}
#modal .panel{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:26px 30px 30px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.28)}
#modal .close{position:absolute;right:14px;top:12px;border:none;background:#f6f8fa;width:30px;height:30px;border-radius:8px;font-size:17px;cursor:pointer;color:#57606a;line-height:1}
#modal .close:hover{background:#e7ebef}
#modal h2{margin:0 34px 4px 0;font-size:21px;line-height:1.4}
#modal .meta{color:#656d76;font-size:13px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #eaeef2}
.body{font-size:15px;line-height:1.85;color:#1f2328;word-break:break-word}
.body h2{font-size:18px;margin:20px 0 8px}
.body h3{font-size:16px;margin:16px 0 6px}
.body p{margin:0 0 10px}
.body ul{margin:6px 0 12px;padding-left:22px}
.body li{margin:3px 0}
.body code{background:#f0f2f4;padding:1px 5px;border-radius:4px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.body blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid #d0d7de;color:#57606a}
.body img{max-width:100%;max-height:58vh;width:auto;object-fit:contain;border-radius:8px;border:1px solid #e3e7eb;margin:12px auto;display:block;cursor:zoom-in}
.mfoot{display:flex;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid #eaeef2;flex-wrap:wrap}
.btn-danger{color:#cf222e;border-color:#f0c4c8;background:#fff}
.btn-danger:hover{background:#fff5f5}
</style>
</head>
<body>

<div id="lock">
  <h2>工作纪要</h2>
  <p>请输入访问密码</p>
  <input type="password" id="pwd" placeholder="密码">
  <button onclick="unlock()">进入</button>
  <div class="err" id="lockErr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="hrow">
      <h1>📚 工作纪要</h1>
      <span class="count" id="count">—</span>
      <input id="search" placeholder="搜索标题或正文…" oninput="render()">
      <button class="btn" onclick="load(true)">刷新</button>
      <button class="btn btn-primary" onclick="location.href='./'">＋ 录入</button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main>
    <div class="grid" id="grid"></div>
    <div class="state hidden" id="state"></div>
  </main>
</div>

<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()">
  <div class="panel">
    <button class="close" onclick="closeModal()">✕</button>
    <h2 id="mTitle"></h2>
    <div class="meta" id="mMeta"></div>
    <div class="body" id="mBody"></div>
    <div class="mfoot">
      <button class="btn btn-primary" onclick="exportPdf()">导出 PDF（含图片）</button>
      <button class="btn" onclick="exportMd()">导出 MD</button>
      <a class="btn" id="mGithub" target="_blank" rel="noopener">在 GitHub 查看原文</a>
      <button class="btn btn-danger" onclick="removeNote()">删除这条</button>
    </div>
  </div>
</div>

<script>
// ================= 配置 =================
const CFG = {
  owner: "gch365",
  repo: "physics-html",
  branch: "master",
  password: "99",
  siteBase: "https://gch365.github.io/physics-html/",
  apiBase: "https://api.github.com/repos/gch365/physics-html",
  rawBase: "https://raw.githubusercontent.com/gch365/physics-html/master/"
};
// ========================================

const $ = id => document.getElementById(id);
let ALL = [];          // 全部纪要
let activeYear = 'all';
let current = null;    // 当前打开的纪要

/* ---------- 解锁 ---------- */
function unlock(){
  if($('pwd').value.trim() === CFG.password){
    try{ sessionStorage.setItem('biji_auth','1'); }catch(e){}
    enter();
  }else{
    $('lockErr').innerText = '密码错误';
  }
}

function enter(){
  $('lock').classList.add('hidden');
  $('app').classList.remove('hidden');
  load();
}

// 从录入页进来（同一次浏览会话已解锁）就不再问密码
(function autoEnter(){
  try{
    if(sessionStorage.getItem('biji_auth') === '1'){ enter(); }
  }catch(e){}
})();
$('pwd').addEventListener('keydown', e=>{ if(e.key === 'Enter') unlock(); });

/* ---------- Token（与录入页共用同一个 localStorage key） ---------- */
function tokenKey(){ return `gh_pat_${CFG.owner}_${CFG.repo}`; }
function getToken(silent){
  const t = localStorage.getItem(tokenKey());
  if(t) return t;
  if(silent) return '';
  const v = (prompt('需要 GitHub Token 才能删除（需 repo 写权限，仅存本机浏览器）') || '').trim();
  if(v) localStorage.setItem(tokenKey(), v);
  return v;
}

/* ---------- 数据加载 ---------- */
function setState(html){
  const s = $('state');
  if(!html){ s.classList.add('hidden'); s.innerHTML = ''; return; }
  s.innerHTML = html; s.classList.remove('hidden');
}

async function load(force){
  $('grid').innerHTML = '';
  setState('<div class="spinner"></div>正在读取纪要…');
  try{
    const notes = await fetchNoteList(force);
    ALL = notes;
    const years = [...new Set(notes.map(n=>n.year))].sort().reverse();
    renderChips(years);
    render();
    $('count').innerText = `${notes.length} 条`;
    setState(notes.length ? '' : '还没有纪要，点右上角「＋ 录入」开始记录。');
  }catch(err){
    setState(`<b style="color:#cf222e">读取失败</b><br>${esc(err.message)}<br><br>
      <span style="font-size:13px">常见原因：GitHub API 匿名访问限流（60 次/小时）。<br>
      稍等几分钟点「刷新」，或填一次 Token 提高到 5000 次/小时。</span><br><br>
      <button class="btn btn-primary" onclick="setTokenAndReload()">填写 Token 并重试</button>`);
  }
}

function setTokenAndReload(){
  const v = (prompt('请输入 GitHub Token（只需填一次，保存在本机浏览器；\n可与录入页共用同一个 Token）') || '').trim();
  if(!v) return;
  localStorage.setItem(tokenKey(), v);
  sessionStorage.removeItem('notes_cache_v1');
  load(true);
}

async function api(path){
  const headers = { 'Accept': 'application/vnd.github+json' };
  const t = getToken(true);
  if(t) headers['Authorization'] = `token ${t}`;
  const r = await fetch(CFG.apiBase + path, { headers, cache: 'no-store' });
  if(r.status === 403 || r.status === 429){
    throw new Error('GitHub API 限流，请稍后再试');
  }
  if(!r.ok) throw new Error(`GitHub API ${r.status}`);
  return r.json();
}

const encPath = p => p.split('/').map(encodeURIComponent).join('/');

async function fetchNoteList(force){
  // 5 分钟内用缓存，避免反复触发限流
  const CACHE_KEY = 'notes_cache_v1';
  if(!force){
    try{
      const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
      if(c && Date.now() - c.t < 5*60*1000 && Array.isArray(c.data)) return c.data;
    }catch(e){}
  }

  const tree = await api(`/git/trees/${CFG.branch}?recursive=1`);
  const paths = (tree.tree || [])
    .filter(i => i.type === 'blob' && i.path.startsWith('notes/') && i.path.endsWith('.md'))
    .map(i => i.path)
    .sort()
    .reverse();   // 文件名以日期开头，倒序即最新在前

  const out = [];
  let failed = 0;
  // 并发抓取正文，限 6 并发
  for(let i = 0; i < paths.length; i += 6){
    const batch = paths.slice(i, i + 6);
    const got = await Promise.all(batch.map(async p => {
      const txt = await fetchText(p);
      if(txt == null) return null;
      try{ return parseNote(p, txt); }catch(e){ return null; }
    }));
    got.forEach(g => { if(g) out.push(g); else failed++; });
  }
  if(failed){
    // 有丢页时给出提示，避免"看起来少了几条"却不知道原因
    setTimeout(()=>{
      const s2 = $('state');
      s2.classList.remove('hidden');
      s2.innerHTML = `<span style="color:#9a6700">有 ${failed} 条正文读取失败</span>（可能是网络或 Pages 尚未构建完成），点右上角「刷新」重试。`;
    }, 100);
  }

  out.sort((a,b) => (b.date + b.title).localeCompare(a.date + a.title));
  try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify({t: Date.now(), data: out})); }catch(e){}
  return out;
}

/* ---------- 抓取 md 正文 ----------
   优先用本站 Pages（同源、国内可访问、不占 API 额度），
   失败再退回 raw.githubusercontent（新文件在 Pages 构建完成前只能从这里取）。
   每个源都带超时，避免网络卡住导致页面一直转圈。
*/
async function fetchText(path, timeoutMs = 12000){
  const urls = [
    CFG.siteBase + encPath(path),   // ① 同源 Pages
    CFG.rawBase  + encPath(path)    // ② raw 兜底
  ];
  for(const u of urls){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
    try{
      const r = await fetch(u, { cache: 'no-store', signal: ctrl.signal });
      clearTimeout(timer);
      if(!r.ok) continue;
      const txt = await r.text();
      // 校验确实是我们的 md 原文（Pages 若做过 Jekyll 渲染会返回 HTML）
      if(/^\s*#\s+/.test(txt) && /日期[：:]/.test(txt)) return txt;
    }catch(e){
      clearTimeout(timer);
    }
  }
  return null;
}

/* ---------- 解析 md ---------- */
function parseNote(path, text){
  const fileName = path.split('/').pop().replace(/\.md$/i, '');
  const m = fileName.match(/^(\d{4}-\d{2}-\d{2})-(.*)$/);
  const date = m ? m[1] : (text.match(/日期[：:]\s*(\d{4}-\d{2}-\d{2})/) || [,''])[1];
  let title = (text.match(/^#\s+(.+)$/m) || [,''])[1].trim();
  if(!title) title = m ? m[2] : fileName;

  // 去掉首行标题和日期行，得到正文
  let body = text
    .replace(/^#\s+.+\r?\n/, '')
    .replace(/^\s*日期[：:]\s*\d{4}-\d{2}-\d{2}\s*\r?\n/, '')
    .trim();

  const images = [];
  body.replace(/!\[[^\]]*\]\(([^)]+)\)/g, (_, src) => { images.push(src); return _; });

  return {
    path, fileName, title,
    date: date || '',
    year: (date || '0000').slice(0, 4),
    body, images,
    excerpt: body.replace(/!\[[^\]]*\]\([^)]+\)/g, '')
                 .replace(/[#*`>\-]/g, ' ')
                 .replace(/\s+/g, ' ').trim()
  };
}

/* ---------- 图片路径修正 ----------
   老纪要写成 notes/assets/... （相对 md 目录会 404）
   新纪要写成 ../assets/... （正确）
   统一解析成站点绝对 URL，并做一次 404 兜底
*/
function resolveImg(src, mdPath){
  if(/^https?:\/\//i.test(src)) return src;
  if(src.startsWith('/')) return CFG.siteBase + src.replace(/^\//, '');
  // 老纪要写的是「仓库根相对路径」notes/assets/...，直接拼站点根，别再按 md 目录解析
  if(/^notes\//.test(src)) return CFG.siteBase + src;
  const dir = mdPath.split('/').slice(0, -1);
  const parts = (dir.join('/') + '/' + src).split('/');
  const out = [];
  for(const p of parts){
    if(p === '.' || p === '') continue;
    if(p === '..') out.pop();
    else out.push(p);
  }
  return CFG.siteBase + out.join('/');
}
// 老路径兜底：把 notes/assets/... 当仓库根相对路径再试一次
function imgFallback(el, src){
  if(el.dataset.fb) return;
  el.dataset.fb = '1';
  if(/^notes\//.test(src)) el.src = CFG.siteBase + src;
}

/* ---------- 渲染 ---------- */
function renderChips(years){
  const box = $('chips');
  box.innerHTML = '';
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeYear === val ? ' active' : '');
    b.innerText = label;
    b.onclick = () => { activeYear = val; renderChips(years); render(); };
    box.appendChild(b);
  };
  if(years.length > 1) mk('全部', 'all');
  years.forEach(y => mk(`${y} 年`, y));
}

function render(){
  const kw = $('search').value.trim().toLowerCase();
  const list = ALL.filter(n => {
    if(activeYear !== 'all' && n.year !== activeYear) return false;
    if(!kw) return true;
    return (n.title + ' ' + n.body).toLowerCase().includes(kw);
  });

  const g = $('grid');
  g.innerHTML = '';
  if(!list.length){
    setState(kw ? '没有匹配的纪要。' : '还没有纪要，点右上角「＋ 录入」开始记录。');
    return;
  }
  setState('');

  list.forEach(n => {
    const c = document.createElement('div');
    c.className = 'card';
    const thumbs = n.images.slice(0, 4).map((s, i) => {
      const u = resolveImg(s, n.path);
      return `<img src="${esc(u)}" alt="" loading="lazy" onerror="imgFallback(this,'${esc(s).replace(/'/g,'&#39;')}')">`;
    }).join('');
    const more = n.images.length > 4 ? `<span class="badge">+${n.images.length - 4}</span>` : '';
    const imgBadge = n.images.length ? `<span class="badge">${n.images.length} 图</span>` : '';
    c.innerHTML = `
      <div class="top">
        <span class="date">${esc(n.date)}</span>
        <span>${imgBadge}</span>
      </div>
      <h3>${esc(n.title)}</h3>
      <div class="ex">${esc(n.excerpt.slice(0, 220))}</div>
      ${thumbs ? `<div class="thumbs">${thumbs}${more}</div>` : ''}`;
    c.onclick = () => openModal(n);
    g.appendChild(c);
  });
}

/* ---------- 极简 md 渲染 ---------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function mdToHtml(md, mdPath){
  const lines = md.split(/\r?\n/);
  let html = '', inList = false, inCode = false, codeBuf = [];

  const inline = s => s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');

  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };

  for(let raw of lines){
    // 图片：单独成行处理
    const imgOnly = raw.match(/^\s*!\[([^\]]*)\]\(([^)]+)\)\s*$/);
    if(imgOnly){
      closeList();
      const u = resolveImg(imgOnly[2], mdPath);
      html += `<img src="${esc(u)}" alt="${esc(imgOnly[1])}" loading="lazy"
                onerror="imgFallback(this,'${esc(imgOnly[2]).replace(/'/g,'&#39;')}')">`;
      continue;
    }
    if(/^```/.test(raw)){
      if(inCode){ html += `<pre style="background:#f6f8fa;padding:10px;border-radius:8px;overflow:auto;font-size:13px"><code>${esc(codeBuf.join('\n'))}</code></pre>`; codeBuf = []; inCode = false; }
      else { closeList(); inCode = true; }
      continue;
    }
    if(inCode){ codeBuf.push(raw); continue; }

    let line = esc(raw);
    if(!line.trim()){ closeList(); continue; }
    if(/^###\s+/.test(line)){ closeList(); html += `<h3>${inline(line.replace(/^###\s+/,''))}</h3>`; continue; }
    if(/^##\s+/.test(line)){ closeList(); html += `<h2>${inline(line.replace(/^##\s+/,''))}</h2>`; continue; }
    if(/^>\s?/.test(line)){ closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`; continue; }
    if(/^[-*+]\s+/.test(line)){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li>${inline(line.replace(/^[-*+]\s+/,''))}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList();
  if(inCode && codeBuf.length) html += `<pre style="background:#f6f8fa;padding:10px;border-radius:8px;overflow:auto"><code>${esc(codeBuf.join('\n'))}</code></pre>`;
  return html;
}

/* ---------- 详情 ---------- */
function openModal(n){
  current = n;
  $('mTitle').innerText = n.title;
  $('mMeta').innerText = `${n.date} · ${n.images.length} 张图 · ${n.path}`;
  $('mBody').innerHTML = mdToHtml(n.body, n.path);
  // 点图片查看原图
  $('mBody').querySelectorAll('img').forEach(img=>{
    img.title = '点击查看原图';
    img.onclick = () => window.open(img.src, '_blank');
  });
  $('mGithub').href = `https://github.com/${CFG.owner}/${CFG.repo}/blob/${CFG.branch}/${encPath(n.path)}`;
  $('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  $('modal').classList.add('hidden');
  document.body.style.overflow = '';
  current = null;
}
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && current) closeModal(); });

/* ---------- 导出 ---------- */
const PRINT_CSS = `
@page{size:A4;margin:18mm 16mm}
*{box-sizing:border-box}
body{margin:0;padding:0;font:15px/1.9 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#1a1a1a;background:#fff}

function printNote(title, date, bodyHtml, multi){
  const w = window.open('', '_blank');
  if(!w){ alert('浏览器拦截了新窗口，请允许弹出窗口后重试'); return; }
  const doc = `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>${esc(title)}</title><style>${PRINT_CSS}</style></head><body>
<div class="hint">打印对话框会自动弹出，目标选「另存为 PDF」即可。若未弹出请按 Ctrl+P</div>
<div class="wrap"><div class="page">
<h1>${esc(title)}</h1>
<div class="meta">日期：${esc(date)}</div>
<div class="body${multi ? ' multi' : ''}">${bodyHtml}</div>
</div></div></body></html>`;
  w.document.open(); w.document.write(doc); w.document.close();

  let tries = 0;
  const timer = setInterval(()=>{
    tries++;
    const imgs = [...w.document.images];
    const ready = imgs.every(i => i.complete && i.naturalWidth > 0);
    if(ready || tries > 60){
      clearInterval(timer);
      try{ w.focus(); w.print(); }catch(e){}
    }
  }, 200);
}

function exportPdf(){
  if(!current){ return; }
  printNote(current.title, current.date, mdToHtml(current.body, current.path), current.images.length > 1);
}

function exportMd(){
  if(!current){ return; }
  const md = `# ${current.title}\n\n日期：${current.date}\n\n${current.body}\n`;
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${current.date}-${current.title}.md`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 删除 ---------- */
async function removeNote(){
  if(!current) return;
  const target = current;                       // 先固定引用，closeModal 会清空 current
  if(!confirm(`确定删除「${target.title}」？\n\n只删这条 md，图片文件会保留在仓库里。`)) return;
  const t = getToken(false);
  if(!t){ alert('未提供 Token，无法删除'); return; }

  const url = `${CFG.apiBase}/contents/${encPath(target.path)}`;
  try{
    const r = await fetch(`${url}?ref=${CFG.branch}`, { headers: { Authorization: `token ${t}` }, cache:'no-store' });
    if(!r.ok) throw new Error(`读取文件失败 ${r.status}`);
    const info = await r.json();
    const d = await fetch(url, {
      method: 'DELETE',
      headers: { Authorization: `token ${t}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `delete note ${target.path}`, sha: info.sha, branch: CFG.branch })
    });
    if(!d.ok){
      const txt = await d.text();
      throw new Error(`删除失败 ${d.status}：${txt.slice(0,200)}`);
    }
    closeModal();
    ALL = ALL.filter(x => x.path !== target.path);
    await load(true);
  }catch(err){
    alert('删除失败：' + err.message);
  }
}

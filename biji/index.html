<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作纪要录入（自用·前端本地压缩）</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
body{max-width:900px;margin:20px auto;padding:0 16px;color:#222}
h2{margin:0 0 12px}
.box{border:1px solid #ccc;padding:16px;border-radius:8px;margin-bottom:12px}
.hidden{display:none!important}
input,textarea,button{width:100%;padding:10px;margin:8px 0;font-size:16px}
input[type=file]{padding:6px}
textarea{min-height:180px;line-height:1.6;resize:vertical}
label{display:block;font-size:14px;color:#444;margin-top:6px}
.img-preview{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.img-preview figure{margin:0;text-align:center}
.img-preview img{height:120px;border:1px solid #aaa;object-fit:contain;display:block}
.img-preview figcaption{font-size:12px;color:#666;margin-top:2px}
#log{white-space:pre-wrap;color:#333;background:#f5f5f5;padding:8px;font-size:13px;border-radius:6px;min-height:24px;max-height:240px;overflow:auto;line-height:1.5}
#log:empty{display:none}
.btn-success{background:#28a745;color:#fff;border:none}
.btn-sub{background:#0d6efd;color:#fff;border:none}
button{border:1px solid #bbb;background:#fafafa;border-radius:6px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.err{color:#c00}
.tip{font-size:13px;color:#666;margin:4px 0 0}
.row{display:flex;gap:10px}
.row>div{flex:1}
</style>
</head>
<body>
<h2>📝 备课/会议纪要录入</h2>

<div class="box" id="lock-panel">
  <p>请输入访问密码</p>
  <input type="password" id="pwd" placeholder="密码">
  <button onclick="unlock()">解锁</button>
  <p class="tip" id="lockTip"></p>
</div>

<div id="main-panel" class="hidden">
  <div class="box">
    <div class="row">
      <div>
        <label>标题</label>
        <input id="title" placeholder="例如：动量定理数字化实验备课">
      </div>
      <div>
        <label>日期</label>
        <input id="date" type="date">
      </div>
    </div>
    <label>正文</label>
    <textarea id="content" placeholder="记录内容……"></textarea>
    <label>选择图片（可多选）</label>
    <input type="file" id="img-input" multiple accept="image/*">
    <div class="img-preview" id="preview"></div>
    <button class="btn-sub" id="submitBtn" onclick="submitNote()">提交到仓库</button>
    <button class="btn-success hidden" id="dlBtn" onclick="downloadCurrentMd()">导出本条MD</button>
    <div id="log"></div>
  </div>
  <div style="margin-top:10px">
    <a href="note-list.html">👉 打开纪要列表页</a>
  </div>
</div>

<script>
// ========== 在这里改配置 ==========
const CONFIG = {
  owner: "gch365",
  repo: "physics-html",
  branch: "master",   // 你的 physics-html 仓库默认分支是 master（不是 main）
  token: "",          // PAT 不要写死在文件里，首次弹窗输入，存 localStorage
  password: "999999", // 页面解锁密码（6个9）
  maxWidth: 1600,     // 压缩后最大宽度
  maxFileSizeKb: 850, // GitHub 单图上限（contents API 建议 < 1MB）
  jpegQuality: 0.82
};
// ===================================

const PICA_CDNS = [
  "https://cdn.jsdelivr.net/npm/pica@9/dist/pica.min.js",
  "https://unpkg.com/pica@9/dist/pica.min.js",
  "https://fastly.jsdelivr.net/npm/pica@9/dist/pica.min.js"
];

let selectedImages = [];
let lastMdText = "";
let lastMdName = "";
let picaInstance = null;
let busy = false;

const $ = id => document.getElementById(id);

if (!$('date').value) $('date').valueAsDate = new Date();

/* ---------- 工具 ---------- */
function log(text){
  const el = $('log');
  el.innerText += text + '\n';
  el.scrollTop = el.scrollHeight;
}
function clearLog(){ $('log').innerText = ''; }

function tokenKey(){ return `gh_pat_${CONFIG.owner}_${CONFIG.repo}`; }
function getToken(){
  const saved = localStorage.getItem(tokenKey());
  if(saved) return saved;
  const t = (prompt('首次使用：请输入 GitHub Personal Access Token（需 repo 写权限，仅保存在本机浏览器）') || '').trim();
  if(t) localStorage.setItem(tokenKey(), t);
  return t;
}

/* ---------- pica 动态加载（多 CDN 兜底，失败则用 canvas 降级） ---------- */
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('加载失败: ' + url));
    document.head.appendChild(s);
  });
}
// pica 的 UMD 产物挂载在 window.pica（小写），构造函数不是 window.Pica
function getPicaCtor(){ return window.pica || window.Pica || null; }

async function ensurePica(){
  if(picaInstance) return picaInstance;
  if(!getPicaCtor()){
    for(const url of PICA_CDNS){
      try { await loadScript(url); } catch(e){ /* 换下一个 CDN */ }
      if(getPicaCtor()) break;
    }
  }
  const Ctor = getPicaCtor();
  if(Ctor){
    try{
      picaInstance = new Ctor({ features:['js','wasm','ww'] }); // 不支持 wasm 时 pica 自动回退
      return picaInstance;
    }catch(e){
      log(`⚠️ pica 初始化失败（${e.message}），改用 canvas 缩放`);
    }
  } else {
    log('⚠️ pica 加载失败（离线？），改用浏览器 canvas 缩放');
  }
  return null;
}

/* ---------- 图片处理 ---------- */
function readAsImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>resolve({ img, url });
    img.onerror = ()=>reject(new Error('图片解码失败'));
    img.src = url;
  });
}

function canvasResize(img, maxWidth, quality){
  let w = img.naturalWidth, h = img.naturalHeight;
  if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';                 // JPEG 无透明通道，先铺白底避免黑块
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return new Promise(res=>canvas.toBlob(res, 'image/jpeg', quality));
}

async function compressImage(file){
  const { img, url } = await readAsImage(file);
  const opt = { maxWidth: CONFIG.maxWidth, quality: CONFIG.jpegQuality };
  try{
    const p = await ensurePica();
    let blob = null;
    if(p){
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > opt.maxWidth){ h = Math.round(h * opt.maxWidth / w); w = opt.maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      await p.resize(img, canvas, { unsharpAmount: 60, unsharpRadius: 0.6, unsharpThreshold: 2 });
      blob = await p.toBlob(canvas, 'image/jpeg', opt.quality);
    }
    if(!blob) blob = await canvasResize(img, opt.maxWidth, opt.quality);
    if(blob.size > CONFIG.maxFileSizeKb * 1024 && opt.quality > 0.55){
      // 体积仍超限，二次降质（先降到 0.68，再 0.55）
      log(`   ↳ 仍超上限，降质重压 ${(blob.size/1024).toFixed(0)}KB`);
      const q = blob.size > CONFIG.maxFileSizeKb * 1024 * 1.5 ? 0.55 : 0.68;
      blob = await canvasResize(img, opt.maxWidth, q);
    }
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('img-input').onchange = async e=>{
  if(busy) return;
  const files = Array.from(e.target.files || []);
  const pre = $('preview');
  pre.innerHTML = '';
  selectedImages = [];
  for(const f of files){
    log(`读取图片：${f.name}，原图 ${(f.size/1024).toFixed(0)}KB`);
    try{
      const blob = await compressImage(f);
      const name = `${selectedImages.length + 1}-${f.name.replace(/\.[^.]+$/, '')}.jpg`;
      selectedImages.push({ name, originName: f.name, blob });
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      const cap = document.createElement('figcaption');
      cap.innerText = `${(blob.size/1024).toFixed(0)}KB`;
      fig.appendChild(img); fig.appendChild(cap);
      pre.appendChild(fig);
      if(blob.size > CONFIG.maxFileSizeKb * 1024){
        log(`⚠️ 压缩完成但 ${(blob.size/1024).toFixed(0)}KB 仍超过 ${CONFIG.maxFileSizeKb}KB，提交时会报错，请先降低 maxWidth`);
        cap.className = 'err';
      } else {
        log(`✅ 压缩完成：${(blob.size/1024).toFixed(0)}KB`);
      }
    }catch(err){
      log(`❌ ${f.name} 压缩失败：${err.message}`);
    }
  }
};

/* ---------- 提交 ---------- */
function sanitize(s){ return s.replace(/[\\/:*?"<>|]/g, '_').trim(); }

async function uploadFile(path, blob, token){
  const buf = await blob.arrayBuffer();
  // 大文件分段转 base64，避免 String.fromCharCode(...) 参数过多爆栈
  const bytes = new Uint8Array(buf);
  let bin = '';
  const CHUNK = 0x8000;
  for(let i = 0; i < bytes.length; i += CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  const b64 = btoa(bin);

  const headers = { 'Authorization': `token ${token}` };
  const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${encodeURI(path)}`;

  let sha = null;
  const res = await fetch(`${url}?ref=${encodeURIComponent(CONFIG.branch)}`, { headers, cache: 'no-store' });
  if(res.ok){
    const exist = await res.json();
    sha = exist && exist.sha;
  } else if(res.status !== 404){
    const t = await res.text();
    throw new Error(`查询已有文件失败：${res.status} ${t}`);
  }

  const body = { message: `add note ${path}`, content: b64, branch: CONFIG.branch };
  if(sha) body.sha = sha;

  const put = await fetch(url, {
    method: 'PUT',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!put.ok){
    const errText = await put.text();
    throw new Error(`GitHub错误：${put.status} ${errText}`);
  }
  return await put.json();
}

async function submitNote(){
  if(busy) return;
  const title = $('title').value.trim();
  const date = $('date').value;
  const content = $('content').value.trim();
  if(!title || !date || !content){ alert('标题、日期、正文不能为空'); return; }

  const token = getToken();
  if(!token){ alert('未提供 GitHub Token，无法提交（可改用「导出本条MD」）'); return; }

  busy = true;
  const btn = $('submitBtn');
  btn.disabled = true; btn.innerText = '提交中…';
  clearLog();
  log('开始提交……');

  try{
    const y = date.split('-')[0];
    const baseDir = `notes/${y}`;
    const assetDir = `notes/assets/${date}`;
    const filename = `${date}-${sanitize(title)}.md`;
    const filePath = `${baseDir}/${filename}`;

    let mdBody = `# ${title}\n\n日期：${date}\n\n${content}\n\n`;

    for(let i = 0; i < selectedImages.length; i++){
      const img = selectedImages[i];
      if(img.blob.size > CONFIG.maxFileSizeKb * 1024){
        throw new Error(`图片 ${img.originName} 压缩后 ${(img.blob.size/1024).toFixed(0)}KB 依然超过 ${CONFIG.maxFileSizeKb}KB`);
      }
      const imgName = `${date}-${i + 1}-${sanitize(img.name.replace(/^\d+-/, ''))}`;
      const imgPath = `${assetDir}/${imgName}`;
      log(`上传图片：${imgPath}（${(img.blob.size/1024).toFixed(0)}KB）`);
      await uploadFile(imgPath, img.blob, token);
      mdBody += `![${imgName}](${imgPath})\n\n`;
    }

    log('写入 md 笔记文件');
    await uploadFile(filePath, new Blob([mdBody], { type: 'text/markdown' }), token);
    log(`✅ 完成！文件路径：${filePath}`);
    log(`访问地址：https://${CONFIG.owner}.github.io/${CONFIG.repo}/${filePath}`);

    lastMdText = mdBody;
    lastMdName = filename;
    $('dlBtn').classList.remove('hidden');
  }catch(err){
    log(`❌ 提交失败：${err.message}`);
    console.error(err);
  }finally{
    busy = false;
    btn.disabled = false; btn.innerText = '提交到仓库';
  }
}

function downloadCurrentMd(){
  if(!lastMdText){ alert('还没有可导出的内容'); return; }
  const blob = new Blob([lastMdText], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = lastMdName || 'note.md';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function unlock(){
  const p = $('pwd').value.trim();
  if(p === CONFIG.password){
    $('lock-panel').classList.add('hidden');
    $('main-panel').classList.remove('hidden');
    $('lockTip').innerText = '';
  } else {
    $('lockTip').innerText = '密码错误';
    $('lockTip').className = 'tip err';
  }
}
$('pwd').addEventListener('keydown', e=>{ if(e.key === 'Enter') unlock(); });
</script>
</body>
</html>

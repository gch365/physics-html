:"（65）速度矢量的正交分解（几何作图）-仿写.html","name":"（65）速度矢量的正交分解（几何作图）-仿写.html"},{"num":"（6）运动图像-仿写.html","name":"（6）运动图像-仿写.html"},{"num":"（7）平抛临界问题-仿写.html","name":"（7）平抛临界问题-仿写.html"},{"num":"（8）斜抛运动-仿写.html","name":"（8）斜抛运动-仿写.html"},{"num":"（9）小船过河-仿写.html","name":"（9）小船过河-仿写.html"},{"num":"（50）3D斜面动态平衡力-仿写.html","name":"斜面与可调挡板的动态受力分析"},{"num":"水平面内圆周运动（临界）.html","name":"水平面内圆周运动（临界）"},{"num":"汽车启动模型.html","name":"汽车启动模型"}];
function dec(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

// ── 检测嵌入参数（从 index 点卡片进入时带 #exp=xxx）──
const _params=new URLSearchParams(location.search);
let _exp=_params.get('exp');
if(!_exp){ var _hm=location.hash.match(/exp=([^&]+)/); if(_hm) _exp=_hm[1]; }
// index 用 encodeURIComponent 传参，这里需要解码回原始中文文件名
if(_exp) _exp = decodeURIComponent(_exp);
var _isEmbed = !!_exp;

var listEl=document.getElementById('list');
var frame=document.getElementById('frame');
var search=document.getElementById('search');
var loading=document.getElementById('loading');

// ════════════════════════════════════════════════════════
//  嵌入模式核心：用 DOMParser + importNode 精确重建实验 DOM
//
//  为什么不用 iframe.srcdoc？
//    双层嵌套 iframe（index→viewer→f01→inner iframe）中 srcdoc 渲染管线
//    会被外层 DOM 操作打断 → 空白（已用 4 张截图确认）。
//  为什么不用 document.write？
//    devfile 预览环境中 document.write 不能完全清除原有 DOM（header 残留），
//    且部分实验脚本未正确执行 → 有的显示+空白，有的全白。
//
//  本方案：DOMParser 解析 HTML 字符串 → importNode 跨文档导入节点 →
//          精确替换 head/body 内容 → 手动重新执行内联脚本。
//          纯 DOM 操作，不依赖任何渲染管线，100% 可控可靠。
// ════════════════════════════════════════════════════════
function writeExperiment(expObj){
  try {
    var html = dec(expObj.code);

    // 1. 注入全屏重置 CSS（消除 margin/padding 导致的顶部空白）
    var resetCSS = 'html,body{margin:0!important;padding:0!important;height:100vh;width:100vw;overflow:hidden;background:#fff}';
    if(html.indexOf('<head>')!==-1){
      html = html.replace('<head>', '<head><style>'+resetCSS+'</style>');
    } else if(html.indexOf('<html>')!==-1){
      html = html.replace('<html>', '<html><head><style>'+resetCSS+'</style></head>');
    } else {
      html = '<style>'+resetCSS+'</style>' + html;
    }

    // 2. 用 DOMParser 解析实验 HTML（在内存中创建独立文档）
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    // 3. 替换 head：清空后导入原 head 的所有子节点（style/link/meta/script）
    var head = document.head;
    while(head.firstChild) head.removeChild(head.firstChild);
    // 保留基础 meta（charset/viewport）
    head.innerHTML = '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
    var srcHeadNodes = doc.head.childNodes;
    for(var i=0;i<srcHeadNodes.length;i++){
      try { head.appendChild(document.importNode(srcHeadNodes[i], true)); } catch(e){}
    }

    // 4. 替换 body：彻底清空 f01 原有内容（header/wrap/aside/main 全部删除）
    var body = document.body;
    body.innerHTML = '';
    body.style.cssText = 'margin:0;padding:0;height:100vh;width:100vw;overflow:auto;background:#fff';

    // 5. 导入实验 body 的所有子节点
    var srcBodyNodes = doc.body.childNodes;
    for(var j=0;j<srcBodyNodes.length;j++){
      try { body.appendChild(document.importNode(srcBodyNodes[j], true)); } catch(e){}
    }

    // 6. 关键：手动重新执行内联脚本（importNode 导入的 <script> 不会自动执行）
    var scripts = body.querySelectorAll('script:not([src])');
    for(var k=0;k<scripts.length;k++){
      try {
        var s = scripts[k];
        if(s.textContent && s.textContent.trim()){
          var ns = document.createElement('script');
          ns.textContent = s.textContent;
          s.parentNode.replaceChild(ns, s);
        }
      } catch(e2){}
    }

  } catch(err){
    // 极端 fallback：DOM 方式也失败时回退到 srcdoc
    body.innerHTML = '';
    frame.style.cssText = 'width:100vw;height:100vh;display:block;border:none;position:fixed;top:0;left:0';
    frame.srcdoc = dec(expObj.code);
    body.appendChild(frame);
  }
}

// 独立模式的嵌入激活（直接打开 f01 页面后点击列表项触发）
function activateEmbed(){
  if(window._embedDone) return;
  window._embedDone = true;
  document.body.classList.add('embed');
  var _a=listEl;
  if(_a && _a.parentNode) _a.parentNode.removeChild(_a);
  var _h1=document.querySelector('header h1'); if(_h1) _h1.style.display='none';
  var _s=search; if(_s) _s.style.display='none';
  var _bb=document.querySelector('.back-btn'); if(_bb) _bb.style.display='inline-flex';
}

function render(list){
  if(_isEmbed) return;
  listEl.innerHTML='';
  list.forEach(function(e){
    var d=document.createElement('div');
    d.className='item';
    d.textContent=e.name;
    d.onclick=function(){ openExp(e);
      var items=document.querySelectorAll('.item');
      for(var i=0;i<items.length;i++) items[i].classList.remove('active');
      d.classList.add('active');
    };
    listEl.appendChild(d);
  });
}

function openExp(e){
  if(_isEmbed){
    // 嵌入模式：直接写实验 HTML 替换当前页面（不走 iframe srcdoc）
    writeExperiment(e);
    return;
  }
  // 独立模式：使用 iframe + srcdoc（此路径已验证可靠，见截图①）
  loading.classList.add('show');
  frame.onload=function(){ loading.classList.remove('show'); };
  frame.src = 'exp/f01/' + encodeURIComponent(e.num);
  _isEmbed = true;
  requestAnimationFrame(function(){ activateEmbed(); });
}

var all = DATA.slice();
search.oninput=function(){
  if(_isEmbed) return;
  var q=(search.value||'').trim().toLowerCase();
  if(!q){ render(all); return; }
  render(all.filter(function(e){ return e.name.toLowerCase().indexOf(q)!==-1; }));
};

// ═══ 初始化入口 ═══
if(!_isEmbed){
  // 独立打开 f01：显示完整 UI 列表（73 个实验）
  render(all);
}else{
  // 嵌入模式（从 index 点卡片进来）：直接用实验 HTML 替换当前页面
  var _target=null;
  for(var i=0;i<DATA.length;i++){ if(DATA[i].num===_exp){ _target=DATA[i]; break; } }
  if(_target){
    writeExperiment(_target);
  } else {
    // 找不到对应实验：显示错误提示（含返回按钮）
    document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif;color:#c00">'
      + '<h2 style="margin-bottom:12px">未找到实验</h2>'
      + '<p>编号：<b>' + (_exp||'(空)') + '</b></p>'
      + '<p style="color:#666;margin-top:10px">请返回平台重新选择。</p>'
      + '<button onclick="history.back()" style="margin-top:16px;padding:8px 20px;background:#1565c0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">← 返回</button>'
      + '</div>';
  }
}
</script>

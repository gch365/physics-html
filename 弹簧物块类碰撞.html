<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹簧物块类碰撞</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f4f6fb; overflow:hidden; }
  header {
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  header h1 { font-size:24px; color:#1c1c1f; margin-right:8px; white-space:nowrap; }
  .btn {
    border:none; border-radius:8px; padding:9px 20px; font-size:17px; cursor:pointer;
    background:#6557d2; color:#fff; font-family:inherit; transition:background .15s;
  }
  .btn:hover { background:#5448b8; }
  .btn.off { background:#9aa0b5; }
  #lblTotal { display:none; align-items:center; gap:6px; font-size:16px; color:#e07415; font-weight:bold; cursor:pointer; }
  #lblTotal input { width:18px; height:18px; cursor:pointer; }
  main { display:flex; gap:12px; padding:12px 16px 0; height:calc(100vh - 190px); }
  #sceneWrap { flex:1.55; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.07); position:relative; overflow:hidden; }
  #scene { width:100%; height:100%; display:block; }
  aside { flex:1; display:flex; flex-direction:column; gap:10px; min-width:340px; overflow-y:auto; }
  .graphBox { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.07); padding:8px 10px 4px; display:none; flex:none; height:248px; }
  .graphBox h3 { font-size:15px; color:#444; margin-bottom:2px; white-space:nowrap; }
  .graphBox canvas { width:100%; height:calc(100% - 24px); display:block; }
  #info {
    background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.07);
    padding:10px 14px; font-size:15px; line-height:1.75; color:#333;
  }
  #info .b { color:#1565c0; font-weight:bold; }
  #info .r { color:#d32f2f; font-weight:bold; }
  #info .o { color:#e07415; font-weight:bold; }
  #info .frm { color:#777; font-size:13.5px; }
  footer {
    display:flex; gap:18px; align-items:flex-end; padding:10px 18px 14px; flex-wrap:wrap;
  }
  .sgroup { display:flex; flex-direction:column; gap:2px; }
  .sgroup label { font-size:15px; color:#333; font-weight:bold; }
  .sgroup label .val { color:#6557d2; }
  .sgroup input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:130px; height:18px; border-radius:9px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,#6557d2 0%,#6557d2 50%,#e7e4f5 50%,#e7e4f5 100%) no-repeat center/100% 6px;
  }
  .sgroup input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%;
    background:#fff; border:3px solid #6557d2; box-shadow:0 2px 5px rgba(101,87,210,.45); cursor:pointer;
    transition:transform .12s;
  }
  .sgroup input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.18); }
  .sgroup input[type=range]::-moz-range-thumb {
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:3px solid #6557d2; box-shadow:0 2px 5px rgba(101,87,210,.45); cursor:pointer;
  }
  #timeGroup input[type=range] { width:220px; }
  #timeGroup label { color:#1c1c1f; }
</style>
</head>
<body>
<header>
  <h1>弹簧物块类碰撞</h1>
  <button class="btn" id="btnPlay">播放</button>
  <button class="btn" id="btnReset">复原</button>
  <button class="btn off" id="btnVT">v-t 图像</button>
  <button class="btn off" id="btnET">E<sub>k</sub>-t 图像</button>
  <label id="lblTotal"><input type="checkbox" id="chkTotal" checked>总动能</label>
</header>
<main>
  <div id="sceneWrap"><canvas id="scene"></canvas></div>
  <aside>
    <div class="graphBox" id="vtBox"><h3>v-t 图像</h3><canvas id="vt"></canvas></div>
    <div class="graphBox" id="etBox"><h3>E<sub>k</sub>-t 图像</h3><canvas id="et"></canvas></div>
    <div id="info"></div>
  </aside>
</main>
<footer>
  <div class="sgroup"><label>m₁ = <span class="val" id="v_m1">1</span> kg</label><input type="range" id="s_m1" min="0.5" max="5" step="0.5" value="1"></div>
  <div class="sgroup"><label>m₂ = <span class="val" id="v_m2">2</span> kg</label><input type="range" id="s_m2" min="0.5" max="5" step="0.5" value="2"></div>
  <div class="sgroup"><label>k = <span class="val" id="v_k">1</span></label><input type="range" id="s_k" min="0.1" max="2" step="0.1" value="1"></div>
  <div class="sgroup"><label>v₁₀ = <span class="val" id="v_v10">2</span> m/s</label><input type="range" id="s_v10" min="0" max="3" step="0.1" value="2"></div>
  <div class="sgroup"><label>l = <span class="val" id="v_l">3</span> m</label><input type="range" id="s_l" min="1" max="5" step="0.5" value="3"></div>
  <div class="sgroup" id="timeGroup"><label>t = <span class="val" id="v_time">0.00</span> s</label><input type="range" id="s_time" min="0" max="6" step="0.01" value="0"></div>
</footer>

<script>
"use strict";
/* ================= 参数与物理 ================= */
const P = { m1:1, m2:2, k:1, v10:2, l:3, a:0, b:6, d:0.5, r:0.4, n:9 };
let time = 0, playing = false;

function phys(){
  const {m1,m2,k,v10,l,a,b,d} = P;
  const w  = Math.sqrt(Math.max(k,1e-9)*(m1+m2)/(m1*m2));   // ω = √(k(m1+m2)/(m1·m2))
  const tC = (b - 2*d - l - a)/Math.max(v10,1e-9);           // t接触
  const vc = m1*v10/(m1+m2);                                  // 共速(质心速度)
  const Tt = Math.PI/w;                                       // 接触时长 = π/ω
  const v11 = (m1-m2)/(m1+m2)*v10;                            // 分离后 m1 速度
  const v21 = 2*m1/(m1+m2)*v10;                               // 分离后 m2 速度
  return {w,tC,vc,Tt,v11,v21,v10};
}
function v1f(t){ const {tC,vc,Tt,v10,v11,w}=phys();
  if(t<tC) return v10;
  if(t<tC+Tt) return vc+(v10-vc)*Math.cos(w*(t-tC));
  return v11; }
function v2f(t){ const {tC,vc,Tt,v21,w}=phys();
  if(t<tC) return 0;
  if(t<tC+Tt) return vc-vc*Math.cos(w*(t-tC));
  return v21; }
function x1f(t){ const {tC,vc,Tt,v10,v11,w}=phys(); const {a}=P;
  if(t<tC) return a+v10*t;
  if(t<tC+Tt) return a+v10*tC+vc*(t-tC)+(v10-vc)*Math.sin(w*(t-tC))/w;
  return a+v10*tC+vc*Tt+(v10-vc)*Math.sin(w*Tt)/w+v11*(t-tC-Tt); }
function x2f(t){ const {tC,vc,Tt,v21,w}=phys(); const {b}=P;
  if(t<tC) return b;
  if(t<tC+Tt) return b+vc*(t-tC)-vc*Math.sin(w*(t-tC))/w;
  return b+vc*Tt-vc*Math.sin(w*Tt)+v21*(t-tC-Tt); }
function Ek1f(t){ return .5*P.m1*v1f(t)**2; }
function Ek2f(t){ return .5*P.m2*v2f(t)**2; }

/* ================= 3D 轴测投影 ================= */
const EX={x:0.98,y:0.20}, EY={x:0.78,y:-0.62}, EZ={x:0,y:-0.92}; // 屏幕基向量(屏幕y向下)
let S=46, OX=250, OY=185;
function pr(x,y,z){ return [OX+S*(EX.x*x+EY.x*y+EZ.x*z), OY+S*(EX.y*x+EY.y*y+EZ.y*z)]; }
const VDIR = {x:-0.796,y:1,z:-0.847};   // 视线方向(指向远处)，用于面排序
function depth(x,y,z){ return VDIR.x*x+VDIR.y*y+VDIR.z*z; }

const cvS = document.getElementById('scene'), ctx = cvS.getContext('2d');
const cvV = document.getElementById('vt'),    ctxV = cvV.getContext('2d');
const cvE = document.getElementById('et'),    ctxE = cvE.getContext('2d');
function fitCanvas(cv){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  }
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height,ctx:c};
}

/* ================= 立方体 ================= */
const CUBE_FACES = [
  {ids:[0,1,2,3]}, // 上 z+
  {ids:[4,5,6,7]}, // 下 z-
  {ids:[0,1,5,4]}, // 前 y-
  {ids:[3,2,6,7]}, // 后 y+
  {ids:[0,3,7,4]}, // 左 x-
  {ids:[1,2,6,5]}, // 右 x+
];
function drawCube(cx, rgb, alpha, edge){
  const d=P.d, x0=cx-d,x1=cx+d,y0=-d,y1=d,z0=-d,z1=d;
  const V=[[x1,y1,z1],[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x0,y1,z1],[x0,y0,z1],[x0,y0,z0],[x0,y1,z0]];
  const pv=V.map(v=>pr(v[0],v[1],v[2]));
  const fs=CUBE_FACES.map(f=>({ids:f.ids, dep:f.ids.reduce((s,i)=>s+depth(V[i][0],V[i][1],V[i][2]),0)/4}))
                    .sort((u,v)=>v.dep-u.dep);          // 远的先画
  for(const f of fs){
    ctx.beginPath();
    f.ids.forEach((i,k)=> k?ctx.lineTo(pv[i][0],pv[i][1]):ctx.moveTo(pv[i][0],pv[i][1]));
    ctx.closePath();
    ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`; ctx.fill();
    ctx.strokeStyle=edge; ctx.lineWidth=1.4; ctx.stroke();
  }
}

/* ================= 场景绘制 ================= */
function drawScene(){
  const {w:W,h:H} = fitCanvas(cvS); const ctx2=ctx;
  ctx2.clearRect(0,0,W,H);
  const {tC}=phys();
  const xa=x1f(time), xb=x2f(time);

  // —— 动态取景：覆盖到 t=6 s 的运动范围 ——
  const xe1=x1f(6), xe2=x2f(6);
  const xmin=Math.min(P.a-P.d-1, P.b-P.d-1.1*P.l, xe1-1);
  const xmax=Math.max(xe1,xe2)+P.d+1.6;
  const gy=4, z0=-P.d;
  const sxMin=EX.x*(xmin-0.6)+EY.x*(-gy), sxMax=EX.x*(xmax+0.6)+EY.x*gy;
  S=W/(sxMax-sxMin); OX=-sxMin*S;
  OY=H*0.40 - S*(EX.y*xa); // 使当前主场景大致居中

  // —— 地面 ——
  const G=[[xmin-0.6,-gy,z0],[xmax+0.6,-gy,z0],[xmax+0.6,gy,z0],[xmin-0.6,gy,z0]].map(v=>pr(v[0],v[1],v[2]));
  ctx2.beginPath(); G.forEach((p,i)=>i?ctx2.lineTo(p[0],p[1]):ctx2.moveTo(p[0],p[1])); ctx2.closePath();
  ctx2.fillStyle='rgba(99,219,219,0.32)'; ctx2.fill();
  // 中央虚线 (y=0, z=-d)
  ctx2.setLineDash([7,6]); ctx2.strokeStyle='rgba(60,60,60,0.55)'; ctx2.lineWidth=1.2;
  let A=pr(xmin-0.6,0,z0), B=pr(xmax+0.6,0,z0);
  ctx2.beginPath(); ctx2.moveTo(A[0],A[1]); ctx2.lineTo(B[0],B[1]); ctx2.stroke();
  ctx2.setLineDash([]);

  // —— 物块 ——
  drawCube(xa,[21,101,192],0.62,'rgba(13,61,115,0.9)');
  drawCube(xb,[211,47,47],0.62,'rgba(120,20,20,0.9)');

  // —— 弹簧 ——
  drawSpring(xa,xb,tC);

  // —— 速度矢量与标注 ——
  const v1=v1f(time), v2=v2f(time);
  drawArrow3(xa,0,0,v1,'#1565c0');
  drawArrow3(xb,0,0,v2,'#d32f2f');
  label('m₁', pr(xa,0,z0), 6, 34, '#1565c0', 22);
  label('m₂', pr(xb,0,z0), 6, 34, '#d32f2f', 22);
  if(Math.abs(v1)>0.03) label('v₁='+v1.toFixed(2), pr(xa+v1,0,0), -42, -50, '#1565c0', 21);
  if(Math.abs(v2)>0.03) label('v₂='+v2.toFixed(2), pr(xb+v2,0,0), -42, -28, '#d32f2f', 21);
}

function drawSpring(xa,xb,tC){
  const d=P.d, l=P.l, r=P.r, n=P.n;
  const xFaceR = xb-d;                       // 固定端 x（贴在 m₂ 左面）
  const contact = time>=tC && time<tC+phys().Tt;
  // 弹簧自由端 x（朝 m₁）：接触时贴 m₁ 右面；否则随 m₂ 伸出自然长度 l
  let xFree;
  if(contact) xFree = Math.min(xa+d, xFaceR-0.1);   // 贴 m₁ 右面，留极小缝
  else        xFree = xFaceR - l;                    // 自然长度（与 tC 定义一致）
  const L = xFaceR - xFree;
  if(L<0.04) return;

  const segs=[];
  const push=(x0,y0,z0,x1,y1,z1)=>{
    const p0=pr(x0,y0,z0), p1=pr(x1,y1,z1);
    segs.push({p0,p1,dep:(depth(x0,y0,z0)+depth(x1,y1,z1))/2});
  };
  // —— 主螺旋（绕 x 轴） ——
  const N=Math.max(180, Math.round(n*48));
  for(let i=0;i<N;i++){
    const t0=i/N, t1=(i+1)/N;
    const x0=xFree+L*t0, x1=xFree+L*t1;
    const a0=2*Math.PI*n*t0, a1=2*Math.PI*n*t1;
    push(x0, r*Math.cos(a0), r*Math.sin(a0), x1, r*Math.cos(a1), r*Math.sin(a1));
  }
  // —— 固定端：端部收口到轴 → 连到 m₂ 左面中心 ——
  push(xFaceR, r, 0, xFaceR, 0, 0);
  push(xFaceR, 0, 0, xb, 0, 0);
  // —— 自由端：端部收口到轴（接触时再连到 m₁ 右面） ——
  push(xFree, r, 0, xFree, 0, 0);
  if(contact) push(xFree, 0, 0, xa+d, 0, 0);
  // —— 画家算法：远的先画，近的覆盖，产生缠绕立体感 ——
  segs.sort((s,u)=>u.dep-s.dep);
  ctx.strokeStyle='#37474F'; ctx.lineWidth=2.8; ctx.lineJoin='round'; ctx.lineCap='round';
  for(const s of segs){ ctx.beginPath(); ctx.moveTo(s.p0[0],s.p0[1]); ctx.lineTo(s.p1[0],s.p1[1]); ctx.stroke(); }
}
function drawArrow3(x,y,z,dx,color){
  if(Math.abs(dx)<0.03) return;
  const p0=pr(x,y,z), p1=pr(x+dx,y,z);
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  const dir=Math.sign(dx), ah=9;
  ctx.beginPath();
  ctx.moveTo(p1[0]+dir*ah,p1[1]); ctx.lineTo(p1[0]-dir*4,p1[1]-6); ctx.lineTo(p1[0]-dir*4,p1[1]+6);
  ctx.closePath(); ctx.fill();
}
function label(txt, p, ox, oy, color, size){
  ctx.fillStyle=color; ctx.font='bold '+size+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign='left'; ctx.fillText(txt, p[0]+ox, p[1]+oy);
}

/* ================= 图像绘制 ================= */
function graphFrame(ctx2,W,H,tMax,yMin,yMax,xLab,yLab){
  const padL=44,padR=12,padT=12,padB=28;
  const X=t=>padL+(t/tMax)*(W-padL-padR);
  const Y=v=>H-padB-((v-yMin)/(yMax-yMin))*(H-padT-padB);
  ctx2.clearRect(0,0,W,H);
  ctx2.strokeStyle='#d5d8e2'; ctx2.lineWidth=1; ctx2.font='12px sans-serif'; ctx2.fillStyle='#666';
  const tStep=tMax>6?2:1;
  for(let t=0;t<=tMax+1e-9;t+=tStep){
    ctx2.beginPath(); ctx2.moveTo(X(t),padT); ctx2.lineTo(X(t),H-padB); ctx2.stroke();
    ctx2.textAlign='center'; ctx2.fillText(t, X(t), H-padB+15);
  }
  const vStep=(yMax-yMin)>6?2:1;
  for(let v=Math.ceil(yMin/vStep)*vStep; v<=yMax; v+=vStep){
    ctx2.beginPath(); ctx2.moveTo(padL,Y(v)); ctx2.lineTo(W-padR,Y(v)); ctx2.stroke();
    ctx2.textAlign='right'; ctx2.fillText(v, padL-5, Y(v)+4);
  }
  // 坐标轴
  ctx2.strokeStyle='#333'; ctx2.lineWidth=2;
  ctx2.beginPath(); ctx2.moveTo(padL,padT); ctx2.lineTo(padL,H-padB); ctx2.lineTo(W-padR,H-padB); ctx2.stroke();
  ctx2.fillStyle='#333'; ctx2.textAlign='left'; ctx2.font='bold 13px sans-serif';
  ctx2.fillText(yLab, padL+6, padT+14); ctx2.fillText(xLab, W-padR-16, H-padB+16);
  return {X,Y,padL,padR,padT,padB};
}
function plotCurve(ctx2,f,tEnd,X,Y,color,lw){
  ctx2.strokeStyle=color; ctx2.lineWidth=lw; ctx2.beginPath();
  let first=true;
  for(let t=0;t<=tEnd+1e-9;t+=0.02){
    const p=[X(t),Y(f(Math.min(t,tEnd)))];
    first?ctx2.moveTo(p[0],p[1]):ctx2.lineTo(p[0],p[1]); first=false;
  }
  ctx2.stroke();
}
function drawVT(){
  const {w:W,h:H}=fitCanvas(cvV);
  const {v10,v11,v21}=phys();
  const yMin=Math.min(0,v11,v21)-0.5, yMax=Math.max(v10,v21,v11,0.5)+0.5;
  const g=graphFrame(ctxV,W,H,8,yMin,yMax,'t/s','v/(m·s⁻¹)');
  // 渐近参考虚线
  const refs=[[v10,'#999'],[v11,'#999'],[v21,'#999']];
  ctxV.setLineDash([6,5]); ctxV.lineWidth=1.4;
  for(const [v,c] of refs){ if(v===0) continue;
    ctxV.strokeStyle=c; ctxV.beginPath(); ctxV.moveTo(g.padL,g.Y(v)); ctxV.lineTo(W-g.padR,g.Y(v)); ctxV.stroke(); }
  ctxV.setLineDash([]);
  ctxV.fillStyle='#888'; ctxV.font='12px sans-serif';
  if(Math.abs(v10)>0.01){ ctxV.textAlign='left'; ctxV.fillText('v₁₀='+v10.toFixed(2), W-g.padR-84, g.Y(v10)-4); }
  if(time>phys().tC+phys().Tt){
    ctxV.fillText('v₁₁='+v11.toFixed(2), g.padL+4, g.Y(v11)+(v11<v10?-4:12));
    ctxV.fillText('v₂₁='+v21.toFixed(2), W-g.padR-78, g.Y(v21)-4);
  }
  plotCurve(ctxV,v1f,time,g.X,g.Y,'#1565c0',3);
  plotCurve(ctxV,v2f,time,g.X,g.Y,'#d32f2f',3);
  legend(ctxV,W,[[ '#1565c0','v₁'],['#d32f2f','v₂']]);
}
function drawET(){
  const {w:W,h:H}=fitCanvas(cvE);
  const eMax=Math.max(0.5*P.m1*P.v10**2, 0.01)*1.18;
  const g=graphFrame(ctxE,W,H,8,0,eMax,'t/s','E_k/J');
  const showTot=document.getElementById('chkTotal').checked;
  plotCurve(ctxE,Ek1f,time,g.X,g.Y,'#1565c0',2.6);
  plotCurve(ctxE,Ek2f,time,g.X,g.Y,'#d32f2f',2.6);
  if(showTot) plotCurve(ctxE,t=>Ek1f(t)+Ek2f(t),time,g.X,g.Y,'#e07415',2.6);
  const items=[['#1565c0','E_k1'],['#d32f2f','E_k2']];
  if(showTot) items.push(['#e07415','E_k总']);
  legend(ctxE,W,items);
}
function legend(ctx2,W,items){
  const lw=items.length*76, x0=(W-lw)/2+20, y0=20;
  ctx2.font='13px sans-serif';
  items.forEach((it,i)=>{
    const x=x0+i*76;
    ctx2.fillStyle=it[0]; ctx2.fillRect(x,y0-9,14,10);
    ctx2.fillStyle='#333'; ctx2.textAlign='left'; ctx2.fillText(it[1],x+18,y0);
  });
}

/* ================= 信息面板 ================= */
function updateInfo(){
  const {w,tC,vc,Tt,v11,v21}=phys();
  const v1=v1f(time), v2=v2f(time);
  document.getElementById('info').innerHTML =
    `<span class="b">v₁</span> = ${v1.toFixed(2)} m/s&nbsp;&nbsp;<span class="r">v₂</span> = ${v2.toFixed(2)} m/s`+
    `&nbsp;&nbsp;t = ${time.toFixed(2)} s<br>`+
    `t<sub>接触</sub> = ${tC.toFixed(2)} s，接触时长 π/ω = ${Tt.toFixed(2)} s，ω = ${w.toFixed(2)} rad/s<br>`+
    `<span class="frm">v<sub>c</sub> = ${vc.toFixed(2)} m/s，`+
    `v₁₁ = (m₁−m₂)/(m₁+m₂)·v₁₀ = <span class="b">${v11.toFixed(2)}</span>，`+
    `v₂₁ = 2m₁/(m₁+m₂)·v₁₀ = <span class="r">${v21.toFixed(2)}</span> m/s</span>`;
}

/* ================= 主循环 ================= */
let showVT=false, showET=false;
function render(){
  drawScene();
  if(showVT) drawVT();
  if(showET) drawET();
  updateInfo();
  document.getElementById('s_time').value=time;
  document.getElementById('v_time').textContent=time.toFixed(2);
}
let lastT=null;
function loop(ts){
  if(playing){
    if(lastT!=null){
      time=Math.min(time+(ts-lastT)/1000, 6);
      if(time>=6){ playing=false; document.getElementById('btnPlay').textContent='播放'; }
    }
    lastT=ts;
  } else lastT=null;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= 控件 ================= */
const $=id=>document.getElementById(id);
$('btnPlay').onclick=()=>{ if(!playing && time>=6) time=0;
  playing=!playing; $('btnPlay').textContent=playing?'暂停':'播放'; };
$('btnReset').onclick=()=>{ time=0; playing=false; $('btnPlay').textContent='播放'; render(); };
$('btnVT').onclick=function(){ showVT=!showVT; this.classList.toggle('off',!showVT);
  $('vtBox').style.display=showVT?'block':'none'; render(); };
$('btnET').onclick=function(){ showET=!showET; this.classList.toggle('off',!showET);
  $('etBox').style.display=showET?'flex':'none';
  $('lblTotal').style.display=showET?'inline-flex':'none'; render(); };
$('chkTotal').onchange=render;
$('s_time').oninput=function(){ time=+this.value; playing=false; $('btnPlay').textContent='播放'; paintSlider(this); render(); };
function paintSlider(el){
  const min=+el.min, max=+el.max, p=(+el.value-min)/(max-min)*100;
  el.style.background=`linear-gradient(90deg,#6557d2 0%,#6557d2 ${p}%,#e7e4f5 ${p}%,#e7e4f5 100%) no-repeat center/100% 6px`;
}
function bindSlider(key, fmt){
  $('s_'+key).oninput=function(){ P[key]=+this.value; $('v_'+key).textContent=fmt(+this.value); paintSlider(this); render(); };
}
bindSlider('m1',v=>v); bindSlider('m2',v=>v); bindSlider('k',v=>v.toFixed(1));
bindSlider('v10',v=>v.toFixed(1)); bindSlider('l',v=>v);
window.addEventListener('resize',render);
document.querySelectorAll('.sgroup input[type=range]').forEach(paintSlider);
render();
</script>

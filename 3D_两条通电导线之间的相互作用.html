<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D 两条通电导线之间的相互作用</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b1020;
    font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#e8edf7; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* 控制面板 */
  #panel {
    position:fixed; top:14px; left:14px; width:268px;
    background:rgba(16,24,46,.82); border:1px solid rgba(120,160,255,.25);
    border-radius:12px; padding:14px 14px 12px; backdrop-filter:blur(6px);
    box-shadow:0 8px 28px rgba(0,0,0,.45); z-index:10; user-select:none;
  }
  #panel h1 { font-size:15px; font-weight:700; margin-bottom:4px; color:#cfe0ff; }
  #panel .sub { font-size:11px; color:#8fa3c8; margin-bottom:12px; line-height:1.5; }
  .row { margin-bottom:11px; }
  .row > label { display:block; font-size:12px; color:#aab8d8; margin-bottom:5px; }
  .seg { display:flex; gap:6px; }
  .seg button {
    flex:1; padding:7px 0; font-size:12px; cursor:pointer; color:#cdd9f2;
    background:rgba(40,54,92,.7); border:1px solid rgba(120,160,255,.25);
    border-radius:8px; transition:.15s;
  }
  .seg button.active { background:#3b6fff; border-color:#5b86ff; color:#fff; font-weight:700; }
  .seg button:active { transform:scale(.97); }
  .chk { display:flex; align-items:center; gap:8px; font-size:12px; color:#c2cfe8; cursor:pointer; }
  .chk input { width:16px; height:16px; accent-color:#3b6fff; }
  .divider { height:1px; background:rgba(120,160,255,.18); margin:11px 0; }
  #status { font-size:12px; line-height:1.6; color:#dfe7fb;
    background:rgba(40,54,92,.5); border-radius:8px; padding:8px 10px; }
  #status b { color:#ffd75e; }
  #status .attract { color:#5bff9b; }
  #status .repel { color:#ff7b7b; }

  /* 图例 */
  #legend {
    position:fixed; bottom:14px; left:14px; z-index:10;
    background:rgba(16,24,46,.78); border:1px solid rgba(120,160,255,.22);
    border-radius:10px; padding:10px 12px; font-size:11.5px; color:#c4d2ee; line-height:1.8;
  }
  #legend .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #hint { position:fixed; bottom:14px; right:14px; z-index:10;
    font-size:11px; color:#7e90b4; background:rgba(16,24,46,.6); padding:7px 11px; border-radius:8px; }
  #resetView { margin-top:6px; width:100%; padding:7px 0; font-size:12px; cursor:pointer;
    color:#cdd9f2; background:rgba(40,54,92,.7); border:1px solid rgba(120,160,255,.25);
    border-radius:8px; }
  #resetView:active { transform:scale(.98); }
</style>
</head>
<body>
<div id="app"></div>

<div id="panel">
  <h1>两条通电导线之间的相互作用</h1>
  <div class="sub">同向电流相吸，反向电流相斥。<br>拖动可旋转视角，滚轮缩放。</div>

  <div class="row">
    <label>导线 1 电流方向 (I₁)</label>
    <div class="seg" id="seg1">
      <button data-d="1" class="active">→ 向右</button>
      <button data-d="-1">← 向左</button>
    </div>
  </div>

  <div class="row">
    <label>导线 2 电流方向 (I₂)</label>
    <div class="seg" id="seg2">
      <button data-d="1" class="active">→ 向右</button>
      <button data-d="-1">← 向左</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="row"><label class="chk"><input type="checkbox" id="ckField" checked> 显示磁力线 (B)</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="ckForce" checked> 显示相互作用力</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="ckRotate"> 自动旋转场景</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="ckPlay" checked> 播放电流流动</label></div>
  <button id="resetView">重置视角</button>

  <div class="divider"></div>
  <div id="status"></div>
</div>

<div id="legend">
  <div><span class="dot" style="background:#ffd75e"></span>黄色箭头 = 电流方向（流动粒子）</div>
  <div><span class="dot" style="background:#5bff9b"></span>绿色箭头 = 吸引力（相向）</div>
  <div><span class="dot" style="background:#ff7b7b"></span>红色箭头 = 排斥力（相背）</div>
  <div><span class="dot" style="background:#6fb6ff"></span>蓝色圆圈 = 导线周围磁力线</div>
</div>
<div id="hint">提示：黄色箭头（贯穿导线的长箭头 + 流动粒子 + I₁/I₂ 标签）共同指示电流方向</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  let W = window.innerWidth, H = window.innerHeight;

  // ---------- 场景 / 相机 / 渲染器 ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  scene.fog = new THREE.Fog(0x0b1020, 22, 46);

  const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
  camera.position.set(9, 7, 13);

  const renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  app.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 0, 0);

  // ---------- 灯光 ----------
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(8, 14, 10); scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x88aaff, 0.35);
  dir2.position.set(-10, -6, -8); scene.add(dir2);

  // ---------- 地面网格 ----------
  const grid = new THREE.GridHelper(40, 40, 0x294069, 0x1a2742);
  grid.position.y = -6; scene.add(grid);

  // ---------- 参数 ----------
  const L = 9;        // 导线长度 (沿 x)
  const R = 0.22;     // 导线半径
  const D = 3.2;      // 两导线间距 (沿 y)
  const y1 = D/2, y2 = -D/2;

  let dir1 = 1, dir2 = 1;   // +1 向右(-x), -1 向左

  // ---------- 文字标签 (canvas sprite，支持动态重绘) ----------
  function makeLabel(text, color){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(2.6, 1.3, 1);
    sp.userData.draw = (t)=>{
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,256,128);
      ctx.fillStyle = color;
      ctx.font = 'bold 72px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t, 128, 64);
      tex.needsUpdate = true;
    };
    sp.userData.draw(text);
    return sp;
  }

  // ---------- 导线 ----------
  function makeWire(y){
    const g = new THREE.CylinderGeometry(R, R, L, 24);
    const m = new THREE.MeshStandardMaterial({ color:0xb87333, metalness:0.85, roughness:0.35 });
    const mesh = new THREE.Mesh(g, m);
    mesh.rotation.z = Math.PI/2;   // 沿 x 轴
    mesh.position.set(0, y, 0);
    return mesh;
  }
  const wire1 = makeWire(y1);
  const wire2 = makeWire(y2);
  scene.add(wire1, wire2);

  // 导线端点支座
  function makePost(y, x){
    const g = new THREE.BoxGeometry(0.5, 1.4, 0.5);
    const m = new THREE.MeshStandardMaterial({ color:0x33405f, roughness:0.8 });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(x, y, 0);
    return mesh;
  }
  scene.add(makePost(y1, L/2+0.3), makePost(y1, -L/2-0.3));
  scene.add(makePost(y2, L/2+0.3), makePost(y2, -L/2-0.3));

  // ---------- 电流流动箭头粒子 ----------
  // 沿导线分布若干小圆锥，尖端指向电流方向，并持续"流动"
  const N = 14;
  function makeCurrent(y, color){
    const group = new THREE.Group();
    const cones = [];
    const geo = new THREE.ConeGeometry(0.34, 0.95, 20);
    for(let i=0;i<N;i++){
      const mat = new THREE.MeshStandardMaterial({ color:color, emissive:color, emissiveIntensity:1.0, metalness:0.2, roughness:0.4 });
      mat.toneMapped = false;
      const cone = new THREE.Mesh(geo, mat);
      cone.rotation.z = -Math.PI/2;  // 默认指向 +x
      group.add(cone);
      cones.push(cone);
    }
    group.position.set(0, y, 0);
    group.userData = { cones, y };
    return group;
  }
  const cur1 = makeCurrent(y1, 0xffd75e);
  const cur2 = makeCurrent(y2, 0xffd75e);
  scene.add(cur1, cur2);

  // 参数 t∈[0,1] 映射为 x∈[-L/2, L/2]
  function updateCurrent(group, d, t0){
    const cones = group.userData.cones;
    for(let i=0;i<N;i++){
      let t = (t0 + i/N) % 1;
      if(t<0) t += 1;
      const x = (t - 0.5) * (L - 0.6);
      const cone = cones[i];
      cone.position.x = x;
      // 尖端指向电流方向
      cone.rotation.z = d > 0 ? -Math.PI/2 : Math.PI/2;
    }
  }

  // 导线端头大方向箭头（贯穿整根导线，明确指示电流从哪端到哪端）
  const arrowY1 = y1 + 0.6, arrowY2 = y2 - 0.6;   // 略微偏移，避免与导线/粒子重叠
  function makeEndArrow(y, color){
    const ar = new THREE.ArrowHelper(
      new THREE.Vector3(1,0,0), new THREE.Vector3(-L/2-0.4, y, 0),
      L + 0.8, color, 0.9, 0.55
    );
    return ar;
  }
  const end1 = makeEndArrow(arrowY1, 0xffd75e);
  const end2 = makeEndArrow(arrowY2, 0xffd75e);
  scene.add(end1, end2);
  function updateEndArrow(ar, y, d){
    const len = L + 0.8;
    if(d > 0){           // 向右：从左端指向右端
      ar.position.set(-L/2 - 0.4, y, 0);
      ar.setDirection(new THREE.Vector3(1, 0, 0));
    } else {             // 向左：从右端指向左端
      ar.position.set(L/2 + 0.4, y, 0);
      ar.setDirection(new THREE.Vector3(-1, 0, 0));
    }
    ar.setLength(len, 0.9, 0.55);
  }

  // 电流文字标签（带实时方向箭头）
  const lab1 = makeLabel('I₁ →', '#ffd75e'); lab1.position.set(0, y1+1.4, 0); scene.add(lab1);
  const lab2 = makeLabel('I₂ →', '#ffd75e'); lab2.position.set(0, y2-1.4, 0); scene.add(lab2);

  // ---------- 相互作用力箭头 ----------
  const force1 = new THREE.ArrowHelper(new THREE.Vector3(0,-1,0), new THREE.Vector3(0,y1,0), 1.2, 0x5bff9b, 0.5, 0.3);
  const force2 = new THREE.ArrowHelper(new THREE.Vector3(0, 1,0), new THREE.Vector3(0,y2,0), 1.2, 0x5bff9b, 0.5, 0.3);
  scene.add(force1, force2);

  // ---------- 磁力线 (绕导线的圆) ----------
  const fieldGroup = new THREE.Group();
  scene.add(fieldGroup);
  function buildField(){
    fieldGroup.clear();
    const ringsPerWire = 5;
    const radii = [0.9, 1.5, 2.2, 3.0];
    [y1, y2].forEach(y=>{
      for(let k=0;k<ringsPerWire;k++){
        const cx = -L/2 + (k+0.5)*(L/ringsPerWire);
        radii.forEach((r, idx)=>{
          const geo = new THREE.TorusGeometry(r, 0.025, 8, 48);
          const mat = new THREE.MeshBasicMaterial({ color:0x6fb6ff, transparent:true, opacity:0.30 + 0.06*idx });
          const ring = new THREE.Mesh(geo, mat);
          ring.position.set(cx, y, 0);
          ring.rotation.y = Math.PI/2; // 圆平面垂直于导线(x)
          fieldGroup.add(ring);
        });
      }
    });
  }
  buildField();

  // ---------- 状态刷新 ----------
  const statusEl = document.getElementById('status');
  function refresh(){
    updateEndArrow(end1, arrowY1, dir1);
    updateEndArrow(end2, arrowY2, dir2);
    lab1.userData.draw('I₁ ' + (dir1 > 0 ? '→' : '←'));
    lab2.userData.draw('I₂ ' + (dir2 > 0 ? '→' : '←'));
    const same = (dir1 === dir2);
    statusEl.innerHTML = same
      ? '电流方向：<b>相同</b><br>两导线<b class="attract">相互吸引</b>（同向相吸）'
      : '电流方向：<b>相反</b><br>两导线<b class="repel">相互排斥</b>（反向相斥）';
    // 受力箭头方向：same→相向, opp→相背
    if(same){
      force1.setDirection(new THREE.Vector3(0,-1,0));
      force2.setDirection(new THREE.Vector3(0, 1,0));
      force1.setColor(0x5bff9b); force2.setColor(0x5bff9b);
    } else {
      force1.setDirection(new THREE.Vector3(0, 1,0));
      force2.setDirection(new THREE.Vector3(0,-1,0));
      force1.setColor(0xff7b7b); force2.setColor(0xff7b7b);
    }
  }
  refresh();

  // ---------- UI 事件 ----------
  function bindSeg(id, set){
    document.querySelectorAll('#'+id+' button').forEach(b=>{
      b.addEventListener('click', ()=>{
        document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        set(parseInt(b.dataset.d,10));
        refresh();
      });
    });
  }
  bindSeg('seg1', v=>dir1=v);
  bindSeg('seg2', v=>dir2=v);

  const ckField = document.getElementById('ckField');
  const ckForce = document.getElementById('ckForce');
  const ckRotate = document.getElementById('ckRotate');
  const ckPlay = document.getElementById('ckPlay');
  ckField.addEventListener('change', ()=> fieldGroup.visible = ckField.checked);
  ckForce.addEventListener('change', ()=>{ force1.visible = force2.visible = ckForce.checked; });
  document.getElementById('resetView').addEventListener('click', ()=>{
    camera.position.set(9,7,13); controls.target.set(0,0,0); controls.update();
  });

  // ---------- 动画 ----------
  let flow = 0;   // 流动相位
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    if(ckPlay.checked){
      flow += dt * 0.42;
      updateCurrent(cur1, dir1, flow * dir1);
      updateCurrent(cur2, dir2, flow * dir2);
    }
    // 磁力线自转(暗示磁场环绕)
    if(fieldGroup.visible){
      fieldGroup.rotation.x += dt * 0.4;
    }
    if(ckRotate.checked){ controls.autoRotate = true; controls.autoRotateSpeed = 1.2; }
    else controls.autoRotate = false;

    controls.update();
    renderer.render(scene, camera);
  }
  // 初始化粒子位置
  updateCurrent(cur1, dir1, 0);
  updateCurrent(cur2, dir2, 0);
  animate();

  // ---------- 自适应 ----------
  window.addEventListener('resize', ()=>{
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
})();
</script>
</body>
</html>

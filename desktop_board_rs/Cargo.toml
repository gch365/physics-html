[package]
name = "desktop_board"
version = "1.0.29"
edition = "2021"
description = "班级桌面大屏（Rust 版，透明悬浮作业卡 + 通知跑马灯）"

[lib]
name = "desktop_board"
path = "src/lib.rs"

[[bin]]
name = "desktop_board"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
ttf-parser = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 2
strip = true
